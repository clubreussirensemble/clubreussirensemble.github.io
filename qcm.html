philes","identique en tout point","totalement nulle","uniquement basique"],"c":0,"e":"L'anhydride, meilleur groupe partant, réagit plus facilement avec les nucléophiles que l'acide carboxylique lui-même."},{"q":"L'hydrolyse d'un ester, en présence d'eau, produit :","o":["un acide carboxylique (ou son sel) et un alcool","uniquement un alcool","uniquement un acide carboxylique","un amide et de l'eau"],"c":0,"e":"L'hydrolyse d'un ester est la réaction inverse de l'estérification, redonnant l'acide et l'alcool de départ."},{"q":"La saponification d'un ester, réalisée en milieu basique, produit :","o":["le sel de l'acide carboxylique (savon) et un alcool","uniquement un acide carboxylique","un chlorure d'acyle","un amide"],"c":0,"e":"La saponification, hydrolyse basique totale et irréversible d'un ester, produit un carboxylate (savon) et un alcool."},{"q":"Un polyester est un polymère formé par la répétition de liaisons :","o":["ester, reliant des motifs diacide et dialcool","amide, reliant des acides aminés","éther uniquement","hydrogène uniquement"],"c":0,"e":"Un polyester résulte de la polymérisation d'un diacide et d'un dialcool, reliés par des liaisons ester successives."},{"q":"Parmi les propriétés physiques des acides carboxyliques figure notamment :","o":["la formation de liaisons hydrogène, responsables de points d'ébullition relativement élevés","une volatilité extrême sans liaison particulière","l'absence totale de solubilité dans l'eau pour les plus petits","une couleur systématiquement vive"],"c":0,"e":"Les acides carboxyliques forment des liaisons hydrogène entre eux, ce qui augmente notablement leur point d'ébullition."},{"q":"La réactivité comparée des dérivés d'acides carboxyliques (chlorure d'acyle, anhydride, ester) vis-à-vis d'un nucléophile suit généralement l'ordre :","o":["chlorure d'acyle plus réactif que l'anhydride, lui-même plus réactif que l'ester","l'ester est toujours le plus réactif","les trois dérivés ont exactement la même réactivité","l'anhydride est totalement inerte"],"c":0,"e":"Le chlorure d'acyle, dont le groupe partant Cl⁻ est excellent, est le plus réactif des trois dérivés, devant l'anhydride puis l'ester."}]},{"t":"Chimie — Amines et amides","m":"Chimie","f":"","g":"Avril","q":[{"q":"Une amine est une molécule dérivée de :","o":["l'eau H₂O","l'ammoniac NH₃","le méthane CH₄","l'éthanol"],"c":1,"e":"Les amines s'obtiennent formellement en remplaçant un ou plusieurs H de NH₃ par des groupes carbonés."},{"q":"La basicité des amines s'explique par :","o":["la présence d'un groupe carbonyle","le doublet non liant de l'azote","l'absence d'hydrogène","la présence d'un halogène"],"c":1,"e":"Le doublet non liant de l'azote permet à l'amine de capter un proton H⁺ : elle se comporte comme une base."},{"q":"Un amide se forme à partir d'un acide (ou d'un chlorure d'acyle) et :","o":["d'un alcool","d'une amine","d'un alcène","d'un halogénure d'alkyle uniquement"],"c":1,"e":"La réaction d'un acide carboxylique (ou de son chlorure d'acyle) avec une amine forme un amide."},{"q":"Une amine primaire est une amine dans laquelle l'atome d'azote est lié à :","o":["un seul groupe carboné et deux atomes d'hydrogène","deux groupes carbonés et un atome d'hydrogène","trois groupes carbonés","aucun groupe carboné"],"c":0,"e":"Une amine primaire présente un seul groupe carboné fixé sur l'azote, les deux autres liaisons étant occupées par des hydrogènes."},{"q":"Une amine tertiaire est une amine dans laquelle l'atome d'azote est lié à :","o":["trois groupes carbonés, sans atome d'hydrogène","un seul groupe carboné","deux groupes carbonés et un atome d'hydrogène","uniquement des atomes d'hydrogène"],"c":0,"e":"Une amine tertiaire porte trois groupes carbonés sur l'azote, sans aucun hydrogène résiduel."},{"q":"Un centre nucléophile est une entité chimique qui :","o":["possède un excès de densité électronique et cherche à donner des électrons","manque d'électrons et cherche à en capter","est totalement neutre électriquement","ne réagit jamais avec un centre électrophile"],"c":0,"e":"Un site nucléophile est riche en électrons et cherche à en céder pour former une nouvelle liaison."},{"q":"Un centre électrophile est une entité chimique qui :","o":["manque de densité électronique et cherche à capter des électrons","possède un excès d'électrons à donner","est totalement inerte chimiquement","correspond toujours à un atome d'azote"],"c":0,"e":"Un site électrophile, pauvre en électrons, est attaqué par un centre nucléophile lors d'une réaction chimique."},{"q":"Le caractère nucléophile des amines s'explique par la présence, sur l'atome d'azote, :","o":["d'un doublet d'électrons non liant, disponible pour former une nouvelle liaison","d'une charge positive permanente","d'un déficit électronique","d'un atome d'hydrogène acide"],"c":0,"e":"Le doublet non liant de l'azote confère aux amines leur réactivité nucléophile caractéristique."},{"q":"La réaction d'Hofmann illustre le caractère nucléophile des amines en mettant en évidence :","o":["leur réaction avec un dérivé halogéné, formant une nouvelle liaison C-N","leur incapacité à réagir avec un halogénoalcane","leur caractère uniquement acide","leur décomposition spontanée"],"c":0,"e":"La réaction d'Hofmann fait réagir le doublet non liant de l'amine avec un halogénoalcane, formant une nouvelle liaison C-N."},{"q":"Un polyamide, comme le nylon 6-6, est un polymère formé par la répétition de liaisons :","o":["amide, reliant des motifs diacide et diamine","ester, reliant des motifs diacide et dialcool","éther uniquement","hydrogène uniquement"],"c":0,"e":"Le nylon 6-6 résulte de la polymérisation d'un diacide et d'une diamine, reliés par des liaisons amide successives."},{"q":"L'hydrolyse d'un polyamide, comme le nylon 6-6, en milieu acide ou basique, redonne :","o":["le diacide et la diamine (ou leurs sels) qui ont servi à sa synthèse","uniquement de l'eau","uniquement du dioxyde de carbone","un alcool et un acide carboxylique"],"c":0,"e":"L'hydrolyse rompt les liaisons amide du polymère, régénérant les monomères diacide et diamine de départ."},{"q":"La basicité des amines s'explique, par analogie avec l'ammoniac NH₃, par la capacité de l'atome d'azote à :","o":["capter un proton H⁺ grâce à son doublet non liant","céder un proton H⁺","céder un électron uniquement","capter un électron uniquement"],"c":0,"e":"Comme l'ammoniac, les amines captent un proton grâce au doublet non liant de l'azote, ce qui explique leur basicité."},{"q":"Parmi les principales applications des amines et amides figure notamment :","o":["la synthèse de polymères comme les polyamides (nylon)","la fabrication exclusive de métaux","la production d'oxygène pur","la synthèse de sels minéraux uniquement"],"c":0,"e":"Les amines et amides sont des briques essentielles de nombreux polymères industriels, comme les polyamides."}]},{"t":"Chimie — Des acides α-aminés aux protéines","m":"Chimie","f":"","g":"Avril","q":[{"q":"En solution aqueuse à pH intermédiaire, un acide α-aminé existe principalement sous forme :","o":["cationique uniquement","anionique uniquement","zwitterion (double charge)","neutre sans charge"],"c":2,"e":"À pH intermédiaire, l'acide α-aminé porte simultanément une charge + (NH₃⁺) et une charge − (COO−) : c'est un zwitterion."},{"q":"La liaison peptidique se forme entre :","o":["deux groupes carboxyles","le groupe carboxyle d'un acide aminé et le groupe amine d'un autre","deux groupes amine","un alcool et un acide"],"c":1,"e":"La liaison peptidique (-CO-NH-) résulte de la réaction entre le -COOH d'un acide aminé et le -NH₂ d'un autre."},{"q":"La structure secondaire d'une protéine est stabilisée principalement par :","o":["des liaisons ioniques uniquement","des liaisons hydrogène","des liaisons covalentes C-C","des forces de van der Waals uniquement"],"c":1,"e":"Les liaisons hydrogène entre groupements -NH et -C=O stabilisent les structures en hélice α ou feuillet β."},{"q":"Un acide α-aminé est une molécule possédant, sur le même atome de carbone :","o":["un groupe amine -NH₂ et un groupe acide carboxylique -COOH","uniquement deux groupes hydroxyle","uniquement un groupe carbonyle","un groupe ester et un groupe amine"],"c":0,"e":"Le carbone α d'un acide aminé porte à la fois un groupe amine et un groupe acide carboxylique."},{"q":"La chiralité d'un acide α-aminé, à l'exception de la glycine, permet de le classer selon une configuration :","o":["D ou L","Z ou E","cis ou trans","syn ou anti"],"c":0,"e":"Le carbone α, asymétrique dans la plupart des acides aminés, permet de définir une configuration D ou L."},{"q":"En solution aqueuse fortement acide, un acide α-aminé existe majoritairement sous sa forme :","o":["cationique (groupe amine protoné, groupe acide non ionisé)","anionique","zwitterion neutre","totalement neutre sans charge"],"c":0,"e":"À pH très acide, le groupe amine est protoné (NH₃⁺) et le groupe acide reste sous forme COOH : la molécule est globalement cationique."},{"q":"En solution aqueuse fortement basique, un acide α-aminé existe majoritairement sous sa forme :","o":["anionique (groupe acide déprotoné, groupe amine non protoné)","cationique","zwitterion majoritaire uniquement","totalement neutre sans charge"],"c":0,"e":"À pH très basique, le groupe acide est déprotoné (COO−) et le groupe amine reste NH₂ : la molécule est globalement anionique."},{"q":"La forme zwitterion d'un acide α-aminé, observée à un pH intermédiaire, comporte simultanément :","o":["un groupe amine protoné (chargé positivement) et un groupe acide déprotoné (chargé négativement)","deux charges positives","deux charges négatives","aucune charge électrique"],"c":0,"e":"Le zwitterion porte à la fois une charge positive (NH₃⁺) et une charge négative (COO−), globalement neutre."},{"q":"La constante d'acidité Ka₁ d'un acide α-aminé correspond à la fonction acide -COOH, tandis que Ka₂ correspond à la fonction :","o":["amine -NH₃⁺","carbonyle","hydroxyle","ester"],"c":0,"e":"Un acide α-aminé possède deux couples acide-base : Ka₁ pour le groupe carboxyle, Ka₂ pour le groupe ammonium."},{"q":"La liaison peptidique se forme par réaction entre :","o":["le groupe acide carboxylique d'un acide α-aminé et le groupe amine d'un autre acide α-aminé","deux groupes amine","deux groupes acide carboxylique","deux groupes hydroxyle"],"c":0,"e":"La liaison peptidique (liaison amide) résulte de la condensation du groupe -COOH d'un acide aminé avec le groupe -NH₂ d'un autre."},{"q":"La formation d'une liaison peptidique entre deux acides α-aminés s'accompagne de l'élimination d'une molécule :","o":["d'eau","de dioxygène","de dihydrogène","de dioxyde de carbone"],"c":0,"e":"Comme pour la formation d'un amide, la réaction de condensation entre les deux acides aminés élimine une molécule d'eau."},{"q":"La structure primaire d'une protéine correspond :","o":["à la séquence précise des acides aminés le long de la chaîne peptidique","à l'enroulement en hélice de la chaîne","au repliement tridimensionnel global","à l'association de plusieurs chaînes peptidiques"],"c":0,"e":"La structure primaire désigne uniquement l'ordre dans lequel les acides aminés sont enchaînés le long de la chaîne."},{"q":"Le rôle catalytique des enzymes en biochimie est étroitement lié à :","o":["leur structure tridimensionnelle spécifique, qui reconnaît un substrat donné","leur simple composition en carbone et hydrogène","leur couleur","leur solubilité uniquement dans l'huile"],"c":0,"e":"C'est la structure spatiale précise de l'enzyme, notamment son site actif, qui lui permet de reconnaître et de catalyser la transformation d'un substrat spécifique."}]},{"t":"Biologie — Nature de l'information génétique","m":"Biologie","f":"","g":"Octobre","q":[{"q":"Le support universel de l'information génétique est :","o":["l'ARN uniquement","l'ADN","les protéines","les lipides membranaires"],"c":1,"e":"L'ADN (acide désoxyribonucléique), organisé en double hélice, est le support universel de l'information génétique."},{"q":"Dans la double hélice d'ADN, la base adénine (A) s'apparie toujours avec :","o":["la guanine (G)","la cytosine (C)","la thymine (T)","une autre adénine (A)"],"c":2,"e":"La complémentarité des bases impose A-T et G-C, reliées par des liaisons hydrogène."},{"q":"Chez les eucaryotes, l'ADN est principalement localisé dans :","o":["le cytoplasme","le noyau, sous forme de chromosomes","la membrane plasmique","les ribosomes"],"c":1,"e":"L'ADN nucléaire est organisé en chromosomes ; une petite quantité existe aussi dans les mitochondries."},{"q":"Le nombre de chromosomes présents dans une cellule somatique humaine est de :","o":["46","23","44","48"],"c":0,"e":"La cellule somatique humaine est diploïde et compte 46 chromosomes, soit 23 paires."},{"q":"La structure d'un chromosome métaphasique se caractérise par la présence de :","o":["deux chromatides sœurs reliées par un centromère","une seule chromatide","quatre chromatides indépendantes","aucune chromatide visible"],"c":0,"e":"Au stade métaphasique, chaque chromosome est constitué de deux chromatides identiques, unies au niveau du centromère."},{"q":"Les constituants de base d'un nucléotide d'ADN sont :","o":["un sucre (désoxyribose), un groupement phosphate et une base azotée","uniquement une base azotée","un acide aminé et un sucre","uniquement un groupement phosphate"],"c":0,"e":"Un nucléotide résulte de l'association d'un sucre, d'un phosphate et d'une base azotée."},{"q":"Les quatre bases azotées composant l'ADN sont :","o":["adénine, thymine, guanine, cytosine","adénine, uracile, guanine, cytosine","adénine, thymine, guanine, uracile","uniquement adénine et thymine"],"c":0,"e":"L'ADN comporte quatre bases : adénine (A), thymine (T), guanine (G) et cytosine (C)."},{"q":"La duplication de l'ADN se déroule selon un mode dit :","o":["semi-conservatif, chaque brin servant de matrice à un nouveau brin complémentaire","conservatif, l'ADN parental restant intact","dispersif, les brins étant totalement mélangés","aléatoire, sans matrice"],"c":0,"e":"La réplication semi-conservative aboutit à deux molécules d'ADN, chacune formée d'un brin ancien et d'un brin nouvellement synthétisé."},{"q":"Au cours du cycle cellulaire, la quantité d'ADN d'une cellule double lors de la phase :","o":["S (synthèse)","G₁","G₂","M (mitose)"],"c":0,"e":"C'est pendant la phase S du cycle cellulaire que se déroule la réplication de l'ADN, doublant la quantité d'ADN."},{"q":"L'ARN se distingue de l'ADN notamment par :","o":["la présence d'uracile à la place de la thymine, et un sucre ribose à la place du désoxyribose","l'absence totale de bases azotées","une structure toujours bicaténaire","l'absence de sucre"],"c":0,"e":"L'ARN utilise l'uracile au lieu de la thymine et le ribose au lieu du désoxyribose, contrairement à l'ADN."},{"q":"La double hélice d'ADN est maintenue notamment par :","o":["des liaisons hydrogène entre bases complémentaires","des liaisons covalentes entre les deux brins","l'absence de toute liaison chimique","des liaisons ioniques uniquement"],"c":0,"e":"Les deux brins de la double hélice sont associés par des liaisons hydrogène entre bases complémentaires (A-T et G-C)."},{"q":"L'information génétique portée par l'ADN est dite universelle car :","o":["le code génétique est globalement le même chez la quasi-totalité des êtres vivants","elle ne concerne que les mammifères","elle change à chaque génération","elle n'existe que chez les végétaux"],"c":0,"e":"Le caractère quasi universel du code génétique traduit l'unité du monde vivant, avec de rares exceptions."},{"q":"Avant la réplication, en phase G₁, une cellule diploïde humaine possède une quantité d'ADN correspondant à :","o":["2n chromosomes à une chromatide chacun","2n chromosomes à deux chromatides chacun","4n chromosomes","n chromosomes uniquement"],"c":0,"e":"En phase G₁, avant la réplication, chaque chromosome est constitué d'une seule chromatide ; la cellule reste diploïde (2n)."}]},{"t":"Biologie — Expression de l'information génétique","m":"Biologie","f":"","g":"Octobre","q":[{"q":"L'expression d'un gène en protéine se déroule selon l'ordre :","o":["traduction puis transcription","transcription puis traduction","réplication puis traduction","traduction uniquement"],"c":1,"e":"Le dogme central : ADN → (transcription) → ARNm → (traduction) → protéine."},{"q":"La transcription produit :","o":["une molécule d'ARN messager à partir de l'ADN","directement une protéine","un chromosome dupliqué","un gamète"],"c":0,"e":"La transcription est la copie d'un brin d'ADN en ARNm, catalysée par l'ARN polymérase, dans le noyau."},{"q":"Un codon du code génétique est constitué de :","o":["1 nucléotide","2 nucléotides","3 nucléotides","4 nucléotides"],"c":2,"e":"Le code génétique est un code à triplets : chaque codon (3 nucléotides) spécifie un acide aminé."},{"q":"La transcription se déroule dans :","o":["le noyau, chez les eucaryotes","exclusivement le cytoplasme","les mitochondries uniquement","le ribosome"],"c":0,"e":"Chez les eucaryotes, la transcription de l'ADN en ARN messager a lieu dans le noyau."},{"q":"L'enzyme responsable de la synthèse de l'ARN messager lors de la transcription est :","o":["l'ARN polymérase","l'ADN polymérase","la ligase","la transcriptase inverse"],"c":0,"e":"L'ARN polymérase catalyse la synthèse du brin d'ARN complémentaire au brin matrice d'ADN."},{"q":"La traduction, deuxième étape de l'expression génétique, se déroule au niveau :","o":["des ribosomes, dans le cytoplasme","du noyau uniquement","de la membrane plasmique uniquement","des chromosomes"],"c":0,"e":"La traduction de l'ARN messager en protéine se déroule sur les ribosomes, dans le cytoplasme."},{"q":"Un codon du code génétique correspond, lors de la traduction, à :","o":["un acide aminé (ou un signal de fin de traduction)","deux acides aminés simultanément","un nucléotide isolé","une chromatide entière"],"c":0,"e":"Chaque codon de trois nucléotides code pour un acide aminé spécifique, ou constitue un codon stop."},{"q":"Le code génétique est dit dégénéré (ou redondant) car :","o":["plusieurs codons différents peuvent coder pour le même acide aminé","chaque acide aminé n'a qu'un seul codon possible","il n'existe aucun codon stop","chaque codon code pour plusieurs acides aminés à la fois"],"c":0,"e":"La redondance du code génétique signifie que la plupart des acides aminés sont codés par plusieurs codons synonymes."},{"q":"Les molécules d'ARN de transfert (ARNt) ont pour rôle, lors de la traduction, d'apporter :","o":["l'acide aminé correspondant à un codon donné, au niveau du ribosome","l'énergie nécessaire à la traduction","le message génétique à transcrire","uniquement de l'eau"],"c":0,"e":"Chaque ARNt reconnaît un codon spécifique via son anticodon et transporte l'acide aminé correspondant."},{"q":"Le codon d'initiation de la traduction, présent chez la quasi-totalité des ARNm, code pour l'acide aminé :","o":["méthionine","glycine","alanine","leucine"],"c":0,"e":"Le codon AUG, codon d'initiation universel, code pour la méthionine, premier acide aminé incorporé dans la chaîne polypeptidique."},{"q":"L'importance des protéines dans le déterminisme des caractères tient au fait qu'elles constituent notamment :","o":["les enzymes et de nombreuses structures cellulaires, dont l'activité détermine le phénotype","uniquement une réserve d'énergie inerte","des molécules sans rôle biologique","uniquement du matériel génétique de réserve"],"c":0,"e":"Les protéines, produits de l'expression des gènes, assurent la quasi-totalité des fonctions biologiques déterminant le phénotype."},{"q":"Un gène peut être défini comme :","o":["une portion d'ADN codant pour un caractère héréditaire, généralement via une protéine","une molécule d'ARN uniquement","un chromosome entier","une cellule entière"],"c":0,"e":"Un gène est une séquence d'ADN qui contient l'information nécessaire à la synthèse d'un produit (souvent une protéine)."},{"q":"Le sens de lecture du code génétique lors de la traduction se fait par codons non chevauchants, ce qui signifie que :","o":["chaque nucléotide n'appartient qu'à un seul codon, lu successivement par groupes de trois","les codons se chevauchent partiellement","la lecture se fait de façon aléatoire","chaque nucléotide appartient à plusieurs codons simultanément"],"c":0,"e":"La lecture du message génétique se fait par tranches successives et non chevauchantes de trois nucléotides."}]},{"t":"Biologie — Les divisions cellulaires","m":"Biologie","f":"","g":"Octobre","q":[{"q":"La mitose permet d'obtenir, à partir d'une cellule mère, deux cellules filles :","o":["haploïdes et différentes","diploïdes et génétiquement identiques à la mère","haploïdes et identiques","tétraploïdes"],"c":1,"e":"La mitose conserve le nombre de chromosomes (2n) et produit deux cellules filles identiques à la cellule mère."},{"q":"La méiose, à partir d'une cellule mère diploïde, produit :","o":["2 cellules diploïdes","4 cellules haploïdes","1 seule cellule diploïde","4 cellules diploïdes"],"c":1,"e":"La méiose comprend deux divisions successives et aboutit à 4 cellules haploïdes (n chromosomes)."},{"q":"La méiose est essentielle car elle permet :","o":["la croissance des tissus","la formation des gamètes et le brassage génétique","la cicatrisation","la réplication de l'ADN uniquement"],"c":1,"e":"La méiose réduit de moitié le nombre de chromosomes et brasse l'information génétique (crossing-over, brassage interchromosomique), condition de la reproduction sexuée."},{"q":"Les différentes phases classiques de la mitose animale, dans l'ordre, sont :","o":["prophase, métaphase, anaphase, télophase","métaphase, prophase, télophase, anaphase","anaphase, télophase, prophase, métaphase","télophase, métaphase, anaphase, prophase"],"c":0,"e":"La mitose se déroule classiquement selon la succession prophase, métaphase, anaphase, télophase."},{"q":"Au cours de l'anaphase de la mitose, on observe :","o":["la séparation des chromatides sœurs, migrant chacune vers un pôle opposé","la condensation initiale des chromosomes","la disparition de l'enveloppe nucléaire uniquement","l'alignement des chromosomes sur la plaque équatoriale"],"c":0,"e":"L'anaphase se caractérise par la séparation des chromatides sœurs de chaque chromosome, qui migrent vers les pôles opposés de la cellule."},{"q":"La constance du nombre de chromosomes d'une cellule mère à ses cellules filles lors de la mitose s'explique par :","o":["la réplication préalable de l'ADN puis la répartition égale des chromatides sœurs","l'absence de réplication de l'ADN","une réduction du nombre de chromosomes de moitié","une fusion des chromosomes"],"c":0,"e":"Grâce à la réplication en phase S puis à la séparation équitable des chromatides, chaque cellule fille reçoit le même nombre de chromosomes que la cellule mère."},{"q":"L'importance biologique de la mitose réside notamment dans :","o":["la croissance, le renouvellement cellulaire et la réparation des tissus","la production exclusive de gamètes","la réduction du nombre de chromosomes","le brassage génétique important"],"c":0,"e":"La mitose assure la multiplication des cellules somatiques, essentielle à la croissance et au renouvellement tissulaire."},{"q":"La méiose, contrairement à la mitose, comporte :","o":["deux divisions successives à partir d'une seule réplication de l'ADN","une seule division cellulaire","trois divisions successives","une réplication répétée à chaque division"],"c":0,"e":"La méiose comprend deux divisions successives (division réductionnelle puis équationnelle) précédées d'une seule réplication de l'ADN."},{"q":"À l'issue de la méiose, à partir d'une cellule mère diploïde, on obtient :","o":["quatre cellules haploïdes","deux cellules diploïdes","une seule cellule haploïde","quatre cellules diploïdes"],"c":0,"e":"La méiose produit quatre cellules filles haploïdes (n chromosomes) à partir d'une cellule mère diploïde (2n)."},{"q":"L'importance génétique de la méiose tient notamment au fait qu'elle permet :","o":["le brassage génétique (interchromosomique et intrachromosomique) et le maintien du nombre de chromosomes à travers les générations","d'empêcher toute variation génétique","de dupliquer indéfiniment le génome","de produire des cellules identiques à la cellule mère"],"c":0,"e":"La méiose génère de la diversité génétique par brassage, tout en réduisant de moitié le nombre de chromosomes, compensé par la fécondation."},{"q":"Le brassage interchromosomique lors de la méiose résulte :","o":["de la répartition aléatoire des chromosomes homologues lors de la première division","de la fusion de deux chromosomes non homologues","de la mutation de l'ADN","de l'absence de division cellulaire"],"c":0,"e":"La disposition aléatoire des paires de chromosomes homologues à la métaphase I, suivie de leur séparation, génère un brassage interchromosomique."},{"q":"Le brassage intrachromosomique lors de la méiose résulte principalement :","o":["des crossing-over (échanges de segments) entre chromatides homologues","de la simple séparation des chromatides sœurs","de l'absence de tout échange génétique","de la duplication de l'ADN"],"c":0,"e":"Les crossing-over, se produisant en prophase I, échangent des segments entre chromatides de chromosomes homologues, créant de nouvelles combinaisons alléliques."},{"q":"L'observation microscopique de figures de mitose ou de méiose permet notamment :","o":["d'identifier et de classer les différentes étapes dans leur ordre chronologique","de mesurer directement la masse de la cellule","de déterminer la composition chimique du milieu","de calculer le PGCD du nombre de chromosomes"],"c":0,"e":"L'observation et la comparaison de figures cellulaires permettent de reconnaître les différentes phases et de reconstituer leur ordre chronologique."}]},{"t":"Biologie — Monohybridisme et dihybridisme","m":"Biologie","f":"","g":"Novembre","q":[{"q":"Le monohybridisme étudie la transmission :","o":["d'un seul caractère héréditaire","de deux caractères liés","du sexe uniquement","des mutations spontanées"],"c":0,"e":"Le monohybridisme concerne le croisement d'individus qui diffèrent par un seul caractère (un seul gène étudié)."},{"q":"Lors d'un croisement monohybride entre deux hétérozygotes (Aa × Aa), la proportion phénotypique attendue en F₂ est :","o":["1:1","3:1","9:3:3:1","1:2:1 en génotype et 3:1 en phénotype"],"c":3,"e":"En F₂, on obtient 1 AA : 2 Aa : 1 aa en génotype, soit 3/4 phénotype dominant et 1/4 phénotype récessif (ratio 3:1)."},{"q":"Dans un dihybridisme avec deux gènes indépendants (AaBb × AaBb), le ratio phénotypique classique en F₂ est :","o":["3:1","1:1:1:1","9:3:3:1","1:2:1"],"c":2,"e":"Deux gènes indépendants (2e loi de Mendel) donnent en F₂ le ratio caractéristique 9:3:3:1."},{"q":"Dans l'écriture conventionnelle d'un croisement génétique, les allèles d'un gène sont généralement représentés par :","o":["des lettres, majuscule pour l'allèle dominant, minuscule pour l'allèle récessif","uniquement des chiffres","des couleurs différentes","des symboles géométriques"],"c":0,"e":"La convention usuelle utilise une lettre majuscule pour l'allèle dominant et la même lettre en minuscule pour l'allèle récessif."},{"q":"Un individu homozygote pour un gène possède :","o":["deux allèles identiques de ce gène","deux allèles différents","un seul allèle, l'autre étant absent","trois allèles différents"],"c":0,"e":"L'homozygotie se caractérise par la présence de deux copies identiques d'un même allèle."},{"q":"Un individu hétérozygote pour un gène possède :","o":["deux allèles différents de ce gène","deux allèles identiques","aucun allèle","trois allèles différents"],"c":0,"e":"L'hétérozygotie se caractérise par la présence de deux allèles différents pour le gène considéré."},{"q":"L'échiquier de croisement (table de Punnett) est un outil utilisé pour :","o":["visualiser et calculer les proportions des différents génotypes issus d'un croisement","mesurer la taille des chromosomes","calculer le PGCD des allèles","observer directement les cellules au microscope"],"c":0,"e":"L'échiquier de croisement organise systématiquement toutes les combinaisons possibles de gamètes pour en déduire les proportions génotypiques et phénotypiques."},{"q":"Le test-cross (ou croisement-test) consiste à croiser un individu de génotype inconnu avec :","o":["un individu homozygote récessif pour le ou les caractères étudiés","un individu homozygote dominant","un individu de même génotype","un individu de sexe opposé uniquement"],"c":0,"e":"Le croisement avec un homozygote récessif permet de révéler directement les gamètes produits par l'individu testé, donc son génotype."},{"q":"Dans un dihybridisme portant sur deux gènes indépendants (situés sur des chromosomes différents), la répartition des gènes lors de la méiose suit :","o":["le principe de l'assortiment indépendant des gènes","une transmission systématiquement liée","une absence totale de ségrégation","une fusion des deux gènes"],"c":0,"e":"Deux gènes situés sur des chromosomes différents se répartissent indépendamment l'un de l'autre lors de la méiose."},{"q":"Dans un croisement monohybride, l'apparition en F₂ d'un caractère absent en F₁ (chez les hétérozygotes) illustre :","o":["le phénomène de dominance/récessivité entre les deux allèles","une mutation nouvelle","l'absence de transmission héréditaire","une erreur expérimentale systématique"],"c":0,"e":"La réapparition du caractère récessif en F₂ confirme sa présence masquée en F₁ par l'allèle dominant."},{"q":"Pour interpréter chromosomiquement les résultats d'un croisement, on associe chaque allèle étudié à :","o":["un locus précis sur un chromosome donné","l'ensemble du génome sans localisation précise","une molécule d'ARN uniquement","un organite cellulaire spécifique"],"c":0,"e":"L'interprétation chromosomique relie chaque allèle à sa position (locus) sur un chromosome, ce qui permet de suivre sa transmission lors de la méiose."},{"q":"La première loi de Mendel énonce que, pour un croisement entre deux lignées pures différant par un seul caractère, la génération F₁ est :","o":["homogène (uniforme dans son phénotype)","hétérogène avec plusieurs phénotypes","identique aux deux parents simultanément","toujours stérile"],"c":0,"e":"La loi de l'uniformité des hybrides de première génération établit que le croisement de deux lignées pures donne une F₁ homogène."},{"q":"L'établissement d'une carte factorielle (carte génétique) permet notamment de :","o":["situer relativement la position de plusieurs gènes sur un même chromosome","déterminer la couleur des chromosomes","mesurer la masse de l'ADN","compter le nombre total de cellules d'un organisme"],"c":0,"e":"La carte factorielle représente l'ordre et les distances relatives entre gènes liés sur un même chromosome, déduits des fréquences de recombinaison."}]},{"t":"Biologie — Gènes liés et hérédité liée au sexe","m":"Biologie","f":"","g":"Novembre","q":[{"q":"Deux gènes liés sont des gènes :","o":["portés par des chromosomes différents","situés sur le même chromosome et transmis généralement ensemble","toujours récessifs","situés uniquement sur le chromosome Y"],"c":1,"e":"Des gènes liés sont portés par le même chromosome ; ils sont transmis ensemble sauf recombinaison par crossing-over."},{"q":"Un caractère lié au sexe (porté par le chromosome X) est transmis selon un mode particulier car :","o":["l'homme (XY) est hémizygote pour les gènes du X","la femme ne possède pas de chromosome X","le chromosome Y porte les mêmes gènes que le X","tous les gènes liés au sexe sont dominants"],"c":0,"e":"L'homme (XY) n'a qu'un seul allèle pour les gènes portés par X : il est hémizygote, donc un allèle récessif s'exprime toujours chez lui."},{"q":"Le daltonisme et l'hémophilie sont des exemples classiques de maladies :","o":["autosomiques dominantes","récessives liées au chromosome X","portées par le chromosome Y","dues à une mutation somatique"],"c":1,"e":"Ces deux maladies sont dues à des allèles récessifs portés par le chromosome X, plus fréquentes chez les hommes."},{"q":"Deux gènes portés par le même chromosome et transmis généralement ensemble sont dits :","o":["liés","indépendants","allèliques","homozygotes"],"c":0,"e":"Des gènes liés sont situés sur le même chromosome et ont donc tendance à être transmis ensemble."},{"q":"La distance génétique entre deux gènes liés s'estime généralement à partir :","o":["de la fréquence des recombinaisons (crossing-over) observées entre eux","de leur taille physique respective","de leur couleur au microscope","de leur nombre de copies"],"c":0,"e":"Plus deux gènes sont éloignés sur un chromosome, plus la fréquence de recombinaison entre eux est élevée, ce qui permet d'estimer leur distance génétique."},{"q":"Chez l'espèce humaine, les chromosomes sexuels sont notés :","o":["X et Y","A et B","1 et 2","M et F uniquement"],"c":0,"e":"Les chromosomes sexuels humains sont désignés X et Y ; la femme est XX, l'homme XY."},{"q":"Un gène porté par le chromosome X et absent du chromosome Y est dit :","o":["hétérosomal (lié au sexe)","autosomal","mitochondrial","cytoplasmique"],"c":0,"e":"Un gène présent uniquement sur X (et non sur Y) suit une transmission liée au sexe, dite hétérosomale."},{"q":"Chez l'homme (XY), pour un gène lié au chromosome X, un seul allèle suffit à déterminer le phénotype car :","o":["l'homme ne possède qu'un seul chromosome X, donc qu'un seul allèle de ce gène","il possède deux chromosomes X comme la femme","le gène est également présent sur Y avec le même allèle","le gène ne s'exprime jamais chez l'homme"],"c":0,"e":"L'homme étant hémizygote pour les gènes portés par X (un seul exemplaire), un seul allèle détermine directement son phénotype."},{"q":"Une maladie récessive liée au chromosome X touche généralement :","o":["plus fréquemment les hommes que les femmes","plus fréquemment les femmes que les hommes","exactement autant les hommes que les femmes","uniquement les femmes"],"c":0,"e":"L'homme étant hémizygote pour X, un seul allèle récessif suffit à exprimer la maladie, alors que la femme doit être homozygote récessive : les hommes sont donc plus fréquemment touchés."},{"q":"Un croisement réciproque, où l'on inverse le sexe des parents porteurs de chaque allèle, permet notamment de :","o":["mettre en évidence une transmission liée au sexe","déterminer la couleur des chromosomes","mesurer directement la distance entre gènes","établir un caryotype"],"c":0,"e":"Si les résultats diffèrent selon le sexe du parent porteur d'un allèle, cela révèle une transmission liée au sexe (hérédité hétérosomale)."},{"q":"Dans l'estimation de la distance entre deux gènes liés, un faible pourcentage de recombinants traduit :","o":["une proximité importante entre les deux gènes sur le chromosome","un éloignement important entre les deux gènes","l'absence totale de liaison génétique","une transmission liée au sexe obligatoire"],"c":0,"e":"Moins deux gènes liés sont distants, moins les crossing-over ont de chance de se produire entre eux, donc moins de recombinants sont observés."},{"q":"Les phénotypes parentaux, plus fréquents que les phénotypes recombinés dans un croisement de gènes liés, s'expliquent par :","o":["le fait que la majorité des gamètes conservent la combinaison allélique parentale, sans crossing-over","l'absence totale de méiose","une mutation systématique","l'égalité stricte entre gènes liés et gènes indépendants"],"c":0,"e":"En l'absence de crossing-over, la majorité des gamètes produits conservent la combinaison allélique d'origine (phénotypes parentaux), d'où leur fréquence plus élevée."},{"q":"Le choix des symboles alléliques (conventions d'écriture) est une étape essentielle avant d'analyser un croisement génétique, car il permet :","o":["de représenter clairement chaque allèle et de suivre sa transmission tout au long du croisement","de déterminer directement le phénotype sans calcul","de remplacer l'observation expérimentale","de calculer automatiquement les distances génétiques"],"c":0,"e":"Une notation claire et cohérente des allèles est indispensable pour suivre rigoureusement leur transmission dans les schémas de croisement."}]},{"t":"Biologie — Mutation et somation","m":"Biologie","f":"","g":"Novembre","q":[{"q":"Une mutation est définie comme :","o":["une modification héréditaire et brutale du matériel génétique","une variation non héréditaire due au milieu","la division normale de la cellule","la fécondation d'un ovule"],"c":0,"e":"La mutation est un changement soudain et transmissible de la séquence d'ADN, à l'origine des allèles."},{"q":"La somation désigne une modification du phénotype qui est :","o":["héréditaire, transmise à la descendance","due au milieu et non héréditaire","toujours provoquée par une mutation germinale","identique à une mutation"],"c":1,"e":"La somation est une modification acquise, provoquée par le milieu, qui n'affecte pas les cellules reproductrices et n'est donc pas transmise."},{"q":"Une mutation touchant les cellules germinales (gamètes) est dite :","o":["somatique et non transmissible","germinale et héréditaire, transmissible à la descendance","une simple somation","impossible à détecter"],"c":1,"e":"Contrairement à la mutation somatique (limitée à l'individu), la mutation germinale affecte les gamètes et peut se transmettre à la descendance."},{"q":"Une mutation ponctuelle correspond à :","o":["une modification touchant un seul nucléotide de la séquence d'ADN","la duplication complète d'un chromosome","la perte d'un chromosome entier","une modification touchant l'ensemble du génome"],"c":0,"e":"La mutation ponctuelle est le changement le plus localisé, affectant un seul nucléotide."},{"q":"Une mutation par substitution consiste à :","o":["remplacer un nucléotide par un autre","ajouter un nucléotide supplémentaire","supprimer un nucléotide","dupliquer l'ensemble du gène"],"c":0,"e":"La substitution remplace simplement un nucléotide de la séquence par un autre."},{"q":"Une mutation par insertion ou délétion peut avoir des conséquences plus importantes qu'une substitution car elle provoque généralement :","o":["un décalage du cadre de lecture des codons en aval","aucune conséquence sur la protéine","uniquement un changement de couleur du phénotype","la disparition immédiate de tout le génome"],"c":0,"e":"L'ajout ou la perte d'un nucléotide (non multiple de trois) décale le cadre de lecture, modifiant potentiellement toute la protéine en aval de la mutation."},{"q":"Une mutation touchant les cellules somatiques (non germinales) a pour conséquence :","o":["de n'affecter que l'individu porteur, sans transmission à sa descendance","d'être systématiquement transmise à la descendance","de toucher immédiatement toutes les cellules du corps","de créer une nouvelle espèce"],"c":0,"e":"Une mutation somatique n'affecte que les cellules dérivées de la cellule mutée chez l'individu, sans passer par les gamètes."},{"q":"Une mutation touchant les cellules germinales, contrairement à une mutation somatique, peut :","o":["être transmise à la descendance de l'individu","uniquement affecter la peau","disparaître immédiatement sans effet","toucher uniquement les cellules musculaires"],"c":0,"e":"Une mutation dans les cellules germinales (gamètes ou leurs précurseurs) peut être transmise aux générations suivantes."},{"q":"L'importance biologique des mutations réside notamment dans le fait qu'elles constituent :","o":["la source ultime de la variabilité génétique et de l'évolution des espèces","un phénomène toujours néfaste et sans utilité","un mécanisme identique à la méiose","un phénomène exclusivement pathologique"],"c":0,"e":"Malgré des conséquences parfois délétères, les mutations sont la source première de la diversité génétique sur laquelle agit la sélection naturelle."},{"q":"La somation se distingue fondamentalement de la mutation car elle correspond à :","o":["une modification du phénotype d'origine non génétique, non transmissible à la descendance","une modification héréditaire de l'ADN","une modification touchant obligatoirement les gamètes","un phénomène identique à la mutation"],"c":0,"e":"La somation est une modification du phénotype liée à l'environnement (accident, maladie non génétique), sans altération de l'ADN, donc non héréditaire."},{"q":"Un exemple classique de somation est :","o":["une cicatrice ou une amputation accidentelle","le daltonisme héréditaire","la drépanocytose","l'albinisme"],"c":0,"e":"Une cicatrice résulte d'un accident et modifie le phénotype sans toucher le génome : c'est un exemple typique de somation, non héréditaire."},{"q":"Contrairement à la mutation, la somation n'est jamais transmise à la descendance car :","o":["elle ne modifie pas l'information génétique portée par l'ADN","elle affecte systématiquement les gamètes","elle se produit uniquement chez les plantes","elle est identique à un crossing-over"],"c":0,"e":"N'affectant pas l'ADN, la somation ne peut en aucun cas être transmise aux générations suivantes."},{"q":"Un agent capable de provoquer des mutations est appelé :","o":["un agent mutagène","un agent somatique","un allèle dominant","un caryotype"],"c":0,"e":"Les rayonnements ionisants, certains produits chimiques ou virus peuvent agir comme agents mutagènes, augmentant la fréquence des mutations."}]},{"t":"Biologie — Génétique humaine","m":"Biologie","f":"","g":"Décembre","q":[{"q":"Pour étudier la transmission d'une maladie héréditaire chez l'homme, on utilise principalement :","o":["le croisement expérimental direct","l'arbre généalogique (pedigree)","la culture in vitro","le clonage"],"c":1,"e":"Chez l'homme, les croisements expérimentaux étant impossibles, on analyse des arbres généalogiques pour déterminer le mode de transmission."},{"q":"Une maladie autosomique récessive ne s'exprime chez un enfant que si :","o":["un seul parent est porteur de l'allèle","les deux parents sont porteurs de l'allèle muté","le gène est porté par le chromosome Y","le gène est dominant"],"c":1,"e":"Pour une maladie récessive autosomique, l'enfant doit recevoir l'allèle muté de ses deux parents (souvent porteurs sains, hétérozygotes)."},{"q":"Le caryotype humain normal comporte :","o":["23 chromosomes","46 chromosomes, soit 23 paires","44 chromosomes","48 chromosomes"],"c":1,"e":"L'espèce humaine possède 46 chromosomes répartis en 23 paires (22 paires d'autosomes + 1 paire de chromosomes sexuels)."},{"q":"Le système de groupes sanguins ABO chez l'homme est déterminé par un gène possédant :","o":["trois allèles (A, B, O)","deux allèles seulement","quatre allèles","un seul allèle"],"c":0,"e":"Le système ABO repose sur trois allèles : A et B, codominants entre eux, et O, récessif par rapport aux deux autres."},{"q":"Dans le système ABO, les allèles A et B sont dits codominants car :","o":["lorsqu'ils sont tous deux présents (génotype AB), les deux caractères s'expriment simultanément","l'un domine systématiquement l'autre","aucun des deux ne s'exprime jamais","ils sont identiques l'un à l'autre"],"c":0,"e":"La codominance entre A et B explique que le génotype AB donne un phénotype AB, où les deux antigènes s'expriment ensemble."},{"q":"Le facteur rhésus, indépendant du système ABO, distingue les individus :","o":["rhésus positif (Rh+) et rhésus négatif (Rh−)","uniquement de type A ou B","uniquement mâles ou femelles","selon leur âge"],"c":0,"e":"Le système rhésus est un système de groupe sanguin distinct de l'ABO, avec un allèle dominant D (Rh+) et un allèle récessif (Rh−)."},{"q":"La drépanocytose est une maladie héréditaire :","o":["autosomale récessive, touchant l'hémoglobine","liée au chromosome Y","dominante et liée au sexe","d'origine uniquement somatique"],"c":0,"e":"La drépanocytose résulte d'une mutation d'un gène autosomal codant l'hémoglobine, transmise selon un mode récessif."},{"q":"L'albinisme, maladie héréditaire touchant la pigmentation, se transmet selon un mode :","o":["autosomal récessif","lié au chromosome X","dominant et lié au sexe","exclusivement somatique"],"c":0,"e":"L'albinisme est généralement dû à un gène autosomal récessif affectant la synthèse de mélanine."},{"q":"L'hémophilie, maladie héréditaire du sang, se transmet selon un mode :","o":["récessif lié au chromosome X","autosomal dominant","autosomal récessif","lié au chromosome Y"],"c":0,"e":"L'hémophilie est une maladie récessive liée au chromosome X, touchant plus fréquemment les hommes."},{"q":"Le daltonisme, trouble de la perception des couleurs, se transmet selon le même mode que :","o":["l'hémophilie, c'est-à-dire récessif lié à X","la drépanocytose, autosomale récessive","l'albinisme, autosomal récessif","aucune maladie connue, il est unique"],"c":0,"e":"Comme l'hémophilie, le daltonisme est une maladie récessive liée au chromosome X."},{"q":"Un arbre généalogique, utilisé pour étudier une maladie héréditaire humaine, permet notamment de :","o":["retracer la transmission du caractère sur plusieurs générations et d'en déduire le mode de transmission","mesurer directement le taux d'ADN d'un individu","observer les chromosomes au microscope","calculer le PGCD entre deux allèles"],"c":0,"e":"L'analyse d'un arbre généalogique permet de déduire, à partir de la répartition des individus atteints, le mode de transmission (dominant/récessif, autosomal/lié au sexe) de la maladie étudiée."},{"q":"Pour prévenir la transmission de maladies héréditaires graves, le conseil génétique s'appuie notamment sur :","o":["l'analyse des antécédents familiaux et, si besoin, un diagnostic génétique","l'absence totale de suivi médical","une simple observation visuelle du nouveau-né","le hasard uniquement"],"c":0,"e":"Le conseil génétique évalue les risques de transmission à partir de l'histoire familiale et des outils de diagnostic disponibles."},{"q":"Chez un couple dont les deux parents sont hétérozygotes pour une maladie autosomale récessive, la probabilité qu'un enfant soit atteint est de :","o":["1/4","1/2","3/4","1"],"c":0,"e":"Le croisement Aa × Aa donne, en moyenne, 1/4 d'enfants homozygotes récessifs (aa), donc atteints."}]},{"t":"Biologie — Réflexes et propriétés du tissu nerveux","m":"Biologie","f":"","g":"Décembre","q":[{"q":"Un arc réflexe simple comprend, dans l'ordre, les éléments suivants :","o":["récepteur → nerf sensitif → centre nerveux → nerf moteur → effecteur","effecteur → centre → récepteur","nerf moteur → récepteur → effecteur","centre nerveux uniquement"],"c":0,"e":"L'influx nerveux suit ce trajet : stimulus capté par un récepteur, voie afférente (sensitive), centre nerveux (moelle épinière), voie efférente (motrice), puis effecteur (muscle)."},{"q":"Les deux propriétés fondamentales du tissu nerveux sont :","o":["contractilité et élasticité","excitabilité et conductibilité","sécrétion et absorption","rigidité et extensibilité"],"c":1,"e":"Le neurone est excitable (capable de répondre à un stimulus) et conducteur (capable de propager un influx nerveux, le potentiel d'action)."},{"q":"Au niveau d'une synapse chimique, la transmission de l'information se fait par :","o":["contact électrique direct entre neurones","libération d'un neurotransmetteur dans la fente synaptique","déplacement du noyau du neurone","fusion des deux neurones"],"c":1,"e":"Le neurone présynaptique libère un neurotransmetteur qui traverse la fente synaptique et se fixe sur des récepteurs du neurone postsynaptique, rendant la transmission unidirectionnelle."},{"q":"Un réflexe inné se distingue d'un réflexe acquis par le fait qu'il est :","o":["présent dès la naissance, sans nécessiter d'apprentissage","acquis par répétition et apprentissage","toujours volontaire","absent chez tous les individus"],"c":0,"e":"Le réflexe inné est un comportement automatique présent dès la naissance, contrairement au réflexe acquis qui résulte d'un conditionnement."},{"q":"Un arc réflexe médullaire monosynaptique comporte, entre le récepteur et l'effecteur, :","o":["une seule synapse dans la moelle épinière","aucune synapse","plusieurs synapses successives","uniquement des synapses cérébrales"],"c":0,"e":"L'arc réflexe monosynaptique, le plus simple, ne comporte qu'une seule synapse entre le neurone sensitif et le neurone moteur."},{"q":"Un arc réflexe polysynaptique se distingue du monosynaptique par la présence :","o":["d'un ou plusieurs interneurones (neurones d'association) supplémentaires","d'aucun neurone sensitif","d'un seul neurone total","d'aucune synapse du tout"],"c":0,"e":"L'arc polysynaptique intègre au moins un interneurone entre le neurone sensitif et le neurone moteur, ajoutant une ou plusieurs synapses."},{"q":"La structure du nerf, observée en coupe transversale, révèle notamment :","o":["des faisceaux de fibres nerveuses regroupées","une structure homogène sans organisation particulière","uniquement des vaisseaux sanguins","une absence totale de fibres"],"c":0,"e":"Le nerf est organisé en faisceaux de fibres nerveuses, eux-mêmes regroupant de nombreux axones."},{"q":"Le neurone, unité structurale et fonctionnelle du système nerveux, comprend notamment :","o":["un corps cellulaire, des dendrites et un axone","uniquement un noyau isolé","uniquement une membrane sans organites","deux noyaux distincts"],"c":0,"e":"Le neurone typique se compose d'un corps cellulaire (soma), de dendrites réceptrices et d'un axone conducteur."},{"q":"Le potentiel de membrane (PM) au repos d'un neurone correspond à :","o":["une différence de potentiel électrique stable entre l'intérieur et l'extérieur de la cellule","l'absence totale de charge électrique","un potentiel toujours positif à l'intérieur","une valeur identique au potentiel d'action"],"c":0,"e":"Au repos, la membrane du neurone présente une différence de potentiel stable, généralement négative à l'intérieur par rapport à l'extérieur."},{"q":"Le potentiel d'action (PA) correspond à :","o":["une variation brève et importante du potentiel de membrane, se propageant le long de la fibre nerveuse","un état permanent et immuable de la membrane","l'absence de toute activité électrique","une propriété exclusive des muscles"],"c":0,"e":"Le potentiel d'action est une inversion transitoire et propagée du potentiel de membrane, support du message nerveux."},{"q":"L'excitabilité, propriété fondamentale du tissu nerveux, désigne sa capacité à :","o":["répondre à une stimulation en générant un signal électrique","se contracter comme un muscle","produire des hormones","se diviser indéfiniment"],"c":0,"e":"L'excitabilité est la capacité du tissu nerveux à réagir à un stimulus en produisant un potentiel d'action."},{"q":"La conductibilité, seconde propriété fondamentale du tissu nerveux, désigne sa capacité à :","o":["propager le message nerveux le long de la fibre, sans atténuation notable","empêcher toute propagation du signal","transformer le signal électrique en signal chimique uniquement au repos","se contracter"],"c":0,"e":"La conductibilité permet au potentiel d'action de se propager rapidement et sans atténuation le long de la fibre nerveuse."},{"q":"Au niveau d'une synapse neuromusculaire, comme au niveau d'une synapse interneuronale, la transmission du message repose sur :","o":["la libération d'un neurotransmetteur dans la fente synaptique","le passage direct du courant électrique sans intermédiaire chimique","la fusion complète des deux neurones","l'absence de toute communication"],"c":0,"e":"La transmission synaptique chimique repose sur la libération d'un neurotransmetteur, qui traverse la fente synaptique pour agir sur la cellule postsynaptique."}]},{"t":"Biologie — Le muscle strié squelettique","m":"Biologie","f":"","g":"Décembre","q":[{"q":"L'unité contractile de base du muscle strié squelettique est :","o":["la fibre nerveuse","le sarcomère","le tendon","le sarcoplasme uniquement"],"c":1,"e":"Le sarcomère, délimité par deux stries Z, contient les filaments d'actine et de myosine et constitue l'unité fonctionnelle de la contraction."},{"q":"La contraction musculaire résulte :","o":["du raccourcissement des filaments d'actine et de myosine","du glissement des filaments d'actine sur les filaments de myosine","de la disparition des myofibrilles","de la rupture du sarcolemme"],"c":1,"e":"Selon la théorie du glissement des filaments, l'actine glisse le long de la myosine, raccourcissant le sarcomère sans que les filaments eux-mêmes ne raccourcissent."},{"q":"L'énergie directement utilisée pour la contraction musculaire provient de :","o":["l'ATP","le glucose directement","l'ADN musculaire","l'oxygène seul"],"c":0,"e":"L'hydrolyse de l'ATP en ADP + Pi fournit l'énergie nécessaire au cycle de la contraction (accrochage/décrochage des ponts d'union actine-myosine)."},{"q":"Parmi les propriétés fondamentales du muscle strié squelettique figurent :","o":["l'excitabilité, la contractilité et l'élasticité","uniquement la conductibilité électrique","l'immobilité totale","la sécrétion hormonale exclusive"],"c":0,"e":"Le muscle possède notamment ces trois propriétés qui lui permettent de répondre à une stimulation par une contraction, puis de retrouver sa longueur initiale."},{"q":"Le myographe est un dispositif expérimental utilisé pour :","o":["enregistrer les variations de longueur ou de tension d'un muscle lors de sa contraction","mesurer la température corporelle","observer directement les chromosomes","mesurer la pression artérielle"],"c":0,"e":"Le myographe permet d'obtenir un myogramme, tracé représentant l'évolution de la contraction musculaire au cours du temps."},{"q":"La secousse musculaire correspond à la réponse d'un muscle à :","o":["une excitation isolée unique","une série d'excitations rapprochées","aucune excitation","une excitation permanente uniquement"],"c":0,"e":"La secousse musculaire est la réponse contractile élémentaire du muscle à un seul stimulus efficace."},{"q":"Le tétanos parfait est obtenu lorsque le muscle est soumis à :","o":["des excitations suffisamment rapprochées pour que les secousses fusionnent en une contraction soutenue","une seule excitation isolée","des excitations très espacées dans le temps","aucune stimulation"],"c":0,"e":"Le tétanos parfait résulte de stimulations à fréquence suffisamment élevée pour que les secousses individuelles se fusionnent complètement."},{"q":"L'électromyogramme enregistre :","o":["l'activité électrique du muscle lors de sa contraction","uniquement la tension mécanique développée","la température du muscle","le débit sanguin musculaire"],"c":0,"e":"L'électromyogramme mesure les phénomènes électriques associés à l'activité musculaire, précédant la réponse mécanique."},{"q":"Pendant la contraction musculaire, la consommation d'oxygène et de glucose par le muscle :","o":["augmente","diminue","reste rigoureusement constante","devient nulle"],"c":0,"e":"L'activité contractile accrue nécessite davantage d'énergie, ce qui augmente la consommation d'oxygène et de glucose."},{"q":"L'accumulation d'acide lactique dans le muscle lors d'un exercice intense résulte notamment :","o":["d'un métabolisme anaérobie lorsque l'apport en oxygène devient insuffisant","d'un excès d'oxygène disponible","de l'absence totale d'activité musculaire","d'une diminution du glucose consommé"],"c":0,"e":"Lorsque l'apport en oxygène ne suit plus la demande, le muscle recourt à la glycolyse anaérobie, produisant de l'acide lactique."},{"q":"Le mécanisme de la contraction musculaire, au niveau moléculaire, repose sur le glissement des filaments :","o":["d'actine par rapport aux filaments de myosine","de collagène par rapport à l'élastine","d'ADN par rapport à l'ARN","de tubuline uniquement"],"c":0,"e":"La théorie du glissement des filaments explique la contraction par le déplacement relatif des filaments d'actine le long des filaments de myosine."},{"q":"Les ions calcium (Ca²⁺) jouent, dans le mécanisme de la contraction musculaire, un rôle essentiel de :","o":["déclencheur, permettant l'interaction entre actine et myosine","inhibiteur systématique de la contraction","source d'énergie directe pour la contraction","constituant structural du sarcomère uniquement"],"c":0,"e":"La libération de Ca²⁺ dans le sarcoplasme démasque les sites de fixation sur l'actine, permettant l'interaction avec la myosine et donc la contraction."},{"q":"La fatigue musculaire peut notamment résulter :","o":["de l'accumulation de déchets métaboliques comme l'acide lactique et de l'épuisement des réserves énergétiques","d'un excès d'oxygène disponible en permanence","de l'absence totale d'activité contractile","d'une diminution du volume musculaire uniquement"],"c":0,"e":"L'accumulation de déchets et l'épuisement des réserves énergétiques du muscle sont des causes majeures de la fatigue musculaire."}]},{"t":"Biologie — La vision","m":"Biologie","f":"","g":"Janvier","q":[{"q":"La perception de la lumière au niveau de la rétine est assurée par :","o":["le cristallin","les cellules photoréceptrices (cônes et bâtonnets)","la cornée","l'humeur vitrée"],"c":1,"e":"Les cônes et les bâtonnets, situés dans la rétine, transforment le signal lumineux en message nerveux (phénomène de phototransduction)."},{"q":"Les cônes rétiniens sont surtout responsables de :","o":["la vision nocturne en faible lumière","la vision des couleurs en lumière vive","la sécrétion des larmes","l'accommodation du cristallin"],"c":1,"e":"Les cônes, concentrés dans la fovéa, assurent la vision diurne et la perception des couleurs, contrairement aux bâtonnets, sensibles en faible luminosité."},{"q":"Le trajet de la lumière dans l'œil, avant d'atteindre la rétine, traverse dans l'ordre :","o":["rétine → cristallin → cornée","cornée → cristallin → rétine","nerf optique → cristallin → cornée","cristallin → cornée → nerf optique"],"c":1,"e":"La lumière traverse la cornée, l'humeur aqueuse, le cristallin puis l'humeur vitrée avant de former une image sur la rétine."},{"q":"Le mécanisme de formation de l'image sur la rétine repose principalement sur :","o":["la réfraction de la lumière par les milieux transparents de l'œil, notamment le cristallin","l'absorption totale de la lumière par la cornée","l'émission de lumière par la rétine elle-même","l'absence de tout phénomène optique"],"c":0,"e":"Les milieux transparents de l'œil, en particulier le cristallin, réfractent la lumière pour former une image nette sur la rétine."},{"q":"Le phénomène d'accommodation de l'œil correspond à :","o":["la modification de la courbure du cristallin permettant une vision nette à différentes distances","l'ouverture et la fermeture de la pupille uniquement","le déplacement de la rétine","la coloration de l'iris"],"c":0,"e":"L'accommodation ajuste la courbure du cristallin, sous l'action des muscles ciliaires, pour adapter la mise au point selon la distance de l'objet observé."},{"q":"La rétine est qualifiée d'hétérogène car elle comporte :","o":["des zones aux caractéristiques différentes, avec une répartition inégale des cônes et des bâtonnets","une structure parfaitement uniforme sur toute sa surface","uniquement des cônes","uniquement des bâtonnets"],"c":0,"e":"La répartition des cônes et des bâtonnets varie selon les zones de la rétine, notamment entre la fovéa (riche en cônes) et la périphérie (riche en bâtonnets)."},{"q":"Les cônes rétiniens sont particulièrement sensibles :","o":["à une forte intensité lumineuse et responsables de la vision des couleurs","à une très faible intensité lumineuse uniquement","à l'obscurité totale","aux ultraviolets uniquement"],"c":0,"e":"Les cônes fonctionnent en conditions de forte luminosité (vision diurne) et permettent la perception des couleurs."},{"q":"Les bâtonnets rétiniens sont particulièrement sensibles :","o":["à une faible intensité lumineuse, responsables de la vision crépusculaire","à une forte intensité lumineuse uniquement","à la vision des couleurs exclusivement","à aucun niveau de lumière"],"c":0,"e":"Les bâtonnets, très sensibles, permettent la vision en faible luminosité (vision crépusculaire ou nocturne), mais sans distinction fine des couleurs."},{"q":"La notion d'adaptation à l'obscurité correspond au phénomène par lequel :","o":["la sensibilité des bâtonnets augmente progressivement dans l'obscurité, améliorant la vision nocturne","l'œil devient immédiatement aveugle dans le noir","les cônes deviennent plus actifs dans l'obscurité","la pupille se ferme totalement"],"c":0,"e":"Après un certain temps dans l'obscurité, la sensibilité des bâtonnets augmente progressivement, ce qui améliore la vision nocturne."},{"q":"La vision centrale, assurée principalement par la fovéa riche en cônes, correspond à :","o":["une vision précise et détaillée, utilisée notamment pour la lecture","une vision floue et périphérique uniquement","une perception uniquement des mouvements","l'absence totale de perception des couleurs"],"c":0,"e":"La fovéa, zone centrale de la rétine très riche en cônes, assure une vision fine et détaillée, nécessaire par exemple à la lecture."},{"q":"La vision périphérique, assurée principalement par les bâtonnets, est surtout utile pour :","o":["détecter les mouvements et voir dans des conditions de faible luminosité","lire un texte avec précision","distinguer finement les couleurs","observer des détails très fins"],"c":0,"e":"La périphérie de la rétine, riche en bâtonnets, est particulièrement sensible aux mouvements et à la faible lumière, bien que peu précise."},{"q":"La myopie, anomalie optique de l'œil, se caractérise par :","o":["une image qui se forme en avant de la rétine","une image qui se forme en arrière de la rétine","une déformation de la cornée uniquement en astigmatisme","une absence totale de vision"],"c":0,"e":"Dans la myopie, l'œil trop convergent (ou trop allongé) forme l'image des objets éloignés en avant de la rétine."},{"q":"L'hypermétropie, anomalie optique de l'œil, se caractérise par :","o":["une image qui se forme en arrière de la rétine","une image qui se forme en avant de la rétine","une perte totale de la vision des couleurs","une dilatation permanente de la pupille"],"c":0,"e":"Dans l'hypermétropie, l'œil pas assez convergent (ou trop court) forme l'image en arrière de la rétine."},{"q":"La presbytie, anomalie optique liée à l'âge, résulte principalement :","o":["d'une perte progressive de l'élasticité du cristallin, réduisant la capacité d'accommodation","d'une déformation irrégulière de la cornée","d'une atteinte des cônes rétiniens uniquement","d'une atteinte des bâtonnets rétiniens uniquement"],"c":0,"e":"Avec l'âge, le cristallin perd de son élasticité, ce qui réduit la capacité d'accommodation et gêne la vision de près."},{"q":"L'astigmatisme, anomalie optique de l'œil, résulte généralement :","o":["d'une courbure irrégulière de la cornée (ou du cristallin)","d'un œil trop long uniquement","d'un œil trop court uniquement","d'une absence totale de cristallin"],"c":0,"e":"L'astigmatisme provient d'une courbure non parfaitement sphérique de la cornée ou du cristallin, déformant l'image formée."},{"q":"La correction optique de la myopie fait généralement appel à des verres :","o":["divergents","convergents","à double foyer uniquement","totalement opaques"],"c":0,"e":"Les verres divergents corrigent la myopie en reculant le point de convergence de l'image vers la rétine."},{"q":"La correction optique de l'hypermétropie fait généralement appel à des verres :","o":["convergents","divergents","cylindriques uniquement","opaques"],"c":0,"e":"Les verres convergents corrigent l'hypermétropie en avançant le point de convergence de l'image vers la rétine."},{"q":"Le trajet de la lumière, avant d'atteindre la rétine, traverse successivement :","o":["la cornée, l'humeur aqueuse, le cristallin, puis l'humeur vitrée","directement la rétine sans traverser aucune structure","uniquement l'iris","uniquement le nerf optique"],"c":0,"e":"La lumière traverse successivement la cornée, l'humeur aqueuse, le cristallin et l'humeur vitrée avant d'atteindre la rétine."}]},{"t":"Biologie — La régulation humorale (eau, glycémie)","m":"Biologie","f":"","g":"Janvier","q":[{"q":"L'hormone qui abaisse la glycémie en favorisant l'entrée du glucose dans les cellules est :","o":["le glucagon","l'insuline","l'ADH","l'adrénaline uniquement"],"c":1,"e":"L'insuline, sécrétée par les cellules β des îlots de Langerhans, est hypoglycémiante : elle favorise le stockage et l'utilisation du glucose."},{"q":"L'hormone antidiurétique (ADH) agit principalement au niveau :","o":["du pancréas","du rein, en favorisant la réabsorption d'eau","du foie, en stockant le glucose","du cœur"],"c":1,"e":"L'ADH, sécrétée par l'hypophyse, augmente la perméabilité à l'eau des tubules rénaux, limitant ainsi les pertes d'eau et concentrant l'urine."},{"q":"Le pancréas endocrine, responsable de la régulation de la glycémie, correspond aux :","o":["acini pancréatiques","îlots de Langerhans","canaux pancréatiques","vésicules biliaires"],"c":1,"e":"Les îlots de Langerhans regroupent les cellules α (sécrétant le glucagon) et β (sécrétant l'insuline), responsables de la régulation hormonale de la glycémie."},{"q":"Le néphron, unité fonctionnelle du rein, joue un rôle essentiel dans :","o":["la formation de l'urine par filtration et réabsorption","la digestion des aliments","la synthèse des protéines plasmatiques","la contraction musculaire"],"c":0,"e":"Le néphron filtre le sang puis réabsorbe sélectivement l'eau et les solutés utiles, aboutissant à la formation de l'urine."},{"q":"Les osmorécepteurs, impliqués dans la régulation de la teneur en eau, détectent principalement :","o":["les variations de la pression osmotique du plasma sanguin","les variations de la glycémie","les variations de la pression artérielle uniquement","la température corporelle"],"c":0,"e":"Les osmorécepteurs, situés notamment dans l'hypothalamus, détectent les variations de concentration osmotique du sang."},{"q":"L'hormone antidiurétique (ADH) agit principalement en :","o":["augmentant la réabsorption d'eau au niveau du rein, diminuant ainsi le volume d'urine","augmentant l'élimination d'eau par le rein","stimulant la sécrétion d'insuline","abaissant la pression artérielle uniquement"],"c":0,"e":"L'ADH favorise la réabsorption d'eau au niveau des tubules rénaux, limitant les pertes hydriques."},{"q":"Le système rénine-angiotensine intervient dans la régulation :","o":["de la teneur en sodium et de la pression artérielle","exclusivement de la glycémie","exclusivement de la température corporelle","de la contraction musculaire uniquement"],"c":0,"e":"Ce système hormonal complexe régule la rétention de sodium et contribue au maintien de la pression artérielle."},{"q":"L'aldostérone, hormone impliquée dans la régulation du sodium, favorise :","o":["la réabsorption du sodium au niveau du rein","l'élimination massive du sodium","la sécrétion d'insuline","la digestion des graisses"],"c":0,"e":"L'aldostérone stimule la réabsorption du sodium (et donc d'eau) au niveau des tubules rénaux, contribuant à la régulation de la volémie."},{"q":"La régulation du pH sanguin par le rein s'effectue notamment par :","o":["l'élimination des ions H⁺ en échange d'autres cations","l'élimination exclusive de glucose","la production de globules rouges","la sécrétion d'insuline"],"c":0,"e":"Le rein participe à l'équilibre acido-basique en excrétant les ions H⁺ en excès, échangés contre d'autres cations."},{"q":"La notion d'homéostasie désigne :","o":["le maintien de la constance du milieu intérieur malgré les variations du milieu extérieur","une variation permanente et non régulée du milieu intérieur","l'absence totale de régulation physiologique","la disparition du milieu intérieur"],"c":0,"e":"L'homéostasie est la capacité de l'organisme à maintenir stables ses paramètres internes (eau, glycémie, pH, etc.) face aux perturbations."},{"q":"Le pancréas endocrine est constitué des îlots de Langerhans, comportant notamment :","o":["des cellules α sécrétant le glucagon et des cellules β sécrétant l'insuline","uniquement des cellules exocrines","uniquement des cellules sécrétant de l'ADH","des cellules produisant uniquement des enzymes digestives"],"c":0,"e":"Les îlots de Langerhans regroupent les cellules endocrines du pancréas, dont les cellules α (glucagon) et β (insuline)."},{"q":"Les acini pancréatiques, formant le tissu exocrine du pancréas, sont responsables de :","o":["la sécrétion d'enzymes digestives déversées dans le tube digestif","la sécrétion d'insuline dans le sang","la sécrétion de glucagon dans le sang","la régulation de la pression artérielle"],"c":0,"e":"Le tissu exocrine du pancréas (acini) sécrète le suc pancréatique riche en enzymes digestives, distinct de la fonction endocrine des îlots."},{"q":"L'insuline, à action hypoglycémiante, agit principalement en :","o":["favorisant l'entrée du glucose dans les cellules et sa mise en réserve","augmentant la libération de glucose par le foie","inhibant totalement l'absorption du glucose","stimulant la production d'urine"],"c":0,"e":"L'insuline abaisse la glycémie en favorisant l'entrée cellulaire du glucose et sa transformation en réserves (glycogène)."},{"q":"Le glucagon, à action hyperglycémiante, agit principalement en :","o":["stimulant la libération de glucose stocké dans le foie (glycogénolyse)","stimulant l'entrée du glucose dans les cellules","abaissant la glycémie","stimulant la sécrétion d'ADH"],"c":0,"e":"Le glucagon augmente la glycémie en stimulant la dégradation du glycogène hépatique et la libération de glucose dans le sang."},{"q":"L'insuline et le glucagon exercent des actions :","o":["antagonistes sur la régulation de la glycémie","identiques et complémentaires sur la glycémie","sans lien avec la glycémie","exclusivement sur la pression artérielle"],"c":0,"e":"Ces deux hormones pancréatiques ont des effets opposés (hypoglycémiant pour l'une, hyperglycémiant pour l'autre), assurant ensemble la régulation fine de la glycémie."},{"q":"Le schéma de synthèse de la régulation hydrominérale illustre notamment la coopération entre :","o":["les volorécepteurs, les osmorécepteurs et les hormones telles que l'ADH et l'aldostérone","uniquement le pancréas endocrine","uniquement les muscles squelettiques","uniquement le système nerveux somatique"],"c":0,"e":"La régulation hydrominérale résulte de l'intégration de plusieurs récepteurs et hormones agissant de concert pour maintenir l'équilibre en eau et en sels minéraux."},{"q":"Les volorécepteurs, impliqués dans la régulation hydrominérale, détectent principalement :","o":["les variations du volume sanguin","les variations de la glycémie","les variations de température corporelle","les variations du pH gastrique"],"c":0,"e":"Les volorécepteurs, situés notamment au niveau cardiaque et vasculaire, informent l'organisme des variations de volume sanguin circulant."},{"q":"Le maintien de la glycémie à une valeur relativement constante malgré les apports alimentaires variables illustre :","o":["un exemple concret d'homéostasie régulée par des mécanismes hormonaux","l'absence totale de régulation physiologique","une variation incontrôlée et permanente","un phénomène propre uniquement à la vision"],"c":0,"e":"La régulation glycémique, assurée notamment par l'insuline et le glucagon, est un exemple classique de mécanisme homéostatique."}]},{"t":"Biologie — Intégration neuro-hormonale (cœur, pression artérielle)","m":"Biologie","f":"","g":"Février","q":[{"q":"Le système nerveux sympathique, lorsqu'il est stimulé, a pour effet sur le cœur de :","o":["ralentir la fréquence cardiaque","accélérer la fréquence cardiaque","arrêter le cœur","n'a aucun effet"],"c":1,"e":"Le système sympathique (cardio-accélérateur) augmente la fréquence et la force des contractions cardiaques, contrairement au parasympathique qui les ralentit."},{"q":"Les barorécepteurs, situés notamment au niveau du sinus carotidien, détectent :","o":["la concentration en glucose sanguin","les variations de la pression artérielle","la température corporelle","la concentration en oxygène uniquement"],"c":1,"e":"Ces récepteurs sensibles à l'étirement de la paroi artérielle informent en permanence les centres nerveux des variations de pression artérielle."},{"q":"Le nerf de Hering, issu des barorécepteurs, transmet l'information vers :","o":["le muscle cardiaque directement","les centres nerveux bulbaires régulateurs de la pression artérielle","les reins","les poumons"],"c":1,"e":"Le nerf de Hering (branche du glossopharyngien) achemine l'influx sensitif vers le centre cardiomodérateur du bulbe rachidien, qui ajuste ensuite l'activité cardiaque."},{"q":"L'automatisme cardiaque désigne la capacité du cœur à :","o":["se contracter rythmiquement de façon autonome, sans commande nerveuse extérieure indispensable","ne jamais se contracter sans stimulation nerveuse","dépendre entièrement du système nerveux central pour chaque battement","s'arrêter en l'absence d'innervation"],"c":0,"e":"Le cœur possède un tissu nodal capable de générer et propager spontanément l'influx à l'origine de son activité rythmique, indépendamment d'une commande nerveuse extérieure."},{"q":"Les centres nerveux cardio-modérateurs, impliqués dans la régulation de l'activité cardiaque, ont pour effet de :","o":["ralentir la fréquence cardiaque","accélérer systématiquement la fréquence cardiaque","stopper définitivement le cœur","n'avoir aucun effet sur le cœur"],"c":0,"e":"Les centres cardio-modérateurs, via le système parasympathique, exercent un effet ralentisseur sur la fréquence cardiaque."},{"q":"Les centres nerveux cardio-accélérateurs, impliqués dans la régulation de l'activité cardiaque, ont pour effet de :","o":["augmenter la fréquence cardiaque","ralentir la fréquence cardiaque","n'avoir aucun effet sur le cœur","stopper le cœur en diastole"],"c":0,"e":"Les centres cardio-accélérateurs, via le système orthosympathique, augmentent la fréquence et la force des contractions cardiaques."},{"q":"Les barorécepteurs, notamment situés au niveau du sinus carotidien, permettent de détecter :","o":["les variations de la pression artérielle","les variations de la glycémie","les variations de la température corporelle","les variations du pH gastrique"],"c":0,"e":"Les barorécepteurs sont sensibles à la pression exercée sur la paroi des vaisseaux, ce qui permet de détecter les variations de pression artérielle."},{"q":"Le nerf de Ludwig-Cyon, comme celui de Hering, transmet l'information des barorécepteurs vers :","o":["les centres nerveux bulbaires régulant l'activité cardiaque","directement le muscle cardiaque, sans relais nerveux","les muscles squelettiques","le pancréas endocrine"],"c":0,"e":"Ces nerfs sensitifs acheminent l'information issue des barorécepteurs vers les centres nerveux du bulbe rachidien, qui ajustent alors l'activité cardiaque."},{"q":"Les voies motrices para- et orthosympathiques, dans la régulation cardiaque, transmettent la commande nerveuse :","o":["des centres nerveux vers le cœur","du cœur vers les centres nerveux","uniquement vers les muscles squelettiques","uniquement vers les reins"],"c":0,"e":"Ces voies motrices efférentes transmettent aux centres nerveux vers le cœur les commandes ajustant sa fréquence."},{"q":"Les hormones de la médullosurrénale, comme l'adrénaline, participent à la régulation de la pression artérielle en :","o":["augmentant la fréquence cardiaque et la vasoconstriction","abaissant systématiquement la fréquence cardiaque","stimulant uniquement la digestion","n'ayant aucun effet cardiovasculaire"],"c":0,"e":"L'adrénaline, sécrétée par la médullosurrénale, stimule le cœur et provoque une vasoconstriction, contribuant à augmenter la pression artérielle."},{"q":"L'électrocardiogramme (ECG) permet d'enregistrer :","o":["l'activité électrique du cœur au cours du cycle cardiaque","uniquement la pression artérielle","la température corporelle","l'activité électrique des muscles squelettiques uniquement"],"c":0,"e":"L'ECG enregistre les variations électriques associées à la dépolarisation et à la repolarisation du muscle cardiaque."},{"q":"L'intégration neuro-hormonale de la régulation cardiovasculaire illustre la coopération entre :","o":["le système nerveux (voies rapides) et le système hormonal (action plus durable)","uniquement le système nerveux","uniquement le système hormonal","aucun des deux systèmes, la régulation étant automatique et isolée"],"c":0,"e":"La régulation cardiovasculaire combine l'action rapide du système nerveux et l'action plus durable des hormones, formant une intégration neuro-hormonale complète."},{"q":"Une augmentation détectée de la pression artérielle déclenche, via les barorécepteurs, une réponse réflexe qui tend à :","o":["ralentir le cœur et diminuer la pression artérielle vers sa valeur normale","augmenter davantage la pression artérielle","n'avoir aucun effet correcteur","stopper immédiatement le cœur"],"c":0,"e":"Ce rétrocontrôle négatif permet de ramener la pression artérielle vers sa valeur de consigne lorsqu'elle s'élève anormalement."}]},{"t":"Biologie — Gamétogenèse","m":"Biologie","f":"","g":"Février","q":[{"q":"La spermatogenèse, à partir d'une spermatogonie, aboutit à la production de :","o":["1 seul spermatozoïde","4 spermatozoïdes fonctionnels","2 spermatozoïdes","4 ovules"],"c":1,"e":"Chaque cellule mère (spermatocyte I) subit une méiose complète et produit 4 spermatozoïdes haploïdes fonctionnels."},{"q":"Contrairement à la spermatogenèse, l'ovogenèse produit, à partir d'une cellule mère :","o":["4 ovules fonctionnels identiques","un seul ovule fonctionnel et des globules polaires non fonctionnels","aucun gamète","2 ovules fonctionnels"],"c":1,"e":"La méiose ovocytaire est inégale : elle donne un seul ovule fonctionnel et des globules polaires qui dégénèrent."},{"q":"Spermatogenèse et ovogenèse ont en commun de reposer toutes deux sur :","o":["la mitose uniquement","la méiose, qui réduit de moitié le nombre de chromosomes","la fécondation","la mutation génétique"],"c":1,"e":"Les deux processus de gamétogenèse impliquent une méiose qui transforme des cellules diploïdes (2n) en cellules haploïdes (n)."},{"q":"La spermatogenèse, à partir d'une spermatogonie, aboutit après méiose et différenciation à la production de :","o":["quatre spermatozoïdes fonctionnels","un seul spermatozoïde","deux spermatozoïdes uniquement","aucun gamète fonctionnel"],"c":0,"e":"Contrairement à l'ovogenèse, la spermatogenèse produit quatre gamètes fonctionnels à partir d'une seule cellule initiale."},{"q":"L'ovogenèse, contrairement à la spermatogenèse, aboutit, à partir d'une cellule mère, à la production de :","o":["un seul ovule fonctionnel et des globules polaires non fonctionnels","quatre ovules fonctionnels","aucun gamète","deux ovules fonctionnels identiques"],"c":0,"e":"Les divisions inégales de l'ovogenèse produisent un seul ovule volumineux et fonctionnel, les autres cellules formées (globules polaires) dégénérant."},{"q":"La structure et l'ultrastructure du spermatozoïde comprennent notamment :","o":["une tête contenant le noyau et l'acrosome, une pièce intermédiaire riche en mitochondries et un flagelle","uniquement un noyau sans aucune autre structure","une paroi cellulosique rigide","l'absence totale de mobilité"],"c":0,"e":"Le spermatozoïde présente une organisation spécialisée en tête (noyau, acrosome), pièce intermédiaire (mitochondries) et flagelle assurant sa mobilité."},{"q":"L'ovocyte II, gamète féminin issu de l'ovogenèse, se caractérise notamment par :","o":["une grande quantité de cytoplasme et de réserves nutritives","une absence totale de cytoplasme","une mobilité active grâce à un flagelle","une taille identique à celle du spermatozoïde"],"c":0,"e":"L'ovocyte II est une cellule volumineuse, riche en réserves cytoplasmiques nécessaires au développement précoce de l'embryon."},{"q":"La comparaison entre spermatogenèse et ovogenèse révèle notamment que les deux processus :","o":["reposent sur la méiose mais diffèrent par le nombre et la taille des gamètes produits","sont rigoureusement identiques en tout point","ne font pas intervenir la méiose","produisent le même nombre de gamètes fonct
