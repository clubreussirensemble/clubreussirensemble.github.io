 < 7","pH > 7","pH = 7","pH = 0"],"c":1,"e":"À 25°C, une solution est basique si pH > 7, neutre si pH = 7, acide si pH < 7."},{"q":"La concentration en ions oxonium [H₃O⁺] d'une solution se calcule à partir du pH par la relation :","o":["[H₃O⁺] = 10^(−pH)","[H₃O⁺] = −log(pH)","[H₃O⁺] = pH/10","[H₃O⁺] = 10^pH"],"c":0,"e":"Par définition du pH, [H₃O⁺] = 10^(−pH)."},{"q":"Le pH d'une solution se calcule à partir de la concentration en ions oxonium par la relation :","o":["pH = −log[H₃O⁺]","pH = [H₃O⁺]","pH = 10^[H₃O⁺]","pH = 1/[H₃O⁺]"],"c":0,"e":"pH = −log[H₃O⁺], relation fondamentale définissant le pH."},{"q":"Lorsque la température augmente, le produit ionique de l'eau Ke :","o":["augmente","diminue","reste rigoureusement constant","devient négatif"],"c":0,"e":"L'autoprotolyse de l'eau étant endothermique, une hausse de température déplace l'équilibre vers la dissociation, augmentant Ke."},{"q":"À 25°C, une solution aqueuse est dite neutre lorsque :","o":["pH = 7","pH = 0","pH = 14","pH < 7"],"c":0,"e":"À 25°C, la neutralité correspond à pH = 7, où [H₃O⁺] = [OH⁻]."},{"q":"À 25°C, une solution aqueuse est acide lorsque :","o":["pH < 7","pH > 7","pH = 7","pH = 14"],"c":0,"e":"Une solution acide se caractérise, à 25°C, par un pH inférieur à 7."},{"q":"Dans l'eau pure à 25°C, les concentrations en ions H₃O⁺ et OH⁻ sont :","o":["égales entre elles","telles que [H₃O⁺] > [OH⁻]","telles que [OH⁻] > [H₃O⁺]","toutes deux nulles"],"c":0,"e":"Dans l'eau pure, l'autoprotolyse produit autant d'ions H₃O⁺ que d'ions OH⁻."},{"q":"À 25°C, la valeur du produit ionique de l'eau Ke est généralement admise égale à :","o":["10⁻¹⁴","10⁻⁷","10⁻¹","1"],"c":0,"e":"À 25°C, Ke = [H₃O⁺]·[OH⁻] = 10⁻¹⁴."},{"q":"La relation générale reliant le pH et le pOH d'une solution aqueuse à 25°C s'écrit :","o":["pH + pOH = 14","pH − pOH = 14","pH · pOH = 14","pH = pOH"],"c":0,"e":"À 25°C, pH + pOH = 14, ce qui découle directement de Ke = 10⁻¹⁴."},{"q":"L'autoprotolyse de l'eau est une réaction :","o":["entre deux molécules d'eau, l'une cédant un proton à l'autre","entre l'eau et l'air","observée uniquement en présence d'un acide fort","impossible dans l'eau pure"],"c":0,"e":"2 H₂O ⇌ H₃O⁺ + OH⁻ : une molécule d'eau cède un proton à une autre molécule d'eau."},{"q":"Si la concentration en ions H₃O⁺ d'une solution est 10⁻³ mol/L, son pH vaut :","o":["3","−3","11","10"],"c":0,"e":"pH = −log(10⁻³) = 3."},{"q":"Si le pH d'une solution vaut 9, sa concentration en ions H₃O⁺ est :","o":["10⁻⁹ mol/L","10⁹ mol/L","9 mol/L","10⁻⁵ mol/L"],"c":0,"e":"[H₃O⁺] = 10^(−pH) = 10⁻⁹ mol/L."},{"q":"Dans une solution acide, par rapport à l'eau pure, la concentration en ions H₃O⁺ est :","o":["supérieure à 10⁻⁷ mol/L","inférieure à 10⁻⁷ mol/L","toujours nulle","égale à celle en OH⁻"],"c":0,"e":"Une solution acide présente une concentration en H₃O⁺ supérieure à celle de l'eau pure (10⁻⁷ mol/L à 25°C)."},{"q":"La constante Ke étant fixée à une température donnée, le produit [H₃O⁺]·[OH⁻] dans toute solution aqueuse :","o":["est constant et égal à Ke, quelle que soit la solution","varie selon l'acidité de la solution","est toujours nul","dépend uniquement du volume"],"c":0,"e":"Ke est une constante caractéristique de l'eau à une température donnée, valable pour toute solution aqueuse à cette température."},{"q":"Le pH d'une solution est défini, pour des concentrations pas trop élevées, par la relation :","o":["pH = −log[H₃O⁺]","pH = log[H₃O⁺]","pH = [H₃O⁺]/Ke","pH = Ke/[H₃O⁺]"],"c":0,"e":"Le pH est défini comme l'opposé du logarithme décimal de la concentration en ions H₃O⁺."},{"q":"Si l'on dilue une solution acide par ajout d'eau, son pH :","o":["augmente, se rapprochant de 7","diminue","reste rigoureusement constant","devient négatif"],"c":0,"e":"La dilution réduit la concentration en ions H₃O⁺, ce qui fait augmenter le pH vers la neutralité."}]},{"t":"Chimie — Acides forts et bases fortes","m":"Chimie","f":"","g":"Octobre","q":[{"q":"Pour une solution d'acide fort de concentration Ca, la relation avec le pH est :","o":["pH = Ca","pH = log(Ca)","pH = −log(Ca)","pH = 14 − Ca"],"c":2,"e":"Un acide fort étant totalement dissocié, [H₃O⁺] = Ca, donc pH = −log(Ca)."},{"q":"HCl est qualifié d'acide fort car sa réaction avec l'eau est :","o":["totale","limitée","nulle","réversible et incomplète"],"c":0,"e":"Un acide fort réagit totalement avec l'eau : la réaction est quantitative (totale)."},{"q":"Pour une solution de NaOH (base forte) de concentration Cb, on a :","o":["pH = −log(Cb)","pH = log(Cb)","pH = 14 + log(Cb)","pH = 14 − log(Cb)"],"c":2,"e":"Cb = [OH⁻], donc pOH = −log(Cb) et pH = 14 − pOH = 14 + log(Cb)."},{"q":"La préparation d'une solution de chlorure d'hydrogène (HCl) en solution aqueuse s'effectue par :","o":["dissolution du gaz chlorure d'hydrogène dans l'eau","évaporation d'eau salée","chauffage de sel de cuisine","dilution d'une base forte"],"c":0,"e":"Le gaz HCl, très soluble dans l'eau, réagit totalement avec elle pour donner la solution d'acide chlorhydrique."},{"q":"L'équation de la réaction totale de HCl avec l'eau s'écrit :","o":["HCl + H₂O → H₃O⁺ + Cl⁻","HCl + H₂O ⇌ H₃O⁺ + Cl⁻","HCl + H₂O → H₂ + Cl₂O","HCl → H⁺ + Cl⁻, réaction incomplète"],"c":0,"e":"HCl est un acide fort : sa réaction avec l'eau est totale, représentée par une flèche simple."},{"q":"L'étude quantitative d'une solution de HCl consiste notamment à :","o":["mesurer le pH et vérifier la relation pH = −log(Ca)","mesurer uniquement la couleur de la solution","peser le volume de solution","chauffer la solution jusqu'à ébullition"],"c":0,"e":"L'étude quantitative vise à confronter la mesure expérimentale du pH à la valeur théorique attendue pour un acide fort."},{"q":"L'hydroxyde de sodium (NaOH) est qualifié de base forte car, en solution aqueuse, sa dissociation est :","o":["totale","partielle","nulle","réversible et limitée"],"c":0,"e":"NaOH se dissocie totalement dans l'eau en ions Na⁺ et OH⁻, ce qui en fait une base forte."},{"q":"La préparation d'une solution aqueuse de NaOH s'effectue généralement par :","o":["dissolution de pastilles ou de cristaux de NaOH dans l'eau","réaction de l'eau avec un gaz uniquement","distillation","combustion"],"c":0,"e":"NaOH solide se dissout dans l'eau en se dissociant totalement en ions Na⁺ et OH⁻."},{"q":"Pour vérifier expérimentalement la relation entre le pH et la concentration Ca d'un acide fort, on peut :","o":["mesurer le pH de plusieurs solutions de concentrations connues et le comparer à la valeur théorique −log(Ca)","peser uniquement la masse d'acide","chauffer la solution","observer sa couleur"],"c":0,"e":"La comparaison entre pH mesuré et pH théorique −log(Ca) permet de vérifier la validité de la relation pour un acide fort."},{"q":"Pour un acide fort, la relation pH = −log(Ca) suppose que :","o":["la dissociation de l'acide dans l'eau est totale","la dissociation est partielle","l'acide est insoluble","la concentration est très faible uniquement"],"c":0,"e":"Cette relation n'est valable que si tout l'acide introduit est dissocié, ce qui est le cas d'un acide fort."},{"q":"Pour une base forte de concentration Cb, la concentration en ions hydroxyde OH⁻ vaut :","o":["[OH⁻] = Cb","[OH⁻] = −Cb","[OH⁻] = 1/Cb","[OH⁻] = 14 − Cb"],"c":0,"e":"Une base forte étant totalement dissociée, [OH⁻] = Cb."},{"q":"L'étude qualitative d'une solution de HCl permet notamment de mettre en évidence :","o":["son caractère acide, par exemple au papier pH ou par réaction avec un métal","son caractère basique","son absence totale de réactivité","sa neutralité"],"c":0,"e":"Le test au papier pH ou la réaction avec un métal actif révèle le caractère acide de la solution de HCl."},{"q":"Une solution de HCl de concentration 10⁻² mol/L a, en toute rigueur, un pH théorique proche de :","o":["2","12","7","14"],"c":0,"e":"pH = −log(Ca) = −log(10⁻²) = 2, l'acide étant totalement dissocié."},{"q":"Une solution de NaOH de concentration 10⁻² mol/L a un pH théorique proche de :","o":["12","2","7","14"],"c":0,"e":"pOH = −log(10⁻²) = 2, donc pH = 14 − 2 = 12."},{"q":"Contrairement à un acide faible, un acide fort en solution aqueuse ne présente, en solution diluée, quasiment pas :","o":["de molécules non dissociées (HA)","d'ions H₃O⁺","d'eau","de charge électrique"],"c":0,"e":"La dissociation totale d'un acide fort implique l'absence quasi totale de molécules HA non dissociées."},{"q":"La différence essentielle entre un acide fort et un acide faible réside dans :","o":["le taux de dissociation dans l'eau, total pour l'acide fort, partiel pour l'acide faible","la couleur de la solution","la présence ou non d'hydrogène","la masse molaire"],"c":0,"e":"Un acide fort se dissocie totalement dans l'eau, alors qu'un acide faible ne se dissocie que partiellement."},{"q":"Une base forte, en solution aqueuse, capte ou libère des ions de façon :","o":["totale, sans équilibre","partielle, avec équilibre","nulle","aléatoire"],"c":0,"e":"Comme pour un acide fort, la dissociation d'une base forte est totale, sans équilibre chimique."},{"q":"Vérifier expérimentalement la relation pH = 14 − pOH pour une base forte revient à comparer :","o":["le pH mesuré à la valeur théorique calculée à partir de la concentration Cb","uniquement la couleur de la solution","le volume de la solution","la température ambiante"],"c":0,"e":"On confronte le pH mesuré expérimentalement à celui calculé théoriquement à partir de Cb pour valider la relation."}]},{"t":"Chimie — Couples acides-bases","m":"Chimie","f":"","g":"Novembre","q":[{"q":"Selon Brönsted, un acide est une espèce capable de :","o":["céder un proton H⁺","capter un proton H⁺","céder un électron","capter un électron"],"c":0,"e":"Définition de Brönsted : un acide cède un proton H⁺, une base en capte un."},{"q":"La constante d'acidité Ka d'un couple acide-base est reliée au pKa par :","o":["pKa = Ka","pKa = −log(Ka)","pKa = 1/Ka","pKa = log(Ka)"],"c":1,"e":"Par définition, pKa = −log(Ka), comme pour le pH et [H₃O⁺]."},{"q":"Plus le pKa d'un couple acide-base est petit, plus l'acide est :","o":["faible","fort","neutre","basique"],"c":1,"e":"Un pKa faible correspond à un Ka élevé, donc à un acide plus dissocié, plus fort."},{"q":"Selon Brönsted, une base est une espèce chimique capable de :","o":["capter un proton H⁺","céder un proton H⁺","céder un électron","capter un électron"],"c":0,"e":"Définition de Brönsted : une base capte un proton H⁺, contrairement à l'acide qui en cède un."},{"q":"Dans le couple acide-base CH₃COOH/CH₃COO⁻, l'espèce CH₃COO⁻ joue le rôle de :","o":["base conjuguée de l'acide CH₃COOH","acide conjugué","espèce neutre sans rôle acido-basique","catalyseur"],"c":0,"e":"CH₃COO⁻ est la base conjuguée obtenue après que l'acide CH₃COOH a cédé un proton."},{"q":"Le couple NH₄⁺/NH₃ est un exemple de couple acide-base où :","o":["NH₄⁺ est l'acide et NH₃ est la base conjuguée","NH₃ est l'acide et NH₄⁺ est la base","les deux espèces sont des acides","les deux espèces sont des bases"],"c":0,"e":"NH₄⁺ cède un proton pour donner NH₃ : NH₄⁺ est donc l'acide du couple, NH₃ la base conjuguée."},{"q":"Une espèce amphotère (ou ampholyte) est une espèce chimique capable de :","o":["se comporter tantôt comme un acide, tantôt comme une base selon le milieu","réagir uniquement comme un acide","réagir uniquement comme une base","rester totalement inerte"],"c":0,"e":"Une espèce amphotère peut céder ou capter un proton selon la nature du réactif rencontré."},{"q":"Un polyacide est un acide capable de céder, au cours de sa dissociation :","o":["plusieurs protons H⁺ successivement","un seul proton H⁺","uniquement des électrons","uniquement des ions hydroxyde"],"c":0,"e":"Un polyacide, comme l'acide phosphorique, possède plusieurs atomes d'hydrogène acides cessibles successivement."},{"q":"Pour un couple acide-base, la constante d'acidité Ka s'exprime, pour le couple AH/A⁻, par :","o":["Ka = [A⁻]·[H₃O⁺]/[AH]","Ka = [AH]/[A⁻]","Ka = [AH]·[A⁻]","Ka = [H₃O⁺]/[AH]"],"c":0,"e":"Ka est le quotient de réaction à l'équilibre pour AH + H₂O ⇌ A⁻ + H₃O⁺."},{"q":"Pour deux couples acide-base, celui dont l'acide possède le Ka le plus grand correspond à un acide :","o":["plus fort","plus faible","de même force que l'autre","totalement inerte"],"c":0,"e":"Un Ka plus grand traduit une dissociation plus poussée, donc un acide plus fort."},{"q":"Le classement des couples acide-base selon leur pKa permet d'établir une relation d'ordre entre :","o":["la force des acides d'une part, et celle des bases d'autre part","uniquement la couleur des solutions","uniquement leur masse molaire","uniquement leur solubilité"],"c":0,"e":"Le pKa permet de classer les acides (et les bases conjuguées) par force croissante ou décroissante."},{"q":"Le domaine de prédominance de la forme acide AH d'un couple acide-base correspond aux valeurs de pH :","o":["inférieures au pKa du couple","supérieures au pKa du couple","toujours égales à 7","indépendantes du pKa"],"c":0,"e":"Pour pH < pKa, la forme acide AH prédomine sur la base conjuguée A⁻."},{"q":"Le domaine de prédominance de la forme basique A⁻ d'un couple acide-base correspond aux valeurs de pH :","o":["supérieures au pKa du couple","inférieures au pKa du couple","toujours égales à 0","indépendantes du pKa"],"c":0,"e":"Pour pH > pKa, c'est la base conjuguée A⁻ qui prédomine."},{"q":"Un indicateur coloré acido-basique est lui-même un exemple :","o":["de couple acide-base faible, dont les deux formes ont des couleurs différentes","d'acide fort uniquement","de base forte uniquement","de sel neutre sans propriété acido-basique"],"c":0,"e":"Un indicateur coloré est un couple acide/base faible dont la forme acide et la forme basique ont des teintes différentes."},{"q":"Pour vérifier expérimentalement la loi d'action de masse sur un couple acide faible/base conjuguée, on peut :","o":["mesurer le pH de mélanges de proportions connues et le comparer à la valeur théorique donnée par Ka","mesurer uniquement la masse des réactifs","chauffer la solution jusqu'à ébullition","observer uniquement la couleur"],"c":0,"e":"On compare la valeur de Ka déduite des mesures de pH à la valeur théorique attendue."},{"q":"Le couple de l'eau, utilisé comme solvant acido-basique, est généralement noté :","o":["H₃O⁺/H₂O ou H₂O/OH⁻","H₂/O₂","OH⁻/O₂","H⁺/H−"],"c":0,"e":"L'eau intervient dans deux couples acide-base : H₃O⁺/H₂O (l'eau base) et H₂O/OH⁻ (l'eau acide)."},{"q":"À pH égal au pKa d'un couple acide-base, les concentrations des deux formes du couple sont :","o":["égales","l'une nulle","toutes deux nulles","dans un rapport de 10"],"c":0,"e":"pH = pKa + log([A⁻]/[AH]) ; si pH = pKa, log([A⁻]/[AH]) = 0, donc [A⁻] = [AH]."},{"q":"Une espèce amphotère typique, capable de céder et de capter un proton, est notamment :","o":["l'ion hydrogénocarbonate HCO₃⁻","l'ion sodium Na⁺","l'eau chlorée uniquement","le méthane CH₄"],"c":0,"e":"HCO₃⁻ peut céder un proton pour donner CO₃²⁻, ou en capter un pour redonner H₂CO₃ : c'est une espèce amphotère."}]},{"t":"Chimie — Réactions acido-basiques","m":"Chimie","f":"","g":"Novembre","q":[{"q":"Lors du dosage d'un acide fort par une base forte, le pH à l'équivalence est :","o":["inférieur à 7","égal à 7","supérieur à 7","indéterminé"],"c":1,"e":"Le mélange à l'équivalence est une solution de sel neutre (ex. NaCl) : le pH vaut 7 à 25°C."},{"q":"Lors du dosage d'un acide faible par une base forte, à la demi-équivalence :","o":["pH = 7","pH = 14","pH = pKa du couple acide/base","pH = 0"],"c":2,"e":"À la demi-équivalence, [acide] = [base conjuguée], donc pH = pKa (relation de Henderson-Hasselbalch)."},{"q":"Le point d'équivalence d'un dosage acido-basique correspond à :","o":["un mélange stœchiométrique des réactifs","un pH toujours égal à 7","un volume nul de réactif titrant","l'absence totale de réaction"],"c":0,"e":"À l'équivalence, les réactifs ont été introduits en proportions stœchiométriques."},{"q":"La réaction entre un acide fort (HCl) et une base forte (NaOH) est caractérisée par le fait qu'elle est :","o":["totale et rapide","partielle et lente","réversible","sans échange de proton"],"c":0,"e":"La réaction de neutralisation acide fort/base forte est quasi instantanée et totale."},{"q":"La dilution d'un dosage acide fort/base forte a pour effet, sur l'allure de la courbe pH = f(V), de :","o":["réduire l'amplitude du saut de pH à l'équivalence","augmenter fortement le saut de pH","n'avoir aucun effet","déplacer l'équivalence vers un pH basique"],"c":0,"e":"Plus les solutions sont diluées, plus le saut de pH observé à l'équivalence est réduit."},{"q":"L'équation bilan de la réaction entre l'acide acétique CH₃COOH et l'hydroxyde de sodium NaOH, en ne considérant que les espèces majoritaires, s'écrit :","o":["CH₃COOH + OH⁻ → CH₃COO⁻ + H₂O","CH₃COOH + Na⁺ → CH₃COONa","CH₃COO⁻ + H₃O⁺ → CH₃COOH + H₂O","CH₃COOH + NaOH → CH₃COONa uniquement à l'état solide"],"c":0,"e":"L'acide acétique, espèce majoritaire, réagit avec l'ion hydroxyde OH⁻, espèce majoritaire apportée par NaOH."},{"q":"Lors du dosage d'un acide faible par une base forte, la courbe pH = f(Vb) présente, avant l'équivalence, une zone où le pH varie :","o":["peu, du fait de la présence du couple acide faible/base conjuguée (effet tampon)","très rapidement à chaque ajout","de façon linéaire stricte","de façon aléatoire"],"c":0,"e":"Le mélange acide faible/base conjuguée formé au fur et à mesure du dosage crée un effet tampon limitant la variation de pH."},{"q":"Sur la courbe de dosage d'un acide faible par une base forte, la demi-équivalence correspond au point où :","o":["pH = pKa du couple acide/base","pH = 7","pH = 14","le volume versé est nul"],"c":0,"e":"À la demi-équivalence, la moitié de l'acide faible a été transformée en sa base conjuguée : [AH] = [A⁻], donc pH = pKa."},{"q":"L'équation bilan de la réaction entre l'acide chlorhydrique HCl et l'ammoniac NH₃ s'écrit, avec les espèces majoritaires :","o":["H₃O⁺ + NH₃ → NH₄⁺ + H₂O","HCl + NH₃ → NH₄Cl uniquement à l'état gazeux","NH₄⁺ + H₂O → NH₃ + H₃O⁺","Cl⁻ + NH₃ → NH₂Cl + H₂"],"c":0,"e":"L'ion oxonium H₃O⁺, espèce majoritaire de HCl, réagit avec l'ammoniac NH₃."},{"q":"Lors du dosage d'un acide fort (HCl) par une base faible (NH₃), le pH à l'équivalence est :","o":["inférieur à 7 (milieu acide)","égal à 7","supérieur à 7","indéterminé"],"c":0,"e":"À l'équivalence, la solution contient l'acide conjugué NH₄⁺, qui rend le milieu légèrement acide."},{"q":"Sur la courbe pH = f(Va) du dosage d'une base faible par un acide fort, la demi-équivalence permet de lire :","o":["le pKa du couple acide/base de la base faible dosée","le pH final uniquement","la concentration de l'acide titrant uniquement","rien de particulier"],"c":0,"e":"À la demi-équivalence, pH = pKa du couple mis en jeu, ce qui permet de le déterminer graphiquement."},{"q":"Repérer l'équivalence sur une courbe de dosage pH = f(V) se fait généralement par :","o":["la méthode des tangentes parallèles ou le point d'inflexion de la courbe","une lecture directe sans calcul","la couleur initiale de la solution","la température du mélange"],"c":0,"e":"Ces méthodes graphiques permettent de localiser précisément le volume équivalent Ve."},{"q":"Dans le dosage d'un acide faible par une base forte, avant tout ajout de base, la solution contient principalement :","o":["l'acide faible non dissocié et sa base conjuguée en faible quantité","uniquement la base conjuguée","uniquement de l'eau pure","uniquement des ions Na⁺"],"c":0,"e":"Avant tout ajout de titrant, seul l'équilibre de dissociation partielle de l'acide faible est présent."},{"q":"Le saut de pH observé à l'équivalence d'un dosage acide fort/base forte est généralement :","o":["important et net","très progressif et peu marqué","inexistant","négatif"],"c":0,"e":"Le dosage acide fort/base forte présente un saut de pH particulièrement marqué au voisinage de l'équivalence."},{"q":"Lors du dosage d'une base faible (NH₃) par un acide fort (HCl), avant l'équivalence, la solution constitue un système tampon formé par le couple :","o":["NH₄⁺/NH₃","H₃O⁺/H₂O","Cl⁻/HCl","Na⁺/NaOH"],"c":0,"e":"Le mélange progressif de NH₃ restant et de NH₄⁺ formé constitue un système tampon."},{"q":"La méthode des tangentes parallèles, utilisée pour déterminer le point équivalent sur une courbe de dosage, consiste à :","o":["tracer deux tangentes parallèles à la courbe de part et d'autre du saut de pH, puis leur parallèle équidistante","mesurer uniquement le volume final","chauffer la solution jusqu'à ébullition","observer la couleur de l'indicateur uniquement"],"c":0,"e":"Cette méthode graphique permet de localiser précisément le point d'inflexion correspondant à l'équivalence."},{"q":"Dans une réaction acide-base, la caractéristique essentielle qui la distingue d'une réaction lente est qu'elle est généralement :","o":["quasi instantanée","très lente","réversible dans le temps","imperceptible"],"c":0,"e":"Les réactions acido-basiques sont, en général, des réactions rapides voire quasi instantanées."},{"q":"Le pH à l'équivalence d'un dosage dépend principalement de la nature des couples acide-base mis en jeu, car :","o":["le sel formé à l'équivalence peut réagir avec l'eau (hydrolyse) et modifier le pH","le pH est toujours égal à 7 quel que soit le couple","le volume versé n'a aucune influence","la concentration ne joue aucun rôle"],"c":0,"e":"Le sel formé à l'équivalence peut être acide, basique ou neutre selon les couples en jeu, modifiant le pH."}]},{"t":"Chimie — Dosage acido-basique","m":"Chimie","f":"","g":"Décembre","q":[{"q":"Le choix d'un indicateur coloré pour un dosage doit se faire de façon à ce que sa zone de virage :","o":["contienne le pH à l'équivalence","soit toujours comprise entre 0 et 7","corresponde au pH initial","soit indépendante du dosage réalisé"],"c":0,"e":"L'indicateur doit virer au voisinage du saut de pH, donc sa zone de virage doit encadrer le pH d'équivalence."},{"q":"À l'équivalence d'un dosage acide fort / base forte, la concentration Ca de la solution dosée se calcule par la relation :","o":["Ca = Cb","Ca·Va = Cb·Vb","Ca = Vb/Va","Ca est indépendante du volume versé"],"c":1,"e":"À l'équivalence, les quantités de matière sont dans les proportions stœchiométriques : Ca·Va = Cb·Vb."},{"q":"Le principe d'un dosage acido-basique consiste à :","o":["déterminer la concentration d'une solution par réaction avec une solution de concentration connue","mesurer uniquement la température du mélange","chauffer la solution jusqu'à évaporation totale","observer la couleur sans qu'il y ait de réaction chimique"],"c":0,"e":"Un dosage permet de déterminer une concentration inconnue en la faisant réagir avec un réactif titrant de concentration connue."},{"q":"Le point d'équivalence d'un dosage peut être déterminé graphiquement à partir de la courbe pH = f(V) en repérant :","o":["le point d'inflexion de la courbe (saut de pH)","le point de départ de la courbe","le minimum de la courbe","un point quelconque de la courbe"],"c":0,"e":"Le point d'équivalence correspond au point d'inflexion de la courbe, là où la pente est maximale."},{"q":"Après avoir déterminé le volume Ve versé à l'équivalence, on calcule la concentration inconnue Ca d'une solution dosée par un titrant de concentration Cb connue à l'aide de :","o":["la relation Ca·Va = Cb·Ve","la seule mesure du pH final","la couleur de l'indicateur uniquement","la masse de la solution"],"c":0,"e":"À l'équivalence, les quantités de matière sont dans les proportions stœchiométriques : Ca·Va = Cb·Ve."},{"q":"Un indicateur coloré est dit adapté à un dosage lorsque sa zone de virage :","o":["encadre le pH du point d'équivalence du dosage","est toujours comprise entre pH 0 et 3","est indépendante du dosage effectué","correspond au pH initial de la solution"],"c":0,"e":"L'indicateur doit changer de couleur précisément au voisinage du pH d'équivalence pour signaler correctement la fin du dosage."},{"q":"Pour un dosage acide fort/base forte, dont le pH à l'équivalence vaut 7, un indicateur adapté doit avoir une zone de virage proche de :","o":["pH 7","pH 0","pH 14","n'importe quelle valeur de pH"],"c":0,"e":"L'indicateur doit virer au voisinage du pH d'équivalence, soit ici pH 7."},{"q":"La phénolphtaléine, dont la zone de virage se situe autour de pH 8-10, est un indicateur généralement adapté au dosage :","o":["d'un acide faible par une base forte","d'une base faible par un acide fort","d'un sel neutre","d'un gaz"],"c":0,"e":"L'équivalence d'un dosage acide faible/base forte est basique, ce qui correspond à la zone de virage de la phénolphtaléine."},{"q":"Le principe général d'un dosage par titrage consiste à ajouter progressivement un réactif titrant, de concentration connue, jusqu'à :","o":["atteindre l'équivalence avec l'espèce à doser","faire disparaître complètement la solution","atteindre un pH de 7 dans tous les cas","obtenir un volume nul"],"c":0,"e":"Le dosage repose sur l'ajout progressif du titrant jusqu'au point d'équivalence, repéré par un changement observable."},{"q":"Lors d'un dosage colorimétrique, le virage brusque de la couleur de l'indicateur permet de repérer approximativement :","o":["le volume équivalent versé","le volume initial","la concentration du titrant uniquement","la température du milieu"],"c":0,"e":"Le changement net de couleur signale, de façon approchée, le volume correspondant à l'équivalence."},{"q":"Un dosage acido-basique peut également être suivi, sans indicateur coloré, à l'aide :","o":["d'un pH-mètre mesurant en continu le pH du mélange","d'un thermomètre uniquement","d'une balance uniquement","d'un chronomètre uniquement"],"c":0,"e":"Le suivi pH-métrique permet de tracer la courbe pH = f(V) et de repérer précisément l'équivalence."},{"q":"Pour un dosage donné, le volume à l'équivalence Ve ne dépend pas :","o":["de la vitesse à laquelle le réactif titrant est versé","de la concentration de la solution dosée","du volume initial de la solution dosée","de la concentration du réactif titrant"],"c":0,"e":"Le volume équivalent est fixé par les quantités de matière en jeu, indépendamment de la vitesse de versement."},{"q":"Un dosage acido-basique permet, en pratique, de déterminer une grandeur inconnue, à savoir :","o":["la concentration d'une espèce acide ou basique en solution","la masse molaire d'un solide","la couleur d'un indicateur","la température de fusion d'un solide"],"c":0,"e":"Le dosage acido-basique a pour objectif principal de déterminer une concentration inconnue."},{"q":"Le choix d'un indicateur coloré pour un dosage acide faible/base forte, dont l'équivalence est basique (pH>7), s'oriente vers un indicateur dont la zone de virage est :","o":["basique, comme la phénolphtaléine","acide, comme le bleu de bromothymol en milieu acide","neutre uniquement","indépendante du pH"],"c":0,"e":"L'indicateur doit virer au voisinage du pH d'équivalence, ici basique."},{"q":"Lors d'un dosage, si l'on verse le réactif titrant trop rapidement au voisinage de l'équivalence, le risque est :","o":["de dépasser le volume équivalent et de fausser la mesure","de ne jamais atteindre l'équivalence","de faire baisser la température","de changer la nature du réactif dosé"],"c":0,"e":"Un versement trop rapide près de l'équivalence peut faire manquer le point exact où le virage a lieu."},{"q":"Graphiquement, avant le point d'équivalence d'un dosage acide fort/base forte, le pH de la solution :","o":["augmente progressivement et lentement","diminue fortement","reste rigoureusement constant","oscille de façon aléatoire"],"c":0,"e":"Avant l'équivalence, l'acide restant en excès limite la hausse du pH, qui augmente donc progressivement."},{"q":"Après le point d'équivalence d'un dosage acide fort par une base forte, l'excès de base forte versée impose au pH de la solution de :","o":["continuer à augmenter, tendant vers le pH de la base versée","redescendre vers 0","rester égal à 7","devenir négatif"],"c":0,"e":"Après l'équivalence, c'est l'excès de base forte versée qui impose le pH, qui continue donc d'augmenter."},{"q":"Un dosage acido-basique bien réalisé permet, en connaissant précisément le volume équivalent, d'obtenir une valeur de concentration :","o":["précise et fiable","totalement aléatoire","toujours fausse","indépendante du volume versé"],"c":0,"e":"Un dosage bien mené fournit une détermination précise de la concentration recherchée."}]},{"t":"Chimie — Solution tampon","m":"Chimie","f":"","g":"Décembre","q":[{"q":"Une solution tampon a pour propriété de :","o":["changer de pH violemment à la moindre addition d'acide","maintenir un pH quasi constant lors d'ajouts modérés d'acide ou de base","ne jamais réagir avec un acide ou une base","avoir un pH toujours égal à 7"],"c":1,"e":"L'effet tampon assure une faible variation de pH lors d'un ajout modéré d'acide, de base, ou d'une dilution."},{"q":"Une solution tampon efficace est généralement composée de :","o":["un acide fort seul","un acide faible et sa base conjuguée en quantités comparables","de l'eau pure","un sel neutre uniquement"],"c":1,"e":"Le mélange acide faible / base conjuguée (proportions voisines) constitue une solution tampon."},{"q":"Les solutions tampons sont notamment utilisées pour :","o":["étalonner un pH-mètre","colorer une solution","augmenter la température d'une réaction","accélérer une combustion"],"c":0,"e":"Les solutions tampons servent d'étalons de pH et sont utilisées en analyse chimique et en milieu biologique."},{"q":"Une solution tampon est généralement préparée en mélangeant :","o":["un acide faible et sa base conjuguée en quantités comparables","un acide fort et une base forte en quantités égales","de l'eau pure et un sel neutre","deux acides forts différents"],"c":0,"e":"Le mélange d'un acide faible et de sa base conjuguée, en proportions voisines, constitue une solution tampon typique."},{"q":"Le pH d'une solution tampon, formée d'un acide faible et de sa base conjuguée en concentrations voisines, est proche :","o":["du pKa du couple acide/base utilisé","de 0","de 14","de 7 dans tous les cas"],"c":0,"e":"Lorsque [AH] ≈ [A⁻], la relation de Henderson-Hasselbalch donne pH ≈ pKa."},{"q":"L'effet tampon se traduit par une variation de pH, lors de l'ajout modéré d'un acide ou d'une base, qui est :","o":["faible, comparée à celle d'une solution non tamponnée","très importante","totalement nulle en toute circonstance","imprévisible"],"c":0,"e":"Le couple acide faible/base conjuguée consomme une partie des ions H₃O⁺ ou OH⁻ ajoutés, limitant la variation de pH."},{"q":"Une solution tampon présente également une faible sensibilité de son pH :","o":["à la dilution modérée","à la température uniquement","à la lumière","à la pression atmosphérique"],"c":0,"e":"Le rapport [A⁻]/[AH] variant peu lors d'une dilution modérée, le pH reste quasi constant."},{"q":"Les solutions tampons sont notamment utilisées comme étalons pour :","o":["l'étalonnage des pH-mètres","la mesure de la masse volumique","la mesure de la conductivité électrique uniquement","la mesure de la température"],"c":0,"e":"Des solutions tampons de pH connu et stable servent de référence pour étalonner les pH-mètres."},{"q":"Dans les milieux biologiques, comme le sang, les solutions tampons jouent un rôle important pour :","o":["maintenir un pH physiologique quasi constant, nécessaire au bon fonctionnement cellulaire","augmenter volontairement l'acidité du sang","éliminer totalement les ions présents","empêcher toute réaction chimique"],"c":0,"e":"Le système tampon du sang (notamment CO₂/HCO₃⁻) maintient le pH sanguin proche de 7,4."},{"q":"Lorsqu'on ajoute une petite quantité de base forte à une solution tampon, le couple acide faible/base conjuguée réagit de façon à :","o":["consommer les ions hydroxyde ajoutés, limitant la variation de pH","amplifier fortement la variation de pH","rendre la solution instable","précipiter immédiatement"],"c":0,"e":"L'acide faible du couple neutralise les ions OH⁻ ajoutés, ce qui limite la hausse du pH."},{"q":"Une solution tampon perd son pouvoir tampon lorsque l'on ajoute :","o":["une quantité d'acide ou de base dépassant largement sa capacité tampon","une quantité infime d'eau","une trace de sel neutre","rien du tout"],"c":0,"e":"Au-delà de sa capacité tampon, l'un des deux membres du couple est épuisé et le pH varie alors fortement."},{"q":"Le pouvoir tampon d'une solution est d'autant plus important que les concentrations de l'acide faible et de sa base conjuguée sont :","o":["élevées et voisines l'une de l'autre","très faibles","très différentes l'une de l'autre","nulles"],"c":0,"e":"Des concentrations élevées et comparables des deux formes du couple maximisent la capacité tampon."},{"q":"En analyse chimique, l'intérêt d'utiliser un milieu tamponné à un pH donné est de :","o":["contrôler précisément les conditions acido-basiques de la réaction étudiée","augmenter aléatoirement le pH","rendre la réaction plus lente systématiquement","empêcher toute mesure"],"c":0,"e":"Un milieu tamponné garantit un pH stable, condition souvent nécessaire à la reproductibilité d'une analyse."},{"q":"Un mélange équimolaire d'acide acétique CH₃COOH et d'acétate de sodium CH₃COONa constitue un exemple typique :","o":["de solution tampon","d'acide fort pur","de base forte pure","de solution neutre sans propriété tampon"],"c":0,"e":"Ce mélange associe un acide faible et sa base conjuguée en quantités égales : c'est une solution tampon classique."},{"q":"Comparée à une solution d'eau pure, une solution tampon soumise à l'ajout d'une même petite quantité d'acide fort voit son pH :","o":["varier beaucoup moins","varier beaucoup plus","rester rigoureusement identique dans tous les cas","devenir immédiatement négatif"],"c":0,"e":"La capacité tampon amortit fortement la variation de pH, contrairement à l'eau pure très sensible au moindre ajout."},{"q":"La zone de pH où une solution tampon est la plus efficace se situe généralement :","o":["autour du pKa du couple acide/base utilisé, à environ ± 1 unité de pH","loin du pKa du couple","uniquement à pH = 7","uniquement à pH = 0"],"c":0,"e":"L'efficacité tampon est maximale lorsque pH est proche du pKa, où les deux formes du couple coexistent en quantités comparables."},{"q":"La préparation d'une solution tampon peut également se faire en dosant partiellement un acide faible par une base forte, jusqu'à obtenir :","o":["un mélange comparable d'acide faible restant et de base conjuguée formée","la neutralisation totale de l'acide faible","un excès important de base forte","un pH nul"],"c":0,"e":"Un dosage partiel, arrêté avant l'équivalence, laisse coexister l'acide faible restant et sa base conjuguée formée."},{"q":"L'effet tampon repose fondamentalement sur l'existence, dans la solution, d'un équilibre entre :","o":["un acide faible et sa base conjuguée, capables de consommer les ions H₃O⁺ ou OH⁻ ajoutés","deux acides forts en excès","deux sels neutres","l'eau pure uniquement"],"c":0,"e":"C'est la coexistence des deux formes du couple acide/base qui permet d'absorber les ajouts modérés d'acide ou de base."}]},{"t":"Chimie — Évolution des systèmes chimiques","m":"Chimie","f":"","g":"Janvier","q":[{"q":"Un système chimiquement instable mais dont la réaction est extrêmement lente est dit :","o":["cinétiquement inerte","en équilibre","totalement réagi","instantané"],"c":0,"e":"Un système cinétiquement inerte est thermodynamiquement instable, mais évolue à une vitesse quasi nulle."},{"q":"Une réaction dite « instantanée » se caractérise par :","o":["une durée de réaction très courte, difficile à mesurer","une durée de plusieurs jours","l'absence totale de réactifs","un état final jamais atteint"],"c":0,"e":"Une réaction instantanée se termine en un temps extrêmement court, quasi impossible à chronométrer avec les moyens usuels."},{"q":"La classification cinétique des réactions chimiques distingue notamment :","o":["réactions acides et basiques uniquement","réactions instantanées, lentes, très lentes, infiniment lentes","réactions endothermiques et exothermiques uniquement","réactions réversibles et irréversibles uniquement"],"c":1,"e":"On classe les réactions selon leur vitesse : instantanée, lente, très lente ou infiniment lente."},{"q":"Un système chimique est dit stable lorsque, thermodynamiquement, la réaction envisagée :","o":["ne peut pas avoir lieu (les réactifs ne peuvent pas évoluer vers les produits)","a lieu instantanément","a lieu très lentement","a lieu de façon explosive"],"c":0,"e":"Un système stable ne présente aucune évolution possible vers d'autres espèces, quelle que soit la durée considérée."},{"q":"Un système chimique cinétiquement inerte est un système pour lequel la réaction est thermodynamiquement possible mais :","o":["sa vitesse est si faible qu'elle est pratiquement imperceptible","elle est en réalité instantanée","elle est impossible","elle libère une énergie infinie"],"c":0,"e":"Le système est capable d'évoluer en théorie, mais la réaction est si lente qu'elle n'est pas observable en pratique."},{"q":"Le mélange dihydrogène/dioxygène à température ambiante, en l'absence de catalyseur ou d'étincelle, est un exemple typique :","o":["de système cinétiquement inerte","de système parfaitement stable thermodynamiquement","de réaction instantanée","de réaction explosive spontanée"],"c":0,"e":"La réaction H₂ + O₂ est thermodynamiquement très favorable, mais sa vitesse est quasi nulle sans apport d'énergie ou de catalyseur."},{"q":"Une réaction chimique dite « lente » se caractérise par une évolution observable à l'œil nu ou par des mesures :","o":["sur une échelle de temps de quelques secondes à quelques heures","de façon instantanée","sur des millions d'années","jamais observable"],"c":0,"e":"Une réaction lente évolue sur une durée mesurable, de l'ordre de quelques secondes à quelques heures."},{"q":"Une réaction chimique dite « très lente » ou « infiniment lente » peut s'étendre sur une échelle de temps de :","o":["plusieurs jours, mois, voire années","quelques secondes uniquement","quelques millisecondes","une fraction de seconde"],"c":0,"e":"Ces réactions évoluent sur des durées beaucoup plus longues, parfois à l'échelle géologique."},{"q":"Une réaction chimique dite « instantanée » est une réaction dont la durée est :","o":["si courte qu'elle est pratiquement indiscernable pour l'observateur","de plusieurs heures","de plusieurs jours","infinie"],"c":0,"e":"Une réaction instantanée semble se produire dès le mélange des réactifs, sans délai perceptible."},{"q":"La rouille du fer, qui s'oxyde lentement au contact de l'air humide, est un exemple typique de réaction :","o":["lente","instantanée","cinétiquement inerte totalement","impossible thermodynamiquement"],"c":0,"e":"L'oxydation du fer par le dioxygène en présence d'humidité est un processus lent, observable sur plusieurs jours."},{"q":"La précipitation d'un chlorure d'argent par mélange de nitrate d'argent et de chlorure de sodium est un exemple typique de réaction :","o":["quasi instantanée","très lente","infiniment lente","cinétiquement inerte"],"c":0,"e":"La précipitation d'AgCl se produit dès le mélange des deux solutions, sans délai notable."},{"q":"La classification cinétique d'une réaction chimique dépend essentiellement :","o":["de la durée nécessaire à son évolution observable","de la couleur des réactifs","de la masse des réactifs","de la forme du récipient utilisé"],"c":0,"e":"C'est la durée d'évolution du système qui permet de classer une réaction comme instantanée, lente, ou très lente."},{"q":"La formation du pétrole à partir de matière organique enfouie est un exemple typique de réaction :","o":["infiniment lente, à l'échelle géologique","instantanée","rapide, en quelques secondes","cinétiquement inerte au sens strict"],"c":0,"e":"La transformation de la matière organique en pétrole s'étend sur des millions d'années."}]},{"t":"Chimie — Vitesse moyenne et vitesse instantanée","m":"Chimie","f":"","g":"Janvier","q":[{"q":"La vitesse instantanée de disparition d'un réactif est définie à partir de :","o":["la concentration initiale uniquement","la dérivée de sa concentration par rapport au temps","le volume du réacteur","la masse molaire du réactif"],"c":1,"e":"v = −d[réactif]/dt : la vitesse instantanée est la dérivée de la concentration par rapport au temps."},{"q":"La vitesse moyenne de formation d'un produit entre deux instants correspond à :","o":["la variation de concentration divisée par la durée de l'intervalle","la concentration finale uniquement","la concentration initiale uniquement","le produit de la concentration par le temps"],"c":0,"e":"vmoy = Δ[produit]/Δt sur l'intervalle de temps considéré."},{"q":"Graphiquement, la vitesse instantanée à un instant t correspond à :","o":["la valeur de la concentration à cet instant","l'aire sous la courbe [concentration]=f(t)","la pente de la tangente à la courbe [concentration]=f(t) en ce point","la pente de la droite reliant l'origine au point"],"c":2,"e":"La vitesse instantanée est donnée par le coefficient directeur de la tangente à la courbe au point considéré."},{"q":"La vitesse moyenne de disparition d'un réactif, entre deux instants t1 et t2, est définie par :","o":["l'opposé du rapport de la variation de sa concentration sur la durée écoulée","le rapport direct de sa concentration sur le temps","la dérivée seconde de sa concentration","une constante indépendante du temps"],"c":0,"e":"vmoy = −Δ[réactif]/Δt, l'opposé permettant d'obtenir une vitesse positive puisque la concentration du réactif diminue."},{"q":"La vitesse instantanée de disparition d'un réactif, à un instant t, correspond à :","o":["l'opposé de la dérivée de sa concentration par rapport au temps, à cet instant","la valeur moyenne de sa concentration","la concentration initiale du réactif","une constante fixée par l'expérimentateur"],"c":0,"e":"v(t) = −d[réactif]/dt, calculée à l'instant t précis."},{"q":"La vitesse instantanée de formation d'un produit, à un instant t, correspond à :","o":["la dérivée de sa concentration par rapport au temps, à cet instant","l'opposé de sa concentration initiale","une valeur toujours nulle","la concentration finale du produit"],"c":0,"e":"v(t) = d[produit]/dt, la concentration du produit augmentant au cours du temps."},{"q":"Graphiquement, sur la courbe donnant la concentration d'un réactif en fonction du temps, la vitesse instantanée de disparition à un instant t correspond :","o":["à l'opposé du coefficient directeur de la tangente à la courbe en ce point","à la valeur de la concentration en ce point","à l'aire sous la courbe","à la pente moyenne de la courbe entière"],"c":0,"e":"La tangente à la courbe [réactif]=f(t) au point considéré donne, au signe près, la vitesse instantanée."},{"q":"L'unité usuelle de la vitesse de réaction, exprimée à partir d'une concentration molaire et du temps en secondes, est :","o":["mol·L⁻¹·s⁻¹","mol·s⁻¹ uniquement","L·s⁻¹","mol·L⁻¹ uniquement"],"c":0,"e":"La vitesse s'exprime comme une variation de concentration par unité de temps, soit mol·L⁻¹·s⁻¹."},{"q":"Pour exploiter des données expérimentales de concentration au cours du temps et déterminer une vitesse instantanée, on peut :","o":["tracer la courbe [réactif] = f(t) et déterminer le coefficient directeur de la tangente au point souhaité","se contenter de la concentration initiale uniquement","mesurer uniquement la température finale","ignorer les données intermédiaires"],"c":0,"e":"Le tracé de la courbe expérimentale et la détermination graphique de tangentes permettent d'accéder aux vitesses instantanées."},{"q":"La vitesse moyenne de formation d'un produit est généralement exprimée en :","o":["mol·L⁻¹·s⁻¹ (ou une unité de temps adaptée)","kg·s⁻¹","mol uniquement","sans unité"],"c":0,"e":"Comme toute vitesse de réaction, elle s'exprime en concentration divisée par un temps."},{"q":"Au cours du temps, pour une réaction classique sans catalyse particulière, la vitesse instantanée de disparition d'un réactif :","o":["diminue généralement, à mesure que sa concentration diminue","augmente systématiquement","reste rigoureusement constante","devient négative"],"c":0,"e":"La vitesse dépend généralement de la concentration des réactifs, qui diminue au fil de la réaction."},{"q":"La courbe représentant l'évolution de la concentration d'un réactif au cours du temps présente, au début de la réaction, une pente qui est en général :","o":["plus marquée (réaction plus rapide), la concentration en réactifs étant alors maximale","nulle","positive","identique à celle de la fin de la réaction"],"c":0,"e":"En début de réaction, les réactifs sont en concentration maximale, ce qui favorise une vitesse plus élevée."},{"q":"La vitesse instantanée de disparition d'un réactif et la vitesse instantanée de formation d'un produit, pour une réaction à coefficients stœchiométriques égaux, sont, en valeur absolue :","o":["égales à chaque instant","toujours différentes","indépendantes l'une de l'autre","nulles en permanence"],"c":0,"e":"Pour des coefficients stœchiométriques égaux, la disparition d'un réactif et la formation d'un produit se font au même rythme."}]},{"t":"Chimie — Facteurs cinétiques","m":"Chimie","f":"","g":"Janvier","q":[{"q":"Une augmentation de la concentration des réactifs a généralement pour effet :","o":["de diminuer la vitesse de la réaction","d'augmenter la vitesse de la réaction","de ne pas modifier la vitesse","d'arrêter totalement la réaction"],"c":1,"e":"Plus les réactifs sont concentrés, plus les chocs efficaces entre molécules sont fréquents : la vitesse augmente."},{"q":"Une augmentation de la température a généralement pour effet sur la vitesse d'une réaction :","o":["de la diminuer","de l'annuler","de l'augmenter","aucun effet"],"c":2,"e":"L'agitation thermique accrue favorise les chocs efficaces : la vitesse de réaction augmente avec la température."},{"q":"L'influence de la pression sur la vitesse d'une réaction concerne principalement :","o":["les réactions en solution aqueuse uniquement","les réactions faisant intervenir des espèces gazeuses","les réactions solides uniquement","aucune réaction chimique"],"c":1,"e":"La pression modifie la concentration des espèces gazeuses, ce qui influence la vitesse des réactions impliquant des gaz."},{"q":"L'expérience de la réaction entre les ions iodure I⁻ et les ions peroxodisulfate S₂O₈²⁻ permet de mettre en évidence expérimentalement l'influence de :","o":["la concentration des réactifs sur la vitesse de réaction","la pression uniquement","la couleur de la lumière","la masse du récipient"],"c":0,"e":"En faisant varier les concentrations initiales de I⁻ ou de S₂O₈²⁻, on observe une modification de la vitesse de la réaction."},{"q":"L'expérience de la réaction entre KMnO₄ et les ions oxalate permet de mettre en évidence expérimentalement l'influence de :","o":["la température sur la vitesse de réaction","la pression uniquement","la couleur du récipient","le volume du bécher uniquement"],"c":0,"e":"En réalisant la réaction à différentes températures, on observe une accélération notable avec la température."},{"q":"L'augmentation de la température accélère généralement une réaction chimique car elle augmente :","o":["la fréquence et l'efficacité des chocs entre molécules réactives","la masse des réactifs","la pression atmosphérique","le volume du récipient"],"c":0,"e":"Une température plus élevée augmente l'agitation moléculaire, donc le nombre de chocs efficaces par unité de temps."},{"q":"La conservation des aliments au réfrigérateur repose sur le principe que le froid :","o":["ralentit les réactions chimiques et biologiques responsables de la dégradation des aliments","accélère leur dégradation","n'a aucun effet sur les réactions chimiques","stérilise totalement les aliments"],"c":0,"e":"La baisse de température diminue la vitesse des réactions de dégradation, prolongeant la conservation des aliments."},{"q":"L'influence de la pression sur la vitesse d'une réaction chimique concerne principalement les réactions :","o":["impliquant des espèces gazeuses","uniquement en solution aqueuse","uniquement entre solides","n'impliquant aucun gaz"],"c":0,"e":"La pression modifie surtout la concentration des espèces gazeuses, donc l'influence est notable pour les réactions en phase gazeuse."},{"q":"Une augmentation de la pression pour une réaction entre gaz a généralement pour effet d'augmenter :","o":["la concentration des espèces gazeuses, donc la fréquence des chocs efficaces","la température du mélange uniquement","la couleur des gaz","le volume du récipient"],"c":0,"e":"Une pression plus élevée rapproche les molécules gazeuses, augmentant la fréquence des collisions efficaces."},{"q":"La vitesse d'une réaction dépend de la concentration des réactifs car une concentration plus élevée entraîne :","o":["un nombre de chocs efficaces entre molécules réactives par unité de temps plus important","une diminution du nombre de molécules présentes","une baisse systématique de la température","aucune influence"],"c":0,"e":"Plus les réactifs sont concentrés, plus les rencontres entre molécules réactives sont fréquentes."},{"q":"Le déclenchement de certaines réactions chimiques par élévation de température trouve une application pratique dans :","o":["l'allumage et la combustion","la conservation des aliments","le refroidissement des moteurs","la filtration de l'eau"],"c":0,"e":"L'apport de chaleur (étincelle, flamme) est souvent nécessaire pour amorcer une combustion."},{"q":"Parmi les trois facteurs cinétiques principaux étudiés (concentration, température, pression), celui qui a le moins d'influence en phase liquide ou solide est généralement :","o":["la pression","la concentration","la température","aucun des trois"],"c":0,"e":"La pression influence surtout les réactions impliquant des gaz ; son effet est limité en phase condensée (liquide ou solide)."},{"q":"Pour ralentir volontairement une réaction chimique en laboratoire, on peut notamment :","o":["diminuer la température du milieu réactionnel","augmenter la concentration des réactifs","augmenter la température","ajouter un catalyseur adapté"],"c":0,"e":"Abaisser la température réduit l'agitation moléculaire et donc la fréquence des chocs efficaces, ralentissant la réaction."}]},{"t":"Chimie — Mécanisme réactionnel","m":"Chimie","f":"","g":"Février","q":[{"q":"Un acte élémentaire correspond à :","o":["la réaction bilan globale d'une transformation","une étape microscopique simple d'un mécanisme réactionnel","une réaction acido-basique uniquement","un dosage volumétrique"],"c":1,"e":"Un mécanisme réactionnel est décrit comme une succession d'actes élémentaires, étapes simples à l'échelle moléculaire."},{"q":"Dans la réaction photochimique entre Cl₂ et H₂, la lumière intervient lors de l'étape :","o":["de neutralisation","d'équivalence","d'initiation","de dosage"],"c":2,"e":"L'étape d'initiation, déclenchée par la lumière, produit les premiers centres actifs (radicaux Cl•)."},{"q":"Dans un mécanisme en chaîne, l'étape de propagation se caractérise par :","o":["la disparition définitive des centres actifs","la régénération des centres actifs consommés","l'absence totale de réaction","la formation directe du produit final sans intermédiaire"],"c":1,"e":"Lors de la propagation, un centre actif consommé est régénéré, ce qui permet à la chaîne réactionnelle de se poursuivre."},{"q":"La description macroscopique d'une réaction chimique s'intéresse :","o":["à l'évolution globale des quantités de réactifs et de produits, sans détailler les étapes","uniquement aux chocs entre molécules individuelles","uniquement à la structure électronique des atomes","à la vitesse de chaque acte élémentaire séparément"],"c":0,"e":"L'échelle macroscopique décrit la réaction dans son ensemble, à partir de grandeurs mesurables comme les concentrations."},{"q":"La description moléculaire (ou microscopique) d'une réaction chimique s'intéresse :","o":["aux différentes étapes, ou actes élémentaires, se déroulant à l'échelle des molécules","uniquement à la couleur macroscopique du mélange","uniquement à la masse totale du système","au volume final du récipient"],"c":0,"e":"Cette échelle décrit précisément comment les molécules interagissent au cours des différentes étapes de la réaction."},{"q":"Un mécanisme réactionnel est défini comme :","o":["l'ensemble des actes élémentaires qui, mis bout à bout, constituent la réaction globale observée","la seule équation bilan de la réaction","la couleur de la réaction","la vitesse moyenne de la réaction"],"c":0,"e":"Le mécanisme réactionnel détaille la succession d'étapes microscopiques conduisant des réactifs aux produits."},{"q":"L'équation bilan de la réaction entre le dichlore Cl₂ et le dihydrogène H₂ s'écrit :","o":["Cl₂ + H₂ → 2 HCl","Cl₂ + H₂ → HCl₂","2 Cl₂ + H₂ → 2 HCl₂","Cl₂ + 2 H₂ → 2 HCl"],"c":0,"e":"La réaction, équilibrée, produit deux molécules de chlorure d'hydrogène HCl pour une molécule de Cl₂ et une de H₂."},{"q":"Dans la réaction photochimique entre Cl₂ et H₂, la lumière joue un rôle essentiel lors de l'étape :","o":["d'initiation, en dissociant une molécule de Cl₂ en deux atomes de chlore","de propagation uniquement","de rupture uniquement","d'aucune étape en particulier"],"c":0,"e":"L'absorption d'un photon par Cl₂ rompt la liaison Cl⁻Cl, formant deux radicaux chlore qui amorcent la chaîne réactionnelle."},{"q":"Lors de l'étape d'initiation d'un mécanisme en chaîne, on observe typiquement :","o":["la formation de centres actifs (radicaux) à partir d'une espèce stable","la disparition totale des réactifs","la formation directe du produit final","l'arrêt de la réaction"],"c":0,"e":"L'initiation crée les premiers centres actifs (radicaux) nécessaires au déclenchement de la chaîne."},{"q":"Lors de l'étape de propagation d'un mécanisme en chaîne, les centres actifs formés :","o":["réagissent avec les molécules stables, régénérant de nouveaux centres actifs","disparaissent définitivement sans réagir","se recombinent entre eux uniquement","n'ont aucun rôle"],"c":0,"e":"La propagation entretient la chaîne : chaque centre actif consommé en régénère un nouveau, permettant à la réaction de se poursuivre."},{"q":"Lors de l'étape de rupture (ou terminaison) d'un mécanisme en chaîne, les centres actifs :","o":["se recombinent entre eux et disparaissent, arrêtant la chaîne réactionnelle","se multiplient indéfiniment","redeviennent des réactifs initiaux","n'existent pas"],"c":0,"e":"La rupture met fin à la chaîne réactionnelle par recombinaison des radicaux entre eux."},{"q":"Un acte élémentaire est une transformation chimique qui se déroule :","o":["en une seule étape, à l'échelle moléculaire, sans intermédiaire réactionnel isolable","en plusieurs étapes complexes observables macroscopiquement","uniquement en présence d'un catalyseur","uniquement à haute température"],"c":0,"e":"Un acte élémentaire constitue la plus petite étape d'un mécanisme, se produisant en une seule fois au niveau moléculaire."},{"q":"Dans un mécanisme en chaîne comme celui de Cl₂ + H₂, une seule étape d'initiation peut conduire, via la propagation, à :","o":["la formation d'un très grand nombre de molécules de produit","la formation d'une seule molécule de produit uniquement","l'arrêt immédiat de la réaction","l'absence totale de réaction"],"c":0,"e":"Le caractère en chaîne du mécanisme permet à un centre actif initial de générer un très grand nombre de cycles de propagation."},{"q":"Le mécanisme radicalaire en chaîne de la réaction Cl₂ + H₂ fait intervenir, comme centres actifs, des :","o":["atomes de chlore et d'hydrogène (radicaux)","ions Cl⁻ et H⁺ uniquement","molécules d'eau","électrons libres uniquement"],"c":0,"e":"Les centres actifs de ce mécanisme sont les radicaux Cl• et H•, formés au cours des étapes d'initiation et de propagation."},{"q":"La vitesse globale d'une réaction se déroulant en plusieurs actes élémentaires successifs est généralement limitée par :","o":["l'acte élémentaire le plus lent du mécanisme","l'acte élémentaire le plus rapide","la somme de toutes les étapes","aucune étape en particulier"],"c":0,"e":"L'étape la plus lente, dite étape cinétiquement déterminante, impose sa vitesse à l'ensemble du processus."},{"q":"Distinguer le mécanisme réactionnel de l'équation bilan permet de comprendre que :","o":["une même équation bilan peut correspondre à plusieurs étapes microscopiques différentes","l'équation bilan décrit toujours fidèlement chaque étape moléculaire","le mécanisme n'a aucune utilité pratique","la vitesse de réaction ne dépend jamais du mécanisme"],"c":0,"e":"L'équation bilan ne renseigne que sur le résultat global, alors que le mécanisme détaille les étapes réellement suivies."},{"q":"Dans la réaction photochimique Cl₂ + H₂, l'absence de lumière a pour conséquence :","o":["une réaction extrêmement lente, voire quasiment nulle, faute d'initiation","une réaction instantanée","aucune différence avec la présence de lumière","la formation d'un produit différent"],"c":0,"e":"Sans lumière pour amorcer l'étape d'initiation, la réaction radicalaire en chaîne ne peut pratiquement pas démarrer."},{"q":"L'étude du mécanisme réactionnel permet notamment d'expliquer :","o":["pourquoi certaines réactions, bien que thermodynamiquement favorables, sont cinétiquement très lentes","uniquement la couleur des réactifs","uniquement la masse molaire des produits","la texture des solides formés"],"c":0,"e":"Le mécanisme révèle les étapes limitantes qui expliquent la lenteur cinétique d'une réaction pourtant favorable thermodynamiquement."}]},{"t":"Chimie — Catalyse","m":"Chimie","f":"","g":"Février","q":[{"q":"Un catalyseur est une espèce qui :","o":["est consommée intégralement par la réaction","augmente la vitesse d'une réaction sans être consommée","ralentit toujours la réaction","modifie l'état d'équilibre final"],"c":1,"e":"Un catalyseur accélère une réaction sans apparaître dans le bilan final : il n'est pas consommé."},{"q":"Une catalyse est dite homogène lorsque le catalyseur :","o":["est dans une phase différente des réactifs","est dans la même phase que les réactifs","est toujours un métal solide","n'existe pas réellement"],"c":1,"e":"Dans une catalyse homogène, catalyseur et réactifs se trouvent dans la même phase (souvent en solution)."},{"q":"Un catalyseur :","o":["déplace toujours l'équilibre vers les produits","ne modifie pas l'état d'équilibre d'une réaction","est un réactif consommé au cours de la réaction","augmente le rendement final de la réaction"],"c":1,"e":"Le catalyseur accélère l'atteinte de l'équilibre mais ne modifie ni sa position, ni le rendement final."},{"q":"Un exemple typique de catalyse homogène est la catalyse de l'estérification par les ions :","o":["H₃O⁺ (catalyse acide)","OH⁻ uniquement","Na⁺","Cl⁻"],"c":0,"e":"Les ions H₃O⁺, en solution comme les réactifs, catalysent l'estérification de façon homogène."},{"q":"L'autocatalyse est un phénomène où :","o":["un produit de la réaction catalyse lui-même la réaction qui le forme","le catalyseur est ajouté en excès dès le début","la réaction s'arrête spontanément","aucun produit n'est formé"],"c":0,"e":"Dans une autocatalyse, l'un des produits formés accélère la réaction qui continue à le produire."},{"q":"Dans certaines réactions d'oxydoréduction, les ions Mn²⁺ formés en cours de réaction peuvent jouer le rôle :","o":["de catalyseur, accélérant la suite de la réaction (autocatalyse)","d'inhibiteur, ralentissant la réaction","de réactif limitant uniquement","de produit final sans effet sur la vitesse"],"c":0,"e":"Les ions Mn²⁺ formés catalysent la suite de la réaction, illustrant un cas typique d'autocatalyse."},{"q":"Une catalyse est dite hétérogène lorsque le catalyseur se trouve :","o":["dans une phase différente de celle des réactifs, par exemple un solide catalysant une réaction entre gaz","dans la même phase que les réactifs","totalement dissous dans les réactifs","absent du milieu réactionnel"],"c":0,"e":"La catalyse hétérogène met en jeu un catalyseur dans une phase distincte, souvent solide, de celle des réactifs."},{"q":"Dans une catalyse hétérogène, l'efficacité du catalyseur dépend fortement de :","o":["la surface de contact entre le catalyseur et les réactifs","la couleur du catalyseur","sa masse totale uniquement","la température ambiante uniquement"],"c":0,"e":"Plus la surface de contact est grande (catalyseur divisé), plus les réactifs peuvent interagir efficacement avec lui."},{"q":"La réaction entre le dihydrogène H₂ et le dioxygène O₂, en présence d'un catalyseur solide, illustre un exemple de :","o":["catalyse hétérogène","catalyse homogène","autocatalyse","catalyse enzymatique uniquement"],"c":0,"e":"Le catalyseur solide et les réactifs gazeux sont dans des phases différentes : c'est une catalyse hétérogène."},{"q":"Un catalyseur, par définition, modifie la vitesse d'une réaction mais :","o":["ne modifie pas l'état d'équilibre final du système","déplace toujours l'équilibre vers les produits","est consommé au cours de la réaction","augmente la quantité de produits formés à l'équilibre"],"c":0,"e":"Un catalyseur accélère l'atteinte de l'équilibre sans en modifier la position finale."},{"q":"Un catalyseur donné catalyse en principe :","o":["à la fois la réaction directe et la réaction inverse d'un même équilibre","uniquement la réaction directe","uniquement la réaction inverse","aucune des deux réactions"],"c":0,"e":"Un catalyseur accélère de la même façon les deux sens d'une réaction équilibrée, sans en déplacer l'équilibre."},{"q":"La sélectivité d'un catalyseur signifie que, pour des réactifs donnés, des catalyseurs différents peuvent orienter la réaction vers :","o":["des produits différents","toujours le même produit unique","l'absence totale de réaction","une vitesse toujours identique"],"c":0,"e":"Selon le catalyseur utilisé, la réaction peut être orientée vers des produits différents, c'est la sélectivité catalytique."},{"q":"L'hydrogénation du monoxyde de carbone CO, selon le catalyseur utilisé, peut conduire à des produits différents, illustrant :","o":["la sélectivité de l'action catalytique","l'absence d'influence du catalyseur","l'autocatalyse uniquement","la catalyse homogène uniquement"],"c":0,"e":"Cet exemple classique montre que le choix du catalyseur détermine la nature du produit majoritairement formé."},{"q":"Dans l'industrie chimique, les catalyseurs sont largement utilisés car ils permettent notamment de :","o":["accélérer les réactions et réduire les coûts énergétiques et de production","ralentir systématiquement toutes les réactions","remplacer totalement les réactifs","éliminer le besoin de contrôle de la réaction"],"c":0,"e":"Les catalyseurs industriels réduisent la température et le temps nécessaires, diminuant les coûts de production."},{"q":"En biochimie, les enzymes jouent un rôle de catalyseurs biologiques permettant notamment :","o":["d'accélérer des réactions métaboliques essentielles à la vie","de ralentir indéfiniment le métabolisme","de détruire systématiquement les substrats","de remplacer l'ADN"],"c":0,"e":"Les enzymes accélèrent considérablement les réactions biochimiques indispensables au fonctionnement des organismes vivants."},{"q":"Dans la vie courante, un exemple d'utilisation de catalyseur se trouve notamment dans :","o":["le pot catalytique des véhicules automobiles","le réfrigérateur","la simple dilution à l'eau","le chauffage électrique seul"],"c":0,"e":"Le pot catalytique utilise des métaux catalyseurs pour transformer les gaz d'échappement nocifs."},{"q":"Le catalyseur d'un pot catalytique automobile a pour rôle d'accélérer la transformation des gaz polluants en :","o":["substances moins nocives pour l'environnement","carburant réutilisable","eau pure uniquement","dioxygène pur"],"c":0,"e":"Le catalyseur transforme les gaz polluants (CO, NOx, hydrocarbures imbrûlés) en composés moins nocifs (CO₂, N₂, H₂O)."},{"q":"Un catalyseur, contrairement à un réactif, se retrouve en principe, à la fin de la réaction, :","o":["intact, en quantité et nature inchangées","totalement consommé","transformé en un nouveau produit","disparu du milieu réactionnel"],"c":0,"e":"Par définition, un catalyseur participe à la réaction sans être consommé : il est régénéré à la fin du cycle catalytique."}]},{"t":"Chimie — Stéréochimie","m":"Chimie","f":"","g":"Mars","q":[{"q":"Un carbone tétragonal présente une géométrie :","o":["plane","tétraédrique","linéaire","pyramidale à base carrée"],"c":1,"e":"Le carbone tétragonal (4 liaisons simples) adopte une géométrie tétraédrique."},{"q":"L'isomérie de conformation, illustrée par l'éthane, correspond à :","o":["une différence de formule brute","des arrangements spatiaux obtenus par rotation autour d'une liaison simple","une différence de squelette carboné","la présence d'un centre asymétrique"],"c":1,"e":"Les conformations sont des arrangements spatiaux interconvertibles par simple rotation autour d'une liaison C-C."},{"q":"Un carbone asymétrique est un carbone :","o":["lié à deux atomes d'hydrogène","lié à quatre groupes différents","toujours terminal dans la chaîne","toujours doublement lié"],"c":1,"e":"Un carbone asymétrique (noté C*) est lié à quatre substituants tous différents, source de chiralité."},{"q":"Un carbone trigonal (hybridé sp²) présente une géométrie caractérisée par :","o":["trois liaisons disposées dans un même plan, à environ 120° les unes des autres","quatre liaisons disposées en tétraèdre","deux liaisons alignées à 180°","une géométrie sans direction privilégiée"],"c":0,"e":"Le carbone trigonal forme trois liaisons σ coplanaires, séparées d'environ 120°, complétées par une liaison π."},{"q":"Dans la molécule d'éthylène (éthène), les atomes de carbone sont :","o":["trigonaux (hybridés sp²)","tétragonaux (hybridés sp³)","linéaires (hybridés sp)","sans hybridation particulière"],"c":0,"e":"La double liaison C=C de l'éthylène impose une hybridation sp² à chacun des deux atomes de carbone."},{"q":"Dans la molécule de benzène, les six atomes de carbone forment un cycle dont la géométrie est :","o":["plane, avec des carbones trigonaux","tétraédrique","linéaire","sphérique"],"c":0,"e":"Le cycle benzénique est plan, chaque carbone étant hybridé sp² (trigonal)."},{"q":"Le cyclohexane peut adopter deux conformations principales appelées :","o":["chaise et bateau","cis et trans","syn et anti","Z et E"],"c":0,"e":"Ces deux conformations résultent de la rotation autour des liaisons C-C du cycle, sans rupture de liaison."},{"q":"Dans la conformation chaise du cyclohexane, on distingue deux types de liaisons C-H, appelées :","o":["liaisons axiales et liaisons équatoriales","liaisons σ et liaisons π","liaisons simples et doubles","liaisons ioniques et covalentes"],"c":0,"e":"Les liaisons axiales sont perpendiculaires au plan moyen du cycle, les liaisons équatoriales lui sont presque parallèles."},{"q":"La conformation chaise du cyclohexane est généralement, par rapport à la conformation bateau, une conformation :","o":["plus stable (énergie plus basse)","moins stable","de même stabilité","instable en toute circonstance"],"c":0,"e":"La conformation chaise minimise les tensions et les interactions défavorables, ce qui la rend plus stable que la conformation bateau."},{"q":"L'isomérie Z/E, illustrée par le cas du butène, concerne des molécules présentant :","o":["une double liaison C=C avec des substituants pouvant occuper des positions différentes de part et d'autre du plan de la double liaison","uniquement des liaisons simples","un seul atome de carbone","aucune double liaison"],"c":0,"e":"L'isomérie Z/E résulte du blocage de la rotation autour d'une double liaison, fixant la position relative des substituants."},{"q":"Dans un isomère Z, les deux substituants prioritaires (selon les règles de priorité) de la double liaison sont situés :","o":["du même côté du plan de la double liaison","de part et d'autre du plan de la double liaison","toujours sur le même atome","à 180° l'un de l'autre"],"c":0,"e":"Le descripteur Z (zusammen) indique que les groupes prioritaires sont du même côté de la double liaison."},{"q":"L'importance de l'isomérie Z/E se manifeste notamment par le fait que les isomères Z et E d'une même molécule peuvent présenter :","o":["des propriétés physiques et biologiques différentes","des propriétés rigoureusement identiques en tout point","la même formule développée","aucune différence observable"],"c":0,"e":"Les isomères Z et E, bien que de même formule brute, diffèrent dans l'espace, ce qui peut modifier leurs propriétés."},{"q":"Un carbone asymétrique porte quatre substituants :","o":["tous différents les uns des autres","tous identiques","dont deux seulement sont identiques","dont trois sont identiques"],"c":0,"e":"Un carbone asymétrique se définit par la présence de quatre substituants tous différents, condition de la chiralité."}]},{"t":"Chimie — Alcools et polyalcools","m":"Chimie","f":"","g":"Mars","q":[{"q":"Un alcool primaire se caractérise par un groupe hydroxyle porté par un carbone lié à :","o":["trois autres atomes de carbone","deux autres atomes de carbone","un seul autre atome de carbone (ou aucun)","un atome d'azote"],"c":2,"e":"Dans un alcool primaire, le carbone fonctionnel n'est lié qu'à un seul autre atome de carbone (ou à aucun, cas du méthanol)."},{"q":"L'oxydation ménagée d'un alcool primaire conduit successivement à :","o":["un aldéhyde puis un acide carboxylique","une cétone","un alcène","un amide"],"c":0,"e":"L'alcool primaire s'oxyde d'abord en aldéhyde, puis en acide carboxylique en cas d'oxydation poussée."},{"q":"L'éthanol peut être obtenu industriellement par :","o":["réaction d'un acide sur une base","fermentation d'un sucre","électrolyse de l'eau","combustion du méthane"],"c":1,"e":"La fermentation alcoolique des sucres, catalysée par des levures, produit de l'éthanol."},{"q":"Le groupe caractéristique d'un alcool est le groupe :","o":["hydroxyle -OH, porté par un atome de carbone tétragonal","carbonyle C=O","carboxyle -COOH","amine -NH₂"],"c":0,"e":"Un alcool se définit par un groupe hydroxyle -OH fixé sur un carbone tétragonal (sp³) non aromatique."},{"q":"Un alcool secondaire est un alcool dont le groupe hydroxyle est porté par un carbone lié à :","o":["deux autres atomes de carbone","un seul autre atome de carbone","trois autres atomes de carbone","aucun autre atome de carbone"],"c":0,"e":"Un carbone secondaire porteur du groupe OH est relié à exactement deux autres atomes de carbone."},{"q":"Un alcool tertiaire est un alcool dont le groupe hydroxyle est porté par un carbone lié à :","o":["trois autres atomes de carbone","un seul autre atome de carbone","deux autres atomes de carbone","aucun autre atome de carbone"],"c":0,"e":"Un carbone tertiaire porteur du groupe OH est relié à trois autres atomes de carbone."},{"q":"La préparation d'un alcool par hydratation d'un alcène consiste en l'addition, sur la double liaison, :","o":["d'une molécule d'eau","d'une molécule de dihydrogène","d'un acide fort uniquement","d'un halogène"],"c":0,"e":"L'hydratation (addition d'eau, en milieu acide) sur un alcène conduit à la formation d'un alcool."},{"q":"L'obtention de l'éthanol par fermentation repose sur la transformation, par des levures, :","o":["de sucres (glucides) en éthanol et dioxyde de carbone","de graisses en éthanol","de protéines en éthanol","de sels minéraux en éthanol"],"c":0,"e":"La fermentation alcoolique transforme les glucides (comme le glucose) en éthanol et en CO₂ sous l'action de levures."},{"q":"La réaction d'un alcool avec le sodium métallique produit :","o":["un alcoolate et du dihydrogène","un alcène et de l'eau","un acide carboxylique","un aldéhyde"],"c":0,"e":"Le sodium réagit avec le groupe hydroxyle de l'alcool en libérant du dihydrogène et en formant l'alcoolate correspondant."},{"q":"La réaction de déshydratation de l'éthanol, en présence d'un catalyseur acide et à chaud, conduit à la formation :","o":["d'éthylène (alcène) et d'eau","d'un acide carboxylique","d'un ester","d'un amide"],"c":0,"e":"La déshydratation intramoléculaire de l'éthanol élimine une molécule d'eau et forme l'alcène correspondant, l'éthylène."},{"q":"L'estérification d'un alcool par un acide carboxylique produit :","o":["un ester et de l'eau","un alcène uniquement","un alcoolate","un amide"],"c":0,"e":"La réaction d'estérification, lente et limitée, conduit à un ester et de l'eau."},{"q":"L'éthane-1,2-diol (glycol) est un exemple de polyalcool utilisé notamment :","o":["comme antigel","comme combustible fossile","comme conservateur alimentaire uniquement","comme solvant apolaire"],"c":0,"e":"Le glycol, de par ses propriétés, abaisse le point de congélation des mélanges, ce qui explique son usage comme antigel."},{"q":"Le propane-1,2,3-triol (glycérol) est un exemple de polyalcool utilisé notamment :","o":["en cosmétique et en pharmacie, pour ses propriétés hydratantes","uniquement comme carburant","uniquement comme antigel","uniquement comme solvant organique apolaire"],"c":0,"e":"Le glycérol, très hydrophile, est largement employé dans les crèmes et préparations pharmaceutiques pour ses propriétés hydratantes."}]},{"t":"Chimie — Aldéhydes et cétones — Oxydation des alcools","m":"Chimie","f":"","g":"Mars","q":[{"q":"Le groupe caractéristique commun aux aldéhydes et aux cétones est :","o":["le groupe hydroxyle -OH","le groupe carbonyle C=O","le groupe carboxyle -COOH","le groupe amine -NH₂"],"c":1,"e":"Aldéhydes et cétones possèdent tous deux un groupe carbonyle C=O, distingué par leur environnement."},{"q":"Le caractère réducteur d'un aldéhyde peut être mis en évidence par :","o":["la réaction avec le sodium","la réduction de la liqueur de Fehling","la mesure du pH","la réaction avec un indicateur coloré"],"c":1,"e":"La liqueur de Fehling (Cu²⁺) est réduite par un aldéhyde, formant un précipité rouge brique (Cu₂O)."},{"q":"L'oxydation ménagée d'un alcool secondaire donne :","o":["un aldéhyde","une cétone","un acide carboxylique","une amine"],"c":1,"e":"Un alcool secondaire s'oxyde en cétone, un composé qui ne peut pas être oxydé davantage facilement."},{"q":"Le groupe caractéristique commun aux aldéhydes et aux cétones est le groupe :","o":["carbonyle C=O","hydroxyle -OH","carboxyle -COOH","amine -NH₂"],"c":0,"e":"Aldéhydes et cétones se distinguent par la présence commune du groupe carbonyle C=O."},{"q":"Dans un aldéhyde, le groupe carbonyle est porté par un carbone lié à :","o":["au moins un atome d'hydrogène","uniquement deux autres atomes de carbone","un atome d'oxygène supplémentaire","un groupe amine"],"c":0,"e":"Le carbone du groupe carbonyle d'un aldéhyde porte toujours au moins un atome d'hydrogène, contrairement à celui d'une cétone."},{"q":"Dans une cétone, le groupe carbonyle est porté par un carbone lié à :","o":["deux autres atomes de carbone (chaîne carbonée de part et d'autre)","un seul atome d'hydrogène et rien d'autre","un groupe hydroxyle","un atome d'azote"],"c":0,"e":"Le carbone du groupe carbonyle d'une cétone est encadré par deux chaînes carbonées, sans hydrogène directement lié."},{"q":"Le test à la 2,4-dinitrophénylhydrazine (DNPH) permet de mettre en évidence :","o":["la présence d'un groupe carbonyle, commun aux aldéhydes et aux cétones","uniquement la présence d'un alcool","uniquement la présence d'un acide carboxylique","uniquement la présence d'une amine"],"c":0,"e":"La DNPH réagit spécifiquement avec le groupe carbonyle, formant un précipité caractéristique."},{"q":"Le caractère réducteur d'un aldéhyde peut être mis en évidence par la réduction du réactif de Tollens (nitrate d'argent ammoniacal), qui se traduit par :","o":["la formation d'un miroir d'argent","un dégagement de dioxygène","un changement de couleur vers le bleu","l'absence totale de réaction"],"c":0,"e":"Les aldéhydes réduisent les ions Ag⁺ en argent métallique, qui se dépose sur les parois du tube, formant un miroir d'argent."},{"q":"La liqueur de Fehling, réduite par un aldéhyde, se caractérise par la formation d'un précipité :","o":["rouge brique d'oxyde de cuivre","bleu de sulfate de cuivre","blanc de chlorure d'argent","noir de dioxyde de manganèse"],"c":0,"e":"L'aldéhyde réduit les ions Cu²⁺ de la liqueur de Fehling en oxyde de cuivre(I), Cu₂O, de couleur rouge brique."},{"q":"L'oxydation ménagée d'un alcool primaire conduit d'abord à un aldéhyde, puis, si l'oxydation se poursuit, à :","o":["un acide carboxylique","une cétone","un alcène","un amide"],"c":0,"e":"Une oxydation plus poussée d'un alcool primaire transforme l'aldéhyde intermédiaire en acide carboxylique."},{"q":"L'oxydation d'un alcool secondaire conduit, contrairement à celle d'un alcool primaire, à :","o":["une cétone, sans oxydation ultérieure possible dans les mêmes conditions","un acide carboxylique","un aldéhyde uniquement","un amide"],"c":0,"e":"L'alcool secondaire s'oxyde en cétone, qui, contrairement à l'aldéhyde, n'est pas oxydable dans les mêmes conditions."},{"q":"Un alcool tertiaire, contrairement aux alcools primaire et secondaire, est en général :","o":["non oxydable par les oxydants usuels, faute d'hydrogène sur le carbone porteur du groupe OH","le plus facilement oxydable","oxydé directement en acide carboxylique","oxydé directement en amide"],"c":0,"e":"L'absence d'atome d'hydrogène sur le carbone fonctionnel empêche l'oxydation ménagée d'un alcool tertiaire."},{"q":"Pour distinguer les trois classes d'alcool à partir de leur formule C₄H₉OH, on peut notamment utiliser :","o":["leur comportement différent vis-à-vis de l'oxydation, formation ou non d'aldéhyde, de cétone, ou absence de réaction","uniquement leur couleur","uniquement leur odeur","uniquement leur masse molaire, identique pour les trois"],"c":0,"e":"Le produit obtenu par oxydation (aldéhyde puis acide, cétone, ou absence de réaction) permet de différencier les trois classes."}]},{"t":"Chimie — Acides carboxyliques et dérivés","m":"Chimie","f":"","g":"Avril","q":[{"q":"Le groupe caractéristique d'un acide carboxylique est :","o":["-OH","-COOH","-CHO","-NH₂"],"c":1,"e":"Le groupe carboxyle -COOH est caractéristique des acides carboxyliques."},{"q":"La réaction d'un alcool avec un acide carboxylique (ou un de ses dérivés) forme :","o":["un aldéhyde","une amine","un ester","un alcane"],"c":2,"e":"L'estérification (alcool + acide ou dérivé d'acide) produit un ester."},{"q":"La saponification d'un ester produit :","o":["un acide et un alcène","un savon (carboxylate) et un alcool","un aldéhyde et de l'eau","un amide et un acide"],"c":1,"e":"La saponification (hydrolyse basique d'un ester) donne un ion carboxylate (savon) et un alcool."},{"q":"Le groupe caractéristique d'un acide carboxylique, -COOH, résulte de la combinaison :","o":["d'un groupe carbonyle et d'un groupe hydroxyle","de deux groupes hydroxyle","d'un groupe amine et d'un groupe carbonyle","de deux groupes carbonyle"],"c":0,"e":"Le groupe carboxyle associe un groupe carbonyle C=O et un groupe hydroxyle -OH sur le même carbone."},{"q":"Les acides carboxyliques sont, en général, des acides :","o":["faibles en solution aqueuse","forts en solution aqueuse","totalement neutres","basiques"],"c":0,"e":"Les acides carboxyliques ne se dissocient que partiellement dans l'eau : ce sont des acides faibles."},{"q":"Un chlorure d'acyle R-COCl s'obtient généralement à partir d'un acide carboxylique par réaction avec :","o":["un chlorure d'un élément comme le chlorure de thionyle ou PCl₅","de l'eau pure","un alcool uniquement","de la soude"],"c":0,"e":"Des réactifs chlorants comme SOCl₂ ou PCl₅ remplacent le groupe hydroxyle de l'acide par un atome de chlore."},{"q":"Un anhydride d'acide s'obtient, formellement, par élimination d'une molécule d'eau entre :","o":["deux molécules d'acide carboxylique (ou un dérivé équivalent)","un alcool et un acide","deux alcools","un acide et une amine"],"c":0,"e":"L'anhydride résulte de la condensation de deux fonctions acide carboxylique, avec perte d'une molécule d'eau."},{"q":"Comparé à l'acide carboxylique correspondant, un anhydride d'acide présente une réactivité :","o":["plus importante vis-à-vis des nucléo
