e empreinte de pas fossilisée est :", "o": ["un fossile stratigraphique", "un minéral", "une trace fossile", "un volcan"], "c": 2, "e": "Trace d'activité."}, {"q": "Un fossile stratigraphique sert à :", "o": ["mesurer le vent", "créer des volcans", "dater les couches", "décorer les roches"], "c": 2, "e": "Espèce courte durée, grande répartition."}]}, {"t": "Géologie — Chap. II — Classification et importance des fossiles", "m": "Géologie", "f": "SE", "g": "", "q": [{"q": "Le classement du plus grand au plus petit groupe est :", "o": ["classe, règne, espèce, genre", "espèce, genre, famille, ordre, classe, embranchement, règne", "genre, règne, ordre", "règne, embranchement, classe, ordre, famille, genre, espèce"], "c": 3, "e": "Classification hiérarchique."}, {"q": "L'unité de base de la classification est :", "o": ["le règne", "la classe", "l'espèce", "l'ordre"], "c": 2, "e": "Espèce."}, {"q": "Les fossiles permettent de reconstituer :", "o": ["les prix", "l'avenir", "les milieux de vie anciens", "la météo de demain"], "c": 2, "e": "Paléoenvironnements."}, {"q": "Un fossile de faciès renseigne sur :", "o": ["l'âge exact seulement", "les saisons futures", "la forme de la Lune", "le milieu de vie"], "c": 3, "e": "Température, salinité, profondeur."}, {"q": "Les ammonites sont des fossiles :", "o": ["de plantes à fleurs", "stratigraphiques", "de virus", "de mammifères"], "c": 1, "e": "Mollusques marins."}]}, {"t": "Géologie — Chap. III — Évolution du globe et origine de la vie", "m": "Géologie", "f": "SE", "g": "", "q": [{"q": "L'âge de la Terre est d'environ :", "o": ["46 milliards d'années", "4,6 milliards d'années", "4,6 millions d'années", "460 000 ans"], "c": 1, "e": "Âge de la Terre."}, {"q": "L'atmosphère primitive contenait peu ou pas de :", "o": ["dioxyde de carbone", "azote", "dioxygène libre", "vapeur d'eau"], "c": 2, "e": "O₂ apparaît grâce à la photosynthèse."}, {"q": "Les océans se sont formés par :", "o": ["fusion des glaciers", "pluies de météorites seulement", "éruptions de sable", "condensation de la vapeur d'eau"], "c": 3, "e": "Refroidissement de la Terre."}, {"q": "L'expérience de Miller (1953) montre :", "o": ["la synthèse d'acides aminés à partir de gaz simples", "la naissance du Soleil", "la dérive des continents", "la formation de volcans"], "c": 0, "e": "Simulation de l'atmosphère primitive."}, {"q": "Les premiers êtres vivants étaient :", "o": ["des organismes unicellulaires simples", "des arbres", "des mammifères", "des oiseaux"], "c": 0, "e": "Procaryotes marins."}]}, {"t": "Géologie — Chap. III — Parenté, sortie des eaux et spéciation", "m": "Géologie", "f": "SE", "g": "", "q": [{"q": "Plus deux espèces ont de séquences ADN semblables, plus elles sont :", "o": ["éloignées", "sans lien", "apparentées", "différentes"], "c": 2, "e": "Parenté moléculaire."}, {"q": "Les premiers vertébrés tétrapodes ont conquis le milieu terrestre à partir :", "o": ["du désert", "des eaux", "de l'espace", "des volcans"], "c": 1, "e": "Sortie des eaux."}, {"q": "Ichthyostega possède :", "o": ["des plumes", "des ailes", "des caractères de poisson et d'amphibien", "des mamelles"], "c": 2, "e": "Forme intermédiaire."}, {"q": "La spéciation est :", "o": ["la disparition du Soleil", "la formation de nouvelles espèces", "un séisme", "la formation de roches"], "c": 1, "e": "Divergence de populations."}, {"q": "L'isolement géographique favorise :", "o": ["la divergence génétique", "la subduction", "l'uniformité totale", "la fossilisation"], "c": 0, "e": "Barrière entre populations."}]}, {"t": "Géologie — Chap. IV — Hominisation", "m": "Géologie", "f": "SE", "g": "", "q": [{"q": "L'hominisation désigne :", "o": ["l'ensemble des transformations menant à l'homme actuel", "la naissance des singes", "la fossilisation des os", "l'évolution des plantes"], "c": 0, "e": "Définition."}, {"q": "Un critère de l'hominisation est :", "o": ["les ailes", "la queue longue", "le pelage épais", "la station debout (bipédie)"], "c": 3, "e": "Libère les mains."}, {"q": "Lucy est un fossile d':", "o": ["Homo sapiens", "Australopithèque", "dinosaure", "Néandertal"], "c": 1, "e": "Découverte en Éthiopie."}, {"q": "Homo erectus est associé à :", "o": ["l'écriture", "l'agriculture moderne", "l'imprimerie", "la maîtrise du feu"], "c": 3, "e": "Étape de l'hominisation."}, {"q": "Le berceau de l'humanité se situe surtout en :", "o": ["Antarctique", "Afrique de l'Est", "Amérique du Nord", "Océanie"], "c": 1, "e": "Origine des premiers hominidés."}]}, {"t": "Géologie — Chap. V — Darwinisme et néo-darwinisme", "m": "Géologie", "f": "SE", "g": "", "q": [{"q": "Darwin a publié « L'Origine des espèces » en :", "o": ["1953", "1789", "1912", "1859"], "c": 3, "e": "Date clé."}, {"q": "Le moteur de l'évolution selon Darwin est :", "o": ["la volonté", "le hasard seul", "l'usage et le non-usage", "la sélection naturelle"], "c": 3, "e": "Survie du plus apte."}, {"q": "Lamarck pensait que :", "o": ["la sélection naturelle suffit", "l'ADN est universel", "les caractères acquis sont héréditaires", "les espèces ne changent pas"], "c": 2, "e": "Théorie réfutée."}, {"q": "Le néo-darwinisme ajoute au darwinisme :", "o": ["la chimie du sol", "l'astronomie", "la génétique et les mutations", "la dérive des continents"], "c": 2, "e": "Source de la variabilité."}, {"q": "La variabilité génétique provient surtout :", "o": ["du hasard social", "des mutations et du brassage génétique", "de l'usage des organes", "de la météo"], "c": 1, "e": "Origine de la diversité."}]}, {"t": "Géologie — Chap. V — Apports de la biologie moléculaire et théorie synthétique", "m": "Géologie", "f": "SE", "g": "", "q": [{"q": "Le code génétique est :", "o": ["universel", "inexistant", "différent chez chaque espèce", "propre à l'homme"], "c": 0, "e": "Même code pour tous les êtres vivants."}, {"q": "La théorie synthétique considère comme unité d'évolution :", "o": ["le fossile", "la cellule seule", "la population", "l'individu seul"], "c": 2, "e": "Évolution des fréquences des gènes."}, {"q": "Une mutation est :", "o": ["un séisme", "une modification de la séquence d'ADN", "une roche", "un fossile"], "c": 1, "e": "Modification héréditaire."}, {"q": "Parmi les facteurs de l'évolution, on compte :", "o": ["mutations, sélection, dérive et migrations", "uniquement le vent", "les éclipses", "uniquement la pluie"], "c": 0, "e": "Théorie synthétique."}, {"q": "La biologie moléculaire a confirmé l'évolution en comparant :", "o": ["les tailles seulement", "les séquences d'ADN et de protéines", "les noms des espèces", "les couleurs"], "c": 1, "e": "Parenté moléculaire."}]}]};
  var LABEL = {programme:'Programme complet',college:'Collège',seconde:'Seconde',premiere:'Première',terminale:'Terminale'};
  var body = document.getElementById('tnBody'), chips = document.querySelectorAll('#tnLevels .tn-chip');
  if(!body) return;
  var quiz = null, idx = 0, ans = [], level = null;

  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function clear(){ while(body.firstChild) body.removeChild(body.firstChild); }
  function setActive(lv){ chips.forEach(function(c){ c.classList.toggle('on', c.dataset.lv===lv); }); }

  var subj = null;
  function showList(lv, sj){
    level = lv; subj = sj || null; quiz = null; setActive(lv); clear();
    var list = DATA[lv] || [];
    var box = el('div','tn-list');
    if(lv==='programme' && !subj){
      var order = [], cnt = {}, nq = {};
      list.forEach(function(qz){ if(!cnt[qz.m]){ cnt[qz.m]=0; nq[qz.m]=0; order.push(qz.m); } cnt[qz.m]++; nq[qz.m]+=qz.q.length; });
      order.forEach(function(m){
        var b = el('button','tn-item', m);
        b.appendChild(el('small',null, cnt[m]+' quiz · '+nq[m]+' questions'));
        b.onclick = function(){ showList('programme', m); };
        box.appendChild(b);
      });
      body.appendChild(box);
      return;
    }
    if(lv==='programme'){
      var back = el('button','tn-back','← Toutes les matières'); back.onclick = function(){ showList('programme'); };
      body.appendChild(back);
      var h = el('div',null,subj); h.style.cssText='font:700 16px Poppins,sans-serif;margin:8px 0;color:var(--blue)'; body.appendChild(h);
    }
    list.forEach(function(qz, i){
      if(lv==='programme' && qz.m!==subj) return;
      var b = el('button','tn-item', qz.t.replace(/^Compétition\s+/,'').replace(/^[^—]+—\s*/, lv==='programme' ? '' : '$&'));
      var sub = qz.q.length+' questions' + (qz.g ? ' · '+qz.g : '') + (qz.f ? ' · filière '+qz.f : '');
      b.appendChild(el('small',null,sub));
      b.onclick = function(){ start(i); };
      box.appendChild(b);
    });
    body.appendChild(box);
  }

  function start(i){ quiz = DATA[level][i]; idx = 0; ans = new Array(quiz.q.length).fill(-1); showQ(); }

  function showQ(){
    clear();
    var q = quiz.q[idx], n = quiz.q.length;
    body.appendChild(el('small',null,quiz.t.replace(/^Compétition\s+/,'')+' — question '+(idx+1)+'/'+n));
    var bar = el('div','tn-bar'), fill = el('i'); fill.style.width = ((idx)/n*100)+'%'; bar.appendChild(fill); body.appendChild(bar);
    body.appendChild(el('p','tn-q',q.q));
    q.o.forEach(function(o, k){
      var b = el('button','tn-opt'+(ans[idx]===k?' sel':''), o);
      b.onclick = function(){ ans[idx]=k; showQ(); };
      body.appendChild(b);
    });
    var nav = el('div','tn-nav');
    var prev = el('button','tn-btn ghost','← Précédent'); prev.disabled = idx===0; prev.onclick=function(){ idx--; showQ(); };
    var last = idx===n-1;
    var next = el('button','tn-btn', last ? 'Terminer ✓' : 'Suivant →'); next.disabled = ans[idx]===-1;
    next.onclick = function(){ if(last) showResult(); else { idx++; showQ(); } };
    nav.appendChild(prev); nav.appendChild(next); body.appendChild(nav);
    var back = el('button','tn-back', level==='programme' ? '← Retour aux chapitres' : '← Changer de matière'); back.onclick=function(){ showList(level, subj); }; body.appendChild(back);
  }

  function showResult(){
    clear();
    var n = quiz.q.length, ok = 0;
    quiz.q.forEach(function(q,i){ if(ans[i]===q.c) ok++; });
    var pct = Math.round(ok/n*100);
    var msg = pct>=80 ? 'Excellent niveau 🌟' : pct>=60 ? 'Bon niveau, continue 💪' : pct>=40 ? 'Niveau moyen : révise les points ratés 📘' : 'À renforcer : le Club est là pour t\u2019aider 🤝';
    body.appendChild(el('small',null,quiz.t.replace(/^Compétition\s+/,'')));
    body.appendChild(el('div','tn-score',ok+' / '+n+'  ('+pct+' %)'));
    body.appendChild(el('p',null,msg));
    var nav = el('div','tn-nav');
    var again = el('button','tn-btn ghost','↻ Refaire ce quiz'); again.onclick=function(){ start(DATA[level].indexOf(quiz)); };
    var other = el('button','tn-btn','Autre matière'); other.onclick=function(){ showList(level, subj); };
    nav.appendChild(again); nav.appendChild(other); body.appendChild(nav);
    var corr = el('div','tn-corr');
    quiz.q.forEach(function(q,i){
      var good = ans[i]===q.c, c = el('div','tn-c '+(good?'ok':'ko'));
      c.appendChild(el('b',null,(i+1)+'. '+q.q));
      var a = el('div',null,'Ta réponse : '); a.appendChild(el('span',good?'g':'r', ans[i]>=0 ? q.o[ans[i]] : '—'));
      c.appendChild(a);
      if(!good){ var r = el('div',null,'Bonne réponse : '); r.appendChild(el('span','g',q.o[q.c])); c.appendChild(r); }
      if(q.e){ var ex = el('div',null,'💡 '+q.e); ex.style.cssText='margin-top:5px;color:var(--ink2);font-size:13px'; c.appendChild(ex); }
      corr.appendChild(c);
    });
    body.appendChild(corr);
  }

  chips.forEach(function(c){ c.onclick=function(){ showList(c.dataset.lv); }; });
})();
</script>
