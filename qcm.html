tome, soit En − Ep."},{"q":"L'énergie de liaison d'un électron sur un niveau d'énergie négative signifie que :","o":["l'électron est lié à l'atome ; il faut lui fournir de l'énergie pour l'arracher (ioniser)","l'électron est déjà libre","l'atome est instable spontanément","l'énergie de l'atome est infinie"],"c":0,"e":"Un niveau d'énergie négatif indique un état lié : il faut fournir de l'énergie pour amener l'électron au niveau nul (électron libre)."},{"q":"Pour ioniser un atome d'hydrogène initialement dans son état fondamental, il faut lui fournir une énergie au moins égale à :","o":["13,6 eV","−13,6 eV","0 eV","6,8 eV"],"c":0,"e":"Il faut amener l'électron du niveau n=1 (E₁=−13,6 eV) au niveau n→∞ (E∞=0), soit une énergie ΔE = 13,6 eV."},{"q":"Le niveau d'énergie n=∞ pour l'atome d'hydrogène correspond à une énergie de :","o":["0 eV, électron libre non lié","−13,6 eV","+13,6 eV","une valeur infinie"],"c":0,"e":"Lorsque n tend vers l'infini, En = −13,6/n² tend vers 0 : l'électron est alors libre, non lié à l'atome."},{"q":"Plus le nombre quantique n est grand, plus l'énergie du niveau En de l'atome d'hydrogène :","o":["se rapproche de 0, l'électron étant de moins en moins lié","diminue vers −∞","reste constante","devient positive et croissante"],"c":0,"e":"En = −13,6/n² : quand n augmente, |En| diminue et En se rapproche de 0, traduisant une liaison de plus en plus faible."},{"q":"La quantification des niveaux d'énergie atomiques explique pourquoi les spectres de raies sont, contrairement à un spectre continu, constitués :","o":["de raies discrètes à des longueurs d'onde bien précises","d'un dégradé continu de couleurs","d'une seule couleur unique toujours identique","d'aucune structure observable"],"c":0,"e":"Comme seules certaines transitions d'énergie sont possibles, seules certaines longueurs d'onde précises sont émises ou absorbées."}]},{"t":"Physique — Physique nucléaire","m":"Physique","f":"","g":"Avril","q":[{"q":"L'énergie de liaison d'un noyau se calcule à partir :","o":["du nombre de neutrons uniquement","du défaut de masse et de la relation E = mc²","de la charge du noyau uniquement","de la période radioactive"],"c":1,"e":"El = Δm·c², où Δm est le défaut de masse entre les nucléons séparés et le noyau formé."},{"q":"La loi de décroissance radioactive s'écrit :","o":["N = N₀ + λt","N = N₀/t","N = N₀·e^(−λt)","N = N₀·λt"],"c":2,"e":"N(t) = N₀·e^(−λt), avec λ la constante radioactive et N₀ le nombre initial de noyaux."},{"q":"Le rayonnement β⁻ correspond à l'émission :","o":["d'un noyau d'hélium","d'un photon de haute énergie","d'un électron","d'un positon"],"c":2,"e":"La radioactivité β⁻ correspond à la transformation d'un neutron en proton avec émission d'un électron."},{"q":"Le noyau d'un atome est constitué de :","o":["protons et neutrons (nucléons)","protons et électrons uniquement","neutrons et électrons uniquement","électrons seuls"],"c":0,"e":"Le noyau atomique est formé de nucléons : protons (chargés positivement) et neutrons (neutres)."},{"q":"Deux isotopes d'un même élément chimique possèdent :","o":["le même nombre de protons mais un nombre de neutrons différent","le même nombre de neutrons mais un nombre de protons différent","des propriétés chimiques totalement différentes","le même nombre de nucléons"],"c":0,"e":"Les isotopes d'un élément ont le même numéro atomique Z (nombre de protons) mais un nombre de neutrons différent."},{"q":"L'énergie de liaison par nucléon est un critère utilisé pour :","o":["comparer la stabilité relative de différents noyaux, plus elle est grande, plus le noyau est stable","mesurer la charge du noyau","calculer la vitesse de désintégration uniquement","déterminer la couleur du rayonnement émis"],"c":0,"e":"Plus l'énergie de liaison par nucléon est élevée, plus les nucléons sont fortement liés entre eux, et plus le noyau est stable."},{"q":"La radioactivité naturelle est un phénomène :","o":["spontané, propre à certains noyaux instables présents dans la nature","provoqué uniquement en laboratoire par bombardement","impossible à observer","uniquement lié à la fission artificielle"],"c":0,"e":"Certains noyaux, instables à l'état naturel, se désintègrent spontanément, sans intervention extérieure."},{"q":"La radioactivité provoquée, ou artificielle, résulte, contrairement à la radioactivité naturelle :","o":["d'une réaction nucléaire déclenchée par l'homme, par exemple un bombardement de noyaux","d'un phénomène totalement spontané","de l'effet photoélectrique","de l'induction électromagnétique"],"c":0,"e":"La radioactivité artificielle est provoquée en laboratoire, par exemple en bombardant des noyaux stables avec des particules."},{"q":"Le rayonnement α correspond à l'émission, par un noyau instable, :","o":["d'un noyau d'hélium, deux protons et deux neutrons","d'un électron","d'un positon","d'un photon de haute énergie uniquement"],"c":0,"e":"La particule α est identique à un noyau d'hélium ⁴₂He, composé de deux protons et deux neutrons."},{"q":"Le rayonnement β⁺ correspond à l'émission :","o":["d'un positon, antiparticule de l'électron","d'un électron","d'un noyau d'hélium","d'un neutron"],"c":0,"e":"La radioactivité β⁺ correspond à la transformation d'un proton en neutron, avec émission d'un positon."},{"q":"Le rayonnement γ correspond à l'émission :","o":["d'un photon de très haute énergie, souvent consécutif à une désintégration α ou β","d'un noyau d'hélium","d'un électron","d'un neutron"],"c":0,"e":"Le rayonnement γ accompagne souvent une désintégration α ou β, lorsque le noyau fils se retrouve dans un état excité et se désexcite en émettant un photon."},{"q":"La période radioactive, ou demi-vie, d'un échantillon radioactif est la durée au bout de laquelle :","o":["la moitié des noyaux initiaux se sont désintégrés","tous les noyaux se sont désintégrés","aucun noyau ne s'est désintégré","le nombre de noyaux double"],"c":0,"e":"La période radioactive T est la durée nécessaire pour que la moitié des noyaux radioactifs initiaux se soient désintégrés."},{"q":"L'activité A d'une source radioactive représente :","o":["le nombre de désintégrations par seconde","la masse totale de l'échantillon","la charge totale des noyaux","le volume de l'échantillon"],"c":0,"e":"L'activité, exprimée en becquerel (Bq), mesure le nombre de désintégrations se produisant chaque seconde dans l'échantillon."},{"q":"L'activité A d'une source radioactive est reliée au nombre de noyaux N présents et à la constante radioactive λ par la relation :","o":["A = λ·N","A = N/λ","A = λ/N","A = λ + N"],"c":0,"e":"L'activité est proportionnelle au nombre de noyaux radioactifs restants : A = λ·N."},{"q":"Une réaction de fission nucléaire consiste en :","o":["la scission d'un noyau lourd en deux noyaux plus légers, avec libération d'énergie","la fusion de deux noyaux légers en un noyau plus lourd","la désintégration α d'un noyau","l'émission d'un photon uniquement"],"c":0,"e":"La fission est la division d'un noyau lourd (par exemple l'uranium 235) en deux noyaux plus légers, avec un important dégagement d'énergie."},{"q":"Une réaction de fusion nucléaire consiste en :","o":["l'union de deux noyaux légers pour former un noyau plus lourd, avec libération d'énergie","la scission d'un noyau lourd","l'émission d'un électron uniquement","l'ionisation d'un atome"],"c":0,"e":"La fusion, comme celle qui a lieu dans le Soleil, combine des noyaux légers (hydrogène) pour former des noyaux plus lourds (hélium), en libérant de l'énergie."},{"q":"Lors de l'écriture d'une équation de réaction nucléaire, les lois de conservation à respecter sont :","o":["la conservation du nombre de nucléons (A) et de la charge (Z)","uniquement la conservation de la masse totale","uniquement la conservation de l'énergie cinétique","aucune loi de conservation particulière"],"c":0,"e":"Dans une équation de réaction nucléaire, la somme des nombres de masse A et la somme des numéros atomiques Z doivent être conservées de part et d'autre."},{"q":"Parmi les dangers de la radioactivité et des réactions nucléaires figure :","o":["l'irradiation et la contamination des organismes vivants par les rayonnements ionisants","l'augmentation de la pression atmosphérique","le refroidissement climatique global","l'amélioration systématique de la santé"],"c":0,"e":"Les rayonnements ionisants peuvent endommager les tissus vivants, d'où la nécessité de se protéger des sources radioactives et de gérer les déchets."}]},{"t":"Mathématiques — Numérations décimale et binaire","m":"Mathématiques","f":"","g":"Octobre","q":[{"q":"Le nombre binaire 1011 correspond, en écriture décimale, à :","o":["9","11","13","15"],"c":1,"e":"1011₂ = 1×8 + 0×4 + 1×2 + 1×1 = 11."},{"q":"Dans le système binaire, la base utilisée est :","o":["2","8","10","16"],"c":0,"e":"Le système binaire utilise deux chiffres (0 et 1) : sa base est 2."},{"q":"Le nombre décimal 13 s'écrit en binaire :","o":["1010","1011","1101","1110"],"c":2,"e":"13 = 8 + 4 + 1, soit 1×8 + 1×4 + 0×2 + 1×1 = 1101₂."},{"q":"Le nombre binaire 1101 correspond, en écriture décimale, à :","o":["13","11","15","9"],"c":0,"e":"1101₂ = 1×8 + 1×4 + 0×2 + 1×1 = 13."},{"q":"Le nombre décimal 20 s'écrit en binaire :","o":["10100","10010","11000","10110"],"c":0,"e":"20 = 16+4 = 1×16+0×8+1×4+0×2+0×1, soit 10100 en base 2."},{"q":"Dans le système décimal, la base utilisée est :","o":["10","2","8","16"],"c":0,"e":"Le système décimal, celui usuel, utilise dix chiffres (0 à 9) : sa base est 10."},{"q":"Le chiffre le plus à droite d'un nombre écrit en base b représente les unités correspondant à la puissance :","o":["b⁰","b¹","b²","b^n"],"c":0,"e":"Dans une écriture en base b, le chiffre des unités correspond au coefficient de b⁰=1."},{"q":"Pour convertir un nombre décimal en binaire, on effectue généralement :","o":["des divisions euclidiennes successives par 2, en conservant les restes","des multiplications successives par 10","une simple addition des chiffres","une division par 16"],"c":0,"e":"La conversion décimal → binaire s'obtient par divisions euclidiennes successives par 2, les restes lus de bas en haut donnant l'écriture binaire."},{"q":"Le système binaire est particulièrement utilisé en informatique car il correspond directement :","o":["aux deux états possibles d'un composant électronique (0 ou 1)","à la base 10 utilisée par les humains","à la base 16 des couleurs uniquement","à aucune application pratique particulière"],"c":0,"e":"Les circuits électroniques fonctionnent naturellement avec deux états (courant présent/absent), ce qui correspond au système binaire."},{"q":"Le nombre binaire 100000 correspond, en écriture décimale, à :","o":["32","16","64","20"],"c":0,"e":"100000₂ = 1×2⁵ = 32."},{"q":"Dans l'écriture décimale d'un nombre entier, chaque chiffre représente un coefficient multiplié par une puissance de :","o":["10","2","la position du chiffre uniquement","1"],"c":0,"e":"Le système décimal est un système de numération positionnelle en base 10."},{"q":"Le plus grand nombre que l'on peut écrire avec 4 chiffres binaires (de 0000 à 1111) est, en décimal :","o":["15","16","31","8"],"c":0,"e":"1111₂ = 8+4+2+1 = 15."},{"q":"La numération binaire n'utilise, pour écrire tout nombre entier, que les chiffres :","o":["0 et 1","0, 1 et 2","0 à 9","0 à 15"],"c":0,"e":"Par définition, la base binaire (base 2) n'utilise que deux chiffres : 0 et 1."}]},{"t":"Mathématiques — Anneaux Z et Z/nZ — division euclidienne et congruences","m":"Mathématiques","f":"","g":"Octobre","q":[{"q":"Dans la division euclidienne de a par b (b≠0), le reste r vérifie :","o":["r peut être négatif ou supérieur à b","0 ≤ r < |b|","r = b","r est toujours nul"],"c":1,"e":"Par définition de la division euclidienne, le reste r vérifie 0 ≤ r < |b|."},{"q":"a est congru à b modulo n (noté a ≡ b [n]) signifie que :","o":["a = b","a − b est un multiple de n","a/b est un entier","a et b ont le même chiffre des unités"],"c":1,"e":"a ≡ b [n] équivaut à dire que n divise (a − b)."},{"q":"L'ensemble (Z/nZ, +, ×) est muni d'une structure de :","o":["groupe multiplicatif uniquement","anneau","espace vectoriel","corps, quel que soit n"],"c":1,"e":"Z/nZ, muni de l'addition et de la multiplication modulo n, est un anneau (commutatif, unitaire)."},{"q":"Dans la division euclidienne de a par b (b>0), le quotient q et le reste r vérifient :","o":["a = b·q + r, avec 0 ≤ r < b","a = b·q + r, avec 0 ≤ r < a","a = b + q·r","a = q·r, avec r quelconque"],"c":0,"e":"La division euclidienne s'écrit a = b·q + r, avec un reste r vérifiant 0 ≤ r < b."},{"q":"L'ensemble Z, muni de l'addition et de la multiplication usuelles, possède une structure :","o":["d'anneau commutatif","de corps","de groupe multiplicatif","d'espace vectoriel"],"c":0,"e":"(Z, +, ×) est un anneau commutatif : Z n'est pas un corps car tout élément non nul n'y est pas inversible pour la multiplication."},{"q":"Si a ≡ b [n] et c ≡ d [n], alors on peut affirmer que :","o":["a + c ≡ b + d [n]","a + c ≡ b − d [n]","a − c ≡ b + d [n]","aucune conclusion n'est possible"],"c":0,"e":"La compatibilité de la congruence avec l'addition permet d'additionner membre à membre deux congruences de même module."},{"q":"Si a ≡ b [n], alors pour tout entier k, on a également :","o":["k·a ≡ k·b [n]","k + a ≡ b [n]","a ≡ k·b [n]","a/k ≡ b/k [n]"],"c":0,"e":"La congruence est compatible avec la multiplication par un entier fixé."},{"q":"L'ensemble Z/nZ est constitué des classes d'équivalence pour la relation :","o":["de congruence modulo n","de divisibilité","d'égalité stricte","de comparaison ≤"],"c":0,"e":"Z/nZ regroupe les entiers en classes selon leur reste dans la division euclidienne par n."},{"q":"L'anneau Z/nZ possède exactement :","o":["n éléments (classes)","n+1 éléments","n−1 éléments","un nombre infini d'éléments"],"c":0,"e":"Il existe exactement n restes possibles (0, 1, ..., n−1) dans la division par n, donc n classes dans Z/nZ."},{"q":"Dans Z/nZ, un élément possède un inverse pour la multiplication si et seulement si :","o":["il est premier avec n","il est pair","il est égal à 0","il est égal à n"],"c":0,"e":"Un élément k de Z/nZ est inversible si et seulement si pgcd(k,n)=1, c'est-à-dire k premier avec n."},{"q":"Z/pZ, avec p premier, possède une structure particulière car il s'agit d'un :","o":["corps (tout élément non nul y est inversible)","simple groupe additif","anneau non commutatif","ensemble sans structure algébrique"],"c":0,"e":"Lorsque p est premier, tout élément non nul de Z/pZ est premier avec p, donc inversible : Z/pZ est un corps."},{"q":"Pour démontrer une propriété de congruence, une méthode courante consiste à :","o":["écrire les nombres sous la forme a = nq+r et étudier les restes","ignorer le reste de la division euclidienne","utiliser uniquement des nombres décimaux","additionner directement les modules"],"c":0,"e":"L'étude des restes dans la division euclidienne par n est l'outil de base pour manipuler les congruences."},{"q":"Un anneau commutatif unitaire est un ensemble muni de deux opérations vérifiant notamment :","o":["l'associativité et la commutativité de l'addition, l'associativité de la multiplication et la distributivité","uniquement la commutativité de la multiplication","aucune propriété particulière","uniquement l'existence d'un inverse pour tout élément"],"c":0,"e":"La structure d'anneau repose sur ces axiomes, sans nécessiter l'existence d'un inverse multiplicatif pour tout élément non nul."}]},{"t":"Mathématiques — Nombres premiers — PGCD et PPCM","m":"Mathématiques","f":"","g":"Octobre","q":[{"q":"Tout entier naturel supérieur à 1 se décompose en produit de facteurs premiers de façon :","o":["non unique","unique, à l'ordre des facteurs près","impossible","unique uniquement s'il est pair"],"c":1,"e":"C'est le théorème fondamental de l'arithmétique : la décomposition en facteurs premiers existe et est unique à l'ordre près."},{"q":"Le PGCD de deux entiers a et b divise :","o":["uniquement a","uniquement b","à la fois a et b","ni a ni b"],"c":2,"e":"Le PGCD (plus grand commun diviseur) est, par définition, un diviseur commun à a et à b."},{"q":"Pour deux entiers naturels a et b, on a la relation :","o":["PGCD(a,b) = PPCM(a,b) toujours","PGCD(a,b) + PPCM(a,b) = a + b","PGCD(a,b) × PPCM(a,b) = a × b","PGCD(a,b) > PPCM(a,b) toujours"],"c":2,"e":"On a toujours PGCD(a,b) × PPCM(a,b) = a × b, pour a et b entiers naturels non nuls."},{"q":"Un nombre entier naturel p est dit premier lorsqu'il possède exactement :","o":["deux diviseurs positifs distincts : 1 et lui-même","un seul diviseur positif","trois diviseurs positifs","une infinité de diviseurs"],"c":0,"e":"Par définition, un nombre premier admet exactement deux diviseurs positifs distincts : 1 et lui-même."},{"q":"L'existence et l'unicité de la décomposition d'un entier en produit de facteurs premiers constituent :","o":["le théorème fondamental de l'arithmétique","le théorème de Bézout","le petit théorème de Fermat","le théorème de Gauss"],"c":0,"e":"Ce résultat central de l'arithmétique garantit que tout entier supérieur à 1 se décompose de façon unique (à l'ordre près) en produit de nombres premiers."},{"q":"Le PPCM de deux entiers a et b est :","o":["le plus petit multiple commun positif à a et b","le plus grand diviseur commun à a et b","toujours égal à a×b","toujours égal à 1"],"c":0,"e":"Le PPCM (plus petit commun multiple) est le plus petit entier positif multiple à la fois de a et de b."},{"q":"Pour deux entiers naturels a et b non nuls, le produit du PGCD et du PPCM vérifie :","o":["PGCD(a,b) × PPCM(a,b) = a × b","PGCD(a,b) + PPCM(a,b) = a + b","PGCD(a,b) = PPCM(a,b)","PGCD(a,b) × PPCM(a,b) = 1"],"c":0,"e":"Relation fondamentale reliant PGCD, PPCM et le produit des deux entiers."},{"q":"L'algorithme d'Euclide permet de calculer le PGCD de deux entiers en effectuant :","o":["des divisions euclidiennes successives jusqu'à obtenir un reste nul","des additions successives","des multiplications successives","une simple comparaison des deux nombres"],"c":0,"e":"L'algorithme d'Euclide repose sur des divisions euclidiennes successives : le PGCD est le dernier reste non nul."},{"q":"Deux entiers a et b sont dits premiers entre eux lorsque :","o":["leur PGCD vaut 1","leur PGCD vaut 0","leur PPCM vaut 1","ils sont tous deux des nombres premiers"],"c":0,"e":"Deux entiers premiers entre eux n'ont aucun diviseur commun autre que 1, donc PGCD(a,b)=1."},{"q":"Le théorème de Bézout affirme que, pour deux entiers a et b, il existe des entiers u et v tels que :","o":["au + bv = PGCD(a,b)","au + bv = PPCM(a,b)","au + bv = 0 uniquement","au − bv = ab"],"c":0,"e":"Le théorème de Bézout établit l'existence de coefficients entiers u et v vérifiant au+bv=PGCD(a,b)."},{"q":"Le PGCD de deux entiers a et b divise également :","o":["toute combinaison linéaire entière de a et b","uniquement le nombre 1","uniquement le produit a×b","aucun autre nombre que a et b eux-mêmes"],"c":0,"e":"Le PGCD, en tant que diviseur commun, divise toute combinaison au+bv, pour u et v entiers."},{"q":"Pour résoudre un problème de partage en lots identiques à partir de deux quantités données, on utilise généralement :","o":["le PGCD des deux quantités","le PPCM des deux quantités","la somme des deux quantités","leur produit"],"c":0,"e":"Le PGCD permet de déterminer la plus grande taille de lot identique divisant exactement les deux quantités."},{"q":"Pour déterminer la date de coïncidence périodique de deux événements de périodes différentes, on utilise généralement :","o":["le PPCM des deux périodes","le PGCD des deux périodes","la moyenne des deux périodes","leur différence"],"c":0,"e":"Le PPCM des deux périodes donne le premier instant où les deux événements périodiques coïncident à nouveau."}]},{"t":"Mathématiques — Formes des nombres complexes et représentation géométrique","m":"Mathématiques","f":"","g":"Novembre","q":[{"q":"La forme trigonométrique d'un nombre complexe z non nul s'écrit :","o":["z = a + ib uniquement","z = r(cosθ + i sinθ)","z = r + iθ","z = θ + ir"],"c":1,"e":"z = r(cosθ + i sinθ), où r = |z| est le module et θ = arg(z) l'argument de z."},{"q":"Dans le plan complexe, l'affixe d'un point M représente :","o":["sa distance à l'origine uniquement","le nombre complexe associé à ses coordonnées","son argument uniquement","sa partie imaginaire uniquement"],"c":1,"e":"L'affixe de M(x,y) est le nombre complexe z = x + iy qui lui est associé."},{"q":"Le module d'un nombre complexe z = a + ib est donné par :","o":["|z| = a + b","|z| = a² + b²","|z| = √(a² + b²)","|z| = a − b"],"c":2,"e":"|z| = √(a² + b²), distance de l'origine au point d'affixe z."},{"q":"La forme algébrique d'un nombre complexe z s'écrit :","o":["z = a + ib, avec a et b réels","z = r(cos θ + i sin θ)","z = r·e^θ","z = a·b"],"c":0,"e":"La forme algébrique exprime z à l'aide de sa partie réelle a et de sa partie imaginaire b."},{"q":"Le passage de la forme algébrique à la forme trigonométrique d'un nombre complexe non nul nécessite de calculer :","o":["son module et son argument","uniquement sa partie réelle","uniquement sa partie imaginaire","son carré"],"c":0,"e":"La forme trigonométrique z = r(cos θ + i sin θ) requiert la connaissance du module r et de l'argument θ."},{"q":"La forme exponentielle d'un nombre complexe non nul de module r et d'argument θ s'écrit :","o":["z = r·e^(iθ)","z = r + iθ","z = e^r·θ","z = r·i^θ"],"c":0,"e":"La notation exponentielle z = r·e^(iθ) est équivalente à la forme trigonométrique r(cos θ + i sin θ)."},{"q":"Dans le plan complexe, deux points M et M' d'affixes z et z' sont symétriques par rapport à l'axe des réels lorsque :","o":["z' est le conjugué de z","z' est l'opposé de z","z' = i·z","z' = z²"],"c":0,"e":"La symétrie par rapport à l'axe des abscisses correspond, en complexes, à la conjugaison."},{"q":"L'affixe du vecteur AB, où A et B ont pour affixes zA et zB, est donnée par :","o":["zB − zA","zB + zA","zA/zB","zA × zB"],"c":0,"e":"L'affixe d'un vecteur AB s'obtient par différence des affixes de son extrémité et de son origine."},{"q":"Le conjugué d'un nombre complexe z = a + ib est le nombre complexe :","o":["a − ib","−a + ib","−a − ib","b + ia"],"c":0,"e":"Le conjugué de z=a+ib, noté z̄, s'obtient en changeant le signe de la partie imaginaire."},{"q":"Le produit d'un nombre complexe z par son conjugué z̄ est égal à :","o":["|z|², un réel positif","2·Re(z)","2i·Im(z)","toujours nul"],"c":0,"e":"z·z̄ = a² + b² = |z|², toujours réel et positif."},{"q":"Dans le plan complexe, l'axe des ordonnées correspond à l'ensemble des points d'affixe :","o":["purement imaginaire","réelle","de module nul uniquement","d'argument nul"],"c":0,"e":"Les points de l'axe des ordonnées ont une partie réelle nulle : leur affixe est un imaginaire pur."},{"q":"Un nombre complexe z est réel si et seulement si :","o":["z = z̄ (il est égal à son conjugué)","z = −z̄","|z| = 1","z = i·z̄"],"c":0,"e":"Un nombre complexe égal à son conjugué a une partie imaginaire nulle, donc il est réel."},{"q":"Le milieu I d'un segment [AB], où A et B ont pour affixes zA et zB, a pour affixe :","o":["(zA + zB)/2","zA − zB","zA × zB","(zA − zB)/2"],"c":0,"e":"L'affixe du milieu d'un segment est la demi-somme des affixes de ses extrémités."}]},{"t":"Mathématiques — Module, argument et équations dans C","m":"Mathématiques","f":"","g":"Novembre","q":[{"q":"Le module d'un produit de deux nombres complexes z1 et z2 est égal à :","o":["|z1| + |z2|","|z1| − |z2|","|z1| × |z2|","|z1| / |z2|"],"c":2,"e":"Le module d'un produit est le produit des modules : |z1·z2| = |z1|·|z2|."},{"q":"L'argument d'un quotient z1/z2 (z2≠0) est égal à :","o":["arg(z1) + arg(z2)","arg(z1) − arg(z2)","arg(z1) × arg(z2)","arg(z1) / arg(z2)"],"c":1,"e":"arg(z1/z2) = arg(z1) − arg(z2) [2π]."},{"q":"Dans C, une équation du second degré à coefficients réels et à discriminant négatif admet :","o":["aucune solution","une solution double réelle","deux solutions complexes conjuguées","une infinité de solutions"],"c":2,"e":"Si Δ<0, l'équation admet deux solutions complexes conjuguées : (−b±i√(−Δ))/(2a)."},{"q":"Pour z1 et z2 non nuls, le module du quotient z1/z2 est égal à :","o":["|z1|/|z2|","|z1| + |z2|","|z1| − |z2|","|z1| × |z2|"],"c":0,"e":"Le module d'un quotient de complexes est le quotient des modules."},{"q":"Pour z1 et z2 non nuls, l'argument du produit z1×z2 est égal, à 2π près, à :","o":["arg(z1) + arg(z2)","arg(z1) − arg(z2)","arg(z1) × arg(z2)","arg(z1)/arg(z2)"],"c":0,"e":"L'argument d'un produit de complexes est la somme des arguments, modulo 2π."},{"q":"L'ensemble C, muni de l'addition et de la multiplication, possède une structure de :","o":["corps commutatif","simple anneau non commutatif","groupe additif uniquement","espace vectoriel uniquement"],"c":0,"e":"(C, +, ×) est un corps commutatif : tout élément non nul y admet un inverse pour la multiplication."},{"q":"Dans l'ensemble C, l'équation x² = −1 admet pour solutions :","o":["i et −i","1 et −1","aucune solution","uniquement i"],"c":0,"e":"Par définition, i²=−1, donc i et son opposé −i sont les deux solutions de x²=−1 dans C."},{"q":"Une équation du second degré az²+bz+c=0 (a≠0), à coefficients réels et de discriminant Δ, admet dans C :","o":["toujours deux solutions (éventuellement complexes conjuguées ou confondues)","toujours une seule solution","aucune solution possible","exactement trois solutions"],"c":0,"e":"Contrairement à R, toute équation du second degré à coefficients réels admet, dans C, toujours deux solutions (confondues si Δ=0)."},{"q":"Si le discriminant Δ d'une équation du second degré à coefficients réels est strictement négatif, les deux solutions complexes sont :","o":["conjuguées l'une de l'autre","opposées l'une de l'autre","réelles et distinctes","confondues"],"c":0,"e":"Lorsque Δ<0, les deux racines complexes s'écrivent (−b±i√(−Δ))/(2a), qui sont conjuguées."},{"q":"Le module d'un nombre complexe z représente géométriquement :","o":["la distance entre l'origine du repère et le point d'affixe z","l'angle formé avec l'axe des réels","uniquement la partie réelle de z","uniquement la partie imaginaire de z"],"c":0,"e":"Le module |z| correspond, dans le plan complexe, à la longueur OM, où M est le point d'affixe z."},{"q":"L'argument d'un nombre complexe non nul z représente géométriquement :","o":["une mesure de l'angle entre l'axe des réels et le vecteur OM (M étant le point d'affixe z)","la distance OM","le carré du module","toujours zéro"],"c":0,"e":"L'argument est une mesure, modulo 2π, de l'angle orienté formé par le vecteur OM avec l'axe des abscisses."},{"q":"Pour résoudre dans C une équation du premier degré az+b=0 (a≠0, a et b complexes), on obtient :","o":["une unique solution z = −b/a","deux solutions distinctes","aucune solution en général","une infinité de solutions"],"c":0,"e":"Comme dans R, une équation du premier degré à coefficient non nul admet une unique solution."},{"q":"L'inégalité triangulaire appliquée aux modules de deux complexes z1 et z2 s'écrit :","o":["|z1 + z2| ≤ |z1| + |z2|","|z1 + z2| = |z1| + |z2| toujours","|z1 + z2| ≥ |z1| × |z2|","|z1 + z2| = |z1| − |z2|"],"c":0,"e":"L'inégalité triangulaire, valable pour les modules comme pour les distances, majore le module d'une somme par la somme des modules."}]},{"t":"Mathématiques — Racines n-ièmes, formule de Moivre et similitudes","m":"Mathématiques","f":"","g":"Novembre","q":[{"q":"La formule de Moivre s'écrit, pour tout entier n :","o":["(cosθ + i sinθ)ⁿ = cos(nθ) + i sin(nθ)","(cosθ + i sinθ)ⁿ = n(cosθ + i sinθ)","(cosθ + i sinθ)ⁿ = cosθⁿ","(cosθ + i sinθ)ⁿ = 1"],"c":0,"e":"Formule de Moivre : (cosθ + i sinθ)ⁿ = cos(nθ) + i sin(nθ)."},{"q":"Un nombre complexe non nul possède, dans C, exactement :","o":["une seule racine n-ième","n racines n-ièmes distinctes","2n racines n-ièmes","aucune racine n-ième"],"c":1,"e":"Tout complexe non nul admet exactement n racines n-ièmes distinctes, régulièrement réparties sur un cercle."},{"q":"Une similitude directe du plan complexe s'écrit sous la forme :","o":["z' = a + z uniquement","z' = az + b, avec a ∈ C*","z' = |z|","z' = z̄ (conjugué)"],"c":1,"e":"Toute similitude directe s'écrit z' = az + b avec a ∈ C* (a≠0), combinant rotation, homothétie et translation."},{"q":"Un nombre complexe non nul possède, dans C, exactement n racines n-ièmes, réparties géométriquement :","o":["régulièrement sur un cercle centré à l'origine (sommets d'un polygone régulier)","alignées sur une droite","toutes confondues en un seul point","réparties de façon aléatoire"],"c":0,"e":"Les n racines n-ièmes d'un complexe non nul ont même module et des arguments régulièrement espacés de 2π/n, formant un polygone régulier."},{"q":"Les racines n-ièmes de l'unité sont les solutions de l'équation :","o":["zⁿ = 1","zⁿ = 0","z = n","zⁿ = n"],"c":0,"e":"Par définition, les racines n-ièmes de l'unité vérifient zⁿ = 1."},{"q":"La formule de Moivre s'écrit, pour tout réel θ et tout entier n :","o":["(cos θ + i sin θ)ⁿ = cos(nθ) + i sin(nθ)","(cos θ + i sin θ)ⁿ = n·(cos θ + i sin θ)","(cos θ + i sin θ)ⁿ = cos(θⁿ)","(cos θ + i sin θ)ⁿ = cos θ + i·n·sin θ"],"c":0,"e":"La formule de Moivre relie directement la puissance n-ième d'un complexe de module 1 à l'angle multiplié par n."},{"q":"La formule de Moivre est notamment utile pour :","o":["exprimer cos(nθ) et sin(nθ) en fonction de cos θ et sin θ (linéarisation)","calculer directement une intégrale","résoudre une équation différentielle","étudier la continuité d'une fonction"],"c":0,"e":"En développant (cos θ + i sin θ)ⁿ, on peut identifier parties réelle et imaginaire pour exprimer cos(nθ) et sin(nθ)."},{"q":"Une similitude directe du plan complexe est une transformation qui conserve :","o":["les angles orientés et multiplie les distances par un rapport constant","uniquement les distances","uniquement les angles non orientés","aucune grandeur géométrique"],"c":0,"e":"Une similitude directe conserve les angles orientés et multiplie toutes les longueurs par un même rapport k."},{"q":"Une similitude directe du plan complexe, d'écriture z' = a  résulte de la dérivation d'une fonction composée avec la fonction puissance."},{"q":"Le calcul des dérivées successives d'une fonction est notamment utile pour :","o":["étudier la convexité de la fonction et déterminer d'éventuels points d'inflexion","calculer directement une primitive","déterminer la parité de la fonction","calculer sa limite à l'infini uniquement"],"c":0,"e":"L'étude du signe de f'' renseigne précisément sur la convexité de la courbe et la présence de points d'inflexion."}]},{"t":"Mathématiques — Étude des variations et branches infinies","m":"Mathématiques","f":"","g":"Janvier","q":[{"q":"Une fonction f admet un extremum local en x₀ lorsque :","o":["f est continue en x₀","f' s'annule et change de signe en x₀","f(x₀) = 0","f' est constante"],"c":1,"e":"Un extremum local correspond à un changement de signe de la dérivée f' en x₀ (où f'(x₀)=0 si f dérivable)."},{"q":"Une droite d'équation y = ax+b est asymptote oblique à la courbe de f en +∞ si :","o":["lim(x→+∞)[f(x) − (ax+b)] = 0","lim(x→+∞) f(x) = a","f(x) = ax+b pour tout x","f n'est pas définie en +∞"],"c":0,"e":"La droite d'équation y=ax+b est asymptote si la différence f(x)−(ax+b) tend vers 0 en +∞."},{"q":"Si lim(x→a) f(x) = ±∞, la droite d'équation x=a est :","o":["une asymptote horizontale","une asymptote verticale","une tangente à la courbe","une asymptote oblique"],"c":1,"e":"Une limite infinie en un point fini a caractérise une asymptote verticale d'équation x=a."},{"q":"Une fonction f est dite croissante sur un intervalle I lorsque, pour tous x₁<x₂ dans I :","o":["f(x₁) ≤ f(x₂)","f(x₁) ≥ f(x₂)","f(x₁) = f(x₂)","f(x₁) < f(x₂) systématiquement pour tout intervalle"],"c":0,"e":"Par définition, une fonction croissante conserve l'ordre : x₁<x₂ implique f(x₁)≤f(x₂)."},{"q":"Le signe de la dérivée f' sur un intervalle renseigne directement sur :","o":["le sens de variation de f sur cet intervalle","la parité de f","la périodicité de f","la continuité de f"],"c":0,"e":"f'>0 indique que f est croissante, f'<0 que f est décroissante sur l'intervalle considéré."},{"q":"Un extremum local d'une fonction dérivable f est atteint en un point où :","o":["la dérivée f' s'annule en changeant de signe","la dérivée f' est toujours positive","la fonction n'est pas continue","la dérivée seconde est nulle"],"c":0,"e":"Un extremum local correspond à un point où f' s'annule en changeant de signe (de + à − ou de − à +)."},{"q":"Une asymptote horizontale d'équation y=k pour une fonction f en +∞ signifie que :","o":["la limite de f(x) quand x tend vers +∞ vaut k","f(k) est défini","f admet un extremum en k","f est croissante à partir de k"],"c":0,"e":"L'asymptote horizontale traduit le fait que f(x) se rapproche indéfiniment de la valeur k lorsque x tend vers +∞."},{"q":"Une asymptote oblique d'équation y=ax+b pour une fonction f en +∞ correspond au cas où :","o":["la limite de [f(x) − (ax+b)] est nulle quand x tend vers +∞","f(x) tend vers l'infini de façon quelconque","f admet une limite finie en +∞","f n'est pas définie en +∞"],"c":0,"e":"L'asymptote oblique traduit un comportement de f qui se rapproche indéfiniment de la droite d'équation y=ax+b."},{"q":"Pour déterminer si la courbe d'une fonction admet une branche parabolique de direction donnée, on étudie généralement :","o":["la limite du rapport f(x)/x lorsque x tend vers l'infini","uniquement la valeur de f(0)","la parité de f","le signe de f uniquement"],"c":0,"e":"L'étude du comportement de f(x)/x à l'infini permet de caractériser la direction d'une éventuelle branche parabolique."},{"q":"Un tableau de variations complet d'une fonction fait généralement apparaître :","o":["le signe de la dérivée et le sens de variation de la fonction sur chaque intervalle","uniquement les valeurs de la fonction en quelques points isolés","uniquement les limites aux bornes du domaine","la seule parité de la fonction"],"c":0,"e":"Le tableau de variations synthétise le signe de f' et le comportement croissant/décroissant de f, ainsi que les valeurs remarquables et limites."},{"q":"Un maximum global d'une fonction f sur un intervalle I est une valeur f(x₀) telle que :","o":["f(x) ≤ f(x₀) pour tout x de I","f(x) ≥ f(x₀) pour tout x de I","f(x₀) = 0","f'(x₀) n'existe pas"],"c":0,"e":"Le maximum global est la plus grande valeur prise par f sur tout l'intervalle I."},{"q":"Une fonction paire, en termes de branches infinies et de variations, présente une courbe représentative :","o":["symétrique par rapport à l'axe des ordonnées","symétrique par rapport à l'origine","sans aucune symétrie particulière","toujours croissante"],"c":0,"e":"Une fonction paire vérifie f(−x)=f(x) pour tout x, ce qui se traduit par une symétrie de sa courbe par rapport à l'axe des ordonnées."},{"q":"L'étude complète des variations d'une fonction permet notamment de résoudre des problèmes :","o":["d'optimisation, comme la recherche d'un extremum sous contrainte","de dénombrement uniquement","de congruence uniquement","de nature purement géométrique sans calcul"],"c":0,"e":"L'étude des variations est un outil essentiel pour les problèmes d'optimisation (maximiser ou minimiser une grandeur)."}]},{"t":"Mathématiques — Fonctions ln et exp","m":"Mathématiques","f":"","g":"Janvier","q":[{"q":"La fonction dérivée de ln(x) sur ]0, +∞[ est :","o":["ln(x)","1/x","x","exp(x)"],"c":1,"e":"La dérivée de la fonction ln est 1/x, sur son ensemble de définition ]0,+∞[."},{"q":"Pour tout réel x, la dérivée de la fonction exponentielle exp(x) est :","o":["1/exp(x)","x × exp(x)","exp(x)","ln(x)"],"c":2,"e":"La fonction exponentielle est sa propre dérivée : exp'(x) = exp(x)."},{"q":"L'équation ln(x) = 0 admet pour unique solution :","o":["x = 0","x = 1","x = e","x = −1"],"c":1,"e":"ln(1) = 0, et la fonction ln étant strictement croissante, c'est l'unique solution."},{"q":"La fonction logarithme népérien, notée ln, est définie sur :","o":["]0, +∞[","R tout entier","]−∞, 0[","[0, +∞["],"c":0,"e":"La fonction ln n'est définie que pour les réels strictement positifs."},{"q":"La dérivée de la fonction ln sur ]0,+∞[ est donnée par :","o":["(ln x)' = 1/x","(ln x)' = x","(ln x)' = −1/x","(ln x)' = 1/x²"],"c":0,"e":"La fonction ln a pour dérivée x↦1/x sur son domaine de définition."},{"q":"La fonction exponentielle, notée exp, est définie sur :","o":["R tout entier, à valeurs dans ]0,+∞[","]0,+∞[ uniquement","]−∞,0[ uniquement","un ensemble borné uniquement"],"c":0,"e":"La fonction exponentielle est définie sur R tout entier et prend uniquement des valeurs strictement positives."},{"q":"La dérivée de la fonction exponentielle est remarquable car elle vérifie :","o":["(exp x)' = exp x, la fonction est sa propre dérivée","(exp x)' = 1/x","(exp x)' = x·exp x","(exp x)' = 0"],"c":0,"e":"La fonction exponentielle est l'unique fonction (à un facteur près) égale à sa propre dérivée."},{"q":"Les fonctions ln et exp sont réciproques l'une de l'autre, ce qui se traduit par la relation :","o":["exp(ln x) = x pour x>0, et ln(exp x) = x pour tout x","ln(x) = exp(x) pour tout x","exp(x) = −ln(x) pour tout x","aucune relation particulière entre ces deux fonctions"],"c":0,"e":"ln et exp sont des fonctions réciproques l'une de l'autre sur leurs domaines respectifs."},{"q":"La relation fonctionnelle caractéristique du logarithme népérien s'écrit, pour a et b strictement positifs :","o":["ln(ab) = ln(a) + ln(b)","ln(ab) = ln(a) × ln(b)","ln(a+b) = ln(a) + ln(b)","ln(ab) = ln(a) − ln(b)"],"c":0,"e":"Le logarithme transforme un produit en somme : c'est sa propriété fonctionnelle fondamentale."},{"q":"La relation fonctionnelle caractéristique de la fonction exponentielle s'écrit, pour a et b réels :","o":["exp(a+b) = exp(a) × exp(b)","exp(a+b) = exp(a) + exp(b)","exp(ab) = exp(a) × exp(b)","exp(a+b) = exp(a) − exp(b)"],"c":0,"e":"L'exponentielle transforme une somme en produit : c'est sa propriété fonctionnelle fondamentale."},{"q":"La limite de ln x lorsque x tend vers +∞ est :","o":["+∞","−∞","0","1"],"c":0,"e":"La fonction ln, bien que croissante lentement, tend vers +∞ lorsque x tend vers +∞."},{"q":"La limite de exp x lorsque x tend vers −∞ est :","o":["0","+∞","−∞","1"],"c":0,"e":"L'exponentielle tend vers 0 (sans jamais l'atteindre) lorsque x tend vers −∞."},{"q":"Les fonctions du type x↦e^(u(x)), où u est dérivable, ont pour dérivée :","o":["u'(x)·e^(u(x))","e^(u'(x))","u(x)·e^(u(x))","e^(u(x)) uniquement"],"c":0,"e":"La dérivée d'une exponentielle composée s'obtient en multipliant e^(u(x)) par la dérivée u'(x) de l'exposant."}]},{"t":"Mathématiques — Suites numériques : récurrence, monotonie, convergence","m":"Mathématiques","f":"","g":"Janvier","q":[{"q":"Le raisonnement par récurrence permet de démontrer une propriété :","o":["uniquement pour n = 0","pour tout entier n à partir d'un rang donné","uniquement pour les nombres réels","pour un seul entier n choisi"],"c":1,"e":"Le raisonnement par récurrence prouve une propriété P(n) pour tout entier n ≥ n0, à partir d'une initialisation et d'une hérédité."},{"q":"Une suite croissante et majorée est :","o":["nécessairement divergente","convergente","nécessairement constante","non définie"],"c":1,"e":"D'après le théorème de convergence monotone, toute suite croissante et majorée converge."},{"q":"Dire qu'une suite (uₙ) converge vers L signifie que :","o":["un = L pour tout n","un devient et reste aussi proche que l'on veut de L quand n → +∞","(uₙ) est bornée uniquement","(uₙ) est croissante uniquement"],"c":1,"e":"La convergence signifie que les termes de la suite se rapprochent indéfiniment de la limite L."},{"q":"Le raisonnement par récurrence permet de démontrer qu'une propriété P(n) est vraie pour tout entier n à partir d'un rang donné, en vérifiant :","o":["l'initialisation au premier rang et l'hérédité (P(n) implique P(n+1))","uniquement l'initialisation","uniquement l'hérédité","uniquement le calcul des premiers termes"],"c":0,"e":"Le principe de récurrence repose sur deux étapes indissociables : l'initialisation et l'hérédité."},{"q":"Une suite (uₙ) est dite croissante lorsque, pour tout entier n :","o":["uₙ₊₁ ≥ un","uₙ₊₁ ≤ un","uₙ₊₁ = un","uₙ₊₁ < 0"],"c":0,"e":"Une suite croissante voit chaque terme supérieur ou égal au précédent."},{"q":"Une suite (uₙ) est dite majorée lorsqu'il existe un réel M tel que :","o":["un ≤ M pour tout entier n","un ≥ M pour tout entier n","un = M pour tout entier n","la suite tend vers M"],"c":0,"e":"Une suite majorée reste toujours inférieure ou égale à une certaine valeur M, quel que soit le rang n."},{"q":"Le théorème de convergence monotone affirme qu'une suite croissante et majorée est :","o":["convergente","toujours divergente","toujours constante","toujours décroissante"],"c":0,"e":"Une suite croissante et majorée converge nécessairement vers une limite finie, qui est le plus petit majorant."},{"q":"Le théorème de convergence monotone affirme qu'une suite décroissante et minorée est :","o":["convergente","toujours divergente","toujours constante","toujours croissante"],"c":0,"e":"De façon symétrique, une suite décroissante et minorée converge vers une limite finie."},{"q":"Une suite arithmétique de raison r vérifie, pour tout entier n :","o":["uₙ₊₁ = un + r","uₙ₊₁ = un × r","uₙ₊₁ = un²","uₙ₊₁ = un/r"],"c":0,"e":"Une suite arithmétique se caractérise par un ajout constant r à chaque terme."},{"q":"Une suite géométrique de raison q vérifie, pour tout entier n :","o":["uₙ₊₁ = un × q","uₙ₊₁ = un + q","uₙ₊₁ = q/un","uₙ₊₁ = un − q"],"c":0,"e":"Une suite géométrique se caractérise par une multiplication constante par q à chaque terme."},{"q":"Une suite géométrique de raison q, avec −1 < q < 1 et q≠0, a pour limite lorsque n tend vers +∞ :","o":["0","+∞","1","q lui-même"],"c":0,"e":"Lorsque |q|<1, les puissances successives de q tendent vers 0."},{"q":"Une suite qui n'admet pas de limite finie et dont les termes ne tendent pas non plus vers l'infini est dite :","o":["divergente sans limite (oscillante, par exemple)","convergente","strictement monotone obligatoirement","constante"],"c":0,"e":"Une telle suite diverge sans tendre vers l'infini, par exemple une suite oscillante comme (−1)ⁿ."},{"q":"Le théorème des gendarmes permet de conclure à la convergence d'une suite (uₙ) vers une limite l lorsque :","o":["(uₙ) est encadrée par deux suites convergeant toutes deux vers l","(uₙ) est simplement majorée","(uₙ) est simplement minorée","(uₙ) est strictement monotone uniquement"],"c":0,"e":"Si vₙ ≤ un ≤ wn et que (vₙ) et (wₙ) convergent vers la même limite l, alors (uₙ) converge également vers l."}]},{"t":"Mathématiques — Suites récurrentes u(n+1)=f(u(n))","m":"Mathématiques","f":"","g":"Février","q":[{"q":"Pour étudier une suite définie par u(n+1) = f(u(n)), on cherche souvent en premier lieu :","o":["les points fixes de f, solutions de f(x) = x","la dérivée seconde de f","le PGCD de u₀ et u₁","la limite de f en −∞"],"c":0,"e":"Les points fixes de f sont les limites potentielles de la suite, d'où l'intérêt de les identifier en premier."},{"q":"Si f est croissante sur un intervalle stable par f, la suite (uₙ) définie par uₙ₊₁=f(uₙ) est :","o":["toujours croissante","toujours décroissante","monotone (le sens dépendant de la position de u₀)","non définie"],"c":2,"e":"Lorsque f est croissante, la suite est monotone ; son sens de variation dépend de la comparaison entre u₀ et u₁."},{"q":"Si la suite (uₙ) définie par uₙ₊₁=f(uₙ) converge vers L et que f est continue, alors L vérifie :","o":["f(L) = L","f(L) = 0","L = u₀","f(L) n'est pas défini"],"c":0,"e":"Par passage à la limite dans uₙ₊₁=f(uₙ), si (uₙ)→L et f continue, alors L = f(L)."},{"q":"Une suite récurrente définie par uₙ₊₁ = f(uₙ) nécessite, pour être entièrement déterminée, de connaître :","o":["la fonction f et le premier terme u₀","uniquement la fonction f","uniquement le premier terme u₀","uniquement la limite éventuelle"],"c":0,"e":"La donnée de f et du terme initial u₀ permet de calculer, de proche en proche, tous les termes de la suite."},{"q":"Si une suite (uₙ) définie par uₙ₊₁=f(uₙ) converge vers une limite finie l, et si f est continue en l, alors l vérifie nécessairement :","o":["f(l) = l","f(l) = 0","f(l) = u₀","l = 0"],"c":0,"e":"Par passage à la limite dans la relation de récurrence, la limite éventuelle l est un point fixe de f, donc f(l)=l."},{"q":"Pour étudier le sens de variation d'une suite uₙ₊₁=f(uₙ), une méthode courante consiste à étudier le signe de :","o":["f(x) − x sur l'intervalle considéré","f(x) uniquement","x uniquement","f'(x) uniquement, sans lien avec f(x)−x"],"c":0,"e":"Le signe de f(x)−x permet de déterminer si uₙ₊₁ est supérieur ou inférieur à un, donc le sens de variation de la suite."},{"q":"Si f est croissante sur un intervalle stable I contenant tous les termes de la suite, alors la suite (uₙ) définie par uₙ₊₁=f(uₙ) est :","o":["monotone (croissante ou décroissante selon la position de u₀ par rapport à u₁)","toujours convergente vers 0","toujours divergente","toujours constante"],"c":0,"e":"Lorsque f est croissante sur un intervalle stable, la suite garde un sens de variation constant, déterminé par la comparaison de u₀ et u₁."},{"q":"Un intervalle I est dit stable par f lorsque :","o":["f(I) est inclus dans I","f(I) est disjoint de I","I est réduit à un seul point","f(I) contient strictement I"],"c":0,"e":"La stabilité de I par f garantit que si un appartient à I, alors uₙ₊₁=f(uₙ) appartient également à I."},{"q":"Pour démontrer par récurrence qu'une suite uₙ₊₁=f(uₙ) reste dans un intervalle stable I, on vérifie que :","o":["u₀ appartient à I, et que si un appartient à I alors uₙ₊₁ appartient également à I","seulement que u₀ appartient à I","seulement que f est continue","seulement que f est croissante"],"c":0,"e":"Ce raisonnement par récurrence combine l'initialisation (u₀ dans I) et l'hérédité (stabilité de I par f)."},{"q":"Si f est décroissante sur un intervalle stable, les suites extraites (u₂ₙ) et (u₂ₙ₊₁) d'une suite uₙ₊₁=f(uₙ) sont généralement :","o":["monotones de sens contraires","toutes deux croissantes","toutes deux décroissantes","identiques"],"c":0,"e":"Lorsque f est décroissante, la composée f∘f est croissante ; les suites des termes pairs et impairs sont alors monotones, en général de sens opposés."},{"q":"La représentation graphique d'une suite uₙ₊₁=f(uₙ), utilisant la courbe de f et la droite d'équation y=x, permet notamment :","o":["de visualiser la convergence éventuelle vers un point fixe","de calculer directement une intégrale","de déterminer la parité de f","de calculer le PGCD de deux termes"],"c":0,"e":"Cette représentation en escalier ou en spirale illustre visuellement le comportement de la suite au voisinage d'un point fixe."},{"q":"Une suite uₙ₊₁=f(uₙ) majorée et croissante converge, d'après le théorème de convergence monotone, vers :","o":["une limite finie, qui est un point fixe de f (si f est continue)","toujours +∞","toujours 0","une valeur non déterminable"],"c":0,"e":"La suite étant croissante et majorée, elle converge, et sa limite est nécessairement un point fixe de f."},{"q":"Pour une suite uₙ₊₁=f(uₙ), si u₀ < u₁, et si f est croissante sur un intervalle stable contenant u₀, alors la suite est :","o":["croissante","décroissante","constante","non monotone"],"c":0,"e":"Avec f croissante, l'ordre initial entre u₀ et u₁ se conserve à chaque étape, donnant une suite croissante."},{"q":"L'étude d'une suite récurrente uₙ₊₁=f(uₙ) commence généralement par :","o":["la recherche d'un intervalle stable contenant tous les termes de la suite","le calcul direct de la limite sans autre étude","l'étude de la parité de f uniquement","le calcul du PPCM des premiers termes"],"c":0,"e":"Établir un intervalle stable est une étape méthodologique essentielle avant d'étudier monotonie et convergence."},{"q":"Dans l'étude d'une suite uₙ₊₁=f(uₙ), si l'on démontre que |uₙ₊₁ − l| ≤ k·|un − l| avec 0<k<1, on peut conclure que :","o":["la suite converge vers l","la suite diverge","la suite est constante","la suite n'est pas définie"],"c":0,"e":"Cette inégalité de contraction, itérée, montre que l'écart à l tend vers 0, donc que (uₙ) converge vers l."},{"q":"Si f est continue et que la suite uₙ₊₁=f(uₙ) est convergente, alors la limite l de la suite vérifie l'équation :","o":["f(l) = l, obtenue par passage à la limite dans la relation de récurrence","f(l) = 0 systématiquement","l = u₀","f'(l) = 0"],"c":0,"e":"Le passage à la limite dans uₙ₊₁=f(uₙ), avec f continue, donne directement l=f(l)."},{"q":"Pour une suite uₙ₊₁=f(uₙ) où f est strictement croissante et n'admet aucun point fixe sur un intervalle stable I, la suite :","o":["diverge, tendant vers une borne de I","converge nécessairement vers un point de I","est constante","oscille indéfiniment"],"c":0,"e":"En l'absence de point fixe, une suite monotone dans un intervalle stable tend, en général, vers une borne de cet intervalle."},{"q":"Étudier la suite uₙ₊₁=f(uₙ) revient souvent à combiner l'étude de la fonction f (variations, points fixes) et celle :","o":["du comportement itératif de la suite elle-même (monotonie, convergence)","uniquement de la parité de f","uniquement du PGCD des premiers termes","uniquement de la limite de f à l'infini"],"c":0,"e":"L'analyse complète articule l'étude fonctionnelle de f et l'étude spécifique du comportement de la suite qui en découle."}]},{"t":"Mathématiques — Calcul intégral et applications","m":"Mathématiques","f":"","g":"Février","q":[{"q":"L'intégrale d'une fonction f entre a et b se calcule à partir d'une primitive F par :","o":["F(a) − F(b)","F(b) − F(a)","F(a) + F(b)","F(b) × F(a)"],"c":1,"e":"∫[a,b] f(x)dx = F(b) − F(a), où F est une primitive de f."},{"q":"L'intégration par parties utilise la formule :","o":["∫u'v = uv + ∫uv'","∫u'v = uv − ∫uv'","∫u'v = u'v'","∫u'v = u + v"],"c":1,"e":"Formule d'intégration par parties : ∫u'(x)v(x)dx = [u(x)v(x)] − ∫u(x)v'(x)dx."},{"q":"L'aire sous la courbe d'une fonction f positive entre a et b est donnée par :","o":["f(b) − f(a)","f(a) + f(b)","∫[a,b] f(x)dx","f'(a)"],"c":2,"e":"Pour f positive sur [a,b], l'aire du domaine sous la courbe vaut ∫[a,b] f(x)dx."},{"q":"Pour calculer une intégrale à l'aide d'une primitive F de f, on utilise la relation :","o":["∫ₐᵇ f(x)dx = F(b) − F(a)","∫ₐᵇ f(x)dx = F(a) − F(b)","∫ₐᵇ f(x)dx = F(a) + F(b)","∫ₐᵇ f(x)dx = F(b) × F(a)"],"c":0,"e":"Le théorème fondamental de l'analyse relie l'intégrale d'une fonction à la différence des valeurs d'une primitive aux bornes."},{"q":"La méthode d'intégration par parties repose sur la formule :","o":["∫ u'v = [uv] − ∫ uv'","∫ u'v = ∫ uv'","∫ u'v = uv","∫ u'v = u'v'"],"c":0,"e":"L'intégration par parties transforme une intégrale en une autre, potentiellement plus simple à calculer."},{"q":"Le changement de variable affine, du type t=ax+b, dans un calcul d'intégrale permet notamment de :","o":["ramener l'intégrale à une forme plus simple, connue","d'annuler systématiquement l'intégrale","de transformer l'intégrale en une somme discrète","de calculer directement une limite de suite"],"c":0,"e":"Un changement de variable affine bien choisi simplifie souvent le calcul d'une intégrale en la ramenant à une forme usuelle."},{"q":"L'intégrale ∫ₐᵇ f(x)dx, lorsque f est positive sur [a,b], représente géométriquement :","o":["l'aire du domaine compris entre la courbe de f, l'axe des abscisses et les droites x=a et x=b","le périmètre de la courbe de f","la longueur de l'intervalle [a,b] uniquement","la valeur de f en un point quelconque"],"c":0,"e":"L'intégrale d'une fonction positive correspond, géométriquement, à l'aire sous la courbe entre les bornes a et b."},{"q":"Si f est négative sur [a,b], l'intégrale ∫ₐᵇ f(x)dx est :","o":["négative, et sa valeur absolue représente l'aire entre la courbe et l'axe des abscisses","toujours positive","toujours nulle","non définie"],"c":0,"e":"Une intégrale d'une fonction négative sur [a,b] est négative ; l'aire géométrique correspond à sa valeur absolue."},{"q":"L'aire comprise entre les courbes de deux fonctions f et g, avec f≥g sur [a,b], se calcule par :","o":["∫ₐᵇ (f(x) − g(x))dx","∫ₐᵇ f(x)dx uniquement","∫ₐᵇ g(x)dx uniquement","∫ₐᵇ (f(x) + g(x))dx"],"c":0,"e":"L'aire entre deux courbes s'obtient en intégrant la différence des deux fonctions, la plus grande moins la plus petite."},{"q":"La relation de Chasles pour les intégrales s'écrit, pour a, b, c réels quelconques (f intégrable) :","o":["∫ₐᵇ f(x)dx + ∫ᵇᶜ f(x)dx = ∫ₐᶜ f(x)dx","∫ₐᵇ f(x)dx × ∫ᵇᶜ f(x)dx = ∫ₐᶜ f(x)dx","∫ₐᵇ f(x)dx = ∫ᵇᶜ f(x)dx","∫ₐᵇ f(x)dx − ∫ᵇᶜ f(x)dx = 0 systématiquement"],"c":0,"e":"La relation de Chasles permet de découper le calcul d'une intégrale sur [a,c] en la somme des intégrales sur [a,b] et [b,c]."},{"q":"Une équation différentielle du type y' = ay (a réel), avec condition initiale, admet pour solution générale :","o":["y(x) = K·e^(ax), K étant déterminé par la condition initiale","y(x) = a·x + K","y(x) = K/x","y(x) = a·K"],"c":0,"e":"Les solutions de y'=ay sont de la forme y(x)=K·e^(ax), K étant fixé par la condition initiale."},{"q":"Pour résoudre une équation différentielle simple du type y' = f(x), on procède essentiellement en :","o":["recherchant une primitive de f","dérivant f une nouvelle fois","calculant la limite de f","résolvant une équation algébrique en x"],"c":0,"e":"Une équation y'=f(x) se résout directement en cherchant une primitive de f, à une constante additive près."},{"q":"Si F et G sont deux primitives d'une même fonction f sur un intervalle I, alors :","o":["F − G est une fonction constante sur I","F = G nécessairement","F et G n'ont aucun lien particulier","F × G est constante"],"c":0,"e":"Deux primitives d'une même fonction sur un intervalle diffèrent uniquement d'une constante."},{"q":"L'intégrale d'une fonction impaire sur un intervalle symétrique [−a,a] est :","o":["nulle","toujours positive","toujours négative","égale à 2a"],"c":0,"e":"Par symétrie, les contributions positives et négatives d'une fonction impaire sur [−a,a] s'annulent exactement."},{"q":"L'intégrale d'une fonction paire sur un intervalle symétrique [−a,a] vérifie :","o":["∫₋ₐᵃ f(x)dx = 2∫₀ᵃ f(x)dx","∫₋ₐᵃ f(x)dx = 0","∫₋ₐᵃ f(x)dx = ∫₀ᵃ f(x)dx","∫₋ₐᵃ f(x)dx = −2∫₀ᵃ f(x)dx"],"c":0,"e":"Par symétrie, l'intégrale d'une fonction paire sur [−a,a] est le double de celle sur [0,a]."},{"q":"La valeur moyenne d'une fonction f continue sur [a,b] est donnée par :","o":["(1/(b−a))·∫ₐᵇ f(x)dx","∫ₐᵇ f(x)dx","(b−a)·∫ₐᵇ f(x)dx","f(a) + f(b) divisé par 2 uniquement"],"c":0,"e":"La valeur moyenne d'une fonction sur un intervalle est l'intégrale de la fonction, divisée par la longueur de l'intervalle."},{"q":"Le calcul du volume d'un solide de révolution engendré par la rotation d'une courbe autour de l'axe des abscisses fait intervenir :","o":["une intégrale du carré de la fonction","une simple intégrale de la fonction","une somme discrète de valeurs de la fonction","le PGCD des bornes"],"c":0,"e":"Le volume d'un solide de révolution s'exprime par π∫ₐᵇ [f(x)]² dx."},{"q":"Pour une fonction f positive et continue sur [a,b], l'intégrale ∫ₐᵇ f(x)dx est nécessairement :","o":["positive ou nulle","négative","nulle systématiquement","indéterminée"],"c":0,"e":"L'intégrale d'une fonction positive sur un intervalle est toujours positive ou nulle."}]},{"t":"Mathématiques — Barycentre et applications affines","m":"Mathématiques","f":"","g":"Mars","q":[{"q":"Le barycentre de points pondérés est conservé par :","o":["une application affine","une application quelconque","une symétrie uniquement","aucune transformation"],"c":0,"e":"Toute application affine conserve le barycentre d'un système de points pondérés."},{"q":"L'application linéaire associée à une application affine f caractérise :","o":["uniquement le point fixe de f","la partie « vectorielle » de f, sans la translation","uniquement l'image d'un point particulier","le déterminant de f uniquement"],"c":1,"e":"Toute application affine s'écrit f(M) = f(O) + φ(OM), où φ est l'application linéaire associée."},{"q":"Le barycentre de deux points A et B affectés de coefficients égaux est :","o":["le point A","le point B","le milieu de [AB]","un point extérieur au segment [AB]"],"c":2,"e":"Avec des coefficients égaux, le barycentre de A et B coïncide avec le milieu du segment [AB]."},{"q":"Le barycentre G de deux points pondérés (A, α) et (B, β), avec α+β≠0, vérifie la relation vectorielle :","o":["α·GA + β·GB = 0","α·GA = β·GB","GA + GB = 0","α·GA − β·GB = AB"],"c":0,"e":"Par définition, le barycentre G de points pondérés vérifie la relation vectorielle α·GA + β·GB = 0 (vecteur nul)."},{"q":"Le centre de gravité (isobarycentre) d'un triangle ABC correspond au barycentre des trois sommets affectés :","o":["de coefficients tous égaux (par exemple tous égaux à 1)","de coefficients tous nuls","d'un seul coefficient non nul","de coefficients négatifs uniquement"],"c":0,"e":"L'isobarycentre attribue le même poids à chaque point, ce qui correspond, pour un triangle, à son centre de gravité."},{"q":"Une application affine du plan conserve, par définition, :","o":["le barycentre de tout système de points pondérés","uniquement les distances","uniquement les angles","aucune propriété géométrique particulière"],"c":0,"e":"Une application affine est caractérisée par la conservation du barycentre de tout système de points pondérés."},{"q":"À toute application affine f du plan est associée une application linéaire, appelée partie linéaire de f, qui agit sur :","o":["les vecteurs, indépendamment du point de départ choisi","uniquement les points fixes de f","uniquement l'origine du repère","les distances uniquement"],"c":0,"e":"La partie linéaire d'une application affine transforme les vecteurs de façon homogène, sans dépendre du point d'application."},{"q":"L'expression analytique d'une application affine du plan, dans un repère donné, s'écrit sous la forme :","o":["x' = ax+by+c, y' = dx+ey+f","x' = a/x, y' = b/y","x' = x+y, y' = x−y uniquement","x' = a, y' = b (constantes)"],"c":0,"e":"Une application affine du plan a une expression analytique linéaire en x et y, à laquelle s'ajoute une constante."},{"q":"Le barycentre d'un système de n points pondérés (Ai, αi), avec Σαi≠0, existe et est unique dès lors que :","o":["la somme des coefficients Σαi est non nulle","tous les coefficients sont positifs","tous les coefficients sont égaux","il y a au moins trois points"],"c":0,"e":"L'existence et l'unicité du barycentre reposent uniquement sur la condition Σαi≠0."},{"q":"Le barycentre d'un système de points pondérés reste inchangé si l'on multiplie tous les coefficients par :","o":["un même réel non nul","un réel différent pour chaque point","zéro","l'inverse de chaque coefficient"],"c":0,"e":"Multiplier tous les coefficients par un même réel non nul ne change pas la position du barycentre."},{"q":"L'associativité du barycentre permet de remplacer un sous-groupe de points pondérés par :","o":["leur barycentre partiel, affecté de la somme de leurs coefficients","un point quelconque du plan","l'origine du repère","aucun point, la propriété n'existe pas"],"c":0,"e":"Cette propriété fondamentale du barycentre permet de simplifier le calcul en réduisant un groupe de points à leur barycentre partiel."},{"q":"Une translation du plan est un exemple particulier d'application affine dont la partie linéaire associée est :","o":["l'application identité","une rotation d'angle quelconque","une homothétie de rapport négatif","non définie"],"c":0,"e":"Une translation conserve la direction et la norme des vecteurs : sa partie linéaire est l'identité."},{"q":"Le barycentre de trois points alignés est toujours situé :","o":["sur la même droite que ces trois points","en dehors de cette droite","au milieu exact du segment formé par deux d'entre eux uniquement","à l'infini"],"c":0,"e":"Le barycentre d'un système de points appartient toujours à toute droite (ou plan) contenant l'ensemble de ces points."}]},{"t":"Mathématiques — Isométries du plan et transformations dans l'espace","m":"Mathématiques","f":"","g":"Mars","q":[{"q":"Une isométrie du plan est une transformation qui conserve :","o":["uniquement les angles","les distances","uniquement les aires","rien de particulier"],"c":1,"e":"Par définition, une isométrie conserve les distances entre points."},{"q":"Parmi ces isométries, laquelle inverse l'orientation du plan ?","o":["la translation","la rotation","la symétrie orthogonale","l'identité"],"c":2,"e":"La symétrie orthogonale (réflexion) est une isométrie indirecte : elle inverse l'orientation, contrairement à la translation ou la rotation."},{"q":"Une homothétie de rapport k transforme un segment en un segment de longueur :","o":["inchangée","multipliée par |k|","multipliée par k²","divisée par k"],"c":1,"e":"Une homothétie de rapport k multiplie toutes les longueurs par |k|."},{"q":"Une isométrie du plan est une transformation qui conserve :","o":["les distances entre tous les points","uniquement les angles","uniquement les aires","aucune grandeur géométrique"],"c":0,"e":"Par définition, une isométrie conserve les distances : pour tous points M et N, f(M)f(N) = MN."},{"q":"Parmi les isométries du plan figurent notamment :","o":["les translations, rotations et symétries (axiales ou centrales)","uniquement les homothéties","uniquement les projections","uniquement les translations"],"c":0,"e":"Les isométries usuelles du plan regroupent translations, rotations et symétries."},{"q":"Une isométrie du plan est dite directe lorsqu'elle conserve :","o":["les angles orientés (l'orientation du plan)","uniquement les distances","les angles mais inverse l'orientation","aucune propriété angulaire"],"c":0,"e":"Les isométries directes, comme les translations et rotations, conservent l'orientation du plan, contrairement aux isométries indirectes (symétries)."},{"q":"Une symétrie axiale du plan est un exemple d'isométrie dite :","o":["indirecte, car elle inverse l'orientation du plan","directe, car elle conserve l'orientation","ni directe ni indirecte","toujours identique à une rotation"],"c":0,"e":"Une symétrie axiale inverse l'orientation des figures : c'est une isométrie indirecte."},{"q":"La composée de deux symétries axiales d'axes sécants est une :","o":["rotation dont l'angle est le double de l'angle entre les deux axes","translation","symétrie centrale uniquement","homothétie"],"c":0,"e":"La composition de deux symétries axiales d'axes sécants en un point donne une rotation de centre ce point, d'angle double de l'angle entre les axes."},{"q":"La composée de deux symétries axiales d'axes parallèles est une :","o":["translation, de vecteur perpendiculaire aux deux axes","rotation","symétrie centrale uniquement","identité"],"c":0,"e":"La composition de deux symétries d'axes parallèles donne une translation dont le vecteur est perpendiculaire aux axes."},{"q":"Dans l'espace, une translation de vecteur non nul est une transformation qui :","o":["conserve les distances et déplace tous les points selon le même vecteur","déforme les distances","ne déplace aucun point","est identique à une symétrie"],"c":0,"e":"La translation dans l'espace déplace chaque point selon un même vecteur, en conservant toutes les distances."},{"q":"Une homothétie de rapport k dans l'espace, contrairement à une isométrie, multiplie les distances par :","o":["|k|, un facteur pouvant être différent de 1","toujours exactement 1","toujours 0","un facteur imaginaire"],"c":0,"e":"Contrairement aux isométries, une homothétie de rapport k modifie les distances d'un facteur |k|, sauf si |k|=1."},{"q":"Une symétrie par rapport à un plan, dans l'espace, est une transformation qui laisse invariants :","o":["tous les points de ce plan","aucun point","uniquement l'origine du repère","tous les points de l'espace"],"c":0,"e":"Les points du plan de symétrie restent fixes par cette transformation ; les autres points sont envoyés de l'autre côté, à égale distance."},{"q":"Classifier les isométries du plan revient notamment à distinguer celles qui possèdent un point fixe unique, comme :","o":["la rotation (hors identité)","la translation de vecteur non nul","aucune transformation, toutes ont un point fixe","toutes les symétries axiales"],"c":0,"e":"Une rotation d'angle non nul possède un unique point fixe, son centre, contrairement à une translation de vecteur non nul."}]},{"t":"Mathématiques — Coniques","m":"Mathématiques","f":"","g":"Mars","q":[{"q":"Une ellipse est définie comme l'ensemble des points dont la somme des distances à deux foyers est :","o":["nulle","constante","variable","égale à la distance focale"],"c":1,"e":"L'ellipse est le lieu des points M tels que MF + MF' = constante (= 2a)."},{"q":"L'excentricité d'un cercle, cas particulier de conique, vaut :","o":["0","1","supérieure à 1","infinie"],"c":0,"e":"Le cercle correspond à une excentricité e = 0 (les deux foyers sont confondus au centre)."},{"q":"Une parabole est caractérisée par une excentricité égale à :","o":["0","1","supérieure à 1","négative"],"c":1,"e":"La parabole est la conique d'excentricité e = 1."},{"q":"Une ellipse peut être définie, par foyers, comme l'ensemble des points M du plan tels que :","o":["la somme des distances MF et MF' à deux points fixes F et F' est constante","la différence des distances MF et MF' est constante","le produit des distances MF et MF' est constant","MF = MF' uniquement"],"c":0,"e":"L'ellipse est définie comme le lieu des points dont la somme des distances à deux foyers est constante."},{"q":"Une hyperbole peut être définie, par foyers, comme l'ensemble des points M du plan tels que :","o":["la valeur absolue de la différence des distances MF et MF' à deux points fixes est constante","la somme des distances MF et MF' est constante","MF = MF' uniquement","le produit des distances MF et MF' est nul"],"c":0,"e":"L'hyperbole est définie comme le lieu des points dont la différence (en valeur absolue) des distances à deux foyers est constante."},{"q":"Une parabole peut être définie comme l'ensemble des points M du plan équidistants :","o":["d'un point fixe (le foyer) et d'une droite fixe (la directrice)","de deux points fixes","de trois points fixes","d'une droite uniquement"],"c":0,"e":"La parabole est le lieu des points équidistants d'un foyer et d'une droite directrice."},{"q":"L'équation réduite d'une ellipse centrée à l'origine, d'axes portés par les axes du repère, s'écrit sous la forme :","o":["x²/a² + y²/b² = 1","x²/a² − y²/b² = 1","y² = 2px","x² + y² = a²"],"c":0,"e":"L'équation réduite d'une ellipse, dans un repère adapté à ses axes de symétrie, s'écrit x²/a² + y²/b² = 1."},{"q":"L'équation réduite d'une hyperbole centrée à l'origine, d'axes portés par les axes du repère, s'écrit sous la forme :","o":["x²/a² − y²/b² = 1","x²/a² + y²/b² = 1","y² = 2px","x² + y² = a²"],"c":0,"e":"L'équation réduite d'une hyperbole, dans un repère adapté, s'écrit x²/a² − y²/b² = 1."},{"q":"L'équation réduite d'une parabole, de sommet à l'origine et d'axe porté par l'axe des abscisses, s'écrit sous la forme :","o":["y² = 2px","x²/a² + y²/b² = 1","x²/a² − y²/b² = 1","x² + y² = 1"],"c":0,"e":"L'équation réduite classique d'une parabole de sommet O et d'axe (Ox) est y² = 2px, p étant le paramètre de la parabole."},{"q":"L'excentricité e d'une conique permet de la classer : une ellipse correspond au cas où :","o":["0 < e < 1","e = 1","e > 1","e = 0 uniquement"],"c":0,"e":"L'excentricité caractérise le type de conique : e<1 pour une ellipse, e=1 pour une parabole, e>1 pour une hyperbole."},{"q":"L'excentricité e d'une conique permet de la classer : une parabole correspond au cas où :","o":["e = 1","0 < e < 1","e > 1","e = 0"],"c":0,"e":"Une excentricité exactement égale à 1 caractérise une parabole."},{"q":"La tangente à une conique en un point M₀ de celle-ci peut se déterminer, pour une courbe définie par une équation cartésienne, à l'aide :","o":["des dérivées partielles de l'équation au point M₀","uniquement des coordonnées du centre de la conique","uniquement du rayon de courbure","d'un calcul de barycentre"],"c":0,"e":"La tangente en un point d'une courbe algébrique s'obtient classiquement par un calcul de dérivées (ou de différentielle) de l'équation en ce point."},{"q":"Un cercle peut être considéré comme un cas particulier d'ellipse pour lequel :","o":["les deux foyers sont confondus (a = b)","les deux foyers sont très éloignés l'un de l'autre","l'excentricité vaut 1","l'excentricité est supérieure à 1"],"c":0,"e":"Lorsque les deux foyers d'une ellipse sont confondus (a=b), l'ellipse dégénère en un cercle, d'excentricité nulle."}]},{"t":"Mathématiques — Dénombrement et équiprobabilité","m":"Mathématiques","f":"","g":"Avril","q":[{"q":"Le nombre de façons de choisir k éléments parmi n, sans tenir compte de l'ordre, est donné par :","o":["n^k","n!/(n−k)!","le coefficient binomial C(n,k)","n × k"],"c":2,"e":"C(n,k) = n!/(k!(n−k)!) compte les combinaisons de k éléments parmi n."},{"q":"Dans une situation d'équiprobabilité, la probabilité d'un événement A est donnée par :","o":["card(Ω)/card(A)","card(A)/card(Ω)","card(A) + card(Ω)","card(A) − card(Ω)"],"c":1,"e":"En situation d'équiprobabilité, P(A) = card(A)/card(Ω) (nombre de cas favorables / nombre de cas possibles)."},{"q":"La formule du binôme de Newton permet de développer :","o":["(a+b)ⁿ","aⁿ + bⁿ","a × b","(a−b)"],"c":0,"e":"La formule du binôme donne le développement de (a+b)ⁿ à l'aide des coefficients binomiaux C(n,k)."},{"q":"Le nombre de permutations de n objets distincts est donné par :","o":["n! (factorielle de n)","n²","2ⁿ","n"],"c":0,"e":"Le nombre de façons d'ordonner n objets distincts est n! = n×(n−1)×...×1."},{"q":"Le nombre d'arrangements de p objets pris parmi n objets distincts (p≤n) est donné par :","o":["n!/(n−p)!","n!/p!","n!/(p!(n−p)!)","nᵖ"],"c":0,"e":"Le nombre d'arrangements, qui tient compte de l'ordre, s'exprime par n!/(n−p)!."},{"q":"Le nombre de combinaisons de p objets pris parmi n objets distincts (p≤n), noté C(n,p), est donné par :","o":["n!/(p!(n−p)!)","n!/(n−p)!","n!/p!","pⁿ"],"c":0,"e":"Une combinaison ne tient pas compte de l'ordre, contrairement à un arrangement, d'où la division supplémentaire par p!."},{"q":"La formule du binôme de Newton s'écrit, pour tout entier naturel n :","o":["(a+b)ⁿ = Σ C(n,k)·a^(n−k)·bᵏ, pour k allant de 0 à n","(a+b)ⁿ = aⁿ + bⁿ","(a+b)ⁿ = n·a·b","(a+b)ⁿ = C(n,n)·aⁿbⁿ"],"c":0,"e":"La formule du binôme développe (a+b)ⁿ à l'aide des coefficients binomiaux C(n,k)."},{"q":"Dans une situation d'équiprobabilité, la probabilité d'un événement A est donnée par :","o":["le nombre de cas favorables divisé par le nombre de cas possibles","le nombre de cas favorables uniquement","le nombre de cas possibles uniquement","la somme des cas favorables et possibles"],"c":0,"e":"En situation d'équiprobabilité, P(A) = card(A)/card(Ω), le rapport entre cas favorables et cas possibles."},{"q":"Pour deux événements A et B, la probabilité de leur réunion vérifie la formule générale :","o":["P(A∪B) = P(A) + P(B) − P(A∩B)","P(A∪B) = P(A) + P(B)","P(A∪B) = P(A) × P(B)","P(A∪B) = P(A) − P(B)"],"c":0,"e":"Cette formule évite de compter deux fois les éléments communs à A et B."},{"q":"Deux événements A et B sont dits incompatibles lorsque :","o":["A∩B = ∅ (ils ne peuvent pas se réaliser simultanément)","A∪B = Ω","P(A) = P(B)","A et B sont indépendants"],"c":0,"e":"Deux événements incompatibles n'ont aucune issue commune : leur intersection est vide."},{"q":"La probabilité de l'événement contraire de A, noté Ā, vérifie :","o":["P(Ā) = 1 − P(A)","P(Ā) = P(A)","P(Ā) = 1 + P(A)","P(Ā) = 0"],"c":0,"e":"La probabilité de l'événement contraire complète celle de A pour atteindre 1."},{"q":"Le nombre total de tirages possibles, avec remise, de p éléments parmi n, en tenant compte de l'ordre, est :","o":["nᵖ","n!/(n−p)!","C(n,p)","n×p"],"c":0,"e":"Avec remise et en tenant compte de l'ordre, chacun des p tirages offre n possibilités indépendantes, d'où nᵖ."},{"q":"Le coefficient binomial C(n,p) vérifie la relation de symétrie :","o":["C(n,p) = C(n,n−p)","C(n,p) = C(p,n)","C(n,p) = −C(n,n−p)","C(n,p) = C(n,p+1)"],"c":0,"e":"Choisir p éléments parmi n revient à en exclure n−p, d'où la symétrie C(n,p)=C(n,n−p)."},{"q":"La relation de Pascal, utilisée pour construire le triangle de Pascal, s'écrit :","o":["C(n,p) = C(n−1,p−1) + C(n−1,p)","C(n,p) = C(n−1,p) × C(n−1,p−1)","C(n,p) = C(n−1,p−1) − C(n−1,p)","C(n,p) = 2·C(n−1,p)"],"c":0,"e":"La relation de Pascal permet de calculer chaque coefficient binomial à partir de deux coefficients du rang précédent."},{"q":"Pour dénombrer le nombre de façons de répartir n objets distincts en tenant compte de l'ordre et sans répétition, on utilise :","o":["les permutations","les combinaisons uniquement","les arrangements avec répétition","aucune formule de dénombrement classique"],"c":0,"e":"Les permutations comptent précisément le nombre de façons d'ordonner tous les objets distincts d'un ensemble."},{"q":"Deux événements A et B sont dits indépendants lorsque :","o":["P(A∩B) = P(A) × P(B)","P(A∩B) = P(A) + P(B)","A∩B = ∅","P(A) = P(B)"],"c":0,"e":"L'indépendance de deux événements se traduit par la factorisation de la probabilité de leur intersection."},{"q":"La probabilité conditionnelle de A sachant B, notée P(A|B), avec P(B)≠0, se calcule par :","o":["P(A∩B)/P(B)","P(A∩B)/P(A)","P(A)×P(B)","P(A) + P(B)"],"c":0,"e":"La probabilité conditionnelle exprime la probabilité de A restreinte à l'univers réduit à B."},{"q":"Une situation de tirage simultané (sans ordre, sans remise) de p objets parmi n se dénombre à l'aide :","o":["des combinaisons C(n,p)","des arrangements","des permutations uniquement","du produit n×p"],"c":0,"e":"Un tirage simultané, où l'ordre n'a pas d'importance et sans répétition, se compte avec les combinaisons."}]},{"t":"Mathématiques — Loi binomiale","m":"Mathématiques","f":"","g":"Avril","q":[{"q":"Une variable aléatoire suit une loi binomiale B(n,p) lorsqu'elle compte :","o":["une distance parcourue","le nombre de succès dans n épreuves de Bernoulli indépendantes et identiques","une moyenne uniquement","un temps d'attente"],"c":1,"e":"La loi binomiale modélise le nombre de succès obtenus lors de n répétitions indépendantes d'une épreuve de Bernoulli de paramètre p."},{"q":"Pour une loi binomiale B(n,p), la probabilité d'obtenir exactement k succès est :","o":["p^k","C(n,k) × p^k × (1−p)^(n−k)","n × p","C(n,k) × p"],"c":1,"e":"P(X=k) = C(n,k)·p^k·(1−p)^(n−k), formule de la loi binomiale."},{"q":"L'espérance d'une variable aléatoire suivant une loi binomiale B(n,p) est égale à :","o":["p","n","n + p","n × p"],"c":3,"e":"L'espérance d'une loi binomiale B(n,p) est E(X) = n × p."},{"q":"Une épreuve de Bernoulli est une expérience aléatoire qui admet exactement :","o":["deux issues possibles : succès ou échec","trois issues possibles","une infinité d'issues","aucune issue précise"],"c":0,"e":"Par définition, une épreuve de Bernoulli ne comporte que deux issues, généralement notées succès et échec."},{"q":"Un schéma de Bernoulli correspond à la répétition de n épreuves de Bernoulli identiques et :","o":["indépendantes les unes des autres","dépendantes les unes des autres","toutes de probabilité différente","non reproductibles"],"c":0,"e":"Le schéma de Bernoulli suppose des répétitions indépendantes de la même épreuve, avec la même probabilité de succès."},{"q":"Une variable aléatoire X suit une loi binomiale de paramètres n et p lorsqu'elle compte :","o":["le nombre de succès obtenus au cours de n épreuves de Bernoulli indépendantes de paramètre p","la somme des probabilités de chaque épreuve","le nombre d'échecs uniquement, sans lien avec p","une valeur continue quelconque"],"c":0,"e":"X suit B(n,p) lorsqu'elle représente le nombre total de succès dans un schéma de Bernoulli à n répétitions de probabilité p."},{"q":"Pour une variable aléatoire X suivant une loi binomiale B(n,p), la probabilité P(X=k) est donnée par :","o":["C(n,k)·pᵏ·(1−p)^(n−k)","C(n,k)·pᵏ","p^k·(1-p)^(n-k)","n·p·k"],"c":0,"e":"La formule de la loi binomiale combine le nombre de façons d'obtenir k succès et la probabilité de chaque issue."},{"q":"L'espérance d'une variable aléatoire X suivant une loi binomiale B(n,p) est donnée par :","o":["E(X) = n·p","E(X) = p","E(X) = n","E(X) = n + p"],"c":0,"e":"L'espérance de la loi binomiale s'exprime simplement par le produit du nombre d'épreuves et de la probabilité de succès."},{"q":"La variance d'une variable aléatoire X suivant une loi binomiale B(n,p) est donnée par :","o":["V(X) = n·p·(1−p)","V(X) = n·p","V(X) = p·(1−p)","V(X) = n²·p"],"c":0,"e":"La variance de la loi binomiale s'exprime par n·p·(1−p), formule classique à connaître."},{"q":"Pour reconnaître qu'une situation concrète relève d'une loi binomiale, il faut vérifier notamment :","o":["la répétition d'épreuves identiques et indépendantes, à deux issues possibles","une seule épreuve unique et non répétée","des épreuves dépendantes les unes des autres","une infinité de résultats possibles"],"c":0,"e":"Ces conditions (répétition, indépendance, deux issues) sont caractéristiques d'un schéma binomial."},{"q":"Un exemple classique de situation modélisée par une loi binomiale est :","o":["le nombre de piles obtenus en lançant n fois une pièce équilibrée","la mesure d'une température continue","la durée de vie d'un composant électronique","le résultat d'un seul lancer de dé"],"c":0,"e":"Le lancer répété d'une pièce, indépendant à chaque fois, constitue un exemple typique de loi binomiale."},{"q":"La somme des probabilités P(X=k), pour k allant de 0 à n, d'une variable aléatoire X suivant une loi binomiale B(n,p), vaut :","o":["1","n","p","0"],"c":0,"e":"Comme pour toute loi de probabilité discrète, la somme des probabilités de toutes les issues possibles vaut 1."},{"q":"Dans un schéma de Bernoulli, si p désigne la probabilité de succès d'une épreuve, la probabilité d'échec est égale à :","o":["1 − p","p","1 + p","p²"],"c":0,"e":"Les deux issues d'une épreuve de Bernoulli étant complémentaires, la probabilité d'échec vaut 1−p."},{"q":"Pour une loi binomiale B(n,p), la probabilité d'obtenir exactement 0 succès sur n épreuves vaut :","o":["(1−p)ⁿ","pⁿ","n·(1−p)","0 systématiquement"],"c":0,"e":"P(X=0) = C(n,0)·p⁰·(1−p)ⁿ = (1−p)ⁿ, correspondant à l'échec sur toutes les épreuves."},{"q":"Pour une loi binomiale B(n,p), la probabilité d'obtenir exactement n succès sur n épreuves vaut :","o":["pⁿ","(1−p)ⁿ","n·p","1"],"c":0,"e":"P(X=n) = C(n,n)·pⁿ·(1−p)⁰ = pⁿ, correspondant au succès sur toutes les épreuves."},{"q":"L'écart-type d'une variable aléatoire suivant une loi binomiale B(n,p) est donné par :","o":["√(n·p·(1−p))","n·p·(1−p)","n·p","√p"],"c":0,"e":"L'écart-type est la racine carrée de la variance, soit √(n·p·(1−p)) pour une loi binomiale."},{"q":"Un contrôle de qualité industriel, prélevant n pièces au hasard et comptant le nombre de pièces défectueuses, se modélise généralement par :","o":["une loi binomiale, si le tirage se fait avec remise ou dans une population très grande","une loi normale exclusivement","une simple moyenne arithmétique","aucun modèle probabiliste connu"],"c":0,"e":"Ce type de contrôle qualité, sous les hypothèses adéquates, se modélise classiquement par une loi binomiale."},{"q":"Pour une loi binomiale B(n,p), lorsque n augmente fortement tout en gardant p fixé, l'espérance n·p :","o":["augmente proportionnellement à n","reste constante","diminue","devient négative"],"c":0,"e":"Comme E(X)=n·p, l'espérance croît proportionnellement au nombre d'épreuves n, à p fixé."}]},{"t":"Chimie — Dissociation de l'eau — Produit ionique","m":"Chimie","f":"","g":"Octobre","q":[{"q":"La réaction d'autoprotolyse de l'eau produit :","o":["H₂ et O₂","H₃O⁺ et OH⁻","H⁺ et O₂−","OH⁻ uniquement"],"c":1,"e":"2 H₂O ⇌ H₃O⁺ + OH⁻ : c'est la réaction d'autoprotolyse de l'eau."},{"q":"Le produit ionique de l'eau Ke est défini par :","o":["Ke = [H₃O⁺] + [OH⁻]","Ke = [H₃O⁺]·[OH⁻]","Ke = [H₃O⁺]/[OH⁻]","Ke = pH·pOH"],"c":1,"e":"Ke = [H₃O⁺]·[OH⁻], et à 25°C, Ke = 10⁻¹⁴."},{"q":"À 25°C, une solution aqueuse est basique lorsque :","o":["pH
