 {"q": "L'agriculture de subsistance est :", "o": ["une production uniquement exportée", "une production destinée surtout à nourrir la famille", "une production industrielle", "une production de luxe"], "c": 1, "e": "Elle dégage peu de surplus."}, {"q": "La faiblesse de l'industrie s'explique notamment par :", "o": ["le manque de capitaux, d'énergie et de techniciens", "un excès de capitaux", "une énergie abondante partout", "un marché saturé de produits locaux"], "c": 0, "e": "Ces facteurs freinent l'industrialisation."}, {"q": "L'insuffisance d'électricité freine surtout :", "o": ["le chant", "la distance", "la météo", "l'industrialisation et la productivité"], "c": 3, "e": "L'énergie est indispensable à l'industrie."}, {"q": "Une forte mortalité infantile traduit :", "o": ["un haut niveau de vie", "une médecine très avancée", "des conditions sanitaires et de vie insuffisantes", "une faible natalité"], "c": 2, "e": "C'est un indicateur de sous-développement."}, {"q": "L'espérance de vie à la naissance est :", "o": ["l'âge de la retraite", "le nombre moyen d'années qu'un nouveau-né peut espérer vivre", "l'âge moyen des habitants", "l'âge du mariage"], "c": 1, "e": "Elle est faible dans les pays sous-développés."}, {"q": "La famine est :", "o": ["une pénurie grave et générale d'aliments", "un excès de nourriture", "un régime volontaire", "une fête"], "c": 0, "e": "Elle diffère de la sous-nutrition chronique."}, {"q": "L'analphabétisme des adultes limite :", "o": ["le climat", "la distance", "la pluie", "la productivité et la participation au développement"], "c": 3, "e": "Le capital humain est essentiel."}]},{"t": "Économie — Préalables du développement et planification", "m": "Économie", "f": "", "g": "Décembre", "q": [{"q": "Laquelle est un préalable essentiel du développement ?", "o": ["la bonne gouvernance", "la corruption", "l'impunité", "la dépendance totale"], "c": 0, "e": "Avec l'indépendance politique et la démocratie."}, {"q": "La planification est :", "o": ["l'absence de programme", "la vente de produits", "la dette extérieure", "l'organisation des activités économiques par des objectifs et des moyens sur une période donnée"], "c": 3, "e": "Elle oriente l'économie nationale."}, {"q": "Un plan à moyen terme couvre en général :", "o": ["1 jour", "50 ans exactement", "environ 3 à 5 ans", "1 heure"], "c": 2, "e": "Exemple : les plans quinquennaux."}, {"q": "La planification impérative est :", "o": ["celle qui laisse tout au marché", "celle dont les objectifs sont obligatoires pour les agents économiques", "celle qui n'existe pas", "celle des banques"], "c": 1, "e": "Elle caractérise les économies centralisées."}, {"q": "La planification indicative :", "o": ["oriente les choix sans les imposer", "impose tout", "supprime le marché", "interdit le commerce"], "c": 0, "e": "Elle fixe des objectifs à titre d'indication."}, {"q": "La planification incitative cherche à orienter par :", "o": ["des sanctions militaires", "l'interdiction d'investir", "la fermeture des frontières", "des mesures incitatives (fiscalité, subventions, crédits)"], "c": 3, "e": "On encourage plutôt qu'on n'oblige."}, {"q": "L'indépendance politique est un préalable car elle permet :", "o": ["d'ignorer le monde", "de supprimer l'État", "de choisir ses politiques économiques", "d'éviter tout échange"], "c": 2, "e": "Sans souveraineté, pas de politique propre."}, {"q": "Les principes démocratiques favorisent le développement car ils :", "o": ["suppriment les élections", "assurent la participation et le contrôle des dirigeants", "protègent l'impunité", "imposent un parti unique"], "c": 1, "e": "Ils réduisent l'arbitraire."}, {"q": "Un plan à court terme couvre généralement :", "o": ["un an ou moins", "dix ans et plus", "un siècle", "trente ans exactement"], "c": 0, "e": "Exemple : le budget annuel."}, {"q": "Un plan à long terme couvre généralement :", "o": ["une semaine", "un mois", "un trimestre", "une dizaine d'années ou plus"], "c": 3, "e": "Il fixe de grandes orientations."}, {"q": "Un avantage de la planification est de :", "o": ["supprimer toute initiative", "augmenter le gaspillage", "fixer des priorités et coordonner l'usage des ressources", "interdire l'épargne"], "c": 2, "e": "Elle donne de la cohérence à l'action."}, {"q": "La planification impérative est surtout pratiquée dans :", "o": ["les économies libérales uniquement", "les économies centralisées", "les économies sans État", "les pays sans plan"], "c": 1, "e": "Les objectifs y sont obligatoires."}, {"q": "Pour qu'un plan réussisse, il faut :", "o": ["des objectifs réalistes, des ressources et un suivi", "aucun suivi", "des objectifs irréalisables", "aucune ressource"], "c": 0, "e": "Évaluation et contrôle sont nécessaires."}]},{"t": "Économie — Mobilisation des ressources et coopération économique", "m": "Économie", "f": "", "g": "Décembre", "q": [{"q": "L'effort national suppose de mobiliser :", "o": ["uniquement l'aide étrangère", "les ressources humaines, matérielles et financières", "uniquement l'armée", "uniquement le pétrole"], "c": 1, "e": "Le développement repose d'abord sur les ressources internes."}, {"q": "La gestion rationnelle des ressources exige :", "o": ["un usage efficace et une répartition équitable", "le gaspillage", "la concentration entre quelques mains", "l'absence de contrôle"], "c": 0, "e": "Elle limite le gaspillage et les inégalités."}, {"q": "La coopération économique internationale est :", "o": ["une guerre commerciale", "un conflit armé", "une dette privée", "l'ensemble des relations d'entraide et d'échanges entre États ou organisations"], "c": 3, "e": "Elle vise un avantage mutuel."}, {"q": "Une coopération bilatérale associe :", "o": ["tous les États du monde obligatoirement", "plusieurs continents seulement", "deux États", "des entreprises privées seulement"], "c": 2, "e": "Exemple : accord entre la Guinée et un autre pays."}, {"q": "Une coopération multilatérale associe :", "o": ["un seul État", "plusieurs États ou organisations", "deux ménages", "un seul entrepreneur"], "c": 1, "e": "Exemple : coopération au sein de la CEDEAO."}, {"q": "La coopération est importante car elle :", "o": ["facilite le financement, le transfert de technologie et les échanges", "augmente l'isolement", "supprime les échanges", "bloque la production"], "c": 0, "e": "Elle peut accélérer le développement."}, {"q": "Les ressources humaines d'un pays sont :", "o": ["ses minerais", "ses rivières", "son capital financier", "sa population active et ses compétences"], "c": 3, "e": "Elles sont le premier moteur du développement."}, {"q": "Les ressources financières internes proviennent notamment :", "o": ["de la dette seulement", "du ciel", "de l'épargne et des impôts", "de la chance"], "c": 2, "e": "Elles financent l'investissement national."}, {"q": "La répartition équitable des ressources vise à :", "o": ["enrichir quelques-uns", "réduire les inégalités et partager les fruits de la croissance", "augmenter la pauvreté", "supprimer l'État"], "c": 1, "e": "Elle favorise la cohésion sociale."}, {"q": "« Compter sur ses propres forces » signifie :", "o": ["privilégier la mobilisation des ressources internes, l'aide extérieure restant complémentaire", "refuser toute aide", "ne rien produire", "fermer les frontières"], "c": 0, "e": "L'effort national passe en premier."}, {"q": "La CEDEAO est un exemple de coopération :", "o": ["bilatérale", "individuelle", "privée", "multilatérale"], "c": 3, "e": "Elle associe plusieurs États."}, {"q": "Un accord entre la Guinée et un seul autre pays est :", "o": ["multilatérale", "universelle", "une coopération bilatérale", "interne"], "c": 2, "e": "Deux partenaires seulement."}, {"q": "Une forme de coopération économique est :", "o": ["la guerre", "l'aide au développement et le transfert de technologie", "l'embargo total", "la contrebande"], "c": 1, "e": "La coopération repose sur l'intérêt mutuel."}]},{"t": "Économie — L'intégration économique", "m": "Économie", "f": "", "g": "Janvier", "q": [{"q": "L'intégration économique est :", "o": ["la fermeture des frontières", "un conflit commercial", "le processus par lequel des États suppriment des barrières pour former un espace économique plus large", "une dette"], "c": 2, "e": "Elle va de la zone de libre échange à l'union."}, {"q": "Dans une zone de libre échange, les États membres :", "o": ["adoptent un tarif extérieur commun", "suppriment les droits de douane entre eux mais gardent leurs tarifs envers les tiers", "fusionnent leurs États", "suppriment toute production"], "c": 1, "e": "L'union douanière ajoute un tarif extérieur commun."}, {"q": "Une union douanière comprend :", "o": ["le libre échange interne et un tarif extérieur commun", "aucune douane", "une seule armée", "des prix imposés"], "c": 0, "e": "Exemple : UEMOA, avec un tarif extérieur commun."}, {"q": "Une zone de préférence douanière accorde :", "o": ["une suppression totale des frontières", "un tarif commun uniforme", "l'interdiction d'échanger", "des avantages tarifaires réciproques entre membres"], "c": 3, "e": "C'est la forme la plus légère."}, {"q": "Un objectif de l'intégration est la recherche :", "o": ["de la hausse du chômage", "de l'isolement", "des économies d'échelle", "de la dette"], "c": 2, "e": "Un marché plus vaste permet de produire à moindre coût."}, {"q": "Un problème lié à l'intégration est :", "o": ["l'excès de recettes douanières", "la perte de recettes douanières", "l'absence de tout échange", "la baisse de la concurrence"], "c": 1, "e": "Il faut aussi gérer le développement inégal et les paiements."}, {"q": "L'intégration par la production consiste à :", "o": ["coordonner ou harmoniser les productions entre pays membres", "supprimer toute production", "interdire l'industrie", "fermer les usines"], "c": 0, "e": "Elle complète l'intégration par les marchés."}, {"q": "Une économie d'échelle est :", "o": ["une hausse du coût unitaire", "une taxe", "un type de monnaie", "la baisse du coût unitaire quand la production augmente"], "c": 3, "e": "Un grand marché permet de produire en grande série."}, {"q": "Le développement économique inégal signifie que :", "o": ["tous sont égaux", "personne ne profite", "certains pays membres profitent davantage de l'intégration", "il n'y a pas de commerce"], "c": 2, "e": "Il faut prévoir des mécanismes de compensation."}, {"q": "La suppression des droits de douane entre membres réduit :", "o": ["les importations de tous", "les recettes douanières de ces États", "le commerce entre membres", "les échanges"], "c": 1, "e": "D'où un problème financier pour les budgets."}, {"q": "Avec une monnaie identique, les paiements entre pays membres sont :", "o": ["simplifiés (sans opération de change)", "impossibles", "plus coûteux", "interdits"], "c": 0, "e": "Cas de la zone franc ou de l'euro."}, {"q": "Avec des monnaies différentes, un problème est :", "o": ["l'absence de prix", "la disparition des frontières", "l'égalité automatique", "le taux de change et la convertibilité"], "c": 3, "e": "Les paiements sont plus complexes."}, {"q": "L'union douanière se distingue de la zone de libre échange par :", "o": ["l'absence de commerce", "la monnaie unique obligatoire", "le tarif extérieur commun", "l'absence de membres"], "c": 2, "e": "Les membres appliquent les mêmes droits de douane aux tiers."}]},{"t": "Économie — La CEDEAO et le NEPAD", "m": "Économie", "f": "", "g": "Janvier", "q": [{"q": "La CEDEAO a été créée en :", "o": ["1945", "1999", "2020", "1975 (traité de Lagos)"], "c": 3, "e": "Communauté économique des États de l'Afrique de l'Ouest."}, {"q": "Le siège de la CEDEAO est à :", "o": ["Conakry", "Dakar", "Abuja (Nigeria)", "Paris"], "c": 2, "e": "La Commission siège à Abuja."}, {"q": "L'objectif principal de la CEDEAO est :", "o": ["de financer la Banque mondiale", "de promouvoir l'intégration économique de l'Afrique de l'Ouest", "d'organiser les Jeux olympiques", "de produire du pétrole"], "c": 1, "e": "Elle vise aussi la libre circulation des personnes et des biens."}, {"q": "Un problème posé à la CEDEAO est :", "o": ["la faible complémentarité des économies et l'insuffisance des infrastructures", "l'excès d'unité parfaite", "l'absence de frontières naturelles", "l'excès d'infrastructures"], "c": 0, "e": "S'y ajoutent les crises politiques et les barrières non tarifaires."}, {"q": "Le NEPAD est :", "o": ["une banque", "un traité de paix", "une entreprise privée", "le Nouveau Partenariat pour le Développement de l'Afrique"], "c": 3, "e": "Il a été adopté en 2001 par l'Union africaine."}, {"q": "Le NEPAD vise notamment :", "o": ["à augmenter la dette", "à fermer l'Afrique au monde", "à réduire la pauvreté et à promouvoir une croissance durable en Afrique", "à supprimer l'agriculture"], "c": 2, "e": "Il insiste sur la bonne gouvernance et le partenariat."}, {"q": "Un organe de la CEDEAO est :", "o": ["le Conseil de sécurité de l'ONU", "la Conférence des chefs d'État et de gouvernement", "le Conseil de l'OTAN", "la Cour pénale internationale"], "c": 1, "e": "C'est l'organe suprême."}, {"q": "La CEDEAO vise aussi :", "o": ["la libre circulation des personnes et des biens dans la région", "l'interdiction des échanges", "la fermeture des frontières", "la suppression des États"], "c": 0, "e": "Principe du protocole de 1979."}, {"q": "L'ECOMOG est :", "o": ["une banque", "une monnaie", "un parti politique", "une force d'intervention militaire ouest-africaine de la CEDEAO"], "c": 3, "e": "Elle est intervenue au Liberia, en Sierra Leone, etc."}, {"q": "Un obstacle à l'intégration en Afrique de l'Ouest est :", "o": ["l'excès de routes", "l'absence de commerce naturel", "la faiblesse des infrastructures de transport", "l'unité linguistique parfaite"], "c": 2, "e": "S'ajoutent les barrières non tarifaires."}, {"q": "Le NEPAD a été adopté sous l'égide :", "o": ["de l'OPEP", "de l'OUA, devenue Union africaine", "de l'OMC", "du FMI"], "c": 1, "e": "Initiative africaine de 2001."}, {"q": "Parmi les priorités du NEPAD, on trouve :", "o": ["les infrastructures, l'agriculture et l'éducation", "la fermeture du marché", "le monopole d'État", "la suppression de l'école"], "c": 0, "e": "Il vise un développement durable."}, {"q": "Un avantage du NEPAD est :", "o": ["l'arrêt des projets", "la hausse obligatoire de la dette", "l'isolement", "la mobilisation de partenaires et de financements pour des projets africains"], "c": 3, "e": "Il repose sur un partenariat."}]},{"t": "Économie — La BAD et le FMI", "m": "Économie", "f": "", "g": "Mars", "q": [{"q": "La BAD est :", "o": ["la Banque africaine de développement", "la Banque asiatique de dépôt", "la Banque américaine de dette", "la Banque arabe de droit"], "c": 0, "e": "Elle finance le développement économique des pays africains."}, {"q": "Le siège de la BAD est à :", "o": ["Genève", "Washington", "Londres", "Abidjan (Côte d'Ivoire)"], "c": 3, "e": "Elle a été créée en 1964."}, {"q": "La BAD a pour fonction principale :", "o": ["de fixer les prix du pétrole", "de réprimer la fraude", "de financer des projets de développement par des prêts et des dons", "d'organiser les élections"], "c": 2, "e": "Elle soutient infrastructures, agriculture, énergie et éducation."}, {"q": "Le FMI est :", "o": ["la Fédération mondiale des industries", "le Fonds monétaire international", "le Fonds mondial d'investissement", "le Forum minier international"], "c": 1, "e": "Il date de Bretton Woods (1944)."}, {"q": "Le siège du FMI est à :", "o": ["Washington", "Genève", "Abuja", "Dakar"], "c": 0, "e": "Il compte aujourd'hui près de 190 pays membres."}, {"q": "Parmi ses rôles, le FMI assure :", "o": ["la production de pétrole", "la vente de produits agricoles", "l'éducation primaire", "la surveillance monétaire et l'assistance financière aux États en difficulté de paiement"], "c": 3, "e": "Ses prêts sont souvent assortis de conditions."}, {"q": "Les membres de la BAD sont :", "o": ["uniquement des entreprises", "uniquement des banques privées", "des pays africains et des pays non africains", "aucun État"], "c": 2, "e": "Il y a des membres régionaux et non régionaux."}, {"q": "Le FMI est issu de :", "o": ["la conférence de Berlin", "la conférence de Bretton Woods (1944)", "le traité de Lagos", "la conférence de Bandung"], "c": 1, "e": "Il a été fondé pour stabiliser le système monétaire."}, {"q": "La « police monétaire » du FMI consiste à :", "o": ["surveiller le respect des règles de bonne conduite en matière de change et de monnaie", "arrêter les voleurs", "imprimer la monnaie", "fixer les salaires"], "c": 0, "e": "C'est sa fonction de surveillance."}, {"q": "L'assistance monétaire du FMI consiste à :", "o": ["offrir des dons à tous", "fixer le prix du pétrole", "gérer les écoles", "aider les États en déséquilibre de balance des paiements"], "c": 3, "e": "Il prête en cas de difficulté de paiement."}, {"q": "La balance des paiements est :", "o": ["un instrument de pesage", "un budget local", "le relevé des échanges économiques et financiers d'un pays avec l'étranger", "un impôt"], "c": 2, "e": "Elle enregistre entrées et sorties de devises."}, {"q": "Les prêts du FMI sont souvent assortis :", "o": ["d'aucune condition", "de conditions (programmes d'ajustement)", "de dons obligatoires", "de gratuité totale"], "c": 1, "e": "C'est la conditionnalité."}, {"q": "La BAD finance par exemple :", "o": ["des routes, des barrages et des projets agricoles", "des armes", "des campagnes électorales", "des loteries"], "c": 0, "e": "Elle soutient les infrastructures."}]},{"t": "Économie — La Banque mondiale, l'OMC et la CNUCED", "m": "Économie", "f": "", "g": "Mars", "q": [{"q": "Parmi ces institutions, laquelle est une filiale de la Banque mondiale ?", "o": ["l'OPEP", "l'IDA (Association internationale de développement)", "l'OMC", "la CEDEAO"], "c": 1, "e": "Autres filiales : SFI, AMGI, CIRDI."}, {"q": "La Banque mondiale a pour fonction principale :", "o": ["de financer des projets de développement et de lutter contre la pauvreté", "de fixer les taux de change quotidiens", "de réglementer le commerce", "de vendre du pétrole"], "c": 0, "e": "Son siège est à Washington."}, {"q": "L'OMC a été créée en :", "o": ["1944", "1960", "2010", "1995"], "c": 3, "e": "Elle a succédé au GATT et siège à Genève."}, {"q": "Le principe de non-discrimination de l'OMC signifie que :", "o": ["les pays riches sont avantagés", "les importations sont interdites", "les partenaires commerciaux doivent être traités de manière égale", "les prix sont fixés par l'État"], "c": 2, "e": "Il repose notamment sur la clause de la nation la plus favorisée."}, {"q": "Le dumping est :", "o": ["la hausse des droits de douane", "la vente à l'étranger à un prix anormalement bas", "un dépôt de fonds", "une taxe"], "c": 1, "e": "Il est interdit par l'OMC quand il fausse la concurrence."}, {"q": "La CNUCED a pour rôle essentiel :", "o": ["de favoriser le commerce et le développement des pays en développement", "de prêter de l'argent aux entreprises privées", "de réprimer le dumping", "d'imprimer les monnaies"], "c": 0, "e": "Elle a été créée en 1964 et siège à Genève."}, {"q": "La BIRD est :", "o": ["la Banque internationale des revenus et de la dette", "le Bureau international de la recherche et du développement", "la Banque ivoirienne de répartition des devises", "la Banque internationale pour la reconstruction et le développement"], "c": 3, "e": "C'est l'institution principale du groupe Banque mondiale."}, {"q": "L'IDA accorde surtout :", "o": ["des prêts à taux record aux pays riches", "des dons militaires", "des prêts très avantageux aux pays les plus pauvres", "des licences commerciales"], "c": 2, "e": "Association internationale de développement."}, {"q": "La SFI finance :", "o": ["l'armée", "le secteur privé dans les pays en développement", "uniquement les administrations", "les églises"], "c": 1, "e": "Société financière internationale."}, {"q": "L'OMC règle aussi :", "o": ["les différends commerciaux entre États membres", "les différends familiaux", "les élections", "les guerres"], "c": 0, "e": "Elle dispose d'un organe de règlement des différends."}, {"q": "Quel organisme a précédé l'OMC ?", "o": ["l'OPEP", "la CNUCED", "le FMI", "le GATT"], "c": 3, "e": "Accord général sur les tarifs douaniers et le commerce (1947)."}, {"q": "L'abaissement des droits de douane vise à :", "o": ["les freiner", "les interdire", "faciliter les échanges internationaux", "les taxer davantage"], "c": 2, "e": "Il est négocié par cycles."}, {"q": "La CNUCED relève :", "o": ["de l'OPEP", "des Nations Unies", "de la CEDEAO", "du FMI"], "c": 1, "e": "Elle a été créée en 1964."}]},{"t": "Économie — L'endettement des pays sous-développés", "m": "Économie", "f": "", "g": "Avril", "q": [{"q": "La dette est :", "o": ["un don gratuit", "une recette fiscale", "une somme due à un créancier avec obligation de remboursement", "un salaire"], "c": 2, "e": "Elle comprend le capital et les intérêts."}, {"q": "La dette publique multilatérale est due :", "o": ["à un seul État étranger", "à des institutions internationales (FMI, Banque mondiale, BAD)", "à des particuliers", "à des entreprises locales"], "c": 1, "e": "La bilatérale est due à un autre État."}, {"q": "La dette privée peut être :", "o": ["interne ou externe", "seulement bilatérale", "seulement multilatérale", "inexistante"], "c": 0, "e": "Elle est due par ou à des agents privés."}, {"q": "Un avantage de la dette est qu'elle peut :", "o": ["supprimer toute dépense", "rendre inutile l'épargne", "réduire toujours les impôts", "financer des investissements productifs"], "c": 3, "e": "À condition d'être bien utilisée."}, {"q": "Un inconvénient majeur de la dette est :", "o": ["le gain de ressources gratuit", "la baisse des intérêts", "le poids du service de la dette (capital et intérêts)", "la disparition du déficit"], "c": 2, "e": "Il réduit les ressources disponibles pour le développement."}, {"q": "L'initiative PPTE a pour but :", "o": ["d'augmenter les prêts à taux élevé", "d'alléger la dette des pays pauvres très endettés", "de supprimer la Banque mondiale", "d'interdire l'emprunt"], "c": 1, "e": "Elle a été lancée en 1996 par le FMI et la Banque mondiale."}, {"q": "Le service de la dette comprend :", "o": ["le remboursement du capital et le paiement des intérêts", "uniquement les intérêts", "uniquement le capital", "les impôts"], "c": 0, "e": "Il pèse sur les budgets des pays endettés."}, {"q": "Le Club de Paris regroupe :", "o": ["des banques privées", "des entreprises", "des syndicats", "des États créanciers qui renégocient la dette publique des pays débiteurs"], "c": 3, "e": "Il traite la dette bilatérale."}, {"q": "Un rééchelonnement de dette consiste à :", "o": ["supprimer tout paiement", "augmenter la dette", "modifier le calendrier de remboursement", "emprunter sans limite"], "c": 2, "e": "La dette n'est pas effacée."}, {"q": "L'annulation de la dette consiste à :", "o": ["doubler la dette", "effacer tout ou partie de ce qui est dû", "emprunter plus", "payer d'avance"], "c": 1, "e": "Elle libère des ressources pour le développement."}, {"q": "Une dette est dite extérieure lorsqu'elle est due :", "o": ["à des créanciers étrangers", "à des créanciers nationaux", "à soi-même", "à personne"], "c": 0, "e": "Elle se rembourse souvent en devises."}, {"q": "Une dette est dite bilatérale lorsqu'elle est due :", "o": ["à une institution multilatérale", "aux citoyens", "à un syndicat", "à un autre État"], "c": 3, "e": "Exemple : prêt d'un État à un autre."}, {"q": "Le surendettement signifie :", "o": ["l'absence de dette", "une dette très faible", "l'impossibilité de faire face normalement à ses dettes", "un excédent budgétaire"], "c": 2, "e": "Il conduit à des renégociations."}]},{"t": "Économie — La pauvreté dans les pays sous-développés", "m": "Économie", "f": "", "g": "Avril", "q": [{"q": "La pauvreté est :", "o": ["l'abondance de ressources", "un revenu très élevé", "une situation transitoire de vacances", "une situation de privation qui empêche de satisfaire les besoins essentiels"], "c": 3, "e": "Elle touche la nourriture, la santé, l'éducation, le logement."}, {"q": "Une cause interne de la pauvreté est :", "o": ["la détérioration des termes de l'échange", "le poids de la dette extérieure imposée", "la mauvaise gouvernance", "la volatilité des prix mondiaux"], "c": 2, "e": "Les trois dernières relèvent plutôt de causes externes."}, {"q": "Une cause externe de la pauvreté est :", "o": ["la corruption nationale", "les échanges internationaux défavorables", "l'analphabétisme local", "l'impunité locale"], "c": 1, "e": "Prix des matières premières, dette, dépendance."}, {"q": "Une conséquence de la pauvreté est :", "o": ["la faim, les maladies et l'exode rural", "l'amélioration de la santé", "la baisse de la mortalité infantile", "la scolarisation totale"], "c": 0, "e": "Elle alimente aussi l'insécurité et les migrations."}, {"q": "Un moyen de lutte contre la pauvreté est :", "o": ["l'augmentation de la corruption", "la baisse des investissements", "la fermeture des écoles", "l'éducation, la santé et la création d'emplois"], "c": 3, "e": "Les stratégies de réduction de la pauvreté combinent plusieurs politiques."}, {"q": "Une stratégie de réduction de la pauvreté dans le domaine politique est :", "o": ["la hausse du chômage", "l'instabilité", "la bonne gouvernance et la lutte contre la corruption", "l'impunité"], "c": 2, "e": "Elle crée les conditions de la croissance."}, {"q": "Le seuil de pauvreté est :", "o": ["un plafond de richesse", "un niveau de revenu ou de consommation en dessous duquel on est considéré comme pauvre", "un impôt", "un salaire maximal"], "c": 1, "e": "Il varie selon les pays."}, {"q": "La pauvreté absolue est :", "o": ["l'impossibilité de satisfaire les besoins essentiels", "un revenu inférieur à la moyenne", "un excès d'argent", "une inégalité sans manque"], "c": 0, "e": "Elle se distingue de la pauvreté relative."}, {"q": "L'exode rural est :", "o": ["le retour vers les campagnes", "un voyage touristique", "un impôt", "le départ des populations rurales vers les villes"], "c": 3, "e": "Il est lié à la pauvreté des campagnes."}, {"q": "Une forte croissance démographique peut aggraver la pauvreté car :", "o": ["les ressources explosent", "les besoins disparaissent", "les ressources augmentent moins vite que les besoins", "les prix sont fixes"], "c": 2, "e": "Il faut des politiques de population."}, {"q": "Le microcrédit permet :", "o": ["de financer les grandes banques", "de financer de petites activités des populations pauvres", "de supprimer les impôts", "d'acheter des armes"], "c": 1, "e": "Il soutient l'auto-emploi."}, {"q": "L'accès à l'eau potable et à la santé relève surtout des mesures :", "o": ["socio-culturelles", "militaires", "monétaires uniquement", "judiciaires uniquement"], "c": 0, "e": "Elles améliorent le capital humain."}, {"q": "Le DSRP est :", "o": ["le diplôme supérieur de recherche publique", "un traité commercial", "un impôt", "le document de stratégie de réduction de la pauvreté"], "c": 3, "e": "Il oriente les politiques nationales."}]},{"t": "Économie — Le chômage dans les pays sous-développés", "m": "Économie", "f": "", "g": "Avril", "q": [{"q": "Le chômeur est une personne :", "o": ["en âge et en capacité de travailler, qui cherche un emploi sans en trouver", "retraitée", "qui refuse tout travail", "qui travaille à plein temps"], "c": 0, "e": "Le chômage mesure le manque d'emplois."}, {"q": "Le chômage déguisé est :", "o": ["une absence totale d'activité", "un congé payé", "une grève", "une situation où des personnes occupées ont une productivité très faible, voire nulle"], "c": 3, "e": "Il est fréquent dans l'agriculture familiale."}, {"q": "Le chômage saisonnier est lié :", "o": ["à l'automatisation", "au changement d'emploi", "aux rythmes de certaines activités (cultures, tourisme)", "à la retraite"], "c": 2, "e": "Il disparaît avec la reprise de l'activité."}, {"q": "Le chômage technologique résulte :", "o": ["de la hausse des salaires seulement", "du remplacement de travailleurs par des machines", "de la baisse des impôts", "d'une grève"], "c": 1, "e": "Le progrès technique supprime certains emplois."}, {"q": "Le chômage frictionnel correspond :", "o": ["à la période de transition entre deux emplois", "au chômage permanent", "au travail à temps plein", "à la retraite"], "c": 0, "e": "Il est normal dans toute économie."}, {"q": "Un moyen de lutte contre le chômage est :", "o": ["la fermeture des entreprises", "la baisse de l'investissement", "la suppression des écoles", "l'ajustement de l'offre et de la demande de travail (formation, création d'emplois)"], "c": 3, "e": "L'objectif est le plein emploi."}, {"q": "Le chômage partiel (sous-emploi) correspond à :", "o": ["une absence totale d'emploi", "un emploi à plein temps", "un travail inférieur à la durée souhaitée ou normale", "une retraite"], "c": 2, "e": "Il est fréquent dans le secteur informel."}, {"q": "Le chômage total est :", "o": ["un temps partiel", "l'absence complète d'emploi chez une personne qui en cherche", "un congé", "un emploi saisonnier"], "c": 1, "e": "C'est la forme la plus visible."}, {"q": "Une conséquence humaine du chômage est :", "o": ["la pauvreté, l'exclusion et parfois la délinquance", "le bien-être général", "l'enrichissement", "la réussite sociale"], "c": 0, "e": "Le chômage fragilise les familles."}, {"q": "Une conséquence économique du chômage est :", "o": ["la hausse de la production", "la baisse des dépenses sociales", "l'excès de recettes", "la perte de production et la baisse des recettes fiscales"], "c": 3, "e": "Les forces productives sont inutilisées."}, {"q": "Le plein emploi désigne :", "o": ["l'absence totale de travail", "le temps partiel général", "une situation où presque toutes les personnes qui veulent travailler ont un emploi", "le chômage de masse"], "c": 2, "e": "C'est un objectif de politique économique."}, {"q": "Le chômage des jeunes diplômés s'explique notamment par :", "o": ["un excès d'emplois", "l'inadéquation entre formations et besoins du marché du travail", "l'absence de diplômes", "la gratuité des études"], "c": 1, "e": "Il faut mieux relier formation et emploi."}, {"q": "La formation professionnelle aide à lutter contre le chômage car elle :", "o": ["adapte les compétences aux emplois disponibles", "supprime les emplois", "augmente l'analphabétisme", "ferme les entreprises"], "c": 0, "e": "Elle améliore l'employabilité."}]},{"t": "Français — Littérature africaine : thèmes et courants", "m": "Français", "f": "", "g": "Octobre", "q": [{"q": "La négritude est un mouvement littéraire qui :", "o": ["défend la colonisation", "affirme la valeur des cultures et de l'identité noires", "rejette toute culture africaine", "est né en Russie"], "c": 1, "e": "Lancé dans les années 1930 par Senghor, Césaire et Damas."}, {"q": "Quels écrivains sont les fondateurs de la négritude ?", "o": ["Senghor, Césaire et Damas", "Camus, Sartre et Malraux", "Apollinaire, Aragon et Éluard", "Kourouma, Mongo Béti et Hampaté Bâ"], "c": 0, "e": "Étudiants noirs à Paris, ils ont lancé le mouvement."}, {"q": "Un griot est :", "o": ["un chef militaire", "un médecin", "un commerçant", "un dépositaire de la tradition orale (histoire, généalogies, contes)"], "c": 3, "e": "Il transmet la mémoire des peuples."}, {"q": "Le thème de « l'Afrique des indépendances » exprime souvent :", "o": ["la joie permanente", "l'absence de politique", "l'espoir puis la désillusion après les indépendances", "le retour de la colonie"], "c": 2, "e": "Beaucoup d'œuvres dénoncent les dérives du pouvoir."}, {"q": "Une œuvre sur la mondialisation et l'intégration des cultures traite surtout :", "o": ["de l'isolement total", "de la rencontre et de la confrontation des cultures", "du refus de tout échange", "de la seule agriculture"], "c": 1, "e": "Elle interroge l'identité face au monde."}, {"q": "La revue Présence africaine a été fondée à Paris en 1947 par :", "o": ["Alioune Diop", "Albert Camus", "André Malraux", "Paul Éluard"], "c": 0, "e": "Elle a diffusé les écrivains africains."}, {"q": "Un écrivain engagé est un écrivain qui :", "o": ["écrit sans idée", "refuse de publier", "ne s'intéresse à rien", "met sa plume au service d'une cause (justice, liberté, dénonciation)"], "c": 3, "e": "L'engagement lie littérature et société."}, {"q": "Kourouma introduit dans son français :", "o": ["uniquement du latin", "uniquement de l'anglais", "des tournures de la langue malinké", "aucun mot africain"], "c": 2, "e": "Il « africanise » la langue française."}, {"q": "La littérature africaine d'expression française est née notamment de :", "o": ["l'invention de l'imprimerie", "l'exil des Russes", "la rencontre entre la colonisation, l'école française et la tradition orale", "la Renaissance italienne"], "c": 2, "e": "Elle puise dans l'oralité tout en utilisant le français."}, {"q": "La littérature orale africaine comprend :", "o": ["uniquement des romans", "contes, proverbes, épopées et devinettes", "uniquement des pièces de théâtre", "uniquement des lois"], "c": 1, "e": "Elle est transmise de bouche à oreille."}, {"q": "Le désenchantement après les indépendances est dénoncé par :", "o": ["Kourouma dans Les Soleils des indépendances", "Apollinaire", "Éluard", "Camus dans La Peste"], "c": 0, "e": "Le roman montre les désillusions du nouveau pouvoir."}, {"q": "L'épopée de Soundjata Keïta est liée :", "o": ["à l'empire romain", "à la Chine", "à la Russie", "à l'empire du Mali"], "c": 3, "e": "Elle est transmise par les griots."}, {"q": "Le thème de la mondialisation interroge notamment :", "o": ["le refus de tout échange", "la seule technique", "l'équilibre entre ouverture au monde et fidélité aux valeurs africaines", "la météo"], "c": 2, "e": "Il pose la question de l'identité culturelle."}]},{"t": "Français — Poésie africaine : Senghor, Césaire, Diop, Damas", "m": "Français", "f": "", "g": "Novembre", "q": [{"q": "Léopold Sédar Senghor fut :", "o": ["explorateur belge", "romancier russe", "poète et premier président du Sénégal", "dramaturge anglais"], "c": 2, "e": "Il fut aussi membre de l'Académie française (1983)."}, {"q": "Quel recueil est de Senghor ?", "o": ["Pigments", "Chants d'ombre", "Coups de pilon", "Cahier d'un retour au pays natal"], "c": 1, "e": "Il a aussi écrit Hosties noires et Éthiopiques."}, {"q": "Le Cahier d'un retour au pays natal est un poème d'Aimé Césaire, écrivain :", "o": ["martiniquais", "sénégalais", "camerounais", "guinéen"], "c": 0, "e": "Publié en 1939."}, {"q": "Coups de pilon est un recueil de :", "o": ["Léon-Gontran Damas", "Léopold Senghor", "Aimé Césaire", "David Diop"], "c": 3, "e": "Publié en 1956 ; l'auteur est mort en 1960."}, {"q": "Pigments (1937) est l'œuvre de :", "o": ["Senghor", "David Diop", "Léon-Gontran Damas", "Mongo Béti"], "c": 2, "e": "Poète guyanais, cofondateur de la négritude."}, {"q": "Le titre « Coups de pilon » évoque :", "o": ["la musique classique européenne", "le geste du pilage et le rythme de la révolte et de l'espoir africains", "le jeu d'échecs", "l'astronomie"], "c": 1, "e": "C'est une image tirée de la vie quotidienne africaine."}, {"q": "Les poèmes de Diop dénoncent surtout :", "o": ["la colonisation et l'oppression, et chantent l'espoir africain", "le pouvoir de l'argent seulement", "la guerre froide", "la science"], "c": 0, "e": "Poésie engagée, au ton souvent combatif."}, {"q": "La poésie de la négritude emprunte souvent :", "o": ["la seule rime classique du XVIIe siècle", "les règles des fables de La Fontaine", "un langage administratif", "les rythmes et images de l'oralité africaine"], "c": 3, "e": "Le vers libre domine."}, {"q": "Éthiopiques est un recueil de :", "o": ["David Diop", "Léon-Gontran Damas", "Aimé Césaire", "Léopold Sédar Senghor"], "c": 3, "e": "Publié en 1956."}, {"q": "Aimé Césaire a aussi écrit :", "o": ["L'Étranger", "Le Cercle des Tropiques", "Discours sur le colonialisme", "Alcools"], "c": 2, "e": "Essai de 1950 contre le colonialisme."}, {"q": "Le vers libre est un vers :", "o": ["toujours rimé en alexandrins", "sans rime ni mètre régulier imposés", "composé d'un seul mot", "uniquement en prose"], "c": 1, "e": "Il caractérise la poésie moderne."}, {"q": "« Afrique, mon Afrique » est un poème de :", "o": ["David Diop", "Senghor", "Damas", "Césaire"], "c": 0, "e": "Tiré de Coups de pilon."}, {"q": "Une image poétique est :", "o": ["un tableau", "une photographie", "une note de bas de page", "une comparaison ou une métaphore qui évoque une idée de façon concrète"], "c": 3, "e": "Elle rend l'idée sensible."}]},{"t": "Français — Romans africains au programme", "m": "Français", "f": "", "g": "Décembre", "q": [{"q": "Les Soleils des indépendances (1968) est un roman de :", "o": ["Mongo Béti", "Amadou Hampaté Bâ", "Camara Laye", "Ahmadou Kourouma"], "c": 3, "e": "Écrivain ivoirien."}, {"q": "Le héros des Soleils des indépendances est :", "o": ["Wangrin", "Meursault", "Fama, prince malinké déchu", "Rieux"], "c": 2, "e": "Il ne trouve plus sa place après l'indépendance."}, {"q": "Perpétue et l'habitude du malheur est de :", "o": ["Kourouma", "Mongo Béti", "Senghor", "Malraux"], "c": 1, "e": "Écrivain camerounais."}, {"q": "L'étrange destin de Wangrin met en scène :", "o": ["un interprète colonial rusé", "un roi zoulou", "un docteur pestiféré", "un soldat russe"], "c": 0, "e": "Roman de l'écrivain malien Amadou Hampaté Bâ."}, {"q": "Alioum Fantouré, auteur du Cercle des Tropiques, est un écrivain :", "o": ["algérien", "québécois", "russe", "guinéen"], "c": 3, "e": "Il dénonce les dérives du pouvoir en Afrique."}, {"q": "Les Écailles du ciel est un roman de :", "o": ["Camus", "Hampaté Bâ", "Thierno Monénembo", "Peter Abrahams"], "c": 2, "e": "Auteur guinéen."}, {"q": "Peter Abrahams, auteur de Je ne suis pas un homme libre, est un écrivain :", "o": ["ivoirien", "sud-africain", "français", "haïtien"], "c": 1, "e": "Il y dénonce l'apartheid et le racisme."}, {"q": "Un roman à thèse sur les indépendances dénonce souvent :", "o": ["le pouvoir autoritaire et la corruption", "le seul sport", "la cuisine", "la météo"], "c": 0, "e": "Les régimes postcoloniaux sont critiqués."}, {"q": "Les Soleils des indépendances est écrit :", "o": ["en français marqué par le malinké", "en anglais", "en latin", "en arabe"], "c": 0, "e": "Kourouma casse la langue française de l'intérieur."}, {"q": "Wangrin est célèbre pour :", "o": ["ses exploits sportifs", "ses voyages sur la lune", "sa carrière de pilote", "ses ruses d'interprète sous la colonisation"], "c": 3, "e": "Roman picaresque africain."}, {"q": "Dans Perpétue, Mongo Béti dénonce :", "o": ["la beauté de la colonie", "le sport", "les dérives du régime postcolonial", "les mathématiques"], "c": 2, "e": "Le roman critique le pouvoir autoritaire."}, {"q": "Dans Les Soleils des indépendances, Fama est :", "o": ["un roi puissant", "le dernier descendant d'une dynastie dépossédée par les nouvelles réalités", "un militaire", "un médecin"], "c": 1, "e": "Il est un « prince » sans pouvoir."}, {"q": "Le roman est un genre :", "o": ["narratif en prose, mettant en scène des personnages", "poétique en vers", "dramatique en dialogues seulement", "argumentatif seulement"], "c": 0, "e": "Il comporte narrateur, personnages, intrigue."}]},{"t": "Français — Théâtre africain au programme", "m": "Français", "f": "", "g": "Janvier", "q": [{"q": "La Tragédie du roi Christophe de Césaire se déroule :", "o": ["à Haïti", "en Russie", "en France", "à Rome"], "c": 0, "e": "Elle met en scène Henri Christophe, roi du nord d'Haïti."}, {"q": "Une saison au Congo de Césaire a pour héros :", "o": ["Sundiata Keïta", "Chaka Zoulou", "Henri Christophe", "Patrice Lumumba"], "c": 3, "e": "Pièce sur l'indépendance du Congo et son assassinat."}, {"q": "La Mort de Chaka est une pièce de :", "o": ["Aimé Césaire", "Sartre", "Seydou Badian Kouyaté", "Camus"], "c": 2, "e": "Écrivain malien."}, {"q": "Chaka était :", "o": ["un empereur romain", "un roi zoulou", "un médecin français", "un prêtre russe"], "c": 1, "e": "Fondateur d'un puissant royaume zoulou."}, {"q": "Le Président est une pièce de :", "o": ["Maxime N'Débéka", "Senghor", "Kourouma", "Albert Camus"], "c": 0, "e": "Auteur congolais."}, {"q": "Les pièces de Césaire interrogent surtout :", "o": ["les règles de la grammaire seulement", "la mode vestimentaire", "les mathématiques", "le pouvoir, la liberté et les lendemains de l'indépendance"], "c": 3, "e": "Théâtre politique."}, {"q": "Le théâtre est un genre fondé sur :", "o": ["le seul récit d'un narrateur", "le seul poème lyrique", "le dialogue et la représentation sur scène", "la seule chronique"], "c": 2, "e": "Il comporte répliques et didascalies."}, {"q": "Les didascalies sont :", "o": ["les répliques des personnages", "les indications de mise en scène écrites par l'auteur", "les titres de chapitres", "les rimes"], "c": 1, "e": "Elles précisent gestes, décors et ton."}, {"q": "Dans La Tragédie du roi Christophe, le roi veut :", "o": ["retourner en Europe", "bâtir un État et une citadelle pour affirmer la dignité de son peuple", "devenir poète", "abolir la royauté"], "c": 1, "e": "Mais son autoritarisme le perd."}, {"q": "Patrice Lumumba est assassiné en :", "o": ["1961", "1900", "1975", "1945"], "c": 0, "e": "Après l'indépendance du Congo."}, {"q": "Le Congo accède à l'indépendance en :", "o": ["1945", "1975", "1990", "1960"], "c": 3, "e": "Une saison au Congo suit ces événements."}, {"q": "Une tragédie met en scène :", "o": ["un conflit amusant sans enjeu", "une description de paysage", "un héros confronté à un destin fatal", "un cours magistral"], "c": 2, "e": "Elle suscite crainte et pitié."}, {"q": "Le monologue est :", "o": ["un dialogue entre deux personnages", "un discours d'un personnage seul en scène", "un chant du chœur", "une didascalie"], "c": 1, "e": "Il révèle les pensées du personnage."}]},{"t": "Français — Poésie surréaliste française", "m": "Français", "f": "", "g": "Février", "q": [{"q": "Le surréalisme est un mouvement qui :", "o": ["impose les règles classiques", "explore l'inconscient, le rêve et l'écriture automatique", "défend le réalisme social strict", "refuse toute création"], "c": 1, "e": "André Breton publie le Manifeste en 1924."}, {"q": "Le Manifeste du surréalisme (1924) est de :", "o": ["André Breton", "Albert Camus", "Sartre", "Malraux"], "c": 0, "e": "Chef de file du mouvement."}, {"q": "Alcools (1913) est un recueil de :", "o": ["Paul Éluard", "Louis Aragon", "Léopold Senghor", "Guillaume Apollinaire"], "c": 3, "e": "On y trouve Le Pont Mirabeau et Zone."}, {"q": "Apollinaire a notamment supprimé dans Alcools :", "o": ["les mots", "les titres", "la ponctuation", "les vers"], "c": 2, "e": "Geste moderne de libération du vers."}, {"q": "Les Yeux d'Elsa (1942) est de :", "o": ["Éluard", "Louis Aragon", "Apollinaire", "Sartre"], "c": 1, "e": "Écrit en pleine Occupation, il célèbre aussi la patrie."}, {"q": "Capitale de la douleur (1926) est de :", "o": ["Paul Éluard", "Aragon", "Apollinaire", "Camus"], "c": 0, "e": "Poète aussi de la Résistance (Liberté)."}, {"q": "L'écriture automatique consiste à :", "o": ["écrire en suivant un plan strict", "recopier des textes", "écrire sans mots", "écrire spontanément, sans contrôle de la raison"], "c": 3, "e": "Elle laisse parler l'inconscient."}, {"q": "Le surréalisme revendique souvent :", "o": ["la soumission aux règles", "la fidélité à la tradition", "la révolte et la liberté de l'imagination", "l'absence de métaphores"], "c": 2, "e": "Il refuse les conventions."}, {"q": "Paul Éluard a écrit le poème de la Résistance :", "o": ["Zone", "Le Pont Mirabeau", "Liberté", "Spleen"], "c": 2, "e": "Il date de 1942."}, {"q": "Le Pont Mirabeau est un poème de :", "o": ["Aragon", "Apollinaire", "Éluard", "Senghor"], "c": 1, "e": "Tiré d'Alcools."}, {"q": "Calligrammes d'Apollinaire est :", "o": ["un recueil de poèmes dont la disposition dessine un objet", "un roman", "une pièce de théâtre", "un essai"], "c": 0, "e": "Il joue avec la forme visuelle du texte."}, {"q": "Aragon est aussi connu pour :", "o": ["ses voyages dans l'espace", "sa carrière d'amiral", "ses romans policiers", "son engagement dans la Résistance et au parti communiste"], "c": 3, "e": "Poète engagé."}, {"q": "Le rêve occupe dans le surréalisme une place :", "o": ["nulle", "secondaire", "centrale, source d'images libres", "interdite"], "c": 2, "e": "L'influence de Freud est forte."}]},{"t": "Français — Romans français : Malraux, Mauriac, Camus, Etcherelli", "m": "Français", "f": "", "g": "Mars", "q": [{"q": "La Condition humaine (1933) de Malraux se passe :", "o": ["à Paris pendant la Commune", "à Rome", "à Shanghai, lors de l'insurrection de 1927", "à Oran"], "c": 2, "e": "Il reçoit le prix Goncourt."}, {"q": "Thérèse Desqueyroux est un roman de :", "o": ["Camus", "François Mauriac", "Malraux", "Sartre"], "c": 1, "e": "Mauriac a reçu le prix Nobel en 1952."}, {"q": "Thérèse Desqueyroux est :", "o": ["une femme prisonnière de son milieu qui tente d'empoisonner son mari", "une héroïne de guerre", "une reine", "une institutrice noire"], "c": 0, "e": "Roman de la révolte étouffée."}, {"q": "L'Étranger (1942) de Camus a pour narrateur :", "o": ["Rieux", "Tarrou", "Kaliayev", "Meursault"], "c": 3, "e": "Il tue un homme sur une plage d'Alger."}, {"q": "L'Étranger illustre :", "o": ["le romantisme", "le classicisme", "la philosophie de l'absurde", "le surréalisme"], "c": 2, "e": "Indifférence du héros, silence du monde."}, {"q": "La Peste (1947) se déroule à :", "o": ["Paris", "Oran", "Shanghai", "Rome"], "c": 1, "e": "Le docteur Rieux y lutte contre l'épidémie."}, {"q": "La peste dans le roman symbolise notamment :", "o": ["le mal et l'oppression (comme l'Occupation)", "la joie de vivre", "la fortune", "les vacances"], "c": 0, "e": "C'est une allégorie."}, {"q": "Élise ou la vraie vie (1967) de Claire Etcherelli décrit :", "o": ["un voyage en Chine", "une cour royale", "un duel", "la condition ouvrière et la guerre d'Algérie"], "c": 3, "e": "Roman de l'usine et de l'amour."}, {"q": "Meursault est condamné à mort après :", "o": ["avoir volé", "avoir fui", "avoir menti", "avoir tué un Arabe sur une plage"], "c": 3, "e": "Le soleil est évoqué comme cause de son geste."}, {"q": "Dans La Peste, le médecin héros est :", "o": ["Meursault", "Tchen", "Rieux", "Garcin"], "c": 2, "e": "Il soigne les malades à Oran."}, {"q": "La Condition humaine met en scène :", "o": ["des paysans landais", "des révolutionnaires communistes à Shanghai", "des ouvriers de Citroën", "des empereurs romains"], "c": 1, "e": "Kyo, Tchen et Katow en sont des personnages."}, {"q": "Quel roman illustre l'engagement politique de ses personnages ?", "o": ["La Condition humaine", "Alcools", "Huis clos", "L'Avare"], "c": 0, "e": "Les héros risquent leur vie pour une cause."}, {"q": "Camus reçoit le prix Nobel de littérature en :", "o": ["1947", "1967", "1927", "1957"], "c": 3, "e": "Il est alors l'un des plus jeunes lauréats."}]},{"t": "Français — Théâtre français : Sartre et Camus", "m": "Français", "f": "", "g": "Avril", "q": [{"q": "Dans Huis clos (1944), Sartre écrit : « L'enfer, c'est :", "o": ["le feu", "le temps", "la nuit", "les autres"], "c": 3, "e": "Trois personnages enfermés dans un salon."}, {"q": "Les Mouches (1943) de Sartre reprend le mythe :", "o": ["d'Œdipe", "de Sisyphe", "d'Oreste", "de Prométhée"], "c": 2, "e": "Pièce sur la liberté et le remords."}, {"q": "Les Mains sales (1948) de Sartre pose le problème :", "o": ["de la cuisine", "de l'action politique et de ses compromis", "du sport", "de la musique"], "c": 1, "e": "Le héros Hugo doit tuer Hoederer."}, {"q": "Caligula de Camus est :", "o": ["un empereur romain qui découvre l'absurde et abuse de son pouvoir", "un navigateur", "un roi africain", "un médecin"], "c": 0, "e": "Pièce sur la liberté absolue et la folie du pouvoir."}, {"q": "Les Justes (1949) de Camus met en scène :", "o": ["des soldats romains", "des ouvriers français", "des princes africains", "des révolutionnaires russes"], "c": 3, "e": "Le héros Kaliayev hésite devant la violence."}, {"q": "Le Malentendu de Camus illustre :", "o": ["une comédie légère", "une fable animalière", "un drame né de l'absence de reconnaissance entre un fils et sa famille", "une épopée"], "c": 2, "e": "Personne ne se reconnaît dans la pièce."}, {"q": "L'existentialisme sartrien affirme que :", "o": ["l'essence précède l'existence", "l'existence précède l'essence : l'homme se définit par ses actes", "tout est écrit d'avance", "l'homme n'est pas libre"], "c": 1, "e": "Il fonde la responsabilité et la liberté."}, {"q": "Parmi ces dramaturges, lequel est lié à l'absurde ?", "o": ["Camus", "Corneille", "Racine", "Molière"], "c": 0, "e": "Camus l'a théorisé dans Le Mythe de Sisyphe."}, {"q": "Huis clos met en scène :", "o": ["Garcin, Inès et Estelle", "Meursault et Marie", "Rieux et Tarrou", "Hugo et Jessica seulement"], "c": 0, "e": "Trois morts enfermés dans un salon."}, {"q": "Dans Les Mains sales, Hugo doit :", "o": ["écrire un roman", "quitter la France", "devenir roi", "assassiner Hoederer, dirigeant du parti"], "c": 3, "e": "La pièce interroge morale et politique."}, {"q": "Dans Les Mouches, Oreste :", "o": ["nie son acte", "reste soumis au remords", "assume librement son acte", "devient roi d'Argos"], "c": 2, "e": "Il revendique sa liberté."}, {"q": "Sartre refuse le prix Nobel en :", "o": ["1957", "1964", "1947", "1975"], "c": 1, "e": "Il refuse toute consécration officielle."}, {"q": "L'« absurde » chez Camus désigne :", "o": ["le décalage entre l'exigence de sens de l'homme et le silence du monde", "le rire", "la logique", "la mode"], "c": 0, "e": "Notion centrale du Mythe de Sisyphe."}]},{"t": "Français — Exercices du baccalauréat : étude de texte, commentaire et dissertation", "m": "Français", "f": "", "g": "Avril", "q": [{"q": "L'introduction d'un commentaire composé comprend :", "o": ["présentation du texte, projet de lecture et annonce du plan", "le seul résumé", "la seule conclusion", "des citations sans lien"], "c": 0, "e": "Elle prépare l'étude."}, {"q": "Le commentaire composé s'organise en :", "o": ["paragraphes sans ordre", "un résumé", "une liste de figures", "axes (parties) qui regroupent les remarques"], "c": 3, "e": "Chaque axe est illustré par des citations."}, {"q": "Une dissertation littéraire est un exercice qui :", "o": ["recopie un texte", "traduit un poème", "répond à une question par une argumentation structurée avec exemples", "résume une œuvre"], "c": 2, "e": "Elle exige un plan et des exemples."}, {"q": "L'introduction d'une dissertation comporte :", "o": ["uniquement la conclusion", "amorce, présentation et reformulation du sujet, problématique et annonce du plan", "un poème", "les références bibliographiques"], "c": 1, "e": "Elle pose le problème."}, {"q": "Un plan dialectique de dissertation est :", "o": ["thèse, antithèse, synthèse", "un seul argument", "une liste d'adjectifs", "un résumé"], "c": 0, "e": "Il confronte puis dépasse les points de vue."}, {"q": "Une métaphore est :", "o": ["une comparaison avec « comme »", "une répétition en début de phrase", "une exagération", "une comparaison sans outil de comparaison"], "c": 3, "e": "Exemple : « cet homme est un lion »."}, {"q": "L'anaphore est :", "o": ["une comparaison", "une opposition", "la répétition d'un mot ou d'une expression en début de phrases ou de vers", "une suppression de mot"], "c": 2, "e": "Elle crée un effet d'insistance."}, {"q": "Pour étudier un texte, il faut d'abord :", "o": ["recopier la biographie de l'auteur", "lire attentivement et repérer thème, énonciation et structure", "ignorer le texte", "lire seulement le titre"], "c": 1, "e": "Le programme demande d'aller droit à l'étude de texte."}, {"q": "La conclusion d'une dissertation :", "o": ["introduit le sujet", "dresse le bilan de la démonstration et peut ouvrir sur une question plus large", "recopie l'introduction", "n'existe jamais"], "c": 1, "e": "Elle répond à la problématique."}, {"q": "Une comparaison contient :", "o": ["un outil de comparaison (comme, tel, pareil à)", "aucun outil", "une négation", "une rime"], "c": 0, "e": "Sans outil, c'est une métaphore."}, {"q": "Une antithèse oppose :", "o": ["deux synonymes", "un mot et son écho", "une phrase et un titre", "deux idées ou mots de sens contraire"], "c": 3, "e": "Exemple : « jour » et « nuit »."}, {"q": "L'hyperbole est :", "o": ["une atténuation", "une répétition", "une exagération", "une comparaison"], "c": 2, "e": "Exemple : « mort de rire »."}, {"q": "Une citation dans un commentaire doit être :", "o": ["recopiée sans commentaire", "courte, entre guillemets et commentée", "inventée", "supprimée"], "c": 1, "e": "Elle sert de preuve à l'analyse."}]},{"t": "Anglais — Women's education et scolarisation (Units 1–8)", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "\"Enrolment\" in a school means:", "o": ["the number of pupils registered", "the number of teachers", "the end of the school year", "a punishment"], "c": 0, "e": "Enrolment = inscription / effectif inscrit."}, {"q": "The number of girls in school is ___ than the number of boys.", "o": ["low", "lower", "lowest", "the lower"], "c": 1, "e": "Comparatif + than."}, {"q": "Educating girls ___ the whole society.", "o": ["benefits", "to benefit", "benefiting", "benefit"], "c": 0, "e": "Sujet gérondif = verbe singulier."}, {"q": "\"To drop out\" means:", "o": ["to change class", "to arrive late", "to leave school before finishing", "to pass an exam"], "c": 2, "e": "Drop out = abandonner ses études."}, {"q": "Boys do outdoor chores ___ girls do housework.", "o": ["because", "unless", "while", "so that"], "c": 2, "e": "While exprime l'opposition."}, {"q": "If 60% of the pupils are boys, girls represent:", "o": ["50 per cent", "60 per cent", "30 per cent", "40 per cent"], "c": 3, "e": "100 − 60 = 40."}, {"q": "Early marriage ___ girls from continuing their studies.", "o": ["avoids", "prevents", "lets", "makes"], "c": 1, "e": "Prevent … from + V-ing."}, {"q": "Which sentence is correct?", "o": ["Many girls leave school because early marriage.", "Many girl leave school because of early marriage.", "Many girls leaves school because of early marriage.", "Many girls leave school because of early marriage."], "c": 3, "e": "Because of + nom ; sujet pluriel + verbe sans -s."}, {"q": "\"Literacy\" means the ability to:", "o": ["sing and dance", "count money only", "read and write", "run fast"], "c": 2, "e": "Literacy = alphabétisation."}, {"q": "Girls ___ often asked to help at home than boys.", "o": ["are more", "more are", "is more", "are most"], "c": 0, "e": "Comparatif de supériorité + than."}, {"q": "\"Gender equality\" means:", "o": ["only boys go to school", "no school for all", "equal rights for girls and boys", "only girls work"], "c": 2, "e": "Égalité des genres."}, {"q": "Many parents can't afford school ___.", "o": ["fields", "fees", "feast", "fares only"], "c": 1, "e": "School fees = frais de scolarité."}]}, {"t": "Anglais — Debate et argumentative essay (Units 9–10)", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "To give your opinion, you can say:", "o": ["By the way,", "As a result,", "Meanwhile,", "In my opinion,"], "c": 3, "e": "In my opinion = à mon avis."}, {"q": "\"On the one hand… ___, …\"", "o": ["by the other hand", "on the other hand", "at the other side", "in the other hand"], "c": 1, "e": "Expression figée."}, {"q": "I totally agree ___ you.", "o": ["with", "about", "to", "by"], "c": 0, "e": "Agree with someone."}, {"q": "Which expression introduces a conclusion?", "o": ["Firstly", "To sum up", "However", "For instance"], "c": 1, "e": "To sum up = en résumé."}, {"q": "A leader is a person who:", "o": ["never decides", "guides and influences a group", "obeys all orders", "works alone"], "c": 1, "e": "Leadership = capacité à guider."}, {"q": "Which one expresses polite disagreement?", "o": ["Be quiet.", "That's stupid.", "You are wrong!", "I'm afraid I don't agree."], "c": 3, "e": "Registre poli."}, {"q": "An argumentative essay usually ends with:", "o": ["a recipe", "a conclusion", "a title", "a dialogue"], "c": 1, "e": "Introduction – développement – conclusion."}, {"q": "\"Firstly, secondly, finally\" are used to:", "o": ["organize arguments", "say goodbye", "give orders", "ask questions"], "c": 0, "e": "Connecteurs d'organisation."}, {"q": "\"However\" introduces:", "o": ["an example", "a result", "a time", "a contrast"], "c": 3, "e": "However = cependant."}, {"q": "\"For example\" can be replaced by:", "o": ["as a result", "for instance", "in conclusion", "besides"], "c": 1, "e": "Synonymes."}, {"q": "\"There are many arguments ___ this idea.\" (contre)", "o": ["with", "against", "for", "among"], "c": 1, "e": "Against = contre."}]}, {"t": "Anglais — First conditional et temps futur (Units 11–12)", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "If it ___ tomorrow, we will stay at home.", "o": ["would rain", "rains", "will rain", "rained"], "c": 1, "e": "If + présent, will + base verbale."}, {"q": "If you study hard, you ___ the exam.", "o": ["would pass", "pass", "will pass", "passed"], "c": 2, "e": "Conditionnel type 1."}, {"q": "She will be late if she ___ the bus.", "o": ["missed", "would miss", "will miss", "misses"], "c": 3, "e": "Pas de will après if."}, {"q": "Unless you hurry, you ___ the train.", "o": ["would miss", "will miss", "won't miss", "missed"], "c": 1, "e": "Unless = if … not."}, {"q": "When I ___ my studies, I will look for a job.", "o": ["will finish", "would finish", "finished", "finish"], "c": 3, "e": "Après when : présent."}, {"q": "Which sentence is correct?", "o": ["If I see him, I told him.", "If I saw him, I will tell him.", "If I see him, I will tell him.", "If I will see him, I will tell him."], "c": 2, "e": "Type 1 : if + présent, will."}, {"q": "I will call you as soon as I ___ home.", "o": ["get", "got", "will get", "would get"], "c": 0, "e": "As soon as + présent."}, "so well", "as good", "as well as"], "c": 3, "e": "As well as = et aussi."}]}, {"t": "Anglais — Third conditional (Units 23–28)", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "If I had studied, I ___ the exam.", "o": ["would have passed", "passed", "would pass", "will pass"], "c": 0, "e": "Type 3 : if + had + pp, would have + pp."}, {"q": "If she ___ earlier, she wouldn't have missed the bus.", "o": ["left", "leaves", "would leave", "had left"], "c": 3, "e": "If + past perfect."}, {"q": "The third conditional is formed with:", "o": ["if + will, would", "if + past perfect, would have + past participle", "if + past simple, would", "if + present, will"], "c": 1, "e": "Structure du type 3."}, {"q": "If they ___ the warning, they might have escaped.", "o": ["would hear", "heard", "hear", "had heard"], "c": 3, "e": "Past perfect après if."}, {"q": "If I hadn't been ill, I ___ to the party.", "o": ["would have gone", "would go", "went", "will go"], "c": 0, "e": "Regret sur le passé."}, {"q": "Which sentence expresses a regret about the past?", "o": ["If only I had listened to my parents.", "I listen to my parents.", "I will listen to my parents.", "If only I listen to my parents."], "c": 0, "e": "If only + past perfect."}, {"q": "\"What would you have done if you had lost your passport?\" Best answer:", "o": ["I go to the police.", "I would have gone to the police.", "I would go to the police.", "I will go to the police."], "c": 1, "e": "Même temps que la question."}, {"q": "If you ___ me earlier, I would have helped you.", "o": ["would tell", "had told", "told", "tell"], "c": 1, "e": "If + had + pp."}, {"q": "She would have been happy if she ___ the prize.", "o": ["won", "would win", "had won", "wins"], "c": 2, "e": "Past perfect."}, {"q": "If the road ___ better, the accident wouldn't have happened.", "o": ["would be", "was", "is", "had been"], "c": 3, "e": "If + had been."}, {"q": "The third conditional refers to:", "o": ["a present habit", "an impossible past situation", "a rule of science", "a real future"], "c": 1, "e": "Passé irréel."}]}, {"t": "Anglais — Present perfect, since et for (Units 29–30, 36)", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "I ___ in Mamou since 2015.", "o": ["live", "have lived", "am living", "lived"], "c": 1, "e": "Since + point de départ → present perfect."}, {"q": "She ___ already finished her homework.", "o": ["is", "has", "had been", "have"], "c": 1, "e": "Third person singular : has."}, {"q": "How long ___ you studied English?", "o": ["are", "have", "do", "did"], "c": 1, "e": "How long + present perfect."}, {"q": "I have studied English ___ three years.", "o": ["ago", "for", "since", "during"], "c": 1, "e": "For + durée ; since + date."}, {"q": "\"Since\" is used with:", "o": ["a duration (3 years)", "a number only", "a point in time (2010, Monday)", "a verb only"], "c": 2, "e": "Since = depuis (date)."}, {"q": "I ___ him yesterday.", "o": ["had seen", "have seen", "see", "saw"], "c": 3, "e": "Hier = prétérit simple."}, {"q": "Have you ___ been to Dakar?", "o": ["ever", "since", "ago", "yet"], "c": 0, "e": "Ever dans les questions d'expérience."}, {"q": "You have a headache. You ___ see a doctor.", "o": ["should", "must to", "would to", "can to"], "c": 0, "e": "Should = conseil."}, {"q": "He has ___ lived in Conakry for ten years.", "o": ["being", "was", "be", "been"], "c": 3, "e": "Have/has + pp."}, {"q": "I haven't seen her ___ Monday.", "o": ["for", "ago", "since", "during"], "c": 2, "e": "Since + date."}, {"q": "They have lived here ___ five years.", "o": ["from", "for", "since", "at"], "c": 1, "e": "For + durée."}, {"q": "She has lost her keys. So she ___ get into the house.", "o": ["won't to", "isn't", "can't", "couldn't be"], "c": 2, "e": "Résultat présent."}]}, {"t": "Anglais — Past perfect et simple past (Units 31–39)", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "When I arrived, the train ___.", "o": ["already left", "had already left", "leaves", "has already l e."}, {"q": "While she ___, the phone rang.", "o": ["cooks", "has cooked", "cooked", "was cooking"], "c": 3, "e": "While + past continuous."}, {"q": "They ___ football when it started to rain.", "o": ["are playing", "were playing", "played", "play"], "c": 1, "e": "Action en cours dans le passé."}, {"q": "Water ___ at 100 °C.", "o": ["boiled", "is boiling", "has boiled", "boils"], "c": 3, "e": "Vérité générale → présent simple."}, {"q": "Look! The children ___ in the garden.", "o": ["are playing", "play", "have played", "played"], "c": 0, "e": "Action en cours → present continuous."}, {"q": "She usually walks to school, but today she ___ the bus.", "o": ["takes", "took", "has taken", "is taking"], "c": 3, "e": "Action temporaire."}, {"q": "In the past continuous, the interrupting action is in the:", "o": ["present perfect", "past perfect", "simple past", "future"], "c": 2, "e": "While … was …, … rang."}, {"q": "She ___ TV when the lights went out.", "o": ["is watching", "watches", "watched", "was watching"], "c": 3, "e": "Action interrompue."}, {"q": "What ___ you doing at 8 o'clock yesterday?", "o": ["were", "are", "have", "did"], "c": 0, "e": "Past continuous."}, {"q": "The sun ___ in the east.", "o": ["has risen", "rose", "rises", "is rising"], "c": 2, "e": "Vérité générale."}, {"q": "I ___ my homework when he called.", "o": ["do", "was doing", "am doing", "did"], "c": 1, "e": "Action en cours."}]}, {"t": "Anglais — Habitual past, opinion et description (Units 46–49)", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "When I was a child, I ___ in the village.", "o": ["use to live", "was use to live", "used to live", "am used to live"], "c": 2, "e": "Used to + base verbale."}, {"q": "He ___ smoke, but he stopped last year.", "o": ["is used to", "was used", "use to", "used to"], "c": 3, "e": "Habitude passée."}, {"q": "Did you ___ play football when you were young?", "o": ["used to", "uses to", "using to", "use to"], "c": 3, "e": "Après did : use to."}, {"q": "Which phrase gives an opinion?", "o": ["Meanwhile,", "In my view,", "For example,", "At last,"], "c": 1, "e": "In my view = selon moi."}, {"q": "Mamou is famous ___ its cool climate.", "o": ["at", "of", "for", "by"], "c": 2, "e": "Famous for."}, {"q": "Tourists visit the waterfalls, ___ are in Fouta Djallon.", "o": ["whose", "where", "who", "which"], "c": 3, "e": "Which pour une chose."}, {"q": "A tourist is a person who:", "o": ["teaches English", "visits a place for pleasure", "works in a bank", "sells tickets only"], "c": 1, "e": "Définition."}, {"q": "We ___ to play in the river when we were kids.", "o": ["would to", "use", "used", "were using"], "c": 2, "e": "Used to."}, {"q": "Mamou is ___ in Guinea.", "o": ["situation", "situated", "situate", "situating"], "c": 1, "e": "Be situated in = être situé."}, {"q": "In my opinion, tourism ___ useful.", "o": ["is", "are", "be", "were been"], "c": 0, "e": "Accord sujet-verbe."}, {"q": "\"Friendly people\" describes people who are:", "o": ["kind and welcoming", "rich only", "lazy", "angry"], "c": 0, "e": "Vocabulaire."}]}, {"t": "Anglais — Responsibility, community, AIDS, tourism, pollution (Units 50–55)", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "You ___ have helped him; he needed you.", "o": ["would to", "can", "will", "should"], "c": 3, "e": "Should have + pp = reproche."}, {"q": "\"Should have + past participle\" expresses:", "o": ["a general truth", "a present habit", "a future plan", "criticism or regret about the past"], "c": 3, "e": "Reproche/regret."}, {"q": "AIDS is caused by:", "o": ["the HIV virus", "bad weather", "a mosquito", "dirty water only"], "c": 0, "e": "HIV = Human Immunodeficiency Virus."}, {"q": "AIDS stands for:", "o": ["African Infection and Disease Study", "Acquired Immune Deficiency Syndrome", "Anti Immune Disease System", "Acute Illness Due to Sun"], "c": 1, "e": "Sigle anglais du SIDA."}, {"q": "Pollution is:", "o": ["a school subject", "a kind of food", "a type of tourism", "the ", "increased", "remained the same", "disappeared"], "c": 1, "e": "150 → 200."}, {"q": "Text: « Ousmane missed the bus, so he was late for the exam. He regretted not leaving home earlier. » — Why was Ousmane late?", "o": ["He lost his book.", "He forgot the exam.", "He missed the bus.", "He was ill."], "c": 2, "e": "Cause explicite."}, {"q": "Same text — \"He regretted\" means he felt:", "o": ["proud", "sorry", "happy", "angry with the teacher"], "c": 1, "e": "Regret = regretter."}, {"q": "In a text, \"it\" in « The book is old but it is useful » refers to:", "o": ["the reader", "the library", "the book", "the author"], "c": 2, "e": "Pronom de reprise."}, {"q": "The main idea of a text is:", "o": ["its central message", "its last sentence only", "its title only", "its first word"], "c": 0, "e": "Idée principale."}, {"q": "To find a precise piece of information quickly, you:", "o": ["ignore the questions", "copy the text", "scan the text", "translate every word"], "c": 2, "e": "Scanning."}]}, {"t": "Anglais — Vocabulary et word formation", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "The opposite of \"increase\" is:", "o": ["improve", "grow", "raise", "decrease"], "c": 3, "e": "Antonyme."}, {"q": "A synonym of \"begin\" is:", "o": ["stop", "leave", "start", "finish"], "c": 2, "e": "Synonyme."}, {"q": "The noun from the verb \"educate\" is:", "o": ["educator only", "educatly", "education", "educative"], "c": 2, "e": "Suffixe -tion."}, {"q": "The adjective from \"danger\" is:", "o": ["dangering", "dangerous", "dangery", "dangerful"], "c": 1, "e": "Suffixe -ous."}, {"q": "\"Unhappy\" is formed with the prefix:", "o": ["im-", "un-", "dis-", "mis-"], "c": 1, "e": "Un + happy."}, {"q": "\"Impossible\" means:", "o": ["possible later", "not possible", "very possible", "almost possible"], "c": 1, "e": "Prefix im- = négation."}, {"q": "A \"teacher\" is a person who:", "o": ["learns only", "teaches", "cooks", "studies"], "c": 1, "e": "Suffixe -er = celui qui fait."}, {"q": "\"Healthy\" is the adjective of:", "o": ["heals", "health", "heal", "healed"], "c": 1, "e": "Health → healthy."}, {"q": "Choose the correct spelling:", "o": ["environement", "enviroment", "environment", "envirenment"], "c": 2, "e": "Orthographe."}, {"q": "\"Harvest\" is related to:", "o": ["farming", "banking", "medicine", "sport"], "c": 0, "e": "Récolte."}]}, {"t": "Anglais — Révision générale : grammaire type bac", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "She asked me where I ___.", "o": ["was lived", "do live", "lived", "live to"], "c": 2, "e": "Discours indirect : concordance."}, {"q": "He said that he ___ tired.", "o": ["is", "was", "be", "been"], "c": 1, "e": "Reported speech : backshift."}, {"q": "The letter ___ yesterday.", "o": ["is written", "has wrote", "wrote", "was written"], "c": 3, "e": "Passif au prétérit."}, {"q": "English ___ all over the world.", "o": ["spoke", "is spoken", "speaks", "is speaking"], "c": 1, "e": "Passif présent."}, {"q": "The book ___ I bought is interesting.", "o": ["which", "whose", "who", "where"], "c": 0, "e": "Pronom relatif pour une chose."}, {"q": "He is the man ___ car was stolen.", "o": ["which", "whom's", "who's", "whose"], "c": 3, "e": "Whose = dont/de qui."}, {"q": "She is ___ than her sister.", "o": ["as taller", "taller", "tallest", "more tall"], "c": 1, "e": "Comparatif court."}, {"q": "Russia is ___ country in the world.", "o": ["most largest", "more large", "the largest", "larger"], "c": 2, "e": "Superlatif court : the + largest."}, {"q": "You ___ smoke here. It is forbidden.", "o": ["mustn't", "don't have to", "shouldn't to", "needn't to"], "c": 0, "e": "Mustn't = interdiction."}, {"q": "I look forward ___ you.", "o": ["seeing to", "to seeing", "to see", "for see"], "c": 1, "e": "Look forward to + V-ing."}]}, {"t": "Anglais — Unit 1 Women's education (1)", "m": "Anglais", "f": "SM · SE", "g": "", "q": [{"q": "Educating women helps reduce ___.", "o": ["poverty", "literacy", "knowledge", "income"
