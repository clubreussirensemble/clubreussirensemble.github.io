ionnels"],"c":0,"e":"Bien que reposant toutes deux sur la méiose, la spermatogenèse et l'ovogenèse diffèrent notamment par le nombre de gamètes fonctionnels produits et leur taille."},{"q":"Les caractéristiques de la puberté chez le garçon et la fille marquent notamment :","o":["le début du fonctionnement actif des gonades et l'apparition des caractères sexuels secondaires","la fin définitive de l'activité des gonades","l'apparition immédiate de la ménopause","l'absence de toute modification physiologique"],"c":0,"e":"La puberté correspond à l'activation des gonades, avec apparition des caractères sexuels secondaires et début de la fonction reproductrice."},{"q":"La structure et la fonction de l'appareil génital de l'homme comprennent notamment :","o":["les testicules (production des spermatozoïdes) et les voies génitales assurant leur transport","uniquement des glandes exocrines sans lien avec la reproduction","uniquement des organes de régulation hormonale sans gamètes","l'absence totale de glandes annexes"],"c":0,"e":"L'appareil génital masculin associe les testicules, producteurs des gamètes, et un ensemble de voies et glandes assurant leur maturation et leur transport."},{"q":"La structure et la fonction de l'appareil génital de la femme comprennent notamment :","o":["les ovaires (production des ovocytes) et les voies génitales, dont l'utérus","uniquement des glandes exocrines sans lien avec la reproduction","l'absence totale d'ovaires","uniquement le vagin"],"c":0,"e":"L'appareil génital féminin associe les ovaires, producteurs des gamètes, et les voies génitales permettant fécondation et développement de l'embryon."},{"q":"L'observation de coupes microscopiques de gonades permet notamment :","o":["d'identifier les différents stades de la gamétogenèse","de mesurer directement la pression artérielle","d'observer le tissu nerveux","de calculer le PGCD des cellules"],"c":0,"e":"L'analyse histologique des gonades révèle les différentes étapes de maturation des cellules germinales."},{"q":"Le rôle exocrine des gonades correspond à :","o":["la production des gamètes (spermatozoïdes ou ovocytes)","la sécrétion d'hormones sexuelles dans le sang","la régulation de la pression artérielle","la digestion des aliments"],"c":0,"e":"La fonction exocrine des gonades, distincte de leur fonction endocrine (sécrétion hormonale), correspond à la production des cellules reproductrices."}]},{"t":"Biologie — Cycles sexuels et régulation hormonale","m":"Biologie","f":"","g":"Février","q":[{"q":"La durée moyenne du cycle menstruel chez la femme est d'environ :","o":["14 jours","21 jours","28 jours","40 jours"],"c":2,"e":"Le cycle menstruel dure en moyenne 28 jours, avec l'ovulation survenant généralement autour du 14e jour."},{"q":"La FSH (hormone folliculo-stimulante) a pour rôle principal de :","o":["déclencher l'ovulation","stimuler la croissance des follicules ovariens","maintenir la grossesse","provoquer les règles"],"c":1,"e":"La FSH, sécrétée par l'hypophyse, stimule le développement des follicules ovariens, tandis que le pic de LH déclenche l'ovulation."},{"q":"La progestérone, sécrétée par le corps jaune, a pour rôle de :","o":["détruire l'endomètre","maintenir et préparer l'endomètre à une éventuelle grossesse","stimuler l'ovulation","empêcher la nidation"],"c":1,"e":"La progestérone rend l'endomètre apte à la nidation et maintient la muqueuse utérine en phase lutéale."},{"q":"Le cycle ovarien, chez la femme, comprend classiquement :","o":["une phase folliculaire, l'ovulation, puis une phase lutéale","uniquement une phase folliculaire","uniquement l'ovulation, sans autre phase","une phase unique sans distinction"],"c":0,"e":"Le cycle ovarien s'organise en phase folliculaire (maturation du follicule), ovulation, puis phase lutéale (formation du corps jaune)."},{"q":"Le cycle utérin, synchronisé avec le cycle ovarien, se caractérise notamment par :","o":["des modifications cycliques de l'endomètre (muqueuse utérine)","l'absence totale de modification de l'utérus","des modifications exclusivement au niveau des ovaires","une activité indépendante du cycle ovarien"],"c":0,"e":"Sous l'influence des hormones ovariennes, l'endomètre se modifie cycliquement, se préparant à une éventuelle nidation."},{"q":"Le complexe hypothalamo-hypophysaire intervient dans la régulation des cycles sexuels en sécrétant notamment :","o":["la GnRH (par l'hypothalamus) et la FSH/LH (par l'hypophyse)","uniquement de l'insuline","uniquement de l'ADH","aucune hormone en lien avec la reproduction"],"c":0,"e":"L'hypothalamus sécrète la GnRH qui stimule l'hypophyse à produire la FSH et la LH, hormones clés de la régulation des cycles sexuels."},{"q":"Le rétrocontrôle négatif, exercé par les hormones ovariennes sur le complexe hypothalamo-hypophysaire, a pour effet :","o":["de freiner la sécrétion de GnRH, FSH et LH lorsque les taux d'hormones ovariennes sont élevés","d'amplifier indéfiniment la sécrétion de FSH et LH","de n'avoir aucun effet régulateur","de stopper définitivement le cycle ovarien"],"c":0,"e":"Le rétrocontrôle négatif limite la sécrétion des hormones hypophysaires lorsque les taux d'hormones ovariennes (œstrogènes, progestérone) sont suffisamment élevés."},{"q":"Le rétrocontrôle positif, exercé en milieu de cycle par un pic d'œstrogènes, provoque :","o":["un pic de LH déclenchant l'ovulation","une inhibition totale de l'hypophyse","une diminution de la FSH sans effet sur la LH","l'arrêt définitif du cycle ovarien"],"c":0,"e":"Un pic transitoire d'œstrogènes en milieu de cycle exerce exceptionnellement un rétrocontrôle positif, déclenchant le pic de LH responsable de l'ovulation."},{"q":"La régulation des fonctions testiculaires implique également le complexe hypothalamo-hypophysaire, avec un rétrocontrôle exercé par :","o":["la testostérone, produite par les testicules","uniquement l'insuline","uniquement l'ADH","aucune hormone testiculaire"],"c":0,"e":"La testostérone exerce un rétrocontrôle négatif sur l'hypothalamus et l'hypophyse, régulant la sécrétion de GnRH, FSH et LH."},{"q":"Chez l'homme, contrairement à la femme, la sécrétion des hormones sexuelles et la production de gamètes se déroulent généralement de façon :","o":["continue, sans cyclicité marquée","strictement cyclique avec ovulation","totalement absente après la puberté","identique en tout point au cycle féminin"],"c":0,"e":"Chez l'homme, la spermatogenèse et la sécrétion de testostérone sont globalement continues, sans le caractère cyclique observé chez la femme."},{"q":"La progestérone, sécrétée principalement par le corps jaune en phase lutéale, a pour rôle notamment de :","o":["préparer et maintenir l'endomètre en vue d'une éventuelle nidation","déclencher l'ovulation","stimuler la sécrétion de FSH","diminuer la vascularisation de l'utérus"],"c":0,"e":"La progestérone favorise le développement de l'endomètre, le rendant apte à accueillir un éventuel embryon."},{"q":"La FSH (hormone folliculo-stimulante), sécrétée par l'hypophyse, agit principalement en stimulant :","o":["la croissance des follicules ovariens","la contraction utérine","la sécrétion de lait","la digestion"],"c":0,"e":"La FSH stimule le développement des follicules ovariens au cours de la phase folliculaire du cycle."},{"q":"La schématisation de la régulation hormonale du cycle ovarien permet notamment de représenter :","o":["les interactions entre l'hypothalamus, l'hypophyse et les ovaires au cours du cycle","uniquement l'anatomie de l'utérus","uniquement la structure du spermatozoïde","l'absence totale d'interactions hormonales"],"c":0,"e":"Ce schéma synthétique illustre les boucles de régulation (rétrocontrôles) reliant le complexe hypothalamo-hypophysaire et les ovaires tout au long du cycle."}]},{"t":"Biologie — Fécondation, grossesse et accouchement","m":"Biologie","f":"","g":"Mars","q":[{"q":"La fécondation, chez l'espèce humaine, a lieu normalement au niveau :","o":["de l'utérus","du tiers supérieur (ampoule) de la trompe utérine","de l'ovaire","du vagin"],"c":1,"e":"La rencontre entre le spermatozoïde et l'ovule se produit généralement dans l'ampoule de la trompe utérine."},{"q":"La durée moyenne d'une grossesse humaine est d'environ :","o":["6 mois","9 mois (environ 40 semaines)","12 mois","3 mois"],"c":1,"e":"La grossesse humaine dure en moyenne 40 semaines d'aménorrhée, soit environ 9 mois."},{"q":"L'hormone principalement responsable du déclenchement des contractions utérines lors de l'accouchement est :","o":["l'insuline","l'ocytocine","l'ADH","le glucagon"],"c":1,"e":"L'ocytocine, sécrétée par l'hypophyse postérieure, stimule les contractions du myomètre lors du travail et de l'accouchement."},{"q":"La migration des gamètes, préalable à la fécondation, désigne notamment :","o":["le trajet des spermatozoïdes dans les voies génitales féminines vers l'ovocyte","le déplacement de l'ovocyte uniquement vers l'extérieur du corps","l'absence totale de déplacement des gamètes","le trajet des spermatozoïdes vers les testicules"],"c":0,"e":"Après l'éjaculation, les spermatozoïdes doivent parcourir les voies génitales féminines pour atteindre le lieu habituel de la fécondation."},{"q":"La fécondation, chez l'espèce humaine, correspond à :","o":["la fusion du spermatozoïde et de l'ovocyte, formant l'œuf (zygote)","la simple rencontre sans fusion des deux gamètes","la division de l'ovocyte sans intervention du spermatozoïde","la formation directe d'un fœtus sans étape intermédiaire"],"c":0,"e":"La fécondation est l'union des noyaux du spermatozoïde et de l'ovocyte, restaurant la diploïdie et formant l'œuf."},{"q":"La segmentation, étape du développement précoce de l'œuf, correspond à :","o":["une suite de divisions cellulaires rapides sans augmentation de la taille globale de l'embryon","une seule division cellulaire unique","l'absence totale de division cellulaire","la formation directe du placenta"],"c":0,"e":"La segmentation multiplie le nombre de cellules de l'embryon par divisions successives rapprochées, sans croissance de volume global."},{"q":"La nidation correspond à :","o":["l'implantation de l'embryon dans la muqueuse utérine (endomètre)","la fusion des gamètes","la formation du corps jaune","le début de l'accouchement"],"c":0,"e":"La nidation est le processus par lequel l'embryon s'implante dans l'endomètre utérin, préparant le développement de la grossesse."},{"q":"Le placenta, formé au cours de la grossesse, joue notamment un rôle dans :","o":["les échanges materno-fœtaux (nutriments, gaz, déchets) et la sécrétion hormonale","exclusivement la digestion du fœtus","exclusivement la formation osseuse du fœtus","la production de spermatozoïdes"],"c":0,"e":"Le placenta assure à la fois les échanges nécessaires au fœtus et la sécrétion d'hormones indispensables au maintien de la grossesse."},{"q":"L'accouchement se déroule classiquement en trois temps, à savoir :","o":["la dilatation du col, l'expulsion du fœtus, puis la délivrance (expulsion du placenta)","uniquement l'expulsion du fœtus","uniquement la dilatation du col","la fécondation, la nidation, puis la naissance"],"c":0,"e":"L'accouchement comprend classiquement la phase de dilatation, l'expulsion du fœtus, puis la délivrance du placenta."},{"q":"Le déterminisme de l'accouchement fait notamment intervenir :","o":["des mécanismes hormonaux, comme l'ocytocine, déclenchant les contractions utérines","exclusivement des facteurs mécaniques sans hormones","l'absence totale de régulation hormonale","uniquement le système nerveux somatique"],"c":0,"e":"Le déclenchement et le déroulement de l'accouchement résultent notamment de l'action de l'ocytocine, stimulant les contractions utérines."},{"q":"La production et la sécrétion du lait maternel, au niveau de la glande mammaire, sont stimulées principalement par :","o":["la prolactine","l'insuline","le glucagon","l'ADH"],"c":0,"e":"La prolactine, hormone hypophysaire, stimule la production de lait par les glandes mammaires après l'accouchement."},{"q":"L'éjection du lait maternel, lors de la tétée, est notamment stimulée par :","o":["l'ocytocine, libérée en réponse à la stimulation du mamelon","l'insuline uniquement","le glucagon uniquement","l'ADH exclusivement"],"c":0,"e":"L'ocytocine, libérée par réflexe lors de la succion, provoque la contraction des cellules myoépithéliales et l'éjection du lait."},{"q":"L'importance du lait maternel pour le nouveau-né réside notamment dans :","o":["l'apport de nutriments adaptés et d'anticorps protecteurs","l'absence totale de valeur nutritionnelle","un rôle uniquement psychologique sans effet biologique","un apport exclusivement en eau"],"c":0,"e":"Le lait maternel fournit à la fois les nutriments nécessaires à la croissance du nourrisson et des anticorps renforçant ses défenses immunitaires."}]},{"t":"Biologie — Contraception et IST/SIDA","m":"Biologie","f":"","g":"Mars","q":[{"q":"Les contraceptifs oraux (pilule) agissent principalement en :","o":["bloquant l'ovulation","détruisant les spermatozoïdes","augmentant la fécondité","stimulant les règles"],"c":0,"e":"La pilule combinée bloque la sécrétion de FSH/LH par rétrocontrôle négatif, empêchant ainsi l'ovulation."},{"q":"Parmi les moyens de contraception, celui qui protège aussi contre les IST est :","o":["la pilule","le stérilet","le préservatif","les injections hormonales"],"c":2,"e":"Le préservatif (masculin ou féminin) est la seule méthode contraceptive offrant une double protection : contraception et prévention des infections sexuellement transmissibles."},{"q":"Le VIH peut se transmettre par :","o":["voie sexuelle, sanguine et de la mère à l'enfant","simple contact cutané","piqûre de moustique","voie aérienne"],"c":0,"e":"Les trois principales voies de transmission du VIH sont sexuelle, sanguine (transfusion, objets souillés) et materno-fœtale (grossesse, accouchement, allaitement)."},{"q":"Les méthodes contraceptives naturelles reposent notamment sur :","o":["l'observation du cycle féminin pour éviter les rapports lors de la période fertile","l'utilisation systématique d'hormones de synthèse","une intervention chirurgicale définitive","l'usage exclusif du préservatif"],"c":0,"e":"Les méthodes naturelles, comme la méthode des températures ou du calendrier, visent à identifier la période fertile du cycle pour éviter la fécondation."},{"q":"Les méthodes contraceptives mécaniques comprennent notamment :","o":["le préservatif et le diaphragme, créant une barrière physique","la pilule contraceptive hormonale","la stérilisation chirurgicale définitive uniquement","l'abstinence périodique uniquement"],"c":0,"e":"Les méthodes mécaniques, comme le préservatif, empêchent physiquement la rencontre des gamètes."},{"q":"Les méthodes contraceptives chimiques (hormonales), comme la pilule, agissent notamment en :","o":["bloquant l'ovulation par régulation hormonale","créant une barrière physique aux spermatozoïdes","stérilisant définitivement l'utilisateur","n'ayant aucun effet sur le cycle ovarien"],"c":0,"e":"La pilule contraceptive agit en modifiant les taux d'hormones, ce qui bloque généralement l'ovulation."},{"q":"Les méthodes contraceptives chirurgicales, comme la ligature des trompes ou la vasectomie, sont caractérisées par :","o":["un caractère généralement définitif ou difficilement réversible","un effet temporaire et facilement réversible","l'absence totale d'efficacité contraceptive","l'utilisation exclusive d'hormones"],"c":0,"e":"Contrairement aux autres méthodes, les techniques chirurgicales de contraception sont le plus souvent définitives ou difficilement réversibles."},{"q":"Parmi les avantages du préservatif, comparé aux autres méthodes contraceptives, figure notamment :","o":["une protection simultanée contre les infections sexuellement transmissibles","une efficacité contraceptive de 100% dans tous les cas","l'absence de nécessité d'utilisation à chaque rapport","un effet hormonal protecteur supplémentaire"],"c":0,"e":"Le préservatif, contrairement à la plupart des autres méthodes, protège à la fois de la grossesse non désirée et des infections sexuellement transmissibles."},{"q":"Les infections sexuellement transmissibles (IST) se transmettent principalement par :","o":["les rapports sexuels non protégés","l'air ambiant","une simple poignée de main","l'eau de boisson"],"c":0,"e":"Les IST, dont le VIH, se transmettent essentiellement par contact sexuel non protégé avec une personne infectée."},{"q":"La prévention des IST repose notamment sur :","o":["l'utilisation systématique du préservatif lors des rapports sexuels","l'absence de toute mesure préventive possible","la seule contraception hormonale","une alimentation particulière"],"c":0,"e":"L'usage du préservatif constitue le moyen de prévention le plus efficace contre la transmission des IST."},{"q":"Le dépistage précoce d'une IST, y compris le VIH, présente l'avantage de :","o":["permettre une prise en charge rapide et de limiter la transmission","n'avoir aucune utilité médicale","aggraver systématiquement la maladie","remplacer totalement le traitement"],"c":0,"e":"Un dépistage précoce permet d'initier rapidement un traitement adapté et de réduire le risque de transmission à d'autres personnes."},{"q":"Le traitement des IST d'origine bactérienne repose généralement sur :","o":["une antibiothérapie adaptée","un traitement antiviral uniquement","l'absence de tout traitement disponible","la seule contraception hormonale"],"c":0,"e":"Contrairement aux IST virales comme le VIH, les IST bactériennes peuvent généralement être traitées efficacement par antibiotiques."},{"q":"Contrairement à une idée reçue rappelée dans les recommandations pédagogiques, l'avortement :","o":["n'est pas une méthode contraceptive, mais résulte souvent d'un manque de contraception","est la méthode contraceptive la plus fiable","doit être utilisé comme moyen de contraception principal","empêche toute grossesse future"],"c":0,"e":"L'avortement ne doit pas être considéré comme un moyen de contraception ; il intervient souvent en raison de l'absence ou de l'échec d'une contraception adaptée."}]},{"t":"Biologie — Mécanismes de défense de l'organisme","m":"Biologie","f":"","g":"Mars","q":[{"q":"La première ligne de défense de l'organisme contre les micro-organismes est constituée par :","o":["les lymphocytes B","la peau et les muqueuses","les anticorps","les vaccins"],"c":1,"e":"La peau et les muqueuses forment une barrière naturelle physique et chimique, première ligne de défense non spécifique."},{"q":"La phagocytose, mécanisme de défense non spécifique, est assurée principalement par :","o":["les hématies","les macrophages et certains leucocytes","les plaquettes","les cellules musculaires"],"c":1,"e":"Les macrophages et polynucléaires neutrophiles ingèrent et détruisent les agents pathogènes par phagocytose."},{"q":"L'inflammation (rougeur, chaleur, douleur, gonflement) est une réaction de défense :","o":["spécifique et acquise","non spécifique, immédiate face à une agression","propre uniquement aux virus","déclenchée seulement par la vaccination"],"c":1,"e":"L'inflammation est une réponse immunitaire innée, non spécifique, qui se met en place rapidement après toute agression tissulaire."},{"q":"La réaction inflammatoire, première étape de la défense non spécifique, se manifeste notamment par :","o":["rougeur, chaleur, douleur et gonflement au site de l'infection","une absence totale de symptômes visibles","une fièvre généralisée uniquement","une perte immédiate de conscience"],"c":0,"e":"L'inflammation, réaction locale de défense, se caractérise classiquement par ces quatre signes cardinaux."},{"q":"La réaction ganglionnaire, observée lors d'une infection locale, correspond à :","o":["une augmentation de volume des ganglions lymphatiques proches du site infecté","une diminution du volume des ganglions","l'absence de toute réaction des ganglions","une réaction exclusivement cutanée"],"c":0,"e":"Les ganglions lymphatiques proches du foyer infectieux augmentent de volume en raison de l'intense activité immunitaire qui s'y déroule."},{"q":"La réaction généralisée, comme la fièvre, lors d'une infection, correspond à :","o":["une réponse systémique de l'organisme face à l'infection","une réaction strictement locale uniquement","l'absence totale de réponse de l'organisme","une réaction propre uniquement aux tissus musculaires"],"c":0,"e":"La fièvre est une réaction générale de l'organisme, souvent bénéfique pour lutter contre l'infection, en complément des réactions locales."},{"q":"La défense non spécifique de l'organisme est qualifiée d'innée car elle est :","o":["présente dès la naissance et ne nécessite pas de contact préalable avec l'agent pathogène","acquise progressivement après plusieurs infections","spécifique à un seul agent pathogène déterminé","absente chez le nouveau-né"],"c":0,"e":"La défense innée est immédiatement disponible, sans nécessiter une reconnaissance préalable spécifique de l'agent pathogène."},{"q":"L'expérience d'injection de toxine puis d'anatoxine permet notamment de mettre en évidence :","o":["l'existence d'une défense spécifique, avec mémoire immunitaire","l'absence totale de réponse immunitaire","uniquement la défense non spécifique","l'effet exclusif des antibiotiques"],"c":0,"e":"Ce type d'expérience historique a permis de révéler l'existence d'une réponse immunitaire spécifique, capable de neutraliser un antigène précis."},{"q":"L'expérience de transfert de lymphocytes d'un sujet vacciné à un autre organisme illustre notamment :","o":["l'existence d'une immunité à médiation cellulaire, transférable par les lymphocytes","l'absence totale de rôle des lymphocytes","uniquement l'action des anticorps solubles","un phénomène exclusivement non spécifique"],"c":0,"e":"Le transfert de lymphocytes vivants d'un sujet immunisé peut conférer une protection à un autre organisme, révélant le rôle central des lymphocytes dans l'immunité spécifique."},{"q":"L'expérience de greffe croisée entre individus génétiquement différents permet de mettre en évidence :","o":["l'existence des notions de « soi » et de « non-soi »","l'absence totale de rejet de greffe","une compatibilité systématique entre tous les individus","uniquement des phénomènes non spécifiques"],"c":0,"e":"Le rejet observé lors d'une greffe croisée révèle que le système immunitaire distingue le « soi » du « non-soi »."},{"q":"Le complexe majeur d'histocompatibilité (CMH) joue un rôle essentiel dans :","o":["la reconnaissance du soi par le système immunitaire","la digestion des aliments","la régulation de la pression artérielle","la contraction musculaire"],"c":0,"e":"Le CMH, présent à la surface des cellules, permet au système immunitaire de reconnaître les cellules de l'organisme comme faisant partie du « soi »."},{"q":"La reconnaissance entre le CMH et les récepteurs membranaires du système immunitaire permet notamment de :","o":["distinguer les cellules du soi de celles étrangères ou anormales","empêcher toute réaction immunitaire","fusionner systématiquement les cellules entre elles","supprimer toute activité des lymphocytes"],"c":0,"e":"Cette reconnaissance moléculaire est à la base de la capacité du système immunitaire à détecter des cellules infectées, anormales ou étrangères."},{"q":"Une auto-greffe, contrairement à une greffe croisée entre individus différents, n'entraîne généralement pas de rejet car :","o":["le greffon provient du même individu, reconnu comme faisant partie du soi","le greffon est systématiquement rejeté quel que soit son origine","le système immunitaire est totalement inactif lors d'une auto-greffe","l'auto-greffe supprime toute réaction immunitaire future"],"c":0,"e":"Une auto-greffe utilise un tissu du même individu, reconnu comme « soi » par le système immunitaire, ce qui évite le rejet."}]},{"t":"Biologie — Réponse immunitaire humorale et cellulaire","m":"Biologie","f":"","g":"Avril","q":[{"q":"La réponse immunitaire humorale repose principalement sur :","o":["les lymphocytes T cytotoxiques","les lymphocytes B et la production d'anticorps","les macrophages uniquement","les cellules musculaires"],"c":1,"e":"Les lymphocytes B, activés, se différencient en plasmocytes sécrétant des anticorps spécifiques dirigés contre l'antigène (immunité à médiation humorale)."},{"q":"La réponse immunitaire cellulaire repose sur l'action directe :","o":["des anticorps circulants","des lymphocytes T cytotoxiques (LT8), qui détruisent les cellules infectées","des globules rouges","du complément uniquement"],"c":1,"e":"Les lymphocytes T cytotoxiques reconnaissent et détruisent directement les cellules infectées ou anormales (immunité à médiation cellulaire)."},{"q":"Lors d'un second contact avec le même antigène, la réponse immunitaire est plus rapide et plus intense grâce :","o":["aux cellules mémoire issues du premier contact","à une nouvelle mutation du système immunitaire","à l'absence de reconnaissance de l'antigène","au hasard"],"c":0,"e":"Les lymphocytes B et T mémoire, formés lors de la réponse primaire, permettent une réponse secondaire rapide et amplifiée (base de la vaccination)."},{"q":"La réponse immunitaire à médiation humorale repose principalement sur :","o":["la production d'anticorps solubles par les lymphocytes B (plasmocytes)","l'action directe des lymphocytes T sur les cellules infectées","l'absence totale d'intervention lymphocytaire","la sécrétion d'hormones pancréatiques"],"c":0,"e":"La réponse humorale est assurée par les anticorps, sécrétés dans le sang et la lymphe par les plasmocytes issus des lymphocytes B."},{"q":"La réponse immunitaire à médiation cellulaire repose principalement sur :","o":["l'action directe des lymphocytes T cytotoxiques sur les cellules infectées ou anormales","la seule production d'anticorps solubles","l'absence totale de cellules immunitaires","la sécrétion exclusive d'hormones"],"c":0,"e":"La réponse cellulaire implique l'action directe des lymphocytes T cytotoxiques, qui détruisent les cellules infectées ou anormales par contact."},{"q":"Un anticorps est une molécule capable de se fixer spécifiquement sur :","o":["un antigène déterminé, dont il reconnaît une structure précise","tous les antigènes indifféremment","uniquement les cellules du soi","aucune structure moléculaire particulière"],"c":0,"e":"La spécificité de l'anticorps repose sur sa capacité à reconnaître précisément une structure antigénique déterminée."},{"q":"Les plasmocytes, cellules effectrices de la réponse humorale, dérivent de la différenciation :","o":["des lymphocytes B activés","des lymphocytes T uniquement","des cellules musculaires","des cellules nerveuses"],"c":0,"e":"Après activation et sélection clonale, les lymphocytes B se différencient en plasmocytes, cellules sécrétrices d'anticorps."},{"q":"Les lymphocytes T cytotoxiques exercent leur action en :","o":["détruisant directement les cellules infectées ou anormales par contact","sécrétant uniquement des anticorps solubles","stimulant exclusivement la digestion","produisant de l'insuline"],"c":0,"e":"Contrairement aux lymphocytes B, les lymphocytes T cytotoxiques agissent par contact direct, détruisant les cellules ciblées."},{"q":"La notion de coopération cellulaire, dans la réponse immunitaire, désigne :","o":["l'interaction entre différents types de cellules immunitaires (lymphocytes T auxiliaires, B, macrophages) pour une réponse efficace","l'action isolée d'un seul type cellulaire sans aucune interaction","l'absence totale de communication entre cellules immunitaires","une réaction exclusivement non spécifique"],"c":0,"e":"Une réponse immunitaire efficace repose sur la coopération entre plusieurs types cellulaires, notamment les lymphocytes T auxiliaires qui stimulent les lymphocytes B et T cytotoxiques."},{"q":"Les lymphocytes T auxiliaires (ou T4) jouent un rôle central dans la coopération cellulaire en :","o":["stimulant l'activation des lymphocytes B et des lymphocytes T cytotoxiques","détruisant directement les cellules infectées","sécrétant eux-mêmes des anticorps","n'ayant aucun rôle dans la réponse immunitaire"],"c":0,"e":"Les lymphocytes T auxiliaires coordonnent la réponse immunitaire en stimulant, via des messagers chimiques, l'activation d'autres cellules immunitaires."},{"q":"La sélection clonale désigne le phénomène par lequel :","o":["seuls les lymphocytes spécifiques d'un antigène donné se multiplient activement après reconnaissance de cet antigène","tous les lymphocytes se multiplient de façon identique quel que soit l'antigène","aucun lymphocyte ne se multiplie après reconnaissance d'un antigène","les lymphocytes disparaissent après reconnaissance d'un antigène"],"c":0,"e":"Seuls les lymphocytes possédant un récepteur spécifique de l'antigène rencontré prolifèrent, formant un clone de cellules spécifiques."},{"q":"La mémoire immunitaire, résultant d'un premier contact avec un antigène, permet lors d'un second contact :","o":["une réponse immunitaire plus rapide et plus intense","une réponse immunitaire plus lente et plus faible","l'absence totale de réponse immunitaire","une réponse identique en tout point au premier contact"],"c":0,"e":"Grâce aux lymphocytes mémoire formés lors du premier contact, la réponse immunitaire lors d'un second contact avec le même antigène est nettement plus rapide et plus efficace."},{"q":"Le principe de la vaccination repose sur :","o":["l'induction d'une mémoire immunitaire par un contact contrôlé avec un antigène atténué ou inactivé","l'apport direct d'anticorps déjà formés","la destruction du système immunitaire","l'absence totale de réponse immunitaire induite"],"c":0,"e":"La vaccination stimule le système immunitaire à produire des lymphocytes mémoire, préparant une réponse rapide en cas d'infection réelle ultérieure."},{"q":"La sérothérapie, contrairement à la vaccination, consiste à :","o":["injecter directement des anticorps déjà formés, pour une protection immédiate mais temporaire","stimuler la production de lymphocytes mémoire à long terme","injecter un antigène atténué","détruire le système immunitaire du patient"],"c":0,"e":"La sérothérapie apporte une protection passive et immédiate par des anticorps déjà formés, mais sans induire de mémoire immunitaire durable."},{"q":"L'immunité acquise, développée après une infection ou une vaccination, se distingue de l'immunité innée par :","o":["sa spécificité vis-à-vis d'un antigène précis et sa capacité de mémoire","son caractère immédiat et non spécifique","l'absence totale de spécificité","son incapacité à générer une mémoire"],"c":0,"e":"Contrairement à l'immunité innée, l'immunité acquise (spécifique) cible précisément un antigène donné et peut générer une mémoire immunitaire durable."},{"q":"Une réaction allergique résulte d'une réponse immunitaire :","o":["excessive ou inadaptée face à une substance généralement inoffensive","totalement absente face à un antigène dangereux","identique en tout point à une réponse immunitaire normale","exclusivement due à une carence en anticorps"],"c":0,"e":"L'allergie est une réaction immunitaire disproportionnée ou inadaptée déclenchée par un allergène habituellement anodin."},{"q":"Les greffes d'organes nécessitent généralement un traitement immunosuppresseur afin de :","o":["limiter la réponse immunitaire du receveur contre le greffon et éviter le rejet","stimuler davantage la réponse immunitaire contre le greffon","garantir un rejet systématique du greffon","n'avoir aucun effet sur la réponse immunitaire"],"c":0,"e":"Les immunosuppresseurs réduisent l'activité du système immunitaire du receveur pour limiter le risque de rejet du greffon perçu comme « non-soi »."},{"q":"Les aides à la réponse immunitaire (vaccins, sérums, greffes de moelle) illustrent notamment :","o":["les différentes stratégies médicales exploitant les mécanismes immunitaires pour protéger l'organisme","l'absence totale d'application médicale de l'immunologie","un phénomène purement théorique sans application pratique","une seule méthode universelle sans variantes"],"c":0,"e":"Ces différentes approches médicales s'appuient toutes sur la compréhension des mécanismes immunitaires pour prévenir ou traiter les maladies."}]},{"t":"Biologie — Dysfonctionnements du système immunitaire (VIH/SIDA)","m":"Biologie","f":"","g":"Avril","q":[{"q":"Le VIH infecte préférentiellement :","o":["les hématies","les lymphocytes T4 (CD4+)","les cellules musculaires","les cellules osseuses"],"c":1,"e":"Le VIH se fixe sur le récepteur CD4 et infecte principalement les lymphocytes T4 (auxiliaires), essentiels à la coordination de la réponse immunitaire."},{"q":"Le stade SIDA correspond à :","o":["la phase initiale, souvent asymptomatique, de l'infection par le VIH","un effondrement du système immunitaire avec apparition d'infections opportunistes","la guérison complète de l'infection","une simple séropositivité sans symptôme"],"c":1,"e":"Le SIDA (syndrome d'immunodéficience acquise) est le stade avancé où le taux de LT4 s'effondre, laissant l'organisme vulnérable à des infections et cancers opportunistes."},{"q":"Le traitement antirétroviral (trithérapie) contre le VIH permet de :","o":["éliminer totalement le virus de l'organisme","ralentir la multiplication virale et retarder l'évolution vers le SIDA","immuniser définitivement contre le virus","empêcher toute transmission du virus"],"c":1,"e":"La trithérapie antirétrovirale ne guérit pas l'infection mais réduit fortement la charge virale, ralentissant la progression vers le stade SIDA et améliorant la qualité de vie."},{"q":"L'adsorption du VIH sur le lymphocyte T4 constitue la première étape de l'infection, reposant sur :","o":["la reconnaissance spécifique entre les protéines virales et les récepteurs membranaires du lymphocyte T4","une pénétration aléatoire sans reconnaissance spécifique","l'action directe des anticorps","la digestion du virus par la cellule"],"c":0,"e":"L'entrée du VIH dans le lymphocyte T4 débute par la reconnaissance spécifique entre les glycoprotéines virales et les récepteurs de la cellule cible."},{"q":"Après adsorption, le VIH injecte dans le lymphocyte T4 notamment :","o":["son ARN viral et l'enzyme transcriptase inverse","directement de l'ADN double brin","uniquement des protéines sans matériel génétique","aucun matériel génétique"],"c":0,"e":"Le VIH, rétrovirus à ARN, introduit son ARN génomique ainsi que la transcriptase inverse nécessaire à sa réplication."},{"q":"La transcriptase inverse, enzyme caractéristique du VIH, permet notamment :","o":["la transformation de l'ARN viral en ADN proviral","la transformation directe de l'ADN en protéines","la destruction immédiate du matériel génétique viral","la réplication de l'ADN de la cellule hôte uniquement"],"c":0,"e":"Cette enzyme rétrotranscrit l'ARN viral en ADN, une étape indispensable à l'intégration du virus dans le génome de la cellule hôte."},{"q":"L'ADN proviral formé à partir de l'ARN viral du VIH s'intègre ensuite :","o":["dans l'ADN du lymphocyte T4 infecté","uniquement dans le cytoplasme sans intégration","dans l'ADN d'autres cellules non infectées","dans aucune structure cellulaire"],"c":0,"e":"L'ADN proviral s'intègre au génome de la cellule hôte, ce qui permet au virus de détourner la machinerie cellulaire pour se multiplier."},{"q":"Après intégration à l'ADN de la cellule, le VIH peut se multiplier, ce qui aboutit notamment à :","o":["la production de nouvelles particules virales et à la destruction progressive du lymphocyte T4 infecté","la guérison spontanée de la cellule infectée","l'absence totale de conséquence pour la cellule","la transformation du lymphocyte T4 en cellule cancéreuse uniquement"],"c":0,"e":"La multiplication virale conduit à la production de nouveaux virions et, généralement, à la destruction progressive des lymphocytes T4 infectés."},{"q":"La production d'anticorps anti-VIH, détectable après l'infection, définit le statut dit :","o":["séropositif","séronégatif","immunodéficient total","vacciné"],"c":0,"e":"La détection d'anticorps anti-VIH dans le sang définit la séropositivité, signe que l'organisme a été en contact avec le virus."},{"q":"La phase de latence clinique de l'infection par le VIH correspond à une période où :","o":["le virus reste présent mais l'individu séropositif ne présente pas encore de symptômes majeurs","le virus a totalement disparu de l'organisme","les symptômes du SIDA sont déjà pleinement développés","l'individu n'est plus du tout contagieux"],"c":0,"e":"Durant cette phase, souvent longue, le virus continue de se répliquer à bas bruit alors que l'individu reste largement asymptomatique."},{"q":"La prolifération progressive du VIH entraîne une dégradation du système immunitaire, se traduisant notamment par :","o":["une diminution du nombre de lymphocytes T4, affaiblissant les défenses de l'organisme","une augmentation du nombre de lymphocytes T4","un renforcement des défenses immunitaires","l'absence totale d'effet sur le système immunitaire"],"c":0,"e":"La destruction progressive des lymphocytes T4, cellules centrales de la coopération immunitaire, affaiblit progressivement l'ensemble du système immunitaire."},{"q":"Le stade SIDA, stade avancé de l'infection par le VIH, se caractérise par :","o":["un système immunitaire fortement affaibli, exposant à des infections opportunistes graves","une immunité renforcée et sans risque infectieux particulier","l'absence totale de symptômes","la guérison complète de l'infection"],"c":0,"e":"Le SIDA correspond au stade où l'immunodéficience est telle que l'organisme devient vulnérable à des infections ou cancers dits opportunistes."},{"q":"Les infections opportunistes, caractéristiques du stade SIDA, sont dues à :","o":["des agents pathogènes habituellement contrôlés par un système immunitaire normal","des agents pathogènes particulièrement virulents chez tout individu, même non infecté par le VIH","l'absence totale d'agents pathogènes","une réaction allergique généralisée"],"c":0,"e":"Ces infections, généralement bénignes chez un individu immunocompétent, deviennent graves chez une personne dont l'immunité est fortement affaiblie."},{"q":"Le traitement antirétroviral (trithérapie) contre le VIH permet notamment de :","o":["ralentir fortement la multiplication du virus et retarder l'évolution vers le stade SIDA","éliminer totalement et définitivement le virus de l'organisme","transformer une personne séropositive en séronégative","empêcher toute transmission ultérieure sans autre précaution"],"c":0,"e":"Sans guérir définitivement l'infection, la trithérapie réduit fortement la charge virale, ralentissant considérablement l'évolution de la maladie."},{"q":"Le VIH cible préférentiellement les lymphocytes T4 en raison de :","o":["la présence, à la surface de ces cellules, de récepteurs spécifiquement reconnus par les protéines virales","l'absence totale de spécificité du virus pour un type cellulaire donné","leur grande taille facilitant l'entrée du virus","leur localisation exclusive dans le cerveau"],"c":0,"e":"La spécificité d'infection du VIH pour les lymphocytes T4 s'explique par la reconnaissance moléculaire entre protéines virales et récepteurs cellulaires spécifiques."},{"q":"La notion de dysfonctionnement du système immunitaire, illustrée par le VIH/SIDA, désigne globalement :","o":["une altération du fonctionnement normal des défenses immunitaires, qu'elle soit par excès (allergie) ou par déficit (immunodéficience)","uniquement une réponse immunitaire trop faible","uniquement une réponse immunitaire excessive","l'absence de toute pathologie liée à l'immunité"],"c":0,"e":"Les dysfonctionnements immunitaires regroupent aussi bien les réponses excessives (allergies) que les déficits immunitaires (comme celui provoqué par le VIH)."},{"q":"La prévention de la transmission du VIH repose notamment sur :","o":["l'usage du préservatif, le dépistage et la prise en charge des personnes séropositives","l'absence de toute mesure préventive efficace","exclusivement un traitement curatif après l'infection","la vaccination systématique, actuellement disponible et généralisée"],"c":0,"e":"En l'absence de vaccin largement disponible, la prévention repose essentiellement sur des mesures comportementales et le dépistage précoce."},{"q":"Le VIH appartient à la famille des rétrovirus, caractérisés notamment par :","o":["un génome à ARN et la capacité de le rétrotranscrire en ADN grâce à la transcriptase inverse","un génome à ADN double brin classique","l'absence totale de matériel génétique","une multiplication indépendante de toute cellule hôte"],"c":0,"e":"Les rétrovirus, dont le VIH, se distinguent par un génome ARN converti en ADN via la transcriptase inverse avant intégration dans la cellule hôte."}]},{"t": "Philosophie — La notion de vérité", "m": "Philosophie", "f": "", "g": "Octobre", "q": [{"q": "Selon la définition classique, la vérité est :", "o": ["l'accord de la pensée avec la réalité", "l'opinion de la majorité", "ce qui est utile", "ce qui est agréable"], "c": 0, "e": "Adaequatio rei et intellectus (Thomas d'Aquin) : conformité entre ce que l'on pense ou dit et ce qui est."}, {"q": "La vérité formelle est :", "o": ["l'accord avec l'expérience", "l'accord avec la majorité", "une croyance sincère", "l'accord de la pensée avec elle-même (cohérence, absence de contradiction)"], "c": 3, "e": "C'est la vérité des mathématiques et de la logique ; la vérité matérielle, elle, est l'accord avec le réel."}, {"q": "Une opinion se distingue de la vérité parce qu'elle est :", "o": ["toujours fausse", "toujours démontrée", "un jugement non prouvé, sujet à l'erreur", "universelle"], "c": 2, "e": "Une opinion peut être juste par hasard, mais elle n'est pas fondée sur des preuves."}, {"q": "La certitude est :", "o": ["identique à la vérité", "l'état d'esprit de celui qui adhère fermement à une idée, sans garantir qu'elle soit vraie", "un synonyme d'erreur", "un doute méthodique"], "c": 1, "e": "On peut être certain et se tromper : la certitude est subjective, la vérité est objective."}, {"q": "Une vérité relative est :", "o": ["une vérité partielle, que le progrès des connaissances peut corriger et préciser", "une erreur", "une vérité éternelle", "une croyance religieuse"], "c": 0, "e": "La science avance par vérités relatives de plus en plus proches de la vérité absolue."}, {"q": "Pour Descartes, l'erreur vient surtout :", "o": ["des sens uniquement", "de la mémoire seulement", "de la volonté de Dieu", "d'un jugement précipité où la volonté va plus loin que l'entendement"], "c": 3, "e": "Méditation IV : on se trompe en affirmant ce qu'on ne conçoit pas clairement."}, {"q": "La vérité objective est celle qui :", "o": ["dépend des goûts de chacun", "change selon l'humeur", "est indépendante de l'opinion de chacun et s'impose à tous", "est toujours religieuse"], "c": 2, "e": "Elle porte sur la réalité elle-même, non sur les préférences."}, {"q": "Le scepticisme soutient que :", "o": ["la vérité est évidente pour tous", "la vérité est inaccessible ou incertaine, d'où la suspension du jugement", "seule l'expérience est vraie", "tout est démontrable"], "c": 1, "e": "Pyrrhon dans l'Antiquité, Montaigne à la Renaissance."}, {"q": "Le dogmatisme consiste à :", "o": ["affirmer la vérité sans examen critique", "douter de tout", "chercher systématiquement la preuve", "refuser d'affirmer quoi que ce soit"], "c": 0, "e": "Le dogmatique tient ses idées pour vraies sans les discuter."}, {"q": "Le doute méthodique de Descartes est :", "o": ["un doute définitif", "une croyance", "un refus de penser", "un moyen provisoire pour atteindre une vérité indubitable"], "c": 3, "e": "Il aboutit au cogito."}, {"q": "Quelle formule exprime le cogito ?", "o": ["« Connais-toi toi-même »", "« Tout coule »", "« Je pense, donc je suis »", "« L'homme est un loup pour l'homme »"], "c": 2, "e": "C'est la première vérité indubitable trouvée par Descartes."}, {"q": "Comment appelle-t-on une croyance admise sans examen critique ?", "o": ["un axiome", "un préjugé", "un théorème", "une loi"], "c": 1, "e": "Le préjugé est un jugement formé d'avance, sans vérification."}, {"q": "La vérité diffère de la réalité en ce que :", "o": ["la réalité est ce qui est, la vérité est le jugement conforme à ce qui est", "elles sont identiques", "la vérité est un objet matériel", "la réalité est une opinion"], "c": 0, "e": "On dit d'un jugement qu'il est vrai, d'une chose qu'elle est réelle."}]},{"t": "Philosophie — Conceptions de la vérité et critères", "m": "Philosophie", "f": "", "g": "Novembre", "q": [{"q": "Pour la conception métaphysique, la vérité se trouve surtout :", "o": ["uniquement dans les données des sens", "dans une réalité transcendante (Idées, Être, Dieu) saisie par la raison ou l'intuition", "dans l'utilité pratique", "dans le vote de la majorité"], "c": 1, "e": "Chez Platon, le monde intelligible des Idées est plus vrai que le monde sensible."}, {"q": "La conception empirique affirme que la connaissance vraie provient :", "o": ["de l'expérience sensible", "d'idées innées", "de la révélation", "de l'autorité"], "c": 0, "e": "Thèse de Bacon, Locke et Hume : tout commence par les sens."}, {"q": "Quel philosophe est associé à la conception rationaliste de la vérité ?", "o": ["Locke", "Hume", "Bacon", "Descartes"], "c": 3, "e": "Le rationalisme fait de la raison la source de la vérité ; Locke, Hume et Bacon sont des empiristes."}, {"q": "Le critère de la vérité proposé par Descartes est :", "o": ["le succès pratique", "le consensus", "l'évidence (idées claires et distinctes)", "la tradition"], "c": 2, "e": "Premier précepte de la méthode : ne tenir pour vrai que ce qui est évident."}, {"q": "Dans les Thèses sur Feuerbach, Marx affirme que la vérité d'une pensée se prouve par :", "o": ["la contemplation", "la pratique", "l'autorité", "la tradition"], "c": 1, "e": "Pour Marx, c'est dans la pratique que l'homme prouve la vérité de sa pensée."}, {"q": "Pour le pragmatisme (William James), une idée est vraie si elle :", "o": ["est utile et réussit dans l'action", "est très ancienne", "est admise par la majorité", "est évidente"], "c": 0, "e": "Le critère pragmatique est le succès pratique de l'idée."}, {"q": "Saint Thomas d'Aquin définit la vérité comme :", "o": ["l'utilité", "le consensus", "la sensation", "l'adéquation de la chose et de l'intelligence"], "c": 3, "e": "Formule médiévale : adaequatio rei et intellectus."}, {"q": "Pour Locke, l'esprit à la naissance est comparable à :", "o": ["un livre déjà rempli", "un feu", "une table rase (tabula rasa)", "une machine"], "c": 2, "e": "Les idées viennent de l'expérience."}, {"q": "« Rien n'est dans l'intelligence qui n'ait d'abord été dans les sens » résume la thèse :", "o": ["rationaliste", "empiriste", "métaphysique", "sceptique"], "c": 1, "e": "Formule scolastique reprise par les empiristes."}, {"q": "Pour les rationalistes, les idées innées sont :", "o": ["présentes dans l'esprit indépendamment de l'expérience", "issues des sens", "inutiles", "imposées par la société"], "c": 0, "e": "Descartes : idées de Dieu, de l'âme, du nombre..."}, {"q": "Le critère de cohérence (non-contradiction) vaut surtout dans :", "o": ["la poésie", "les sciences expérimentales seules", "la cuisine", "les sciences formelles (logique, mathématiques)"], "c": 3, "e": "Une proposition qui se contredit ne peut pas être vraie."}, {"q": "Le critère du consensus fait dépendre la vérité :", "o": ["de l'évidence", "de l'expérience", "de l'accord du plus grand nombre", "de la révélation"], "c": 2, "e": "Limite : la majorité peut se tromper (on a cru la Terre plate)."}, {"q": "Le critère de la vérification expérimentale est propre :", "o": ["aux mathématiques pures", "aux sciences de la nature", "à la métaphysique", "à la poésie"], "c": 1, "e": "Une hypothèse est confirmée si l'expérience la vérifie."}]},{"t": "Philosophie — La logique : histoire et définition", "m": "Philosophie", "f": "", "g": "Décembre", "q": [{"q": "La logique peut se définir comme :", "o": ["l'étude du comportement social", "l'art de bien parler", "la science des lois et règles du raisonnement correct", "la science des nombres"], "c": 2, "e": "Elle étudie la validité de la pensée, indépendamment de son contenu."}, {"q": "Qui est considéré comme le fondateur de la logique formelle ?", "o": ["Platon", "Aristote", "Hegel", "Descartes"], "c": 1, "e": "Aristote a fondé la théorie du syllogisme ; ses traités de logique forment l'Organon."}, {"q": "Le Novum Organum (1620), qui met en avant l'induction, est l'œuvre de :", "o": ["Francis Bacon", "Aristote", "Kant", "Leibniz"], "c": 0, "e": "Bacon propose une logique de la découverte face au syllogisme d'Aristote."}, {"q": "La Logique de Port-Royal (1662) porte le titre complet :", "o": ["Le Discours de la méthode", "L'Organon", "La Critique de la raison pure", "La Logique ou l'Art de penser"], "c": 3, "e": "Elle est l'œuvre d'Arnauld et Nicole, d'inspiration cartésienne."}, {"q": "La logique mathématique (symbolique) naît au XIXᵉ siècle avec :", "o": ["Aristote et Platon", "Bacon et Locke", "Boole et Frege", "Héraclite et Parménide"], "c": 2, "e": "Boole (1854) et Frege (1879) traduisent le raisonnement en symboles et en calcul."}, {"q": "Le mot « logique » vient du grec logos, qui signifie :", "o": ["nombre", "raison, discours", "vie", "expérience"], "c": 1, "e": "Logos désigne à la fois la raison et le discours."}, {"q": "Les Stoïciens (Chrysippe) ont développé surtout :", "o": ["une logique des propositions", "la théorie de l'évolution", "la dialectique matérialiste", "la logique booléenne"], "c": 0, "e": "Elle complète la logique des termes d'Aristote."}, {"q": "L'ensemble des traités de logique d'Aristote s'appelle :", "o": ["l'Éthique à Nicomaque", "la Métaphysique", "la République", "l'Organon"], "c": 3, "e": "Organon signifie « instrument »."}, {"q": "Quels penseurs de la civilisation arabo-musulmane ont commenté Aristote et transmis sa logique ?", "o": ["Boole et Frege", "Marx et Engels", "Avicenne et Averroès", "Locke et Hume"], "c": 2, "e": "Ils ont joué un rôle majeur dans la transmission de sa pensée."}, {"q": "Hegel a développé :", "o": ["le syllogisme", "la logique dialectique", "la logique booléenne", "l'induction expérimentale"], "c": 1, "e": "Sa dialectique est idéaliste ; Marx la reprend en version matérialiste."}, {"q": "La logique formelle s'intéresse :", "o": ["à la forme du raisonnement, non à son contenu", "au contenu seulement", "aux émotions", "à l'histoire des idées"], "c": 0, "e": "Elle vérifie la validité, pas la vérité matérielle."}, {"q": "Le but de la logique est de :", "o": ["produire de la poésie", "décrire les sociétés", "mesurer le temps", "distinguer le raisonnement valide du raisonnement faux"], "c": 3, "e": "Elle fournit des règles pour bien raisonner."}, {"q": "Russell et Whitehead sont les auteurs des :", "o": ["Éléments", "Organon", "Principia Mathematica", "Logique de Port-Royal"], "c": 2, "e": "Ouvrage (1910-1913) de logique mathématique."}]},{"t": "Philosophie — Concept, jugement, raisonnement, analyse et synthèse", "m": "Philosophie", "f": "", "g": "Décembre", "q": [{"q": "Un concept est :", "o": ["un jugement", "un raisonnement", "une image sensible particulière", "une idée générale et abstraite désignant une classe d'êtres ou d'objets"], "c": 3, "e": "Exemple : le concept « homme » s'applique à tous les hommes."}, {"q": "Dans le jugement « La terre est ronde », le prédicat (attribut) est :", "o": ["la terre", "est", "ronde", "toute la phrase"], "c": 2, "e": "Sujet : la terre ; copule : est ; prédicat : ronde."}, {"q": "Le jugement est l'opération par laquelle l'esprit :", "o": ["forme une idée générale", "affirme ou nie un rapport entre des concepts", "tire une conclusion de plusieurs propositions", "divise un tout"], "c": 1, "e": "Sa forme verbale est la proposition."}, {"q": "Le raisonnement déductif va :", "o": ["du général au particulier", "du particulier au général", "du sensible à l'imaginaire", "du hasard au certain"], "c": 0, "e": "L'induction fait l'inverse : du particulier au général."}, {"q": "Dans « Tout homme est mortel ; Socrate est un homme ; donc Socrate est mortel », « Socrate est un homme » est :", "o": ["la majeure", "la conclusion", "le moyen terme", "la mineure"], "c": 3, "e": "La majeure est « Tout homme est mortel » ; le moyen terme est « homme »."}, {"q": "L'analyse consiste à :", "o": ["rassembler des éléments en un tout", "généraliser à partir de cas", "décomposer un tout en ses éléments pour les étudier", "affirmer sans preuve"], "c": 2, "e": "La synthèse est l'opération inverse : recomposer le tout (Descartes : diviser, puis conduire par ordre)."}, {"q": "La compréhension d'un concept est :", "o": ["l'ensemble des êtres auxquels il s'applique", "l'ensemble des caractères qui le définissent", "son nom", "son image"], "c": 1, "e": "L'ensemble des objets concernés est son extension."}, {"q": "L'extension du concept « oiseau » comprend :", "o": ["tous les oiseaux", "les ailes et le bec", "le vol", "le mot « oiseau »"], "c": 0, "e": "Extension : ensemble des êtres désignés par le concept."}, {"q": "Plus l'extension d'un concept est grande, plus sa compréhension est :", "o": ["grande", "nulle", "égale", "petite"], "c": 3, "e": "Loi inverse : « animal » s'applique à plus d'êtres que « chat », mais dit moins."}, {"q": "Un jugement de valeur :", "o": ["constate un fait", "énonce une loi", "exprime une appréciation (bon, beau, juste)", "démontre un théorème"], "c": 2, "e": "Différent du jugement de réalité, qui constate."}, {"q": "L'induction va :", "o": ["du général au particulier", "du particulier au général", "du faux au vrai", "du concept au mot"], "c": 1, "e": "Elle généralise à partir de cas observés."}, {"q": "Le raisonnement par analogie conclut :", "o": ["d'une ressemblance observée à une ressemblance supposée", "avec une certitude absolue", "du général au particulier", "sans comparer"], "c": 0, "e": "Sa conclusion est probable, non certaine."}, {"q": "Un raisonnement est valide lorsque :", "o": ["la conclusion est agréable", "les prémisses sont nombreuses", "il plaît à l'auditoire", "la conclusion découle logiquement des prémisses"], "c": 3, "e": "Validité formelle ne veut pas dire vérité matérielle."}]},{"t": "Philosophie — La logique classique", "m": "Philosophie", "f": "", "g": "Janvier", "q": [{"q": "Le principe d'identité s'énonce :", "o": ["A est A", "A ne peut être à la fois A et non-A", "ou A, ou non-A", "tout A devient non-A"], "c": 0, "e": "C'est le premier principe de la logique d'Aristote."}, {"q": "Le principe de non-contradiction affirme qu'une chose :", "o": ["est toujours égale à elle-même", "peut être A ou non-A ou un intermédiaire", "change sans cesse", "ne peut pas être et ne pas être en même temps sous le même rapport"], "c": 3, "e": "On ne peut pas affirmer et nier la même chose à la fois."}, {"q": "Le principe du tiers exclu signifie que, entre deux propositions contradictoires :", "o": ["il y a toujours une position intermédiaire", "les deux sont vraies", "il n'y a pas de troisième possibilité", "les deux sont fausses"], "c": 2, "e": "Ou A, ou non-A : l'une des deux est vraie."}, {"q": "Une limite majeure de la logique classique est qu'elle :", "o": ["est trop dynamique", "envisage les choses de façon statique, sans rendre compte du mouvement et du changement", "n'a aucune règle", "ne connaît pas le raisonnement"], "c": 1, "e": "Elle fige les concepts, ce que reproche la dialectique."}, {"q": "Le syllogisme est jugé stérile par certains parce que sa conclusion :", "o": ["est déjà contenue dans les prémisses et n'apporte pas de connaissance vraiment nouvelle", "est toujours fausse", "n'a pas de prémisses", "dépend de l'expérience"], "c": 0, "e": "Critique de Descartes, Bacon et Stuart Mill."}, {"q": "L'apport essentiel de la logique classique est d'avoir établi :", "o": ["la théorie de l'évolution", "les lois de la dialectique", "la méthode expérimentale", "des règles de validité formelle du raisonnement"], "c": 3, "e": "Elle garantit la rigueur formelle de la pensée."}, {"q": "Identité, non-contradiction et tiers exclu sont :", "o": ["les lois de la dialectique", "les étapes de la méthode expérimentale", "les trois principes de la logique classique", "les critères de la vérité"], "c": 2, "e": "Ils fondent la logique d'Aristote."}, {"q": "Quelle proposition viole le principe de non-contradiction ?", "o": ["« Il pleut »", "« Il pleut et il ne pleut pas, au même endroit et au même moment »", "« Il ne pleut pas »", "« Il pleut parfois »"], "c": 1, "e": "On ne peut affirmer et nier la même chose sous le même rapport."}, {"q": "Une conclusion peut être valide mais fausse si :", "o": ["une prémisse est fausse", "les prémisses sont vraies et le raisonnement correct", "elle est évidente", "elle est courte"], "c": 0, "e": "Exemple : « Tout ce qui vole est oiseau ; l'avion vole ; donc c'est un oiseau »."}, {"q": "Un syllogisme comporte :", "o": ["deux propositions", "quatre propositions", "une seule proposition", "trois propositions : majeure, mineure, conclusion"], "c": 3, "e": "Il relie deux prémisses à une conclusion."}, {"q": "La logique classique convient bien pour :", "o": ["expliquer les révolutions", "prévoir le hasard", "vérifier la rigueur formelle d'un raisonnement", "décrire le devenir"], "c": 2, "e": "C'est son domaine de validité."}, {"q": "On reproche à la logique classique de :", "o": ["ne pas avoir de règles", "opposer rigidement les contraires sans voir leur transformation mutuelle", "être trop historique", "nier la raison"], "c": 1, "e": "Critique dialectique."}, {"q": "La dialectique met en cause le tiers exclu car :", "o": ["dans le réel en mouvement une chose peut devenir son contraire", "il est trop récent", "il est faux en mathématiques", "il n'existe pas"], "c": 0, "e": "Ex. : l'eau chauffée passe de liquide à gaz."}]},{"t": "Philosophie — La logique dialectique", "m": "Philosophie", "f": "", "g": "Janvier", "q": [{"q": "La logique dialectique étudie la réalité comme :", "o": ["un ensemble figé", "un processus en mouvement et en transformation", "une illusion", "un simple jeu de mots"], "c": 1, "e": "Elle pense le changement et le développement."}, {"q": "Quel penseur grec est associé à l'idée que « tout coule » (changement perpétuel) ?", "o": ["Héraclite", "Parménide", "Aristote", "Thalès"], "c": 0, "e": "Héraclite : on ne se baigne jamais deux fois dans le même fleuve."}, {"q": "Pour la dialectique, la source du mouvement et du développement est :", "o": ["une force extérieure seulement", "le hasard seulement", "l'immobilité", "la contradiction interne aux choses (unité et lutte des contraires)"], "c": 3, "e": "C'est la première loi de la dialectique."}, {"q": "Laquelle de ces propositions est une loi de la dialectique (Engels) ?", "o": ["le principe du tiers exclu", "la loi de l'identité", "le passage de la quantité à la qualité", "la loi de l'offre et de la demande"], "c": 2, "e": "Les trois lois : unité et lutte des contraires, quantité → qualité, négation de la négation."}, {"q": "La dialectique de Marx et Engels diffère de celle de Hegel parce qu'elle :", "o": ["nie tout mouvement", "part de la réalité matérielle et non de l'Idée", "refuse la contradiction", "est purement formelle"], "c": 1, "e": "Marx dit avoir « remis la dialectique sur ses pieds » : dialectique matérialiste contre dialectique idéaliste."}, {"q": "Quel exemple illustre le passage de la quantité à la qualité ?", "o": ["l'eau chauffée progressivement qui bout à 100 °C (changement d'état)", "un syllogisme valide", "une définition", "une opinion"], "c": 0, "e": "L'accumulation de changements quantitatifs produit un saut qualitatif."}, {"q": "Selon la dialectique, tout phénomène est :", "o": ["isolé et immuable", "indépendant de tout", "purement accidentel", "en liaison avec les autres et en mouvement"], "c": 3, "e": "Principes de liaison universelle et de développement."}, {"q": "La négation de la négation désigne :", "o": ["un retour exact au point de départ", "une simple destruction", "un dépassement qui conserve l'acquis à un niveau supérieur", "une contradiction logique"], "c": 2, "e": "Ex. : le grain, la plante, puis de nouveaux grains."}, {"q": "Quel est un exemple d'unité des contraires ?", "o": ["2 + 2 = 4", "les pôles positif et négatif d'un aimant", "un triangle", "une définition"], "c": 1, "e": "Les contraires sont inséparables et en tension."}, {"q": "Le schéma thèse, antithèse, synthèse est associé à :", "o": ["la dialectique de Hegel", "la logique d'Aristote", "la méthode de Bacon", "le pragmatisme"], "c": 0, "e": "Il décrit le dépassement des contradictions."}, {"q": "Dans la dialectique, la contradiction est :", "o": ["une erreur à éviter", "impossible", "sans effet", "le moteur du développement"], "c": 3, "e": "Les contradictions internes font évoluer les choses."}, {"q": "Engels expose la dialectique notamment dans :", "o": ["l'Organon", "le Novum Organum", "l'Anti-Dühring et la Dialectique de la nature", "la République"], "c": 2, "e": "Il y formule les trois lois de la dialectique."}, {"q": "La logique dialectique complète la logique classique en :", "o": ["supprimant toute raison", "prenant en compte le mouvement que la logique formelle laisse de côté", "supprimant toute règle", "niant la pensée"], "c": 1, "e": "Les deux logiques ont des domaines différents."}]},{"t": "Philosophie — Philosophie et biologie", "m": "Philosophie", "f": "", "g": "Février", "q": [{"q": "La biologie est la science qui étudie :", "o": ["les astres", "les nombres", "les êtres vivants et les phénomènes de la vie", "les lois sociales"], "c": 2, "e": "Du grec bios (vie) et logos (science)."}, {"q": "Quelle démarche est propre aux sciences expérimentales comme la biologie ?", "o": ["la démonstration axiomatique", "l'observation, l'hypothèse et l'expérimentation", "la révélation", "l'introspection seule"], "c": 1, "e": "Le vivant est étudié par observation, hypothèse, expérience et interprétation."}, {"q": "Qui a exposé la méthode expérimentale en médecine dans une Introduction publiée en 1865 ?", "o": ["Claude Bernard", "Aristote", "Platon", "Hegel"], "c": 0, "e": "Introduction à l'étude de la médecine expérimentale."}, {"q": "Le vitalisme soutient que le vivant :", "o": ["est une simple machine", "n'existe pas", "est immortel", "possède un principe vital irréductible aux seules lois physico-chimiques"], "c": 3, "e": "Il s'oppose au mécanisme (animal-machine de Descartes)."}, {"q": "La théorie de la sélection naturelle est présentée par :", "o": ["Pasteur", "Galilée", "Darwin (L'Origine des espèces, 1859)", "Euclide"], "c": 2, "e": "Elle explique l'évolution des espèces."}, {"q": "Un lien entre philosophie et biologie est que la philosophie :", "o": ["remplace la biologie", "s'interroge sur la nature de la vie et sur les limites éthiques de l'expérimentation sur le vivant", "ignore la vie", "n'étudie que les nombres"], "c": 1, "e": "Exemples : vitalisme/mécanisme, origine de la vie, bioéthique."}, {"q": "Le mécanisme considère le vivant comme :", "o": ["une machine soumise aux lois physico-chimiques", "animé par un principe vital", "immuable", "inexplicable"], "c": 0, "e": "Thèse de Descartes (animal-machine)."}, {"q": "L'approche biologique est spécifique parce que le vivant est :", "o": ["inerte", "sans structure", "immuable", "organisé, capable de se reproduire et de se réguler"], "c": 3, "e": "Organisation, reproduction, régulation caractérisent la vie."}, {"q": "L'expérimentation sur le vivant pose surtout un problème :", "o": ["grammatical", "géométrique", "éthique (respect de la vie et de la dignité)", "monétaire"], "c": 2, "e": "D'où la bioéthique."}, {"q": "La génétique moderne est fondée par :", "o": ["Newton", "Mendel (lois de l'hérédité, 1866)", "Euclide", "Hegel"], "c": 1, "e": "Ses expériences sur les pois ont fondé la génétique."}, {"q": "La classification des êtres vivants sert à :", "o": ["les ordonner selon leurs ressemblances et parentés", "les supprimer", "prouver Dieu", "mesurer le temps"], "c": 0, "e": "Exemple : le système de Linné."}, {"q": "Le fixisme soutient que les espèces :", "o": ["évoluent", "se transforment constamment", "naissent par hasard", "sont fixes et n'évoluent pas"], "c": 3, "e": "Il s'oppose à l'évolutionnisme (Lamarck, Darwin)."}, {"q": "Pasteur a réfuté :", "o": ["la gravitation", "l'évolution", "la génération spontanée", "l'hérédité"], "c": 2, "e": "Ses expériences du XIXᵉ siècle l'ont montré."}]},{"t": "Philosophie — Philosophie et mathématiques", "m": "Philosophie", "f": "", "g": "Mars", "q": [{"q": "Les mathématiques procèdent principalement par :", "o": ["observation de la nature uniquement", "révélation", "sondage d'opinion", "démonstration déductive à partir d'axiomes et de définitions"], "c": 3, "e": "C'est la méthode hypothético-déductive."}, {"q": "Un axiome est :", "o": ["un théorème démontré", "une hypothèse expérimentale provisoire", "une proposition admise sans démonstration, point de départ d'une théorie", "une opinion"], "c": 2, "e": "L'axiomatique organise une théorie à partir d'axiomes non contradictoires."}, {"q": "Les Éléments, modèle de présentation axiomatique, sont l'œuvre de :", "o": ["Descartes", "Euclide", "Gödel", "Bacon"], "c": 1, "e": "Euclide, IIIᵉ siècle av. J.-C."}, {"q": "Les géométries non euclidiennes sont nées de la remise en cause du :", "o": ["postulat des parallèles", "théorème de Pythagore", "principe d'identité", "calcul décimal"], "c": 0, "e": "Lobatchevski et Riemann ont montré qu'on peut changer d'axiomes sans contradiction."}, {"q": "Un algorithme est :", "o": ["une loi de la nature", "un axiome", "un jugement de valeur", "une suite finie d'opérations précises permettant de résoudre un problème"], "c": 3, "e": "Le mot vient du nom du mathématicien al-Khwarizmi (IXᵉ siècle)."}, {"q": "Galilée écrit que le livre de la nature est écrit en langage mathématique. Cela pose la question :", "o": ["de l'inexistence des nombres", "de l'origine des langues", "du rapport entre mathématiques abstraites et réel", "de l'histoire politique"], "c": 2, "e": "C'est le problème « mathématiques et réel »."}, {"q": "Un théorème est :", "o": ["une proposition admise sans preuve", "une proposition démontrée à partir des axiomes et théorèmes précédents", "une hypothèse expérimentale", "une opinion"], "c": 1, "e": "Il se distingue de l'axiome, admis sans preuve."}, {"q": "La démonstration par l'absurde consiste à :", "o": ["supposer le contraire et aboutir à une contradiction", "vérifier sur un exemple", "mesurer", "observer"], "c": 0, "e": "Exemple classique : l'irrationalité de √2."}, {"q": "Un contre-exemple permet de :", "o": ["la démontrer", "l'admettre", "la mesurer", "montrer qu'une proposition générale est fausse"], "c": 3, "e": "Un seul cas suffit à réfuter une proposition universelle."}, {"q": "Une axiomatique doit être avant tout :", "o": ["contradictoire", "sans règles", "non contradictoire (cohérente)", "expérimentale"], "c": 2, "e": "On demande aussi l'indépendance des axiomes."}, {"q": "Gödel (1931) a montré que :", "o": ["les mathématiques sont fausses", "tout système axiomatique cohérent assez riche contient des propositions indécidables", "les nombres n'existent pas", "tout est démontrable"], "c": 1, "e": "C'est le théorème d'incomplétude."}, {"q": "Pour le formalisme de Hilbert, les mathématiques sont :", "o": ["un système formel de symboles et de règles cohérentes", "une copie de la nature", "une révélation", "une expérience"], "c": 0, "e": "Il cherchait à fonder les mathématiques sur des axiomes sûrs."}, {"q": "Le raisonnement par récurrence sert à démontrer :", "o": ["une propriété physique", "une loi sociale", "une opinion", "une propriété valable pour tous les entiers à partir d'un rang"], "c": 3, "e": "Initialisation, hérédité, conclusion."}]},{"t": "Philosophie — Méthode expérimentale : faits, théories et lois", "m": "Philosophie", "f": "", "g": "Avril", "q": [{"q": "Dans la démarche expérimentale, l'ordre habituel est :", "o": ["observation des faits, hypothèse, expérience, loi puis théorie", "théorie, loi, hasard", "opinion, révélation, loi", "loi, faits inventés, hypothèse"], "c": 0, "e": "L'expérience contrôle l'hypothèse ; les lois sont ensuite organisées en théorie."}, {"q": "Une hypothèse scientifique est :", "o": ["une vérité définitive", "une croyance", "un fait brut", "une explication provisoire à vérifier par l'expérience"], "c": 3, "e": "Elle est confirmée, corrigée ou rejetée par l'expérience."}, {"q": "Une loi scientifique exprime :", "o": ["un fait isolé", "un ordre politique", "un rapport constant et nécessaire entre des phénomènes, souvent sous forme mathématique", "un souhait"], "c": 2, "e": "Exemple : la loi d'Ohm U = R·I."}, {"q": "Une théorie scientifique est :", "o": ["un simple fait", "un ensemble cohérent de lois et d'hypothèses qui explique et relie les faits", "une opinion personnelle", "une hypothèse non testée"], "c": 1, "e": "Elle systématise les lois et permet de prévoir de nouveaux faits."}, {"q": "Selon Karl Popper, une théorie est scientifique si elle est :", "o": ["réfutable (falsifiable) par l'expérience", "irréfutable", "ancienne", "admise par tous"], "c": 0, "e": "Critère de falsifiabilité."}, {"q": "Quand un fait bien établi contredit une théorie, le scientifique doit :", "o": ["ignorer le fait", "modifier le fait", "cesser toute recherche", "réexaminer et, au besoin, corriger ou abandonner la théorie"], "c": 3, "e": "C'est ainsi que la science progresse."}, {"q": "Un fait scientifique est :", "o": ["une rumeur", "une opinion", "un fait observé et établi avec rigueur, souvent construit par la méthode", "un souvenir"], "c": 2, "e": "Le fait brut devient fait scientifique après contrôle."}, {"q": "L'expérience sert à :", "o": ["inventer des faits", "provoquer et contrôler des phénomènes pour tester une hypothèse", "remplacer la théorie", "éviter l'observation"], "c": 1, "e": "Elle est le juge de l'hypothèse."}, {"q": "L'induction scientifique consiste à :", "o": ["passer de cas observés à une loi générale", "déduire sans observer", "répéter une opinion", "refuser l'expérience"], "c": 0, "e": "Elle suppose la répétition des observations."}, {"q": "Le déterminisme scientifique affirme que :", "o": ["tout est hasard", "rien n'a de cause", "les lois changent chaque jour", "les mêmes causes, dans les mêmes conditions, produisent les mêmes effets"], "c": 3, "e": "Principe fondamental de la science expérimentale."}, {"q": "Une expérience « cruciale » permet de :", "o": ["supprimer une loi", "faire de la poésie", "départager deux hypothèses rivales", "éviter la mesure"], "c": 2, "e": "Elle élimine l'une des deux hypothèses."}, {"q": "Une théorie est plus solide quand :", "o": ["elle est ancienne", "elle explique beaucoup de faits et prévoit de nouveaux phénomènes vérifiés", "elle est célèbre", "elle n'a jamais été discutée"], "c": 1, "e": "Pouvoir explicatif et prédictif."}, {"q": "Claude Bernard insiste sur :", "o": ["le contrôle de l'hypothèse par l'expérience", "le dogme", "l'autorité", "la tradition"], "c": 0, "e": "Il faut douter de ses idées et les soumettre à l'expérience."}]},{"t": "Économie — Définition et classification des pays sous-développés", "m": "Économie", "f": "", "g": "Octobre", "q": [{"q": "Le sous-développement désigne :", "o": ["un état de richesse", "une situation où l'économie et la société ne satisfont pas correctement les besoins fondamentaux de la population", "l'absence totale d'agriculture", "un régime politique"], "c": 1, "e": "Faible revenu, faible productivité et besoins de base mal couverts."}, {"q": "Parmi ces pays, lesquels sont des Nouveaux Pays Industrialisés (NPI) ?", "o": ["la Corée du Sud et Singapour", "le Niger et le Tchad", "l'Arabie saoudite et le Koweït", "la France et l'Allemagne"], "c": 0, "e": "Les « dragons » d'Asie ont connu une industrialisation rapide."}, {"q": "L'OPEP est l'organisation :", "o": ["des pays pauvres très endettés", "des pays industrialisés", "du commerce mondial", "des pays exportateurs de pétrole"], "c": 3, "e": "Elle a été créée en 1960 pour coordonner les politiques pétrolières."}, {"q": "Les PMA sont :", "o": ["les pays à marché assuré", "les pays membres d'Afrique", "les pays les moins avancés", "les pays à production maximale"], "c": 2, "e": "C'est la catégorie des pays les plus pauvres et les plus vulnérables ; la Guinée y figure."}, {"q": "Les PPTE sont :", "o": ["les pays producteurs de pétrole exportateurs", "les pays pauvres très endettés", "les pays à prix très élevés", "les pays partenaires de l'Europe"], "c": 1, "e": "Initiative FMI/Banque mondiale d'allègement de la dette."}, {"q": "Les PRI sont :", "o": ["les pays à revenu intermédiaire", "les pays riches industrialisés", "les pays à production réduite", "les pays à régime islamique"], "c": 0, "e": "Ils se situent entre les PMA et les pays développés."}, {"q": "Un pays développé se caractérise généralement par :", "o": ["une économie uniquement agricole", "un fort analphabétisme", "une forte mortalité infantile", "un revenu par habitant élevé et une économie diversifiée"], "c": 3, "e": "Le développement combine richesse, santé et éducation."}, {"q": "Le PIB par habitant sert à :", "o": ["compter la population", "compter les écoles", "mesurer le niveau moyen de richesse produite par habitant", "mesurer le chômage"], "c": 2, "e": "C'est un indicateur parmi d'autres."}, {"q": "L'IDH combine :", "o": ["pétrole, or et diamant", "revenu, santé (espérance de vie) et éducation", "dette, déficit et inflation", "armée, police et justice"], "c": 1, "e": "Indicateur du PNUD."}, {"q": "Les pays de l'OPEP tirent l'essentiel de leurs recettes :", "o": ["de l'exportation du pétrole", "du tourisme", "de l'agriculture vivrière", "du textile"], "c": 0, "e": "Le pétrole domine leurs exportations."}, {"q": "Les PMA sont classés ainsi notamment en raison :", "o": ["de leur grande richesse", "de leur industrie avancée", "de leur faible population", "de leur faible revenu et de leur fragilité économique et humaine"], "c": 3, "e": "Critères définis par l'ONU."}, {"q": "L'expression « tiers-monde » désigne traditionnellement :", "o": ["les pays riches", "les pays du Nord", "l'ensemble des pays sous-développés", "les pays en guerre"], "c": 2, "e": "Expression d'Alfred Sauvy (1952)."}, {"q": "Un pays en développement est un pays :", "o": ["qui a atteint le plein développement", "qui cherche à améliorer le niveau de vie et à diversifier son économie", "sans commerce", "sans habitants"], "c": 1, "e": "Le développement est un processus."}]},{"t": "Économie — Les causes actuelles du sous-développement", "m": "Économie", "f": "", "g": "Octobre", "q": [{"q": "Les échanges inégaux désignent :", "o": ["l'égalité des prix mondiaux", "l'échange de services gratuits", "la baisse relative du prix des matières premières exportées par rapport aux produits manufacturés importés", "la suppression des douanes"], "c": 2, "e": "C'est la détérioration des termes de l'échange."}, {"q": "La dépendance technologique signifie que les pays sous-développés :", "o": ["exportent leur technologie", "importent l'essentiel de leurs techniques et équipements", "n'ont besoin d'aucune technique", "produisent tous leurs brevets"], "c": 1, "e": "Elle freine l'industrialisation locale."}, {"q": "Laquelle de ces pratiques relève de la mauvaise gouvernance ?", "o": ["le détournement des deniers publics", "la publication des comptes de l'État", "la transparence budgétaire", "l'alternance démocratique"], "c": 0, "e": "Corruption et impunité aggravent le sous-développement."}, {"q": "L'instabilité politique nuit au développement parce qu'elle :", "o": ["attire toujours les capitaux", "crée de l'épargne", "supprime la dette", "décourage l'investissement et désorganise l'économie"], "c": 3, "e": "Coups d'État et conflits détruisent les capacités productives."}, {"q": "L'impunité consiste à :", "o": ["punir sévèrement les fautes", "contrôler les comptes publics", "ne pas sanctionner les auteurs de fautes ou de crimes économiques", "transférer les technologies"], "c": 2, "e": "Elle encourage la corruption."}, {"q": "La difficile alternance au pouvoir signifie que :", "o": ["les élections sont impossibles à organiser", "les dirigeants quittent difficilement le pouvoir par les urnes", "le pouvoir change chaque mois", "l'armée n'existe pas"], "c": 1, "e": "Elle bloque le renouvellement des idées et des équipes."}, {"q": "Les termes de l'échange comparent :", "o": ["le prix des exportations au prix des importations", "le nombre d'habitants et d'écoles", "les salaires et les loyers", "les impôts et les dettes"], "c": 0, "e": "Leur détérioration appauvrit les exportateurs de matières premières."}, {"q": "Le transfert de technologie désigne :", "o": ["l'exportation de matières premières", "l'achat de nourriture", "la création d'impôts", "le passage de techniques d'un pays à un autre"], "c": 3, "e": "Les pays pauvres en dépendent largement."}, {"q": "La corruption est :", "o": ["la gestion transparente", "la lutte contre la fraude", "l'abus d'une fonction pour un avantage personnel", "un contrôle fiscal"], "c": 2, "e": "Elle détourne des ressources du développement."}, {"q": "Le manque de transparence signifie que :", "o": ["tous les comptes sont publiés", "les citoyens ne peuvent pas contrôler l'usage des fonds publics", "les budgets sont débattus", "les recettes sont affichées"], "c": 1, "e": "Il favorise détournements et impunité."}, {"q": "L'exploitation financière peut se manifester par :", "o": ["le transfert de bénéfices et le remboursement de dettes vers l'étranger", "les dons sans condition", "l'annulation des dettes", "l'absence de banques"], "c": 0, "e": "Elle draine des capitaux hors du pays."}, {"q": "La détérioration des termes de l'échange est défavorable :", "o": ["aux pays exportateurs de produits manufacturés", "à tous également", "à personne", "aux pays exportateurs de matières premières"], "c": 3, "e": "Leurs exportations achètent de moins en moins d'importations."}, {"q": "Une bonne gouvernance suppose :", "o": ["secret et privilèges", "impunité", "transparence, responsabilité et respect de la loi", "arbitraire"], "c": 2, "e": "C'est un préalable du développement."}]},{"t": "Économie — Caractéristiques économiques et extra-économiques du sous-développement", "m": "Économie", "f": "", "g": "Novembre", "q": [{"q": "La faiblesse de l'agriculture dans les pays sous-développés tient surtout à :", "o": ["un excès de machines modernes", "un excès d'engrais", "l'absence de paysans", "l'outillage rudimentaire et à la faible productivité"], "c": 3, "e": "Elle limite les rendements et la sécurité alimentaire."}, {"q": "L'hypertrophie du secteur tertiaire signifie :", "o": ["un manque de commerces", "une industrie très développée", "un secteur des services (commerce, transport...) disproportionné par rapport à l'industrie", "une agriculture dominante"], "c": 2, "e": "Il est souvent peu productif et informel."}, {"q": "La faiblesse du revenu national se mesure notamment par :", "o": ["un fort revenu par habitant", "un faible revenu par habitant", "une forte épargne", "un faible chômage"], "c": 1, "e": "Elle limite l'épargne et l'investissement."}, {"q": "Laquelle est une caractéristique démographique du sous-développement ?", "o": ["la surnatalité", "la faible natalité", "la forte espérance de vie", "la faible mortalité infantile"], "c": 0, "e": "Natalité élevée, mortalité infantile élevée."}, {"q": "La sous-nutrition est :", "o": ["une alimentation excessive", "un excès de vitamines", "une absence de faim", "une alimentation insuffisante en quantité ou en qualité"], "c": 3, "e": "Elle affecte la santé et la capacité de travail."}, {"q": "Un indicateur socio-culturel du sous-développement est :", "o": ["le taux élevé de diplômés", "une presse abondante", "la faible scolarisation et le fort analphabétisme", "de nombreuses universités"], "c": 2, "e": "Le capital humain est insuffisamment développé."},
