 circulaire."},{"q":"Le vecteur accélération tangentielle est colinéaire :","o":["au vecteur vitesse","au rayon de courbure","perpendiculaire à la vitesse","à la normale principale"],"c":0,"e":"at est porté par le vecteur tangent à la trajectoire, donc colinéaire au vecteur vitesse."}]},{"t":"Physique — Mouvement du centre d'inertie","m":"Physique","f":"","g":"Octobre","q":[{"q":"Un référentiel galiléen est un référentiel dans lequel :","o":["le principe d'inertie est vérifié","tout solide est immobile","le temps s'écoule différemment","la vitesse est toujours nulle"],"c":0,"e":"Un référentiel galiléen est un référentiel où le principe d'inertie (1re loi de Newton) est valable."},{"q":"Pour un système de masse constante, le principe fondamental de la dynamique s'écrit :","o":["ΣF = m·a","ΣF = m·v","ΣF = m²·a","ΣF = a/m"],"c":0,"e":"PFD : la somme des forces extérieures est égale au produit de la masse par l'accélération du centre d'inertie."},{"q":"Le théorème de l'énergie cinétique relie la variation d'énergie cinétique à :","o":["la quantité de mouvement du système","la somme des travaux des forces extérieures","la vitesse initiale uniquement","la position du centre d'inertie"],"c":1,"e":"ΔEc = ΣW(forces extérieures) entre deux instants."},{"q":"Le référentiel héliocentrique est centré sur :","o":["la Terre","le Soleil, avec des axes dirigés vers des étoiles fixes","la Lune","le centre de la Voie lactée"],"c":1,"e":"Le référentiel héliocentrique a pour origine le centre du Soleil et des axes dirigés vers des étoiles considérées comme fixes."},{"q":"Le référentiel géocentrique est un référentiel :","o":["centré sur le centre de la Terre, avec des axes dirigés vers des étoiles fixes","centré sur le Soleil","fixe à la surface de la Terre","centré sur la Lune"],"c":0,"e":"Le référentiel géocentrique a pour origine le centre de la Terre, avec des axes dirigés vers des étoiles fixes (il ne suit pas la rotation propre de la Terre)."},{"q":"Un référentiel terrestre est considéré comme galiléen :","o":["dans l'absolu et sans aucune approximation","de façon approchée, pour des expériences de courte durée","uniquement la nuit","jamais"],"c":1,"e":"Le référentiel terrestre n'est galiléen qu'en approximation, du fait de la rotation de la Terre ; cette approximation est valable pour des expériences de courte durée."},{"q":"La quantité de mouvement d'un point matériel de masse m animé d'une vitesse v est donnée par :","o":["p = m·v","p = m/v","p = m·v²","p = v/m"],"c":0,"e":"La quantité de mouvement est le vecteur p = m·v, colinéaire au vecteur vitesse."},{"q":"Le principe d'inertie énonce que, dans un référentiel galiléen, un point matériel isolé (ou pseudo-isolé) :","o":["est nécessairement immobile","est soit au repos, soit en mouvement rectiligne uniforme","accélère constamment","tourne indéfiniment"],"c":1,"e":"Le principe d'inertie affirme que la vitesse d'un point isolé (somme des forces nulle) reste constante en direction et en norme."},{"q":"Le théorème du centre d'inertie, contrairement au principe d'inertie, s'applique à :","o":["un point matériel isolé uniquement","un système soumis à des forces extérieures dont la résultante n'est pas nulle","un système au repos uniquement","un système isolé sans force"],"c":1,"e":"Le théorème du centre d'inertie (ΣF = m·a) généralise le principe d'inertie au cas où la résultante des forces extérieures n'est pas nulle."},{"q":"Pour un système isolé ou pseudo-isolé (ΣF=0), le théorème du centre d'inertie se réduit à :","o":["au principe d'inertie (vitesse du centre d'inertie constante)","à une accélération infinie","à un mouvement circulaire","à l'arrêt immédiat du système"],"c":0,"e":"Si ΣF=0, alors a=0 : le centre d'inertie se déplace à vitesse constante, ce qui est le principe d'inertie appliqué au centre d'inertie."},{"q":"Pour résoudre un problème de translation en connaissant les positions mais pas la durée du mouvement, il est souvent plus efficace d'utiliser :","o":["le théorème de l'énergie cinétique","uniquement le principe fondamental de la dynamique","la loi de Kepler","le principe d'inertie"],"c":0,"e":"Le théorème de l'énergie cinétique relie directement vitesses et distances parcourues, sans faire intervenir explicitement le temps."},{"q":"Le théorème de l'énergie cinétique s'applique à un solide :","o":["uniquement en rotation","en translation, entre deux instants donnés","uniquement au repos","uniquement en apesanteur"],"c":1,"e":"Pour un solide en translation, ΔEc = ΣW(forces extérieures) entre deux instants du mouvement."},{"q":"Un système pseudo-isolé est un système pour lequel :","o":["aucune force ne s'exerce","la résultante des forces extérieures est nulle bien que plusieurs forces s'exercent","la masse est nulle","la vitesse est toujours nulle"],"c":1,"e":"Un système pseudo-isolé subit plusieurs forces extérieures dont la somme vectorielle est nulle, ce qui équivaut à un système isolé du point de vue dynamique."}]},{"t":"Physique — Interaction et champ gravitationnel","m":"Physique","f":"","g":"Octobre","q":[{"q":"La force de gravitation entre deux masses ponctuelles est :","o":["proportionnelle au produit des masses et inversement proportionnelle au carré de la distance","proportionnelle à la distance","indépendante de la distance","proportionnelle à la somme des masses"],"c":0,"e":"Loi de Newton : F = G·m1·m2/d²."},{"q":"Le mouvement d'un satellite à trajectoire circulaire est :","o":["uniformément accéléré","rectiligne","uniforme","aléatoire"],"c":2,"e":"La force gravitationnelle, centripète, ne modifie pas la norme de la vitesse : le mouvement circulaire est uniforme."},{"q":"D'après la 3e loi de Kepler, le rapport T²/a³ pour des satellites d'un même astre est :","o":["proportionnel à la masse du satellite","constant","nul pour une orbite circulaire","variable selon le satellite"],"c":1,"e":"La 3e loi de Kepler énonce que T²/a³ est une constante qui ne dépend que de l'astre attracteur."},{"q":"Le champ de pesanteur en un point diffère du champ de gravitation car il prend en compte, en plus de l'attraction terrestre :","o":["l'effet de la rotation de la Terre (force d'inertie centrifuge)","l'attraction lunaire uniquement","la pression atmosphérique","la température"],"c":0,"e":"Le champ de pesanteur résulte de la combinaison du champ de gravitation et de l'effet de la rotation terrestre (force centrifuge d'entraînement)."},{"q":"L'intensité du champ gravitationnel terrestre à une altitude h s'exprime par :","o":["g(h) = G·MT/(RT+h)²","g(h) = G·MT/RT² uniquement au sol","g(h) = G·MT·(RT+h)","g(h) = G·MT²/(RT+h)"],"c":0,"e":"g(h) = G·MT/(RT+h)², avec RT le rayon terrestre et MT la masse de la Terre."},{"q":"Lorsque h est très petit devant le rayon terrestre RT, le champ gravitationnel g(h) :","o":["peut être approximé par g₀, la valeur au sol","devient nul","double systématiquement","devient infini"],"c":0,"e":"Pour h « RT, (RT+h)² ≈ RT², donc g(h) ≈ g₀ : l'approximation reste valable près du sol."},{"q":"La vitesse linéaire d'un satellite en orbite circulaire de rayon r=RT+h s'exprime, en fonction du champ g(h), par :","o":["v = √(g(h)·r)","v = g(h)/r","v = r/g(h)","v = g(h)·r²"],"c":0,"e":"La force gravitationnelle assure l'accélération centripète : v²/r = g(h), soit v = √(g(h)·r)."},{"q":"La période de révolution T d'un satellite en orbite circulaire de rayon r se déduit de sa vitesse linéaire v par la relation :","o":["T = 2πr/v","T = v/(2πr)","T = 2πv/r","T = πr·v"],"c":0,"e":"La période est la durée nécessaire pour parcourir la circonférence 2πr à la vitesse v, soit T = 2πr/v."},{"q":"La première loi de Kepler énonce que la trajectoire d'une planète autour du Soleil est :","o":["un cercle parfait centré sur le Soleil","une ellipse dont le Soleil occupe l'un des foyers","une droite","une spirale"],"c":1,"e":"Selon la première loi de Kepler, les planètes décrivent des orbites elliptiques dont le Soleil occupe l'un des deux foyers."},{"q":"La deuxième loi de Kepler (loi des aires) indique que le rayon vecteur reliant le Soleil à la planète balaie :","o":["des aires égales en des temps égaux","des angles égaux en des temps égaux","des distances égales en des temps égaux","aucune loi particulière"],"c":0,"e":"La loi des aires traduit la conservation du moment cinétique : la vitesse aréolaire de la planète est constante."},{"q":"L'impesanteur ressentie par les astronautes en orbite s'explique par le fait que :","o":["il n'y a plus aucune force de gravitation dans l'espace","le satellite et son contenu sont en chute libre permanente autour de la Terre","la masse des astronautes devient nulle","l'air disparaît totalement"],"c":1,"e":"En orbite, le satellite et tout ce qu'il contient chutent librement sous l'effet de la gravitation, d'où l'absence apparente de poids ressenti."},{"q":"L'impesanteur peut également être observée de façon temporaire :","o":["dans un avion en vol parabolique (chute libre)","uniquement sur la Lune","uniquement dans un ascenseur immobile","jamais sur Terre"],"c":0,"e":"Un avion suivant une trajectoire parabolique en chute libre reproduit, pendant quelques secondes, les conditions d'impesanteur."},{"q":"La vitesse angulaire ω d'un satellite en orbite circulaire de période T est donnée par :","o":["ω = 2π/T","ω = T/2π","ω = 2πT","ω = π/T²"],"c":0,"e":"ω = 2π/T, relation générale entre vitesse angulaire et période pour un mouvement circulaire."}]},{"t":"Physique — Mouvement dans un champ uniforme","m":"Physique","f":"","g":"Novembre","q":[{"q":"Dans le champ de pesanteur uniforme (sans frottement), la trajectoire d'un projectile est :","o":["une droite","un cercle","une parabole","une ellipse"],"c":2,"e":"L'équation de trajectoire y(x) est une fonction du 2nd degré : c'est une parabole."},{"q":"Une particule chargée entrant perpendiculairement dans un champ électrostatique uniforme suit une trajectoire :","o":["circulaire","parabolique","rectiligne","hélicoïdale"],"c":1,"e":"Le mouvement est analogue au tir parabolique : accélération constante perpendiculaire à la vitesse initiale."},{"q":"Pour résoudre un problème de mouvement dans un champ uniforme, on peut choisir l'approche cinématique ou :","o":["l'approche statique","l'approche énergétique","l'approche thermique","l'approche chimique"],"c":1,"e":"Le théorème de l'énergie cinétique offre une seconde méthode, souvent plus rapide."},{"q":"Dans le champ de pesanteur uniforme, le vecteur accélération d'un projectile (sans frottement) est :","o":["constant, égal à g","variable selon la vitesse","nul","perpendiculaire à g"],"c":0,"e":"En l'absence de frottement, la seule force est le poids, donc a = g, constant en direction et en norme."},{"q":"Les équations horaires du mouvement d'un projectile dans le champ de pesanteur uniforme sont obtenues par :","o":["intégration successive du vecteur accélération","dérivation du vecteur position","mesure expérimentale uniquement","la loi de Kepler"],"c":0,"e":"On intègre a(t) pour obtenir v(t), puis on intègre v(t) pour obtenir les équations horaires de la position."},{"q":"La flèche d'un tir parabolique correspond à :","o":["la portée horizontale maximale","la hauteur maximale atteinte par le projectile","la vitesse au sommet","la durée totale du mouvement"],"c":1,"e":"La flèche est l'altitude maximale atteinte par le projectile au cours de sa trajectoire."},{"q":"La portée horizontale d'un tir parabolique est :","o":["la distance horizontale entre le point de lancement et le point de retombée","la hauteur maximale","la vitesse initiale","le temps de vol"],"c":0,"e":"La portée est la distance horizontale parcourue par le projectile entre son lancement et son retour au même niveau."},{"q":"Pour une particule chargée pénétrant perpendiculairement dans un champ électrostatique uniforme E, l'accélération subie vaut :","o":["a = qE/m","a = qE","a = E/m","a = q/(mE)"],"c":0,"e":"D'après le principe fondamental de la dynamique, F = qE = m·a, donc a = qE/m."},{"q":"La déviation angulaire d'une particule chargée à la sortie d'un champ électrostatique uniforme est l'angle entre :","o":["la vitesse initiale et la vitesse finale","le champ électrique et la vitesse initiale","deux positions successives","la charge et la masse"],"c":0,"e":"La déviation angulaire mesure l'écart de direction entre le vecteur vitesse à l'entrée et à la sortie du champ."},{"q":"La déflexion électrostatique correspond à :","o":["le déplacement transversal de la particule, souvent mesuré sur un écran","la vitesse angulaire de la particule","la charge totale déplacée","le temps de traversée du champ"],"c":0,"e":"La déflexion est l'écart entre le point d'impact de la particule déviée et le point d'impact qu'elle aurait eu sans champ."},{"q":"Pour calculer la vitesse de sortie d'une particule chargée accélérée par une tension U, l'approche énergétique utilise :","o":["le théorème de l'énergie cinétique (le travail de la force électrique vaut qU)","uniquement le principe fondamental de la dynamique","la loi de Kepler","le principe d'inertie"],"c":0,"e":"ΔEc = W(F électrique) = qU permet de calculer directement la vitesse de sortie sans étudier le détail du mouvement."},{"q":"Dans un champ électrostatique uniforme, la composante de la vitesse perpendiculaire au champ (parallèle aux plaques) :","o":["reste constante","augmente proportionnellement au temps","diminue","devient nulle"],"c":0,"e":"L'accélération n'a de composante que selon la direction du champ ; la composante de vitesse perpendiculaire au champ n'est donc pas modifiée."},{"q":"Le mouvement d'un projectile dans le champ de pesanteur uniforme peut se décomposer en :","o":["un mouvement uniforme horizontal et un mouvement uniformément varié vertical","deux mouvements circulaires","un mouvement uniquement vertical","un mouvement aléatoire"],"c":0,"e":"Horizontalement, aucune force n'agit (vitesse constante) ; verticalement, le poids impose une accélération constante g (MRUV)."}]},{"t":"Physique — Dynamique du solide en rotation","m":"Physique","f":"","g":"Novembre","q":[{"q":"Le théorème fondamental de la dynamique en rotation relie le moment des forces à :","o":["J·(dω/dt)","m·a","J·ω","m·v"],"c":0,"e":"ΣM = J·(dω/dt), où J est le moment d'inertie et dω/dt l'accélération angulaire."},{"q":"Le théorème de Huygens permet de calculer :","o":["la vitesse angulaire d'un solide","le moment d'inertie par rapport à un axe parallèle à un axe passant par le centre de masse","la période de rotation","l'énergie cinétique de translation"],"c":1,"e":"Théorème de Huygens : J(Δ) = J(G) + m·d², pour un axe Δ parallèle à l'axe passant par G."},{"q":"L'unité du moment d'inertie J dans le Système International est :","o":["kg·m²","kg·m/s","N·m","kg/m²"],"c":0,"e":"J s'exprime en kg·m² (masse × distance au carré)."},{"q":"Le moment d'une force par rapport à un axe fixe dépend :","o":["uniquement de l'intensité de la force","de l'intensité de la force et de la distance de son point d'application à l'axe (bras de levier)","uniquement de la masse du solide","de la vitesse angulaire"],"c":1,"e":"Le moment d'une force est le produit de son intensité par le bras de levier (distance de la droite d'action à l'axe)."},{"q":"Le moment d'inertie J d'un solide par rapport à un axe caractérise :","o":["sa résistance à la mise en rotation, liée à la répartition des masses autour de l'axe","sa vitesse de rotation","sa masse totale uniquement","sa température"],"c":0,"e":"J = Σ mi·ri² dépend de la façon dont la masse est répartie par rapport à l'axe de rotation."},{"q":"Pour un solide en rotation autour d'un axe fixe, l'énergie cinétique de rotation s'exprime par :","o":["Ec = ½ J ω²","Ec = J ω","Ec = ½ m v² uniquement","Ec = J/ω"],"c":0,"e":"Ec = ½ J ω², expression analogue à ½ m v² pour la translation, avec J et ω pour la rotation."},{"q":"La vitesse angulaire ω d'un solide en rotation s'exprime généralement en :","o":["mètres par seconde","radians par seconde","kilogrammes","newtons"],"c":1,"e":"La vitesse angulaire, notée ω, s'exprime en radians par seconde (rad/s)."},{"q":"Pour deux solides de même masse, celui dont la matière est répartie le plus loin de l'axe de rotation possède :","o":["un moment d'inertie plus grand","un moment d'inertie plus petit","le même moment d'inertie","un moment d'inertie nul"],"c":0,"e":"Comme J = Σ mi·ri², plus la matière est éloignée de l'axe, plus le moment d'inertie est élevé, à masse égale."},{"q":"Pour mettre un solide en rotation plus facilement, à moment des forces donné, il faut :","o":["un moment d'inertie élevé","un moment d'inertie faible","une masse infinie","un axe mobile"],"c":1,"e":"D'après ΣM = J·(dω/dt), pour un moment M fixé, un J plus faible donne une accélération angulaire plus grande."},{"q":"Un exemple courant d'application du théorème de Huygens est le calcul du moment d'inertie :","o":["d'un axe passant par le centre de masse uniquement","d'un solide par rapport à un axe parallèle ne passant pas par le centre de masse","d'un point matériel isolé","d'une masse ponctuelle immobile"],"c":1,"e":"Le théorème de Huygens permet de calculer J par rapport à un axe Δ à partir de J connu par rapport à un axe parallèle passant par le centre de masse G."},{"q":"Dans la relation de Huygens J(Δ) = J(G) + m·d², le terme d représente :","o":["la distance entre l'axe Δ et l'axe parallèle passant par le centre de masse G","le diamètre du solide","la vitesse angulaire","le rayon de giration"],"c":0,"e":"d est la distance séparant les deux axes parallèles, l'un passant par G, l'autre étant l'axe Δ étudié."},{"q":"Le moment cinétique d'un solide en rotation autour d'un axe fixe s'exprime par :","o":["L = J·ω","L = m·v","L = J/ω","L = m·a"],"c":0,"e":"Le moment cinétique par rapport à l'axe de rotation vaut L = J·ω, analogue à p = m·v pour la translation."},{"q":"Pour un solide en rotation uniforme (ω constante), le moment résultant des forces extérieures par rapport à l'axe est :","o":["maximal","nul","négatif","infini"],"c":1,"e":"D'après ΣM = J·(dω/dt), si ω est constante, dω/dt = 0, donc la somme des moments des forces extérieures est nulle."}]},{"t":"Physique — Oscillateurs mécaniques","m":"Physique","f":"","g":"Novembre","q":[{"q":"La position d'équilibre stable d'un oscillateur mécanique correspond à :","o":["un maximum d'énergie potentielle","une vitesse maximale imposée","un minimum d'énergie potentielle","une accélération constante"],"c":2,"e":"À l'équilibre stable, l'énergie potentielle est minimale : tout écart y ramène le système."},{"q":"L'équation différentielle d'un pendule élastique horizontal non amorti s'écrit :","o":["x'' + (k/m)x = 0","x'' − (k/m)x = 0","x'' + (m/k)x = 0","x' + (k/m)x = 0"],"c":0,"e":"En appliquant le PFD : m·x'' = −k·x, soit x'' + (k/m)x = 0."},{"q":"Pour un oscillateur harmonique non amorti, l'énergie mécanique :","o":["diminue progressivement","augmente","se conserve","est nulle en permanence"],"c":2,"e":"En l'absence de frottement, l'énergie mécanique (Ec + Ep) reste constante au cours du temps."},{"q":"Le pendule élastique et le pendule simple sont deux exemples typiques :","o":["de mouvements rectilignes uniformes","d'oscillateurs mécaniques","de mouvements circulaires uniformes","de chutes libres"],"c":1,"e":"Ces deux systèmes oscillent périodiquement autour d'une position d'équilibre stable : ce sont des oscillateurs mécaniques."},{"q":"Pour un pendule élastique horizontal de raideur k et de masse m, la pulsation propre ω₀ est donnée par :","o":["ω₀ = √(k/m)","ω₀ = k/m","ω₀ = √(m/k)","ω₀ = m·k"],"c":0,"e":"En résolvant x'' + (k/m)x = 0, on identifie ω₀² = k/m, soit ω₀ = √(k/m)."},{"q":"La période propre T₀ d'un pendule élastique horizontal s'exprime par :","o":["T₀ = 2π√(m/k)","T₀ = 2π√(k/m)","T₀ = m/k","T₀ = 1/(2π√(k/m))"],"c":0,"e":"T₀ = 2π/ω₀ = 2π√(m/k), la période propre de l'oscillateur harmonique."},{"q":"La fréquence propre f₀ d'un oscillateur harmonique est reliée à la période propre T₀ par :","o":["f₀ = 1/T₀","f₀ = T₀","f₀ = 2π·T₀","f₀ = T₀²"],"c":0,"e":"La fréquence est l'inverse de la période : f₀ = 1/T₀."},{"q":"Pour vérifier qu'une solution x(t) = Xₘ·cos(ω₀·t + φ) satisfait l'équation différentielle x'' + ω₀²x = 0, il faut :","o":["dériver deux fois x(t) et substituer dans l'équation","intégrer x(t) une seule fois","mesurer expérimentalement x(t)","calculer uniquement x(0)"],"c":0,"e":"On calcule x'(t) puis x''(t), puis on vérifie que x''(t) + ω₀²x(t) = 0 est bien satisfaite pour tout t."},{"q":"Dans l'expression x(t) = Xₘ·cos(ω₀·t + φ), le terme φ représente :","o":["la phase à l'origine","l'amplitude","la pulsation","la période"],"c":0,"e":"φ est la phase à l'origine des temps, qui dépend des conditions initiales du mouvement."},{"q":"Dans l'expression x(t) = Xₘ·cos(ω₀·t + φ), Xₘ représente :","o":["l'amplitude des oscillations","la phase","la pulsation propre","la fréquence"],"c":0,"e":"Xₘ est l'amplitude maximale de l'élongation au cours des oscillations."},{"q":"Pour un oscillateur mécanique amorti (frottements non négligeables), l'énergie mécanique au cours du temps :","o":["reste rigoureusement constante","diminue progressivement, dissipée par frottement","augmente indéfiniment","devient instantanément nulle"],"c":1,"e":"Les frottements dissipent progressivement l'énergie mécanique de l'oscillateur, qui décroît au cours du temps."},{"q":"Au cours des oscillations amorties, l'énergie mécanique perdue est convertie principalement en :","o":["énergie chimique","énergie thermique (chaleur), par frottement","énergie nucléaire","énergie électrique"],"c":1,"e":"Les frottements dissipent l'énergie mécanique sous forme de chaleur, échauffant légèrement le système et son environnement."},{"q":"Un pendule élastique vertical, à l'équilibre, occupe une position où :","o":["l'énergie potentielle totale (élastique + pesanteur) est minimale","la vitesse est maximale","l'accélération est maximale","le ressort est totalement détendu"],"c":0,"e":"La position d'équilibre stable correspond à un minimum de l'énergie potentielle totale du système."}]},{"t":"Physique — Champ magnétique","m":"Physique","f":"","g":"Décembre","q":[{"q":"L'expérience d'Oersted met en évidence :","o":["l'effet photoélectrique","l'existence d'un champ magnétique créé par un courant","la loi de Laplace","l'induction électromagnétique"],"c":1,"e":"Oersted a montré qu'un courant électrique dévie une aiguille aimantée : il crée donc un champ magnétique."},{"q":"L'intensité du champ magnétique créé par un solénoïde est proportionnelle :","o":["à la longueur du solénoïde uniquement","à l'intensité du courant et au nombre de spires par unité de longueur","à la résistance du solénoïde","à la tension à ses bornes"],"c":1,"e":"B = μ0·n·I, avec n le nombre de spires par mètre et I l'intensité du courant."},{"q":"Le sens du champ magnétique créé par un solénoïde se détermine à partir :","o":["de la couleur des fils","du sens du courant (règle de la main droite)","de la résistance du circuit","de la tension appliquée"],"c":1,"e":"La règle de la main droite (ou du tire-bouchon) donne le sens de B à partir du sens du courant."},{"q":"L'expérience du tube de Crookes permet de mettre en évidence :","o":["l'action d'un champ magnétique sur un faisceau d'électrons","la loi de Kepler","l'effet photoélectrique","la radioactivité"],"c":0,"e":"Le tube de Crookes montre la déviation d'un faisceau d'électrons sous l'action d'un champ magnétique, preuve de son existence."},{"q":"Un spectre magnétique est obtenu expérimentalement à l'aide de :","o":["limaille de fer disposée autour d'un aimant ou d'un courant","eau colorée","rayons X","un thermomètre"],"c":0,"e":"La limaille de fer s'oriente selon les lignes de champ, révélant visuellement le spectre magnétique."},{"q":"En un point donné, le vecteur champ magnétique B est représenté par une flèche :","o":["tangente à la ligne de champ en ce point","perpendiculaire à la ligne de champ","toujours verticale","de norme nulle"],"c":0,"e":"Le vecteur B en un point est tangent à la ligne de champ passant par ce point."},{"q":"Le champ magnétique terrestre possède, en un lieu donné, une composante horizontale dont l'intensité dépend :","o":["de l'inclinaison magnétique du lieu","uniquement de l'altitude","de la température ambiante","de la pression atmosphérique"],"c":0,"e":"La composante horizontale du champ magnétique terrestre dépend de l'inclinaison magnétique, qui varie selon la latitude."},{"q":"L'inclinaison magnétique en un point est l'angle que fait le champ magnétique terrestre avec :","o":["le plan horizontal","le méridien de Greenwich","l'axe de rotation terrestre","la verticale du lieu"],"c":0,"e":"L'inclinaison est l'angle entre le vecteur champ magnétique terrestre total et le plan horizontal local."},{"q":"Dans un solénoïde, le champ magnétique est considéré comme quasi uniforme :","o":["partout à l'extérieur du solénoïde","à l'intérieur, loin des extrémités","uniquement aux extrémités","nulle part"],"c":1,"e":"Le champ magnétique à l'intérieur d'un solénoïde long est quasi uniforme, sauf au voisinage immédiat des extrémités."},{"q":"L'unité du champ magnétique B dans le Système International est :","o":["le tesla (T)","le weber (Wb)","le henry (H)","l'ampère (A)"],"c":0,"e":"Le champ magnétique B s'exprime en tesla (T) dans le Système International."},{"q":"L'expérience d'Oersted a été réalisée en approchant :","o":["une aiguille aimantée d'un fil parcouru par un courant électrique","deux aimants entre eux","une charge d'un condensateur","un thermomètre d'une résistance"],"c":0,"e":"Oersted a observé la déviation d'une aiguille aimantée placée à proximité d'un fil parcouru par un courant."},{"q":"Le pendule magnétique, placé au voisinage d'un aimant ou d'un courant, s'oriente selon :","o":["la direction du champ magnétique local","une direction aléatoire","la verticale uniquement","la direction du champ électrique"],"c":0,"e":"L'aiguille du pendule magnétique s'aligne dans la direction du champ magnétique résultant au point où elle se trouve."},{"q":"Le nombre de spires par unité de longueur d'un solénoïde est un facteur qui, pour un courant donné :","o":["n'a aucune influence sur le champ magnétique créé","influence directement l'intensité du champ magnétique créé (B = μ0·n·I)","diminue le champ magnétique","modifie uniquement la résistance"],"c":1,"e":"B = μ0·n·I : le champ créé est proportionnel au nombre de spires par unité de longueur n."}]},{"t":"Physique — Particule chargée en mouvement dans un champ magnétique uniforme","m":"Physique","f":"","g":"Décembre","q":[{"q":"La force de Lorentz exercée sur une particule chargée s'exprime par :","o":["F = q·v×B","F = q·E","F = m·a","F = q·B²"],"c":0,"e":"F = q·v×B, perpendiculaire à la fois à la vitesse et au champ magnétique."},{"q":"La force magnétique exercée sur une particule chargée :","o":["accélère toujours la particule","freine toujours la particule","ne travaille pas (la norme de la vitesse reste constante)","modifie la charge de la particule"],"c":2,"e":"F étant perpendiculaire à v, elle ne travaille pas : l'énergie cinétique, donc la norme de v, reste constante."},{"q":"Lorsque la vitesse initiale est orthogonale au champ magnétique uniforme, la trajectoire de la particule est :","o":["rectiligne","circulaire","parabolique","elliptique"],"c":1,"e":"La force magnétique, centripète et de norme constante, impose une trajectoire circulaire uniforme."},{"q":"Le rayon de la trajectoire circulaire d'une particule chargée dans un champ magnétique uniforme (vitesse initiale perpendiculaire à B) s'exprime par :","o":["R = m·v/(|q|·B)","R = q·B/m","R = m·B/q","R = v/(q·B)"],"c":0,"e":"En égalant la force magnétique à la force centripète (|q|vB = mv²/R), on obtient R = mv/(|q|B)."},{"q":"La période du mouvement circulaire d'une particule chargée dans un champ magnétique uniforme est :","o":["indépendante de la vitesse de la particule","proportionnelle à la vitesse","égale à 2πm/(|q|B), indépendante de v","égale à v/B uniquement"],"c":2,"e":"T = 2πR/v = 2πm/(|q|B) : la période ne dépend pas de la vitesse, propriété exploitée dans le cyclotron."},{"q":"La vitesse angulaire (pulsation cyclotron) d'une particule chargée dans un champ magnétique uniforme est donnée par :","o":["ω = |q|B/m","ω = m/(qB)","ω = qB","ω = B/m"],"c":0,"e":"ω = 2π/T = |q|B/m, appelée pulsation cyclotron."},{"q":"Le spectromètre de masse utilise la déviation d'ions dans un champ magnétique pour :","o":["mesurer leur masse, ou leur rapport masse/charge","mesurer leur température","accélérer des électrons uniquement","créer un courant continu"],"c":0,"e":"En mesurant le rayon de la trajectoire circulaire des ions dans un champ connu, on en déduit leur masse (ou le rapport m/q)."},{"q":"Dans un spectromètre de masse, deux ions de même charge mais de masses différentes, animés de la même vitesse dans le même champ B, décrivent des trajectoires circulaires de rayons :","o":["identiques","différents, proportionnels à leur masse","toujours nuls","infinis"],"c":1,"e":"Comme R = mv/(|q|B), à v, q et B fixés, le rayon R est proportionnel à la masse m de l'ion."},{"q":"Le cyclotron est un dispositif qui utilise un champ magnétique pour :","o":["ralentir des particules chargées","maintenir des particules chargées sur une trajectoire circulaire pendant qu'un champ électrique les accélère","mesurer la charge de l'électron","produire de la lumière"],"c":1,"e":"Le champ magnétique courbe la trajectoire des particules en cercle, tandis qu'un champ électrique alternatif les accélère à chaque passage."},{"q":"Dans le cyclotron, le fait que la période de révolution soit indépendante de la vitesse permet :","o":["d'accélérer les particules à une fréquence fixe du champ électrique alternatif","de ralentir systématiquement les particules","de rendre le dispositif inutilisable à haute énergie","de supprimer le champ magnétique"],"c":0,"e":"La période T ne dépendant pas de v, la fréquence du champ électrique accélérateur peut rester fixe tout au long de l'accélération."},{"q":"La force de Lorentz s'exerçant sur une particule chargée est toujours dirigée :","o":["perpendiculairement au plan formé par v et B","parallèlement à v","parallèlement à B","dans le sens opposé à B"],"c":0,"e":"F = q·v×B est, par définition du produit vectoriel, perpendiculaire à la fois à v et à B."},{"q":"Si la vitesse initiale d'une particule chargée est parallèle au champ magnétique uniforme B, la force magnétique exercée sur elle est :","o":["maximale","nulle","minimale mais non nulle","infinie"],"c":1,"e":"F = q·v×B ; si v est parallèle à B, le produit vectoriel est nul, donc F=0 et la particule poursuit un mouvement rectiligne uniforme."},{"q":"Dans le cas général où la vitesse initiale d'une particule chargée fait un angle quelconque avec B, la trajectoire résultante est :","o":["rectiligne","circulaire","hélicoïdale (en hélice)","parabolique"],"c":2,"e":"La composante de v parallèle à B donne un mouvement rectiligne uniforme, et la composante perpendiculaire donne un mouvement circulaire : la combinaison forme une hélice."}]},{"t":"Physique — Loi de Laplace","m":"Physique","f":"","g":"Décembre","q":[{"q":"La loi de Laplace donne l'expression de la force exercée par un champ magnétique sur :","o":["un aimant seul","une charge au repos","un conducteur parcouru par un courant","un condensateur chargé"],"c":2,"e":"F = I·L×B s'applique à un conducteur rectiligne parcouru par un courant, placé dans un champ B."},{"q":"Le flux magnétique à travers un circuit plan dépend :","o":["de la résistance du circuit uniquement","de la surface, du champ B et de l'angle entre B et la normale au circuit","de la tension à ses bornes","de l'intensité du courant uniquement"],"c":1,"e":"Φ = B·S·cos(θ), où θ est l'angle entre B et la normale au plan du circuit."},{"q":"La position d'équilibre stable d'une bobine placée dans un champ magnétique correspond à :","o":["un flux minimal","une intensité nulle","un flux nul","un flux maximal"],"c":3,"e":"L'équilibre stable est atteint lorsque le flux à travers la bobine est maximal."},{"q":"L'expérience des rails de Laplace met en évidence :","o":["le déplacement d'une tige conductrice sous l'action d'un champ magnétique lorsqu'elle est parcourue par un courant","l'induction électromagnétique uniquement","l'effet photoélectrique","la radioactivité"],"c":0,"e":"Une tige mobile posée sur des rails, parcourue par un courant et placée dans un champ B, se déplace sous l'effet de la force de Laplace."},{"q":"La force de Laplace exercée sur un conducteur rectiligne de longueur L parcouru par un courant I, dans un champ B, s'exprime vectoriellement par :","o":["F = I·L×B","F = I·L·B (produit scalaire)","F = I/(L·B)","F = q·v×B"],"c":0,"e":"F = I·L×B, où L est le vecteur longueur orienté dans le sens du courant."},{"q":"Le sens de la force de Laplace peut être déterminé à l'aide de :","o":["la règle des trois doigts de la main droite (ou du bonhomme d'Ampère)","la règle de la main gauche uniquement chez tous les physiciens","aucune règle particulière","la couleur des fils"],"c":0,"e":"La règle des trois doigts (ou du bonhomme d'Ampère) permet de déterminer le sens du vecteur force de Laplace."},{"q":"Parmi les applications courantes de la loi de Laplace figure :","o":["le moteur à courant continu","le thermomètre","le baromètre","la pile électrique"],"c":0,"e":"Le moteur à courant continu utilise la force de Laplace exercée sur des conducteurs pour produire un mouvement de rotation."},{"q":"Le haut-parleur électrodynamique utilise la force de Laplace pour :","o":["convertir un signal électrique en vibration mécanique (son)","convertir la lumière en électricité","mesurer une résistance","stocker de l'énergie chimique"],"c":0,"e":"La bobine mobile du haut-parleur, parcourue par le signal électrique dans le champ d'un aimant, vibre sous l'effet de la force de Laplace, produisant le son."},{"q":"Dans un ampèremètre à cadre mobile, la déviation de l'aiguille résulte :","o":["de la force de Laplace exercée sur les spires du cadre parcourues par le courant à mesurer","de l'effet photoélectrique","de la dilatation thermique","de la radioactivité"],"c":0,"e":"Le courant à mesurer traverse un cadre mobile placé dans un champ magnétique ; la force de Laplace fait dévier l'aiguille proportionnellement à l'intensité."},{"q":"Le flux magnétique Φ à travers une surface S, dans un champ B uniforme faisant un angle θ avec la normale, s'écrit :","o":["Φ = B·S·cos(θ)","Φ = B·S·sin(θ)","Φ = B/S","Φ = B + S"],"c":0,"e":"Φ = B·S·cos(θ), où θ est l'angle entre le vecteur champ B et la normale à la surface S."},{"q":"L'unité du flux magnétique dans le Système International est :","o":["le weber (Wb)","le tesla (T)","le henry (H)","le farad (F)"],"c":0,"e":"Le flux magnétique Φ s'exprime en weber (Wb) dans le Système International."},{"q":"Lorsque le plan d'une spire est perpendiculaire au champ magnétique B (B parallèle à la normale), le flux à travers la spire est :","o":["nul","maximal","négatif","indéterminé"],"c":1,"e":"Quand la normale est parallèle à B, θ=0, cos(θ)=1, donc Φ=B·S est maximal : c'est la position d'équilibre stable."},{"q":"Le moteur à courant continu convertit :","o":["l'énergie électrique en énergie mécanique de rotation grâce à la force de Laplace","l'énergie mécanique en énergie chimique","l'énergie lumineuse en énergie électrique","l'énergie thermique en énergie nucléaire"],"c":0,"e":"Le courant traversant les spires du rotor, placées dans le champ d'un aimant (ou d'un stator), subit la force de Laplace qui entraîne la rotation."}]},{"t":"Physique — Induction électromagnétique","m":"Physique","f":"","g":"Janvier","q":[{"q":"La loi de Lenz permet de déterminer :","o":["l'intensité du champ magnétique","le sens du courant induit","la résistance du circuit","la fréquence du courant"],"c":1,"e":"La loi de Lenz énonce que le courant induit s'oppose, par ses effets, à la cause qui lui a donné naissance."},{"q":"La loi de Faraday relative à la f.é.m. induite s'écrit :","o":["e = −dΦ/dt","e = R·i","e = Φ·t","e = L·I"],"c":0,"e":"La f.é.m. induite est l'opposé de la dérivée du flux par rapport au temps."},{"q":"L'alternateur est une application industrielle de :","o":["l'effet photoélectrique","l'induction électromagnétique","la radioactivité","la diffraction"],"c":1,"e":"L'alternateur convertit un mouvement mécanique en courant induit grâce à l'induction électromagnétique."},{"q":"Le phénomène d'induction électromagnétique peut être mis en évidence expérimentalement en :","o":["déplaçant un aimant à proximité d'une bobine reliée à un galvanomètre","chauffant une résistance","mesurant le pH d'une solution","observant une réaction chimique"],"c":0,"e":"Le déplacement relatif d'un aimant et d'une bobine fait varier le flux magnétique et fait apparaître un courant induit, détecté par le galvanomètre."},{"q":"Pour qu'un courant soit induit dans une bobine, il faut que le flux magnétique la traversant :","o":["reste constant","varie au cours du temps","soit nul en permanence","soit toujours maximal"],"c":1,"e":"La loi de Faraday montre que la f.é.m. induite, donc le courant induit, n'existe que si le flux varie dans le temps."},{"q":"Lorsqu'on approche rapidement un aimant d'une bobine, le courant induit créé s'oppose, d'après la loi de Lenz, à :","o":["l'augmentation du flux magnétique à travers la bobine, en créant un champ qui s'y oppose","la diminution du flux","rien de particulier","la résistance du circuit"],"c":0,"e":"La loi de Lenz énonce que le courant induit s'oppose, par ses effets, à la cause qui lui a donné naissance, ici l'augmentation du flux."},{"q":"La force électromotrice moyenne induite dans un circuit, pour une variation de flux ΔΦ pendant une durée Δt, s'écrit :","o":["e = −ΔΦ/Δt","e = ΔΦ·Δt","e = Δt/ΔΦ","e = ΔΦ + Δt"],"c":0,"e":"La f.é.m. moyenne induite est l'opposé du taux de variation moyen du flux magnétique."},{"q":"Si la f.é.m. induite dans un circuit de résistance R est e, l'intensité du courant induit s'obtient par :","o":["i = e/R (loi d'Ohm)","i = e·R","i = R/e","i = e²/R"],"c":0,"e":"Selon la loi d'Ohm appliquée au circuit induit, i = e/R."},{"q":"Le transformateur électrique fonctionne grâce au phénomène :","o":["d'induction électromagnétique entre deux bobines couplées par un flux commun","de radioactivité","de l'effet photoélectrique","de la loi de Kepler"],"c":0,"e":"La variation du courant dans le circuit primaire fait varier le flux, qui induit une f.é.m. dans le circuit secondaire couplé magnétiquement."},{"q":"Le freinage par courants de Foucault utilise le fait que :","o":["des courants induits dans une pièce métallique en mouvement dans un champ magnétique s'opposent à ce mouvement","la lumière ralentit un objet","le champ magnétique accélère systématiquement les métaux","aucun courant n'est induit dans un métal"],"c":0,"e":"Les courants de Foucault, induits dans la masse métallique en mouvement, créent des forces qui s'opposent, d'après la loi de Lenz, à ce mouvement."},{"q":"Dans un alternateur, la rotation d'une bobine dans un champ magnétique (ou d'un aimant devant une bobine fixe) produit :","o":["une tension induite alternative","une tension continue constante","aucune tension","uniquement de la chaleur"],"c":0,"e":"La rotation fait varier périodiquement le flux, ce qui induit une tension alternative de même fréquence que la rotation."},{"q":"La loi de Lenz est souvent résumée par l'idée que le système induit s'oppose :","o":["à la cause qui lui a donné naissance","à la loi de conservation de l'énergie","à la gravitation","à la loi de Kepler"],"c":0,"e":"Cette formulation générale de la loi de Lenz exprime que les effets de l'induction s'opposent toujours à leur propre cause."},{"q":"Si le flux magnétique à travers un circuit reste constant, la f.é.m. induite est :","o":["nulle","maximale","infinie","négative"],"c":0,"e":"e = −dΦ/dt ; si Φ est constant, sa dérivée est nulle, donc e=0."},{"q":"L'intensité de la f.é.m. induite dépend, entre autres facteurs, de :","o":["la rapidité de variation du flux magnétique","la couleur du conducteur","la masse du circuit","la température ambiante uniquement"],"c":0,"e":"Plus le flux varie rapidement (dΦ/dt grand), plus la f.é.m. induite est importante."},{"q":"Dans un alternateur de centrale électrique, l'énergie mécanique de rotation d'une turbine est convertie en énergie électrique grâce à :","o":["l'induction électromagnétique","la radioactivité","l'effet photoélectrique","la fission nucléaire directement"],"c":0,"e":"La turbine entraîne la rotation d'un rotor (aimant ou bobine), ce qui induit, par induction électromagnétique, une tension aux bornes du stator."},{"q":"En s'éloignant d'une bobine, un aimant provoque un flux magnétique à travers celle-ci qui :","o":["augmente","diminue","reste constant","devient négatif systématiquement"],"c":1,"e":"L'éloignement de l'aimant réduit l'intensité du champ magnétique au niveau de la bobine, donc le flux diminue."},{"q":"Le fait que le courant induit s'oppose, selon la loi de Lenz, à la cause qui l'a produit est une conséquence directe :","o":["du principe de conservation de l'énergie","de la troisième loi de Kepler","de la loi de gravitation","du principe d'inertie"],"c":0,"e":"Si le courant induit favorisait la cause qui l'engendre, cela créerait de l'énergie sans limite, en contradiction avec le principe de conservation de l'énergie."},{"q":"Un galvanomètre relié à une bobine permet de mettre en évidence l'induction car il :","o":["détecte le passage d'un courant induit lors de la variation du flux","mesure directement le champ magnétique","mesure la masse de la bobine","n'a aucun rôle dans cette expérience"],"c":0,"e":"Le galvanomètre, sensible à de faibles courants, révèle la présence du courant induit lors de la variation du flux magnétique."}]},{"t":"Physique — Auto-induction","m":"Physique","f":"","g":"Janvier","q":[{"q":"Le flux propre d'une bobine s'exprime par :","o":["φ = L·i","φ = R·i","φ = C·U","φ = q/C"],"c":0,"e":"φ = L·i, où L est le coefficient d'auto-induction (inductance) de la bobine."},{"q":"L'énergie magnétique emmagasinée dans une bobine d'inductance L parcourue par un courant I est :","o":["Em = ½ L I²","Em = L·I","Em = ½ C U²","Em = R·I²"],"c":0,"e":"Em = ½ L I², analogue à l'énergie électrostatique ½ C U² d'un condensateur."},{"q":"Le retard à l'établissement du courant dans un circuit inductif est dû à :","o":["l'effet Joule","la résistance seule","l'auto-induction","la capacité seule"],"c":2,"e":"La f.é.m. auto-induite s'oppose à l'établissement (ou à la disparition) rapide du courant."},{"q":"Le retard à l'établissement du courant dans un circuit inductif peut être mis en évidence expérimentalement en comparant :","o":["l'allumage de deux lampes, l'une en série avec une bobine, l'autre avec une résistance","la couleur de deux lampes identiques","la température de deux résistances","le poids de deux bobines"],"c":0,"e":"La lampe en série avec la bobine s'allume avec un léger retard par rapport à celle en série avec la résistance, du fait de l'auto-induction."},{"q":"Le coefficient d'auto-induction L d'un solénoïde sans noyau de fer dépend notamment :","o":["du nombre de spires, de la longueur et de la section du solénoïde","uniquement de la couleur du fil","de la tension appliquée","de la fréquence du courant uniquement"],"c":0,"e":"L = μ0·N²·S/l dépend de la géométrie du solénoïde (nombre de spires N, section S, longueur l)."},{"q":"L'unité du coefficient d'auto-induction L dans le Système International est :","o":["le henry (H)","le farad (F)","le tesla (T)","le weber (Wb)"],"c":0,"e":"L'inductance L s'exprime en henry (H) dans le Système International."},{"q":"La loi de Faraday-Lenz appliquée à l'auto-induction s'écrit, pour la f.é.m. auto-induite e :","o":["e = −L·(di/dt)","e = L·i","e = −L/i","e = i/L"],"c":0,"e":"La f.é.m. auto-induite est proportionnelle à l'opposé de la vitesse de variation du courant qui la traverse."},{"q":"Lorsque le courant dans une bobine croît rapidement, la f.é.m. auto-induite :","o":["s'oppose à cette croissance (effet retardateur)","favorise cette croissance","est nulle","n'a aucun effet"],"c":0,"e":"Conformément à la loi de Lenz, la f.é.m. auto-induite s'oppose à la variation du courant qui la crée."},{"q":"À la disparition brutale du courant dans un circuit inductif, la f.é.m. auto-induite tend à :","o":["maintenir le courant, en s'opposant à sa disparition","accélérer sa disparition","créer un courant de sens opposé instantanément sans transition","n'avoir aucun effet"],"c":0,"e":"La bobine s'oppose à toute variation brutale du courant, qu'il s'agisse d'un établissement ou d'une disparition."},{"q":"L'énergie magnétique emmagasinée dans une bobine d'inductance L parcourue par un courant I peut être restituée :","o":["lors de la diminution du courant","uniquement lors de l'établissement du courant","jamais","uniquement sous forme de lumière"],"c":0,"e":"Lorsque le courant diminue, l'énergie magnétique stockée dans la bobine est restituée au circuit."},{"q":"Le phénomène d'auto-induction se manifeste dans un circuit :","o":["comportant une bobine parcourue par un courant variable","uniquement dans un circuit purement résistif","uniquement dans un condensateur","uniquement en courant continu constant"],"c":0,"e":"L'auto-induction apparaît dès qu'une bobine est parcourue par un courant dont l'intensité varie au cours du temps."},{"q":"Pour un solénoïde sans noyau de fer de N spires, de longueur l et de section S, le coefficient L est proportionnel :","o":["au carré du nombre de spires (N²)","à N uniquement","à l'inverse de N","indépendant de N"],"c":0,"e":"L = μ0·N²·S/l, formule du coefficient d'auto-induction d'un solénoïde sans noyau de fer : L est proportionnel à N²."},{"q":"Une bobine réelle possède, en plus de son inductance L, une résistance interne r qui provoque :","o":["une dissipation d'énergie par effet Joule","une annulation totale du phénomène d'auto-induction","une augmentation de l'inductance","aucun effet"],"c":0,"e":"La résistance interne r de la bobine dissipe une partie de l'énergie électrique par effet Joule, en plus du stockage magnétique."},{"q":"L'énergie magnétique Em = ½ L I² emmagasinée dans une bobine est analogue, par sa forme, à l'énergie électrostatique d'un condensateur :","o":["Ee = ½ C U²","Ee = C·U","Ee = q/C","Ee = C²U"],"c":0,"e":"Les deux expressions sont formellement analogues : ½ L I² pour la bobine et ½ C U² pour le condensateur."},{"q":"Dans un circuit RL soumis à un échelon de tension, l'intensité du courant tend vers sa valeur finale :","o":["instantanément","progressivement, avec un retard dû à l'auto-induction","jamais","de façon oscillante indéfiniment"],"c":1,"e":"L'auto-induction s'oppose à la variation brutale du courant, qui atteint sa valeur finale de façon progressive (établissement exponentiel)."},{"q":"Le rôle d'une bobine dans un circuit électrique est souvent comparé à celui de l'inertie mécanique car elle :","o":["s'oppose aux variations rapides du courant, comme la masse s'oppose aux variations rapides de vitesse","accélère toujours le courant","n'a aucune influence sur le courant","stocke uniquement de la chaleur"],"c":0,"e":"De même que l'inertie mécanique résiste aux changements de vitesse, la bobine résiste aux variations rapides de courant."},{"q":"Le flux propre φ = L·i d'une bobine est le flux magnétique créé par la bobine à travers :","o":["elle-même, du fait du courant qui la parcourt","un circuit voisin uniquement","le vide en l'absence de courant","une résistance externe"],"c":0,"e":"Le flux propre correspond au flux du champ magnétique créé par la bobine, à travers ses propres spires."},{"q":"L'auto-induction est utilisée, par exemple, dans les circuits d'allumage automobile pour :","o":["générer une haute tension lors de l'ouverture rapide du circuit primaire","mesurer la température du moteur","stocker du carburant","mesurer la vitesse du véhicule"],"c":0,"e":"L'ouverture rapide du circuit primaire de la bobine d'allumage provoque une f.é.m. auto-induite très élevée, nécessaire à l'étincelle."}]},{"t":"Physique — Oscillations électriques libres","m":"Physique","f":"","g":"Février","q":[{"q":"Un circuit (L, C) idéal, sans résistance, présente des oscillations :","o":["forcées","libres non amorties","amorties rapidement","nulles"],"c":1,"e":"En l'absence de résistance, l'énergie totale se conserve : les oscillations sont libres et non amorties."},{"q":"La pulsation propre d'un circuit (L, C) est donnée par :","o":["ω₀ = 1/√(LC)","ω₀ = LC","ω₀ = √(L/C)","ω₀ = L/C"],"c":0,"e":"ω₀ = 1/√(LC), formule à retenir pour tout circuit oscillant LC."},{"q":"Dans un circuit (R, L, C) amorti, le régime pseudopériodique se caractérise par :","o":["une croissance de l'amplitude","des oscillations d'amplitude constante","des oscillations d'amplitude décroissante","l'absence totale d'oscillation"],"c":2,"e":"Le régime pseudopériodique présente des oscillations dont l'amplitude décroît progressivement (amortissement)."},{"q":"Les oscillations électriques libres dans un circuit (L,C) peuvent être mises en évidence expérimentalement en observant, à l'oscilloscope :","o":["la tension aux bornes du condensateur après sa décharge dans la bobine","la tension d'une pile seule","la résistance du circuit","la température du circuit"],"c":0,"e":"En chargeant le condensateur puis en le laissant se décharger dans la bobine, on observe à l'oscilloscope des oscillations de tension."},{"q":"L'équation différentielle régissant la charge q(t) d'un condensateur se déchargeant dans une bobine idéale (L,C) s'écrit :","o":["q'' + (1/LC)·q = 0","q' + (1/LC)·q = 0","q'' − (1/LC)·q = 0","q + LC·q'' = 1"],"c":0,"e":"En appliquant la loi des mailles à un circuit LC idéal, on obtient l'équation q'' + (1/LC)·q = 0."},{"q":"Pour vérifier qu'une solution q(t) = Qₘ·cos(ω₀·t+φ) satisfait l'équation différentielle du circuit (L,C), il faut :","o":["dériver deux fois q(t) et substituer dans l'équation différentielle","mesurer expérimentalement q(0) uniquement","intégrer q(t) une fois","calculer uniquement Qₘ"],"c":0,"e":"On calcule q'(t) puis q''(t), et on vérifie que q'' + (1/LC)q = 0 est satisfaite pour tout t."},{"q":"La période propre T₀ d'un circuit (L,C) est donnée par :","o":["T₀ = 2π√(LC)","T₀ = 2π/√(LC)","T₀ = √(LC)","T₀ = LC"],"c":0,"e":"T₀ = 2π/ω₀ = 2π√(LC), avec ω₀ = 1/√(LC)."},{"q":"Dans un circuit (L,C) idéal, sans résistance, l'énergie totale se conserve car elle oscille entre :","o":["l'énergie électrique du condensateur et l'énergie magnétique de la bobine","l'énergie chimique et l'énergie nucléaire","l'énergie thermique et l'énergie cinétique","aucune forme d'échange n'existe"],"c":0,"e":"En l'absence de résistance, l'énergie totale se conserve et se transfère périodiquement entre le condensateur (Ee=q²/2C) et la bobine (Em=½Li²)."},{"q":"Dans un circuit (R,L,C) fortement amorti, on observe un régime dit :","o":["apériodique, sans oscillation","pseudopériodique avec de nombreuses oscillations","parfaitement sinusoïdal non amorti","de résonance"],"c":0,"e":"Pour un amortissement important, le régime devient apériodique : la tension retourne à zéro sans osciller."},{"q":"Le régime pseudopériodique d'un circuit (R,L,C) se distingue du régime périodique idéal par :","o":["une amplitude des oscillations qui diminue progressivement au cours du temps","une amplitude constante","l'absence totale d'oscillation","une fréquence infinie"],"c":0,"e":"Dans le régime pseudopériodique, les oscillations persistent mais leur amplitude décroît progressivement à cause de la résistance."},{"q":"Dans un circuit (L,C) non amorti, à l'instant où la tension aux bornes du condensateur est maximale, l'intensité du courant dans le circuit est :","o":["nulle","maximale","négative","infinie"],"c":0,"e":"À cet instant, toute l'énergie est sous forme électrique dans le condensateur ; l'énergie magnétique, donc le courant, est nulle."},{"q":"Dans un circuit (L,C) non amorti, lorsque l'intensité du courant est maximale, l'énergie emmagasinée dans le condensateur est :","o":["nulle","maximale","la moitié de l'énergie totale","infinie"],"c":0,"e":"À cet instant, toute l'énergie est sous forme magnétique dans la bobine ; l'énergie électrique du condensateur est nulle."},{"q":"Plus la résistance d'un circuit (R,L,C) est grande, plus l'amortissement des oscillations est :","o":["important, les oscillations s'atténuent plus vite","faible","inexistant","indépendant de R"],"c":0,"e":"La résistance dissipe l'énergie par effet Joule ; plus elle est grande, plus l'amortissement des oscillations est rapide."}]},{"t":"Physique — Oscillations électriques forcées","m":"Physique","f":"","g":"Février","q":[{"q":"L'intensité efficace d'un courant alternatif sinusoïdal est reliée à l'intensité maximale par :","o":["Ieff = Imax","Ieff = Imax/√2","Ieff = 2·Imax","Ieff = Imax²"],"c":1,"e":"Pour un signal sinusoïdal, la valeur efficace vaut la valeur maximale divisée par √2."},{"q":"Le phénomène de résonance d'intensité dans un circuit (R, L, C) série se produit lorsque :","o":["la résistance est nulle","la fréquence d'excitation égale la fréquence propre du circuit","la capacité est infinie","l'inductance est nulle"],"c":1,"e":"L'intensité est maximale à la résonance, quand la fréquence de l'excitateur égale la fréquence propre."},{"q":"Le facteur de qualité d'un circuit résonant caractérise :","o":["la puissance moyenne dissipée","la tension efficace aux bornes du générateur","l'acuité (finesse) de la résonance","la capacité du condensateur"],"c":2,"e":"Plus le facteur de qualité est élevé, plus la résonance est aiguë (bande passante étroite)."},{"q":"Un courant alternatif sinusoïdal est un courant dont l'intensité varie au cours du temps selon une fonction :","o":["sinusoïdale, de fréquence et d'amplitude données","constante","exponentielle croissante","aléatoire"],"c":0,"e":"Un courant alternatif sinusoïdal s'écrit i(t) = Im·sin(ωt+φ), caractérisé par son amplitude Im et sa pulsation ω."},{"q":"L'impédance Z d'un circuit (R,L,C) série peut être déterminée graphiquement à l'aide :","o":["de la construction de Fresnel","d'un simple calcul de résistance seule","de la loi de Kepler","de la loi de Lenz uniquement"],"c":0,"e":"La représentation de Fresnel permet d'additionner vectoriellement les tensions et d'en déduire l'impédance du circuit."},{"q":"Pour un circuit (R,L) série en régime sinusoïdal, l'impédance s'exprime par :","o":["Z = √(R² + (Lω)²)","Z = R + Lω","Z = R·Lω","Z = R/(Lω)"],"c":0,"e":"L'impédance d'un circuit (R,L) série se calcule par la somme quadratique de R et de la réactance inductive Lω."},{"q":"Pour un circuit (R,C) série en régime sinusoïdal, l'impédance s'exprime par :","o":["Z = √(R² + (1/(Cω))²)","Z = R + 1/(Cω)","Z = R·Cω","Z = R − Cω"],"c":0,"e":"L'impédance d'un circuit (R,C) série se calcule par la somme quadratique de R et de la réactance capacitive 1/(Cω)."},{"q":"À la résonance d'intensité d'un circuit (R,L,C) série, l'impédance du circuit est :","o":["minimale, égale à R","maximale","nulle","infinie"],"c":0,"e":"À la résonance, les réactances inductive et capacitive se compensent, l'impédance se réduit à R, ce qui rend l'intensité maximale."},{"q":"La courbe de résonance d'intensité I(f) d'un circuit (R,L,C) série présente :","o":["un pic à la fréquence de résonance puis une décroissance de part et d'autre","une droite constante","une décroissance continue sans pic","une croissance infinie"],"c":0,"e":"La courbe I(f) présente un maximum net à la fréquence de résonance, encadré par une décroissance progressive."},{"q":"La bande passante d'un circuit résonant correspond à l'intervalle de fréquences pour lequel :","o":["l'intensité reste supérieure à Imax/√2","l'intensité est nulle","la tension est constante","le circuit est hors tension"],"c":0,"e":"La bande passante délimite les fréquences pour lesquelles l'intensité efficace dépasse Imax/√2 (critère conventionnel)."},{"q":"Plus le facteur de qualité d'un circuit résonant est élevé, plus la bande passante est :","o":["étroite","large","nulle","infinie"],"c":0,"e":"Un facteur de qualité élevé traduit une résonance aiguë, donc une bande passante étroite."},{"q":"La puissance moyenne consommée par effet Joule dans un dipôle (R,L,C) série s'exprime, en fonction de l'intensité efficace Ieff, par :","o":["P = R·Ieff²","P = R·Ieff","P = Ieff²/R","P = R/Ieff"],"c":0,"e":"Seule la résistance R dissipe de l'énergie par effet Joule ; la puissance moyenne vaut P = R·Ieff²."},{"q":"Dans un circuit (R,L,C) série, le déphasage entre la tension et l'intensité dépend :","o":["de la fréquence du générateur, via Lω et 1/(Cω)","uniquement de la résistance R","uniquement de la tension efficace","d'aucun paramètre du circuit"],"c":0,"e":"Le déphasage dépend de la différence entre la réactance inductive et la réactance capacitive, qui varient toutes deux avec la fréquence."}]},{"t":"Physique — Ondes électromagnétiques","m":"Physique","f":"","g":"Février","q":[{"q":"Une onde électromagnétique se propage dans le vide à une vitesse égale à :","o":["la vitesse du son","une vitesse nulle","la vitesse de la lumière c","une vitesse infinie"],"c":2,"e":"Toutes les ondes électromagnétiques se propagent dans le vide à la célérité c ≈ 3×10⁸ m/s."},{"q":"Le spectre électromagnétique est classé par domaine selon :","o":["la longueur d'onde (ou la fréquence)","la couleur uniquement","l'intensité du courant","la masse des particules"],"c":0,"e":"On distingue les domaines (radio, IR, visible, UV, X, γ) selon la longueur d'onde ou la fréquence."},{"q":"Les rayons X, utilisés en imagerie médicale, se situent dans un domaine du spectre caractérisé par :","o":["une longueur d'onde très longue","une fréquence nulle","une longueur d'onde très courte","l'absence de propagation dans le vide"],"c":2,"e":"Les rayons X ont une longueur d'onde très courte (donc une fréquence et une énergie élevées)."},{"q":"Une onde électromagnétique est constituée de la propagation couplée :","o":["d'un champ électrique et d'un champ magnétique, perpendiculaires entre eux et à la direction de propagation","uniquement d'un champ électrique","uniquement d'un champ magnétique","de particules matérielles uniquement"],"c":0,"e":"Une onde électromagnétique associe un champ électrique et un champ magnétique perpendiculaires, se propageant ensemble."},{"q":"Contrairement à une onde mécanique, une onde électromagnétique peut se propager :","o":["dans le vide","uniquement dans un milieu matériel","uniquement dans l'eau","uniquement dans l'air"],"c":0,"e":"Une onde électromagnétique n'a pas besoin de support matériel : elle se propage même dans le vide."},{"q":"Le domaine des ondes radio correspond à des longueurs d'onde :","o":["très grandes, de quelques centimètres à plusieurs kilomètres","très courtes, de l'ordre du nanomètre","identiques à celles des rayons X","nulles"],"c":0,"e":"Les ondes radio ont les plus grandes longueurs d'onde du spectre électromagnétique usuel."},{"q":"Les ondes infrarouges, de longueur d'onde supérieure à celle du visible, sont notamment utilisées pour :","o":["les télécommandes et l'imagerie thermique","la radiographie médicale","la stérilisation par UV","la communication radio longue distance uniquement"],"c":0,"e":"L'infrarouge est couramment utilisé dans les télécommandes domestiques et l'imagerie thermique (caméras infrarouges)."},{"q":"Le domaine visible du spectre électromagnétique correspond à des longueurs d'onde comprises approximativement entre :","o":["400 nm et 800 nm","1 mm et 1 m","10⁻¹² m et 10⁻¹⁰ m","plusieurs kilomètres"],"c":0,"e":"La lumière visible correspond à des longueurs d'onde comprises approximativement entre 400 nm (violet) et 800 nm (rouge)."},{"q":"Les rayonnements ultraviolets (UV), de longueur d'onde inférieure au visible, sont notamment responsables :","o":["du bronzage et de certains risques pour la peau","de la propagation des ondes radio","de l'effet Joule","de la radioactivité naturelle"],"c":0,"e":"Les UV, plus énergétiques que le visible, provoquent le bronzage mais peuvent aussi endommager la peau en excès."},{"q":"Les rayons gamma (γ), situés à l'extrémité du spectre électromagnétique de plus haute fréquence, sont notamment émis lors :","o":["de désintégrations radioactives","de la réception d'ondes radio","du fonctionnement d'un four à micro-ondes uniquement","de la propagation du son"],"c":0,"e":"Les rayons γ, très énergétiques, accompagnent souvent des désintégrations radioactives (émission γ)."},{"q":"Plus la fréquence d'une onde électromagnétique est élevée, plus son énergie associée, par photon, est :","o":["grande","petite","nulle","indépendante de la fréquence"],"c":0,"e":"E = h·ν : l'énergie d'un photon est proportionnelle à la fréquence de l'onde électromagnétique associée."},{"q":"Les micro-ondes, utilisées notamment dans les fours domestiques et les radars, se situent dans le spectre :","o":["entre les ondes radio et l'infrarouge","entre les UV et les rayons X","au-delà des rayons gamma","dans le domaine du son"],"c":0,"e":"Les micro-ondes occupent une gamme de longueurs d'onde intermédiaire entre les ondes radio et l'infrarouge."},{"q":"La relation entre la longueur d'onde λ, la fréquence f et la célérité c d'une onde électromagnétique dans le vide s'écrit :","o":["c = λ·f","c = λ/f","c = f/λ","c = λ + f"],"c":0,"e":"c = λ·f, relation fondamentale reliant célérité, longueur d'onde et fréquence pour toute onde."}]},{"t":"Physique — Ondes lumineuses","m":"Physique","f":"","g":"Mars","q":[{"q":"La diffraction de la lumière met en évidence son caractère :","o":["corpusculaire pur","ondulatoire","thermique","électrique"],"c":1,"e":"Seul un phénomène ondulatoire peut se diffracter : la diffraction confirme la nature ondulatoire de la lumière."},{"q":"Dans le dispositif des fentes de Young, l'interfrange dépend :","o":["de la longueur d'onde, de l'écartement des fentes et de la distance à l'écran","uniquement de la puissance de la source","de la température ambiante","de la couleur de l'écran"],"c":0,"e":"i = λD/a, avec λ la longueur d'onde, D la distance à l'écran et a l'écartement des fentes."},{"q":"Deux sources lumineuses sont dites cohérentes lorsqu'elles ont :","o":["des fréquences différentes","même fréquence et un déphasage constant","des amplitudes nulles","la même position dans l'espace"],"c":1,"e":"La cohérence exige une même fréquence et un déphasage constant dans le temps entre les deux sources."},{"q":"Le phénomène de diffraction de la lumière se manifeste notamment lorsqu'un faisceau lumineux traverse :","o":["une fente très étroite ou un obstacle de petite dimension","uniquement un miroir plan","uniquement une lentille convergente","un milieu parfaitement homogène et infini"],"c":0,"e":"La diffraction apparaît lorsque la lumière rencontre un obstacle ou une ouverture de dimension comparable à sa longueur d'onde."},{"q":"Pour observer des interférences lumineuses stables avec le dispositif des fentes de Young, les deux sources doivent être :","o":["synchrones et cohérentes, de même fréquence et de déphasage constant","de fréquences différentes","de couleurs différentes","très éloignées l'une de l'autre"],"c":0,"e":"La cohérence des deux sources secondaires est indispensable pour obtenir une figure d'interférence stable dans le temps."},{"q":"Dans le dispositif des fentes de Young, les deux sources secondaires sont généralement obtenues par :","o":["le passage d'une même onde lumineuse à travers deux fentes fines et proches","deux lasers indépendants non synchronisés","deux ampoules ordinaires quelconques","une seule fente unique"],"c":0,"e":"Une seule source primaire éclaire deux fentes fines, qui se comportent alors comme deux sources secondaires cohérentes."},{"q":"La différence de marche δ entre deux rayons issus des fentes de Young, en un point M de l'écran, s'exprime en fonction de l'écartement a, de la distance D et de la position x par :","o":["δ = a·x/D","δ = D·x/a","δ = a·D/x","δ = a + x + D"],"c":0,"e":"La différence de marche entre les deux chemins optiques s'exprime par δ = a·x/D, dans l'approximation des petits angles."},{"q":"Une frange brillante est observée en un point où la différence de marche δ est égale à :","o":["un nombre entier de longueurs d'onde (δ = k·λ)","un nombre demi-entier de longueurs d'onde","toujours nulle uniquement au centre","une valeur aléatoire"],"c":0,"e":"L'interférence est constructive (frange brillante) lorsque δ = k·λ, avec k entier relatif."},{"q":"Une frange sombre est observée en un point où la différence de marche δ est égale à :","o":["(k + ½)·λ, avec k entier","k·λ, avec k entier","toujours nulle","λ/4 uniquement"],"c":0,"e":"L'interférence est destructive (frange sombre) lorsque δ = (k+½)·λ, avec k entier relatif."},{"q":"L'interfrange i, distance entre deux franges brillantes consécutives, augmente lorsque :","o":["la longueur d'onde λ augmente, à a et D fixés","l'écartement a des fentes augmente","la distance D à l'écran diminue","aucune de ces situations"],"c":0,"e":"i = λD/a : l'interfrange est proportionnel à la longueur d'onde λ."},{"q":"Si l'on augmente la distance D entre les fentes de Young et l'écran, à a et λ fixés, l'interfrange i :","o":["augmente","diminue","reste constant","devient nul"],"c":0,"e":"i = λD/a : l'interfrange est proportionnel à D."},{"q":"Si l'on augmente l'écartement a des fentes de Young, à λ et D fixés, l'interfrange i :","o":["diminue","augmente","reste constant","devient infini"],"c":0,"e":"i = λD/a : l'interfrange est inversement proportionnel à l'écartement a des fentes."},{"q":"Deux ondes lumineuses de même fréquence mais de phases aléatoires et changeant constamment l'une par rapport à l'autre sont dites :","o":["incohérentes","cohérentes","synchrones","en phase constante"],"c":0,"e":"Deux sources sont incohérentes lorsque leur déphasage relatif varie de façon imprévisible dans le temps, empêchant toute interférence stable."},{"q":"Au centre de la figure d'interférence des fentes de Young, point équidistant des deux fentes, on observe :","o":["une frange brillante, δ = 0","une frange sombre","l'absence totale de lumière","une zone de diffraction pure"],"c":0,"e":"Au point équidistant des deux fentes, la différence de marche est nulle (δ=0=0·λ) : on y observe une frange brillante centrale."},{"q":"La couleur d'une frange brillante observée en lumière blanche, hors du centre de la figure d'interférence, dépend :","o":["de la longueur d'onde qui vérifie la condition d'interférence constructive en ce point","uniquement de l'intensité de la source","de la distance D uniquement","d'aucun facteur physique"],"c":0,"e":"Chaque longueur d'onde du spectre visible produit ses propres franges brillantes à des positions différentes, colorant la figure."},{"q":"Un faisceau laser est souvent utilisé dans les expériences d'interférences car il fournit une lumière :","o":["monochromatique et cohérente","polychromatique et incohérente","de fréquence variable aléatoirement","totalement diffuse"],"c":0,"e":"Le laser émet une lumière monochromatique et cohérente, idéale pour obtenir des figures d'interférence nettes."},{"q":"Le phénomène de diffraction devient plus marqué, angle de diffraction plus grand, lorsque la largeur de la fente :","o":["diminue","augmente","reste constante","n'a aucune influence"],"c":0,"e":"Plus la fente est étroite (comparable à λ), plus le phénomène de diffraction est prononcé."},{"q":"La mise en évidence expérimentale de la diffraction de la lumière, historiquement, a permis d'appuyer :","o":["le modèle ondulatoire de la lumière face au modèle purement corpusculaire","le modèle purement corpusculaire de la lumière","la théorie de la relativité","la théorie de la gravitation universelle"],"c":0,"e":"Seul un phénomène ondulatoire pouvant se diffracter, cette observation a été un argument majeur en faveur du modèle ondulatoire de la lumière."}]},{"t":"Physique — Effet photoélectrique","m":"Physique","f":"","g":"Mars","q":[{"q":"Selon la théorie d'Einstein, la lumière est constituée de :","o":["particules massives chargées","photons, quanta d'énergie","ondes uniquement, sans grain d'énergie","atomes"],"c":1,"e":"Einstein modélise la lumière comme un flux de photons, chacun porteur d'un quantum d'énergie E = h·ν."},{"q":"L'effet photoélectrique ne se produit que si :","o":["l'intensité lumineuse est suffisante, quelle que soit la fréquence","la fréquence de la lumière incidente dépasse une fréquence seuil","la lumière est rouge","le métal est isolant"],"c":1,"e":"Il existe une fréquence seuil en dessous de laquelle aucun électron n'est arraché, quelle que soit l'intensité."},{"q":"La dualité onde-corpuscule signifie que la lumière (et la matière) présente :","o":["uniquement des propriétés ondulatoires","uniquement des propriétés corpusculaires","à la fois des propriétés ondulatoires et corpusculaires","aucune de ces propriétés"],"c":2,"e":"Selon le contexte expérimental, la lumière se manifeste tantôt comme une onde, tantôt comme un flux de particules."},{"q":"L'effet photoélectrique correspond à :","o":["l'émission d'électrons par une plaque métallique éclairée par une lumière de fréquence suffisante","l'émission de lumière par un métal chauffé","la désintégration d'un noyau radioactif","l'absorption de particules alpha"],"c":0,"e":"L'effet photoélectrique est l'arrachement d'électrons d'un métal sous l'action d'un rayonnement lumineux de fréquence suffisante."},{"q":"La fréquence seuil photoélectrique d'un métal est la fréquence minimale de la lumière incidente :","o":["en dessous de laquelle aucun électron n'est arraché, quelle que soit l'intensité lumineuse","au-dessus de laquelle l'effet photoélectrique n'existe plus","qui correspond toujours à la lumière rouge","qui dépend uniquement de l'intensité lumineuse"],"c":0,"e":"En dessous de la fréquence seuil, aucun électron n'est émis, même avec une intensité lumineuse très élevée."},{"q":"Le quantum d'énergie d'un photon de fréquence ν est donné par :","o":["E = h·ν","E = h/ν","E = m·c²","E = h·c"],"c":0,"e":"L'énergie d'un photon est proportionnelle à sa fréquence : E = h·ν, où h est la constante de Planck."},{"q":"Dans la relation d'Einstein pour l'effet photoélectrique, l'énergie cinétique maximale Ec des électrons émis s'exprime par :","o":["Ec = h·ν − W₀, W₀ étant le travail d'extraction","Ec = h·ν + W₀","Ec = W₀/(h·ν)","Ec = h·ν·W₀"],"c":0,"e":"L'énergie du photon absorbé se répartit entre le travail d'extraction W₀ et l'énergie cinétique de l'électron émis."},{"q":"Le travail d'extraction W₀ d'un métal représente :","o":["l'énergie minimale nécessaire pour arracher un électron du métal","l'énergie cinétique de l'électron émis","la charge de l'électron","la masse du métal"],"c":0,"e":"W₀ est l'énergie qu'il faut fournir au minimum à un électron pour qu'il quitte le métal."},{"q":"Le travail d'extraction W₀ d'un métal est relié à sa fréquence seuil ν0 par la relation :","o":["W₀ = h·ν0","W₀ = h/ν0","W₀ = ν0/h","W₀ = h + ν0"],"c":0,"e":"À la fréquence seuil, toute l'énergie du photon sert juste à extraire l'électron (Ec=0), d'où W₀ = h·ν0."},{"q":"Si la fréquence de la lumière incidente est inférieure à la fréquence seuil, augmenter l'intensité lumineuse :","o":["ne provoque pas d'émission d'électrons","provoque toujours l'émission d'électrons","double l'énergie cinétique des électrons émis","n'a aucun rapport avec le phénomène"],"c":0,"e":"Chaque photon doit individuellement posséder une énergie suffisante ; augmenter le nombre de photons sans augmenter leur énergie individuelle ne change rien."},{"q":"Une augmentation de l'intensité lumineuse, à fréquence fixée supérieure au seuil, a pour effet d'augmenter :","o":["le nombre d'électrons arrachés par seconde (intensité du courant photoélectrique)","l'énergie cinétique de chaque électron émis","la fréquence seuil","le travail d'extraction"],"c":0,"e":"L'intensité lumineuse est proportionnelle au nombre de photons reçus par seconde ; chacun libère un électron, augmentant le courant photoélectrique, mais pas l'énergie individuelle de chaque électron."},{"q":"La théorie d'Einstein sur l'effet photoélectrique repose sur l'idée que la lumière transporte son énergie sous forme :","o":["de grains d'énergie discrets, les photons","d'un flux continu, indéfiniment divisible","de particules massives chargées","d'ondes purement mécaniques"],"c":0,"e":"Einstein a modélisé la lumière comme un flux de photons, chacun porteur d'un quantum d'énergie h·ν."},{"q":"La dualité onde-corpuscule signifie que selon le phénomène observé, la lumière se comporte :","o":["tantôt comme une onde, tantôt comme un ensemble de particules, les photons","uniquement comme une onde","uniquement comme une particule","ni comme une onde ni comme une particule"],"c":0,"e":"Certains phénomènes (diffraction, interférences) révèlent le caractère ondulatoire ; d'autres (effet photoélectrique) révèlent le caractère corpusculaire."},{"q":"Une cellule photovoltaïque convertit directement :","o":["l'énergie lumineuse en énergie électrique","l'énergie électrique en énergie lumineuse","l'énergie chimique en énergie mécanique","l'énergie nucléaire en énergie thermique"],"c":0,"e":"Une cellule photovoltaïque transforme directement l'énergie des photons incidents en énergie électrique."},{"q":"Le fonctionnement d'une cellule photovoltaïque repose sur un phénomène apparenté à :","o":["l'effet photoélectrique, interaction photon-matière libérant des charges","la radioactivité naturelle","l'induction électromagnétique uniquement","la loi de Kepler"],"c":0,"e":"L'absorption de photons libère des porteurs de charge dans le matériau semi-conducteur, générant un courant électrique."},{"q":"Dans une expérience d'effet photoélectrique, si l'on utilise une lumière de fréquence supérieure à la fréquence seuil, l'énergie cinétique maximale des électrons émis :","o":["augmente avec la fréquence de la lumière incidente","diminue avec la fréquence","est indépendante de la fréquence","est toujours nulle"],"c":0,"e":"D'après Ec = h·ν − W₀, l'énergie cinétique des électrons émis augmente linéairement avec la fréquence de la lumière incidente."},{"q":"Le fait que l'effet photoélectrique dépende d'une fréquence seuil, et non de l'intensité, est un phénomène :","o":["inexplicable par le modèle ondulatoire classique de la lumière, mais expliqué par le modèle du photon","parfaitement expliqué par le modèle ondulatoire classique","sans rapport avec la nature de la lumière","uniquement observé pour les métaux non conducteurs"],"c":0,"e":"Le modèle ondulatoire classique prévoit qu'une intensité suffisante devrait toujours arracher des électrons, ce que l'expérience contredit ; seul le modèle du photon explique correctement le seuil."},{"q":"L'expérience historique de l'effet photoélectrique utilise typiquement un dispositif comportant :","o":["une plaque métallique éclairée, reliée à un circuit permettant de détecter un courant d'électrons émis","un tube contenant un gaz radioactif","un aimant en rotation","un condensateur seul, sans source lumineuse"],"c":0,"e":"Le dispositif classique comprend une cathode métallique éclairée, une anode et un circuit permettant de mesurer le courant photoélectrique produit."}]},{"t":"Physique — Niveaux d'énergie de l'atome","m":"Physique","f":"","g":"Avril","q":[{"q":"Pour l'atome d'hydrogène, l'énergie du niveau n est donnée par :","o":["En = 13,6·n² (eV)","En = −13,6/n² (eV)","En = −13,6·n (eV)","En = 13,6/n (eV)"],"c":1,"e":"En = −13,6/n² (eV), formule des niveaux d'énergie de l'atome d'hydrogène (modèle de Bohr)."},{"q":"La désexcitation d'un atome correspond à :","o":["une absorption d'énergie","un passage d'un niveau supérieur vers un niveau inférieur avec émission d'un photon","une ionisation complète","une fusion nucléaire"],"c":1,"e":"Lors de la désexcitation, l'atome perd de l'énergie en émettant un photon en passant à un niveau plus bas."},{"q":"L'ionisation d'un atome correspond à :","o":["la capture d'un électron supplémentaire","l'arrachement d'un électron : l'atome devient un ion","la désintégration du noyau","l'émission d'un rayonnement γ uniquement"],"c":1,"e":"L'ionisation consiste à fournir assez d'énergie pour arracher un électron : l'atome devient un ion positif."},{"q":"Un spectre de raies d'émission (ou d'absorption) d'un atome met en évidence :","o":["la quantification des niveaux d'énergie de l'atome","un spectre continu sans structure","l'absence totale d'énergie dans l'atome","une énergie infinie de l'atome"],"c":0,"e":"Les raies discrètes du spectre correspondent à des transitions entre niveaux d'énergie eux-mêmes discrets (quantifiés)."},{"q":"Selon les postulats de Bohr, l'énergie de l'atome ne peut prendre que des valeurs :","o":["discrètes, correspondant à des niveaux d'énergie bien définis","continues, prenant n'importe quelle valeur","toujours nulles","infinies"],"c":0,"e":"Bohr postule que l'atome ne peut exister que dans des états d'énergie discrets, appelés niveaux d'énergie."},{"q":"La relation de Bohr reliant la fréquence ν(p,n) d'un photon émis ou absorbé aux niveaux d'énergie En et Ep s'écrit :","o":["h·ν(p,n) = En − Ep","h·ν(p,n) = En + Ep","h·ν(p,n) = En·Ep","h·ν(p,n) = En/Ep"],"c":0,"e":"L'énergie du photon échangé correspond exactement à la différence d'énergie entre les deux niveaux impliqués dans la transition."},{"q":"Lorsqu'un atome absorbe un photon et passe d'un niveau d'énergie inférieur à un niveau supérieur, ce phénomène est appelé :","o":["excitation","désexcitation","ionisation","fission"],"c":0,"e":"L'excitation correspond au passage d'un atome vers un niveau d'énergie plus élevé, par absorption d'un photon."},{"q":"Pour l'atome d'hydrogène, l'énergie du niveau fondamental (n=1) vaut :","o":["−13,6 eV","+13,6 eV","0 eV","−6,8 eV"],"c":0,"e":"En = −13,6/n² (eV) ; pour n=1, on obtient E₁ = −13,6 eV, le niveau fondamental (le plus lié)."},{"q":"Un spectre d'émission de raies est obtenu lorsqu'un gaz excité :","o":["émet de la lumière uniquement à certaines longueurs d'onde discrètes, correspondant aux transitions entre niveaux d'énergie","émet toutes les longueurs d'onde de façon continue","n'émet aucune lumière","absorbe toute la lumière incidente"],"c":0,"e":"Chaque raie d'émission correspond à une transition précise d'un niveau d'énergie supérieur vers un niveau inférieur."},{"q":"Un spectre d'absorption de raies apparaît lorsqu'une lumière blanche traverse un gaz froid, qui absorbe :","o":["certaines longueurs d'onde précises, correspondant aux transitions énergétiques possibles de ses atomes","toutes les longueurs d'onde de façon uniforme","aucune longueur d'onde","uniquement les infrarouges"],"c":0,"e":"Le gaz absorbe sélectivement les photons dont l'énergie correspond exactement à une transition possible entre ses niveaux d'énergie."},{"q":"La spectroscopie permet notamment de déterminer la composition chimique d'une étoile en analysant :","o":["les raies d'absorption ou d'émission présentes dans son spectre lumineux","uniquement sa température de surface par le toucher","sa masse par pesée directe","sa vitesse de rotation uniquement"],"c":0,"e":"Chaque élément chimique possède un spectre de raies caractéristique, qui permet de l'identifier à distance dans une étoile."},{"q":"L'étude du spectre de la couronne solaire par spectroscopie a notamment permis de découvrir :","o":["la présence d'éléments chimiques caractéristiques par leurs raies spécifiques","l'absence totale d'éléments chimiques","uniquement la présence d'hydrogène","rien de significatif"],"c":0,"e":"L'analyse spectroscopique de la couronne solaire a révélé la présence d'éléments identifiés grâce à leurs raies caractéristiques."},{"q":"Quand un atome passe d'un niveau d'énergie En (supérieur) à un niveau Ep (inférieur), l'énergie du photon émis vaut :","o":["En − Ep (positive)","Ep − En","En + Ep","En·Ep"],"c":0,"e":"Le photon émis lors de la désexcitation emporte l'énergie perdue par l'a
