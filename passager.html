<style>:root{--navy:#0A2A57;--navy-deep:#071A38;--blue:#2563EB;--gold:#FAB202;--green:#17A34A;--red:#D9060C;--ink:#0F172A;--ink2:#5B6B85;--paper:#F5F8FC;--paper2:#EEF2F8;--line:#E3E9F2;--shadow:0 6px 24px rgba(10,42,87,.08);--ease:cubic-bezier(.4,0,.2,1);--gn-green:#009460;--gn-yellow:#FCD116;--gn-red:#CE1126}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Work Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink)}
h1,h2,h3{font-family:'Poppins',sans-serif;color:inherit;line-height:1.15}
#app{max-width:720px;margin:0 auto;min-height:100vh}
header{background:var(--navy-deep);color:#fff;padding:12px 18px 16px;border-bottom:4px solid;border-image:linear-gradient(90deg,var(--gn-green),var(--gn-yellow),var(--gn-red)) 1}
.logo-mark{width:52px;height:52px;border-radius:50%;background:#fff;padding:3px;object-fit:contain;flex:none}
header h1{font:800 19px Poppins,sans-serif;color:#fff}header p{font-size:11.5px;color:var(--gold);font-weight:700;letter-spacing:.02em;margin-top:3px}
nav{display:flex;gap:8px;margin-top:12px;font-size:12.5px;flex-wrap:wrap}nav a{color:#fff;border:1.5px solid rgba(255,255,255,.55);padding:7px 14px;border-radius:999px;text-decoration:none;font-weight:600}nav a:hover{background:rgba(255,255,255,.12)}
main{padding:18px 16px}.card{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
h2{font:700 17px Poppins,sans-serif;margin:4px 0 12px;color:var(--ink)}label{font-size:12.5px;font-weight:600;color:var(--ink2);display:block;margin:10px 0 5px}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}input:focus,select:focus{outline:none;border-color:var(--blue)}
.btn{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:999px;background:var(--navy);color:#fff;font:700 14px 'Work Sans',sans-serif;cursor:pointer;transition:transform .15s var(--ease)}.btn:hover{transform:translateY(-2px)}
.btn.or{background:var(--blue);color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.3)}.btn.vert{background:var(--green)}.btn.rouge{background:var(--red)}.btn.sm{padding:10px;margin-top:8px;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.meta{font-size:12.5px;color:var(--ink2);margin-top:4px}
.badge{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--paper2);white-space:nowrap}
.en_attente{background:#FEF3C7;color:#92400E}.acceptee,.en_cours{background:#DCFCE7;color:#166534}.terminee{background:#E0E7FF;color:#3730A3}.annulee{background:#FEE2E2;color:#991B1B}
.road{position:relative;height:26px;margin:10px 0;border-bottom:2px dashed var(--line)}.car{position:absolute;bottom:-4px;left:0;font-size:22px}
.move{animation:go 3s linear infinite}@keyframes go{to{left:calc(100% - 26px)}}
#msg{font-size:13px;margin-top:10px;color:var(--red)}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}#toast.show{opacity:1}
.hide{display:none}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1;padding:9px 12px;border:1.5px solid var(--line);background:#fff;border-radius:999px;font:700 12.5px 'Work Sans',sans-serif;color:var(--ink2);cursor:pointer}.tabs .on{background:var(--navy-deep);border-color:var(--navy-deep);color:#fff}
