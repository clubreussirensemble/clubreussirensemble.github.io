<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Messages — Club Réussir Ensemble</title>
<meta name="description" content="Messagerie privée des élèves du Club Réussir Ensemble : discute en direct, envoie photos et vidéos.">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A2A57; --navy-deep:#071A38; --blue:#2563EB; --blue-deep:#1D4ED8;
  --green:#17A34A; --red:#D9060C; --gold:#FAB202;
  --ink:#0F172A; --ink2:#5B6B85; --paper:#F5F8FC; --paper2:#EEF2F8; --line:#E3E9F2; --card:#FFFFFF;
  --mine:#DCEBFF; --mine-ink:#0F172A; --theirs:#FFFFFF; --chatbg:#EAF0F8;
  --shadow:0 6px 24px rgba(10,42,87,.08);
}
:root[data-theme="dark"]{
  --ink:#EAF0FA; --ink2:#9FB0C8; --paper:#0B1626; --paper2:#111F35; --line:#22314A; --card:#101E33;
  --mine:#1D4ED8; --mine-ink:#fff; --theirs:#16263F; --chatbg:#0B1626; --navy-deep:#050D1A;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:'Work Sans',sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button,input,textarea,select{font-family:inherit}
a{text-decoration:none;color:inherit}

/* En-tête */
.bar{background:var(--navy-deep);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));flex-shrink:0}
.bar a.back{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:18px}
.bar img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.bar b{font:800 16px 'Poppins',sans-serif;line-height:1.1}
.bar small{display:block;color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:.06em}
.bar .sp{flex:1}
.ib{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:16px;cursor:pointer}

/* Mise en page */
#gate{padding:40px 20px;text-align:center;color:var(--ink2);font-size:15px}
#app{flex:1;display:flex;min-height:0}
.side{width:360px;max-width:100%;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--chatbg)}

/* Liste */
.stop{padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px}
.stop h2{margin:0;font:800 20px 'Poppins',sans-serif}
.srch{width:100%;border:none;border-radius:999px;padding:11px 16px;background:var(--paper2);color:var(--ink);font-size:14px;outline:none}
.tabs{display:flex;gap:6px}
.tab{border:none;background:var(--paper2);color:var(--ink2);font-weight:600;font-size:12.5px;padding:7px 14px;border-radius:999px;cursor:pointer}
.tab.on{background:var(--blue);color:#fff}
#list{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover,.row.on{background:var(--paper2)}
.row .mid{flex:1;min-width:0}
.row .t1{display:flex;gap:8px;align-items:baseline}
.row .t1 b{flex:1;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t1 small{color:var(--ink2);font-size:11.5px;flex-shrink:0}
.row .t2{display:flex;gap:8px;align-items:center;margin-top:2px}
.row .t2 span{flex:1;color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.unread .t2 span,.row.unread .t1 small{color:var(--ink);font-weight:700}
.badge{background:var(--green);color:#fff;font-size:11.5px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.av{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px 'Poppins',sans-serif;flex-shrink:0;background-size:cover;background-position:center}
.av.has{color:transparent;font-size:0}
.av.sm{width:38px;height:38px;font-size:13px}
.empty{color:var(--ink2);text-align:center;padding:36px 20px;font-size:14px}

/* Conversation */
.chead{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.chead .back{display:none;border:none;background:none;font-size:22px;color:var(--ink);cursor:pointer;padding:0 4px}
.chead b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead small{display:block;color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;background:var(--card);color:var(--ink2);font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:999px;margin:10px 0;box-shadow:var(--shadow)}
.bw{display:flex}
.bw.me{justify-content:flex-end}
.bb{max-width:min(78%,520px);padding:7px 10px 5px;border-radius:14px;background:var(--theirs);color:var(--ink);box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:14.5px;line-height:1.35;word-wrap:break-word;overflow-wrap:anywhere}
.bw.me .bb{background:var(--mine);color:var(--mine-ink);border-bottom-right-radius:4px}
.bw:not(.me) .bb{border-bottom-left-radius:4px}
.bb p{margin:0;white-space:pre-wrap}
.bb img,.bb video{display:block;max-width:100%;max-height:320px;border-radius:10px;margin-bottom:4px;cursor:pointer;background:#000}
.meta{display:flex;justify-content:flex-end;gap:4px;font-size:10.5px;opacity:.65;margin-top:2px}
.tick.lu{color:#38BDF8;opacity:1}
.who{font-size:11.5px;font-weight:700;color:var(--blue);margin-bottom:2px}

/* Saisie */
.composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);flex-shrink:0;position:relative}
.composer textarea{flex:1;resize:none;border:none;outline:none;border-radius:20px;padding:11px 16px;background:var(--paper2);color:var(--ink);font-size:15px;max-height:120px;line-height:1.3}
.cbtn{width:42px;height:42px;border-radius:50%;border:none;background:none;font-size:20px;cursor:pointer;color:var(--ink2);flex-shrink:0}
.cbtn:hover{background:var(--paper2)}
.send{background:var(--blue);color:#fff;font-size:17px}
.send:hover{background:var(--blue-deep)}
.send:disabled{opacity:.5}
#emo{position:absolute;bottom:100%;left:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;max-width:calc(100% - 16px)}
#emo.open{display:grid}
#emo button{border:none;background:none;font-size:22px;padding:4px;cursor:pointer;border-radius:8px}
#emo button:hover{background:var(--paper2)}
#prev{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
#prev img,#prev video{width:54px;height:54px;object-fit:cover;border-radius:8px}
#prev span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prev button{border:none;background:none;font-size:18px;color:var(--red);cursor:pointer}
.ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink2);text-align:center;padding:20px}
.ph .big{font-size:56px}
.note{font-size:11.5px;color:var(--ink2);text-align:center;padding:6px 12px;background:var(--card)}

/* Visionneuse */
#vw{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center}
#vw.open{display:flex}
#vw img,#vw video{max-width:96%;max-height:90vh}
#vw button{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;border:none;background:rgba(255,255,255,.15);color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}

/* Mobile : un seul panneau à la fois */
@media (max-width:760px){
  .side{width:100%;border-right:none}
  .main{display:none}
  body.chat-open .side{display:none}
  body.chat-open .main{display:flex}
  .chead .back{display:block}
  .bb{max-width:86%}
}
.mdel{background:none;border:0;cursor:pointer;font-size:12px;opacity:.55;padding:0 4px;margin-right:auto;line-height:1}
.mdel:hover{opacity:1}
.mdel:disabled{opacity:.3;cursor:default}
.callb{border:none;background:var(--paper2);color:var(--ink);font-weight:700;font-size:12.5px;padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.callb:hover{background:var(--line)}
.callj{display:inline-block;margin:4px 0 2px;background:var(--green);color:#fff!important;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px}
.bb audio{display:block;width:240px;max-width:100%;height:40px;margin-bottom:4px}
#rec{display:none;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-top:1px solid var(--line);font-size:14px;color:var(--ink)}
#rec .dot{width:11px;height:11px;border-radius:50%;background:var(--red);animation:blk 1s infinite}
@keyframes blk{50%{opacity:.25}}
#rec span{flex:1;font-weight:700}
#rec button{border:none;border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer}
#rec #recX{background:var(--paper2);color:var(--red)}
#rec #recOk{background:var(--blue);color:#fff}
#micBtn.on{color:var(--red)}
@media (max-width:420px){.callb{padding:8px 9px;font-size:12px}}
.tabs{flex-wrap:wrap}
.newg{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--line);font-weight:700;color:var(--blue)}
.newg:hover{background:var(--paper2)}
.newg .av{background:var(--green)}
.mact{background:none;border:0;cursor:pointer;font-size:12px;opacity:.55;padding:0 3px;line-height:1}
.mact:hover{opacity:1}
.rq{border-left:3px solid var(--blue);background:rgba(37,99,235,.10);border-radius:6px;padding:4px 8px;margin-bottom:4px;cursor:pointer;font-size:12.5px}
.rq b{display:block;color:var(--blue);font-size:11.5px}
.rq span{display:block;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.rx{background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.rx.mine{border-color:var(--blue);background:rgba(37,99,235,.15)}
#rp{position:fixed;z-index:250;display:none;background:var(--card);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:4px 6px;gap:2px}
#rp.open{display:flex}
#rp button{border:none;background:none;font-size:22px;padding:3px 5px;cursor:pointer;border-radius:50%}
#rp button:hover{background:var(--paper2)}
#rbar{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);font-size:13px}
#rbar div{flex:1;min-width:0;border-left:3px solid var(--blue);padding-left:8px}
#rbar b{display:block;color:var(--blue);font-size:12px}
#rbar span{display:block;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rbar button{border:none;background:none;font-size:18px;color:var(--red);cursor:pointer}
.bw.flash .bb{outline:2px solid var(--gold)}
#gm{position:fixed;inset:0;z-index:320;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
#gm.open{display:flex}
.gbox{background:var(--card);color:var(--ink);border-radius:18px;width:100%;max-width:420px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.gbox h3{margin:0;padding:16px 18px 8px;font:800 18px 'Poppins',sans-serif}
.gbox input[type=text]{margin:6px 18px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--paper2);color:var(--ink);font-size:14.5px;outline:none}
#gpick{flex:1;overflow-y:auto;margin:4px 8px;min-height:120px}
#gpick label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:14px}
#gpick label:hover{background:var(--paper2)}
#gpick small{color:var(--ink2)}
.gact{display:flex;gap:8px;padding:12px 18px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.gact button{border:none;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--paper2);color:var(--ink)}
.gact #gsave{background:var(--blue);color:#fff}
.gact #gleave{background:none;color:var(--red);margin-right:auto}
#fm{position:fixed;inset:0;z-index:320;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px}
#fm.open{display:flex}
#fm .gbox input[type=text]{margin:6px 18px}
#fpick{flex:1;overflow-y:auto;min-height:160px}
.fwd{font-size:11.5px;font-style:italic;opacity:.7;margin-bottom:2px}
.gone{font-style:italic;opacity:.65}
#callov{position:fixed;inset:0;z-index:400;background:#000;display:none;flex-direction:column}
#callov.open{display:flex}
#callov .cbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--navy-deep);color:#fff;flex-shrink:0}
#callov .cbar b{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#callov .cbar a{color:var(--gold);font-weight:700;font-size:12.5px}
#callov .cbar button{border:none;border-radius:999px;background:var(--red);color:#fff;font-weight:700;padding:9px 16px;cursor:pointer}
#callov iframe{flex:1;border:0;width:100%;background:#000}
.gtag{font-size:11px;color:var(--red);font-weight:700;margin-bottom:2px}
</style>
</head>
<body>

<header class="bar">
  <a class="back" href="reseau.html" aria-label="Retour au réseau">←</a>
  <img src="/icon-512.png" alt="" onerror="this.style.display='none'">
  <div><b>Messages</b><small>CLUB RÉUSSIR ENSEMBLE</small></div>
  <span class="sp"></span>
  <button class="ib" id="notifBtn" aria-label="Notifications" title="Activer les notifications" style="display:none">🔕</button>
  <button class="ib" id="themeBtn" aria-label="Thème">🌙</button>
</header>

<div id="gate">Chargement…</div>

<div id="app" style="display:none">
  <aside class="side">
    <div class="stop">
      <h2>Discussions</h2>
      <input class="srch" id="q" type="search" placeholder="Rechercher un élève ou une discussion…" autocomplete="off">
      <div class="tabs">
        <button class="tab on" id="tChats">💬 Discussions</button>
        <button class="tab" id="tGroups">👪 Groupes</button>
        <button class="tab" id="tPeople">👥 Tous les élèves</button>
        <button class="tab" id="tAdmin" style="display:none">🛡️ Supervision</button>
      </div>
    </div>
    <div id="list"></div>
  </aside>

  <section class="main" id="main">
    <div class="ph" id="ph"><div class="big">💬</div><b>Tes messages</b><span>Choisis une discussion ou commence-en une nouvelle avec un camarade du club.</span></div>
    <div id="chatbox" style="display:none;flex:1;flex-direction:column;min-height:0">
      <div class="chead">
        <button class="back" id="back" aria-label="Retour">←</button>
        <div class="av sm" id="cav"></div>
        <div style="min-width:0;flex:1"><b id="cname"></b><small id="csub"></small></div>
        <button class="callb" id="callMeet" type="button" title="Appel vidéo Google Meet">📹 Meet</button>
        <button class="callb" id="callJitsi" type="button" title="Appel vidéo Jitsi Meet">📞 Jitsi</button>
        <button class="callb" id="ginfo" type="button" title="Infos du groupe" style="display:none">ℹ️ Groupe</button>
      </div>
      <div id="msgs"></div>
      <div class="note" id="cnote">🔒 Pour la sécurité des élèves, l’administration du club peut consulter les messages.</div>
      <div id="prev"></div>
      <div id="rbar"><div><b id="rbN"></b><span id="rbT"></span></div><button type="button" id="rbX" aria-label="Annuler la réponse">✕</button></div>
      <div id="rec"><i class="dot"></i><span id="recT">0:00</span><button type="button" id="recX" aria-label="Annuler">✕</button><button type="button" id="recOk" aria-label="Envoyer le vocal">➤</button></div>
      <div class="composer" id="composer">
        <div id="emo"></div>
        <button class="cbtn" id="emoBtn" aria-label="Émojis">😊</button>
        <button class="cbtn" id="attBtn" aria-label="Joindre une photo ou une vidéo">📎</button>
        <input type="file" id="file" accept="image/*,video/*" hidden>
        <button class="cbtn" id="micBtn" aria-label="Message vocal" title="Message vocal">🎤</button>
        <textarea id="inp" rows="1" maxlength="1000" placeholder="Écris un message…"></textarea>
        <button class="cbtn send" id="send" aria-label="Envoyer">➤</button>
      </div>
    </div>
  </section>
</div>

<div id="vw"><button id="vx" aria-label="Fermer">✕</button><div id="vm"></div></div>
<div id="rp"></div>
<div id="callov"><div class="cbar"><b id="callT">Appel vidéo</b><a id="callTab" href="#" target="_blank" rel="noopener noreferrer">↗ Onglet</a><button type="button" id="callX">📞 Quitter</button></div><iframe id="callF" title="Appel vidéo" allow="camera; microphone; display-capture; autoplay; fullscreen; clipboard-write"></iframe></div>
<div id="fm"><div class="gbox">
  <h3>Transférer à…</h3>
  <input type="text" id="fq" placeholder="Rechercher un groupe ou un élève…" autocomplete="off">
  <div id="fpick"></div>
  <div class="gact"><button type="button" id="fcancel">Annuler</button></div>
</div></div>
<div id="gm"><div class="gbox">
  <h3 id="gtitle">Nouveau groupe</h3>
  <input type="text" id="gname" maxlength="60" placeholder="Nom du groupe" autocomplete="off">
  <input type="text" id="gq" placeholder="Rechercher un élève…" autocomplete="off">
  <div id="gpick"></div>
  <div class="gact"><button type="button" id="gleave">Quitter le groupe</button><button type="button" id="gcancel">Annuler</button><button type="button" id="gsave">Enregistrer</button></div>
</div></div>

<script type="module">
import { fbAuth, fbDB, C_ELEVES, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, query, where, onSnapshot, onAuthStateChanged } from "./firebase.js";

/* Cloudinary (mêmes réglages que reseau.html) */
const CLOUD_NAME = "dctxjclv8", UPLOAD_PRESET = "reseau_eleves";
const MAX_VIDEO = 30 * 1024 * 1024;
const M = "reseau_messages", MEM = "reseau_membres", GRP = "reseau_groupes";
const REACTS = ["👍","❤️","😂","😮","😢","🙏"];
const EMOJIS = ["😀","😂","😍","🥰","😎","🤔","😢","😡","👍","👏","🙏","💪","🔥","🎉","❤️","📚","✅","❌","💡","🎓","🏆","🤝","👋","😅"];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ini = n => String(n || "?").split(" ").map(x => x[0]).slice(0, 2).join("").toUpperCase();
const convId = (a, b) => [a, b].sort().join("_");
const hhmm = t => new Date(t).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
const dayLabel = t => {
  const d = new Date(t), n = new Date(), y = new Date(Date.now() - 864e5);
  if (d.toDateString() === n.toDateString()) return "Aujourd’hui";
  if (d.toDateString() === y.toDateString()) return "Hier";
  return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
};
const short = t => {
  const d = new Date(t), n = new Date();
  if (d.toDateString() === n.toDateString()) return hhmm(t);
  if (d.toDateString() === new Date(Date.now() - 864e5).toDateString()) return "Hier";
  return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
};

let me = null, isAdmin = false;
let msgs = [], allMsgs = [], mem = {}, members = [];
let tab = "chats", chat = null, aconv = null, pending = null;
let mUnsub = null, memUnsub = null, aUnsub = null, gUnsub = null;
let groups = {}, replying = null, gEdit = null;
let pres = {}, typRaw = {}, pUnsub = null, tUnsub = null, lastTyp = 0, beatT = null, tickT = null;
const PRES = "reseau_presence", FRAPPE = "reseau_frappe";
const typingUids = () => Object.entries(typRaw).filter(([u, t]) => u !== (me && me.uid) && Date.now() - Number(t) < 6000).map(([u]) => u);
const vuTxt = t => {
  const d = new Date(t), now = Date.now();
  if (now - t < 100000) return "en ligne";
  if (d.toDateString() === new Date().toDateString()) return "vu à " + hhmm(t);
  if (d.toDateString() === new Date(now - 864e5).toDateString()) return "vu hier à " + hhmm(t);
  return "vu le " + d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" });
};
function beat() {
  if (!me || document.visibilityState !== "visible") return;
  setDoc(doc(fbDB, PRES, me.uid), { t: Date.now() }, { merge: true }).catch(() => {});
}
function unwatch() {
  [pUnsub, tUnsub].forEach(u => u && u());
  pUnsub = tUnsub = null; pres = {}; typRaw = {};
}
function watchChat() {
  unwatch();
  if (aconv || !chat) return;
  tUnsub = onSnapshot(doc(fbDB, FRAPPE, curConv()), s => { typRaw = s.exists() ? s.data() : {}; renderHead(); }, () => {});
  if (!chat.g) pUnsub = onSnapshot(doc(fbDB, PRES, chat.uid), s => { pres = s.exists() ? s.data() : {}; renderHead(); }, () => {});
}
function typ(on) {
  if (!me || !chat) return;
  const now = Date.now();
  if (on) { if (now - lastTyp < 2500) return; lastTyp = now; } else lastTyp = 0;
  setDoc(doc(fbDB, FRAPPE, curConv()), { [me.uid]: on ? now : 0 }, { merge: true }).catch(() => {});
}
const curConv = () => chat ? (chat.g ? "g_" + chat.gid : convId(me.uid, chat.uid)) : "";
const dest = () => chat.g
  ? { conv: "g_" + chat.gid, membres: (groups[chat.gid] && groups[chat.gid].membres) || [me.uid], groupe: chat.gid, groupeNom: chat.nom }
  : { conv: convId(me.uid, chat.uid), membres: [me.uid, chat.uid], a: chat.uid, aNom: chat.nom };

/* ── Notifications push (Firebase Cloud Messaging) ──
   À remplir : Console Firebase > Paramètres du projet > Général (config web) et Cloud Messaging (clé VAPID). */
const PUSH_CFG = { apiKey: "", authDomain: "", projectId: "", messagingSenderId: "", appId: "" };
const VAPID_KEY = "";
const pushOK = () => !!(PUSH_CFG.apiKey && PUSH_CFG.projectId && PUSH_CFG.messagingSenderId && PUSH_CFG.appId && VAPID_KEY);
let pushApp = null;
async function enablePush(silent) {
  if (!me) return;
  if (!pushOK()) { if (!silent) alert("Les notifications ne sont pas encore configurées (clés Firebase à renseigner dans messages.html)."); return; }
  try {
    if (!("Notification" in window) || !("serviceWorker" in navigator)) throw new Error("Navigateur non compatible");
    let perm = Notification.permission;
    if (perm === "default" && !silent) perm = await Notification.requestPermission();
    if (perm !== "granted") { if (!silent) alert("Notifications refusées. Autorise-les dans les réglages du navigateur."); return; }
    const A = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const Mg = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js");
    if (!(await Mg.isSupported())) throw new Error("Notifications non prises en charge sur cet appareil");
    pushApp = pushApp || A.initializeApp(PUSH_CFG, "push");
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js?c=" + encodeURIComponent(JSON.stringify(PUSH_CFG)));
    await navigator.serviceWorker.ready;
    const token = await Mg.getToken(Mg.getMessaging(pushApp), { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error("Jeton indisponible");
    const ref = doc(fbDB, "reseau_tokens", me.uid), snap = await getDoc(ref).catch(() => null);
    const old = snap && snap.exists() ? (snap.data().tokens || []) : [];
    if (!old.includes(token)) await setDoc(ref, { tokens: [...old, token].slice(-5), maj: Date.now() }, { merge: true });
    $("notifBtn").textContent = "🔔"; $("notifBtn").title = "Notifications activées";
    if (!silent) alert("Notifications activées ✅");
  } catch (err) { if (!silent) alert("Activation impossible : " + (err.message || err)); }
}
$("notifBtn").onclick = () => enablePush(false);

function avatar(uid, nom, cls) {
  const p = mem[uid] && mem[uid].photo;
  return `<div class="av ${cls || ""} ${p ? "has" : ""}" ${p ? `style="background-image:url('${esc(p)}')"` : ""}>${esc(ini(nom))}</div>`;

onAuthStateChanged(fbAuth, async user => {
  [mUnsub, memUnsub, aUnsub, gUnsub].forEach(u => u && u());
  mUnsub = memUnsub = aUnsub = gUnsub = null; chat = null; aconv = null; groups = {}; unwatch();
  if (!user) { me = null; return gate("Connecte-toi avec ton compte élève pour accéder à tes messages.", true); }
  const [e, a] = await Promise.all([
    getDoc(doc(fbDB, C_ELEVES, user.uid)).catch(() => null),
    getDoc(doc(fbDB, "admins", user.uid)).catch(() => null)
  ]);
  isAdmin = !!(a && a.exists());
  const d = e && e.exists() ? e.data() : null;
  if (!isAdmin && (!d || d.statut !== "valide")) return gate("Ton inscription doit encore être validée par un administrateur du club.");
  me = { uid: user.uid, name: d ? (d.prenom + " " + d.nom).trim() : "Administrateur", classe: d ? (d.classe || "") : "Club" };
  $("gate").style.display = "none"; $("app").style.display = "flex";
  $("tAdmin").style.display = isAdmin ? "" : "none";
  start();
});

function start() {
  if ("Notification" in window) {
    $("notifBtn").style.display = "";
    if (Notification.permission === "granted") { $("notifBtn").textContent = "🔔"; enablePush(true); }
  }
  beat(); clearInterval(beatT); beatT = setInterval(beat, 60000);
  clearInterval(tickT); tickT = setInterval(() => { if (chat) renderHead(); }, 4000);
  setDoc(doc(fbDB, MEM, me.uid), { uid: me.uid, nom: me.name, classe: me.classe }, { merge: true }).catch(() => {});
  memUnsub = onSnapshot(collection(fbDB, MEM), s => {
    mem = {}; s.docs.forEach(x => mem[x.id] = x.data());
    members = s.docs.map(x => x.data()).filter(m => m.uid && m.uid !== me.uid).sort((a, b) => String(a.nom).localeCompare(String(b.nom)));
    renderList(); if (chat) renderHead();
    openFromHash();
  }, () => {});
  mUnsub = onSnapshot(query(collection(fbDB, M), where("membres", "array-contains", me.uid)), s => {
    msgs = s.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => a.createdAt - b.createdAt);
    renderList(); if (chat) renderChat();
  }, () => {});
  gUnsub = onSnapshot(query(collection(fbDB, GRP), where("membres", "array-contains", me.uid)), s => {
    groups = {}; s.docs.forEach(x => groups[x.id] = { id: x.id, ...x.data() });
    if (chat && chat.g) {
      if (!groups[chat.gid]) closePane(); else { chat.nom = groups[chat.gid].nom; renderHead(); }
    }
    renderList(); openFromHash();
  }, () => {});
  if (isAdmin) aUnsub = onSnapshot(collection(fbDB, M), s => {
    allMsgs = s.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => a.createdAt - b.createdAt);
    if (tab === "admin") { renderList(); if (aconv) renderChat(); }
  }, () => {});
}

/* ── Liste ── */
function convRows(src) {
  const c = {}; src.forEach(m => c[m.conv] = m);
  return Object.values(c).sort((a, b) => b.createdAt - a.createdAt);
}
const preview = m => m.supprime ? "🚫 Message supprimé" : m.mediaUrl ? (m.mediaType === "audio" ? "🎤 Message vocal" : m.mediaType === "video" ? "🎥 Vidéo" : "📷 Photo") : (m.texte || "");
function renderList() {
  if (!me) return;
  const q = $("q").value.trim().toLowerCase(), el = $("list");
  document.querySelectorAll(".tab").forEach(b => b.classList.remove("on"));
  $({ chats: "tChats", groups: "tGroups", people: "tPeople", admin: "tAdmin" }[tab]).classList.add("on");
  let h = "";
  if (tab === "chats") {
    const rows = convRows(msgs).map(m => {
      const g = !!m.groupe;
      const o = g ? { uid: "g:" + m.groupe, nom: (groups[m.groupe] && groups[m.groupe].nom) || m.groupeNom || "Groupe" }
        : m.de === me.uid ? { uid: m.a, nom: m.aNom } : { uid: m.de, nom: m.deNom };
      const nb = g ? msgs.filter(x => x.conv === m.conv && x.de !== me.uid && !(x.luPar || []).includes(me.uid)).length
        : msgs.filter(x => x.conv === m.conv && x.a === me.uid && !x.lu).length;
      return { m, o, nb, g };
    }).filter(r => (!r.g || groups[r.m.groupe]) && (!q || String(r.o.nom).toLowerCase().includes(q)));
    h = rows.length ? rows.map(({ m, o, nb, g }) => {
      const on = chat && (g ? chat.g && "g:" + chat.gid === o.uid : !chat.g && chat.uid === o.uid);
      const who = m.de === me.uid ? "Toi : " : g ? esc(String(m.deNom).split(" ")[0]) + " : " : "";
      const av = g ? '<div class="av">👪</div>' : avatar(o.uid, o.nom);
      const attr = g ? `data-gid="${esc(m.groupe)}"` : `data-chat="${esc(o.uid)}"`;
      return `<div class="row ${nb ? "unread" : ""} ${on ? "on" : ""}" ${attr} data-nom="${esc(o.nom)}">${av}<div class="mid"><div class="t1"><b>${esc(o.nom)}</b><small>${short(m.createdAt)}</small></div><div class="t2"><span>${who}${esc(preview(m).slice(0, 60))}</span>${nb ? `<i class="badge">${nb}</i>` : ""}</div></div></div>`;
    }).join("")
      : `<p class="empty">${q ? "Aucune discussion trouvée." : "Aucune discussion pour le moment.<br>Va dans « Tous les élèves » pour écrire à un camarade, ou crée un groupe."}</p>`;
  } else if (tab === "groups") {
    const l = Object.values(groups).filter(g => !q || String(g.nom).toLowerCase().includes(q)).sort((a, b) => String(a.nom).localeCompare(String(b.nom)));
    h = '<div class="newg" id="newg"><div class="av sm">＋</div>Nouveau groupe</div>' + (l.length
      ? l.map(g => `<div class="row ${chat && chat.g && chat.gid === g.id ? "on" : ""}" data-gid="${esc(g.id)}" data-nom="${esc(g.nom)}"><div class="av">👪</div><div class="mid"><div class="t1"><b>${esc(g.nom)}</b></div><div class="t2"><span>${(g.membres || []).length} membres</span></div></div></div>`).join("")
      : '<p class="empty">Tu n’as encore aucun groupe.</p>');
  } else if (tab === "people") {
    const l = members.filter(m => !q || String(m.nom).toLowerCase().includes(q) || String(m.classe || "").toLowerCase().includes(q));
    h = l.length ? l.map(m => `<div class="row" data-chat="${esc(m.uid)}" data-nom="${esc(m.nom)}">${avatar(m.uid, m.nom)}<div class="mid"><div class="t1"><b>${esc(m.nom)}</b></div><div class="t2"><span>${esc(m.classe || "Club")}</span></div></div></div>`).join("")
      : '<p class="empty">Aucun élève trouvé.</p>';
  } else {
    const rows = convRows(allMsgs).filter(m => !q || (String(m.deNom) + " " + String(m.aNom || m.groupeNom || "")).toLowerCase().includes(q));
    h = rows.length ? rows.map(m => `<div class="row" data-conv="${esc(m.conv)}"><div class="av">🛡️</div><div class="mid"><div class="t1"><b>${m.groupe ? "👪 " + esc(m.groupeNom || "Groupe") : esc(m.deNom) + " ↔ " + esc(m.aNom)}</b><small>${short(m.createdAt)}</small></div><div class="t2"><span>${esc(preview(m).slice(0, 60))}</span></div></div></div>`).join("")
      : '<p class="empty">Aucune conversation.</p>';
  }
  el.innerHTML = h;
}
$("q").oninput = renderList;
$("tChats").onclick = () => { tab = "chats"; renderList(); };
$("tGroups").onclick = () => { tab = "groups"; renderList(); };
$("tPeople").onclick = () => { tab = "people"; renderList(); };
$("tAdmin").onclick = () => { tab = "admin"; renderList(); };
$("list").addEventListener("click", e => {
  if (e.target.closest("#newg")) { openGroupModal(null); return; }
  const r = e.target.closest(".row"); if (!r) return;
  if (r.dataset.conv) { aconv = r.dataset.conv; chat = null; openPane(true); return; }
  if (r.dataset.gid) { aconv = null; chat = { g: true, gid: r.dataset.gid, nom: r.dataset.nom }; openPane(false); return; }
  aconv = null; chat = { uid: r.dataset.chat, nom: r.dataset.nom }; openPane(false);
});

function openFromHash() {
  const h = decodeURIComponent((location.hash || "").slice(1));
  if (!h || chat || aconv) return;
  if (h.startsWith("g:")) {
    const g = groups[h.slice(2)];
    if (g) { chat = { g: true, gid: g.id, nom: g.nom }; openPane(false); }
    return;
  }
  const m = members.find(x => x.uid === h);
  if (m) { chat = { uid: m.uid, nom: m.nom }; openPane(false); }
}
window.addEventListener("hashchange", () => { if (me && location.hash.length > 1) { chat = null; aconv = null; openFromHash(); } });

/* ── Conversation ── */
function openPane(readOnly) {
  $("ph").style.display = "none"; $("chatbox").style.display = "flex";
  document.body.classList.add("chat-open");
  $("composer").style.display = readOnly ? "none" : "";
  $("cnote").textContent = readOnly ? "🛡️ Mode supervision : lecture seule." : "🔒 Pour la sécurité des élèves, l’administration du club peut consulter les messages.";
  stopRec(true); clearPending(); clearReply();
  watchChat(); renderHead(); renderChat(true); renderList();
  if (!readOnly) $("inp").focus({ preventScroll: true });
}
function closePane() {
  stopRec(true); unwatch();
  chat = null; aconv = null; document.body.classList.remove("chat-open");
  $("chatbox").style.display = "none"; $("ph").style.display = "";
  history.replaceState(null, "", location.pathname); renderList();
}
$("back").onclick = closePane;

function renderHead() {
  const isG = !!(chat && chat.g);
  $("callMeet").style.display = (aconv || isG) ? "none" : "";
  $("callJitsi").style.display = aconv ? "none" : "";
  $("ginfo").style.display = isG ? "" : "none";
  if (aconv) {
    const l = allMsgs.filter(m => m.conv === aconv);
    $("cav").className = "av sm"; $("cav").textContent = "🛡️"; $("cav").style.backgroundImage = "";
    $("cname").textContent = l.length ? (l[0].groupe ? "👪 " + (l[0].groupeNom || "Groupe") : l[0].deNom + " ↔ " + l[0].aNom) : "Conversation";
    $("csub").textContent = "Supervision"; return;
  }
  if (!chat) return;
  if (isG) {
    const g = groups[chat.gid], ms = (g && g.membres) || [];
    $("cav").className = "av sm"; $("cav").textContent = "👪"; $("cav").style.backgroundImage = "";
    $("cname").textContent = chat.nom;
    const tp = typingUids().map(u => ((mem[u] && mem[u].nom) || "Quelqu’un").split(" ")[0]);
    $("csub").textContent = tp.length ? tp.join(", ") + " écrit…" : (ms.map(u => (mem[u] && mem[u].nom) || "").filter(Boolean).map(n => n.split(" ")[0]).join(", ").slice(0, 70) || ms.length + " membres");
    return;
  }
  const p = mem[chat.uid] && mem[chat.uid].photo;
  $("cav").className = "av sm" + (p ? " has" : ""); $("cav").textContent = ini(chat.nom);
  $("cav").style.backgroundImage = p ? `url('${p}')` : "";
  $("cname").textContent = chat.nom;
  $("csub").textContent = typingUids().length ? "écrit…" : (pres.t ? vuTxt(pres.t) : ((mem[chat.uid] && mem[chat.uid].classe) || "Club Réussir Ensemble"));
}

function bubble(m, withName) {
  const mine = m.de === me.uid && !aconv;
  if (m.supprime && !aconv) return `<div class="bw ${mine ? "me" : ""}" id="m_${esc(m.id)}"><div class="bb gone">${withName ? `<div class="who">${esc(m.deNom)}</div>` : ""}🚫 Message supprimé<div class="meta"><span>${hhmm(m.createdAt)}</span></div></div></div>`;
  const fw = (m.transfere ? '<div class="fwd">↪ Transféré</div>' : "") + (m.supprime ? '<div class="gtag">🚫 Supprimé par l’expéditeur</div>' : "");
  const media = m.mediaUrl ? (m.mediaType === "audio" ? `<audio src="${esc(m.mediaUrl)}" controls preload="metadata"></audio>` : m.mediaType === "video"
    ? `<video src="${esc(m.mediaUrl)}" controls preload="metadata" playsinline></video>`
    : `<img src="${esc(m.mediaUrl)}" alt="Photo" loading="lazy" data-zoom="${esc(m.mediaUrl)}">`) : "";
  const txt = m.mediaUrl && /^(📷 Photo|🎥 Vidéo|🎤 Message vocal)$/.test(m.texte || "") ? "" : (m.texte || "");
  const seen = m.groupe ? (m.luPar || []).some(u => u !== me.uid) : m.lu;
  const tick = mine ? `<span class="tick ${seen ? "lu" : ""}">${seen ? "✓✓" : "✓"}</span>` : "";
  const rq = m.replyTo ? `<div class="rq" data-goto="${esc(m.replyTo.id)}"><b>${esc(m.replyTo.nom)}</b><span>${esc(m.replyTo.texte)}</span></div>` : "";
  const rc = {}; Object.entries(m.react || {}).forEach(([u, em]) => { if (em) (rc[em] = rc[em] || []).push(u); });
  const rxs = Object.keys(rc).length ? `<div class="rxs">${Object.entries(rc).map(([em, us]) => `<span class="rx ${us.includes(me.uid) ? "mine" : ""}" data-rxchip="${esc(m.id)}" data-em="${esc(em)}">${esc(em)} ${us.length}</span>`).join("")}</div>` : "";
  const acts = aconv ? "" : `<button type="button" class="mact" data-reply="${esc(m.id)}" aria-label="Répondre" title="Répondre">↩</button><button type="button" class="mact" data-react="${esc(m.id)}" aria-label="Réagir" title="Réagir">😊</button>${m.callUrl ? "" : `<button type="button" class="mact" data-fwd="${esc(m.id)}" aria-label="Transférer" title="Transférer">↪</button>`}`;
  const call = callOk(m.callUrl) ? `<a class="callj" href="${esc(m.callUrl)}" ${m.callType === "meet" ? "" : `data-call="${esc(m.callUrl)}"`} target="_blank" rel="noopener noreferrer">📞 Rejoindre l’appel ${m.callType === "meet" ? "Google Meet" : "Jitsi"}</a>` : "";
  return `<div class="bw ${mine ? "me" : ""}" id="m_${esc(m.id)}"><div class="bb">${withName ? `<div class="who">${esc(m.deNom)}</div>` : ""}${fw}${rq}${media}${txt ? `<p>${esc(txt)}</p>` : ""}${call}${rxs}<div class="meta">${acts}${mine ? `<button type="button" class="mdel" data-del="${esc(m.id)}" aria-label="Supprimer ce message" title="Supprimer">🗑</button>` : ""}<span>${hhmm(m.createdAt)}</span>${tick}</div></div></div>`;
}
let lastCount = -1;
function renderChat(force) {
  const l = aconv ? allMsgs.filter(m => m.conv === aconv) : (chat ? msgs.filter(m => m.conv === curConv()) : []);
  const box = $("msgs"), nearEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  let h = "", last = "";
  l.forEach(m => {
    const d = new Date(m.createdAt).toDateString();
    if (d !== last) { h += `<div class="day">${esc(dayLabel(m.createdAt))}</div>`; last = d; }
    h += bubble(m, !!aconv || !!(chat && chat.g));
  });
  box.innerHTML = h || '<p class="empty">Écris le premier message 👋</p>';
  if (force || nearEnd || l.length !== lastCount) box.scrollTop = box.scrollHeight;
  lastCount = l.length;
  if (!aconv && chat && document.visibilityState === "visible") {
    if (chat.g) l.filter(m => m.de !== me.uid && !(m.luPar || []).includes(me.uid)).forEach(m => updateDoc(doc(fbDB, M, m.id), { luPar: [...(m.luPar || []), me.uid] }).catch(() => {}));
    else l.filter(m => m.a === me.uid && !m.lu).forEach(m => updateDoc(doc(fbDB, M, m.id), { lu: true }).catch(() => {}));
  }
}
document.addEventListener("visibilitychange", () => { beat(); if (chat) renderChat(); });

$("file").onchange = () => {
  const f = $("file").files[0]; if (!f) return;
  if (f.type.startsWith("video") && f.size > MAX_VIDEO) { alert("Vidéo trop lourde (30 Mo maximum)."); $("file").value = ""; return; }
  pending = f;
  const u = URL.createObjectURL(f), v = f.type.startsWith("video");
  $("prev").innerHTML = (v ? `<video src="${u}" muted></video>` : `<img src="${u}" alt="">`) + `<span>${esc(f.name)}</span><button type="button" id="px" aria-label="Retirer">✕</button>`;
  $("prev").style.display = "flex"; $("px").onclick = clearPending;
};

function shrink(f) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => {
      const s = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error("Image illisible")), "image/jpeg", 0.8);
    };
    im.onerror = () => rej(new Error("Image illisible"));
    im.src = URL.createObjectURL(f);
  });
}
async function upload(f) {
  if (!CLOUD_NAME || !UPLOAD_PRESET) throw new Error("L’envoi de photos et vidéos n’est pas encore configuré.");
  const v = f.type.startsWith("video"), fd = new FormData();
  fd.append("file", v ? f : await shrink(f)); fd.append("upload_preset", UPLOAD_PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${v ? "video" : "image"}/upload`, { method: "POST", body: fd });
  const j = await r.json();
  if (!j.secure_url) throw new Error((j.error && j.error.message) || "Échec de l’envoi");
  return { url: j.secure_url, type: v ? "video" : "image" };
}

let sending = false;
async function sendMsg() {
  if (sending || !chat) return;
  const i = $("inp"), t = i.value.trim();
  if (!t && !pending) return;
  sending = true; $("send").disabled = true;
  try {
    let media = null;
    if (pending) media = await upload(pending);
    const data = {
      ...dest(), de: me.uid, deNom: me.name,
      texte: t || (media ? (media.type === "video" ? "🎥 Vidéo" : "📷 Photo") : ""),
      lu: false, createdAt: Date.now()
    };
    if (media) { data.mediaUrl = media.url; data.mediaType = media.type; }
    if (replying) data.replyTo = replying;
    i.value = ""; grow(); clearPending(); clearReply(); typ(false); $("emo").classList.remove("open");
    await addDoc(collection(fbDB, M), data);
  } catch (err) {
    alert("Message non envoyé : " + (err.code || err.message));
  } finally { sending = false; $("send").disabled = false; i.focus(); }
}

/* ── Appels vidéo : Google Meet / Jitsi Meet (lien envoyé dans la discussion) ── */
const JITSI_BASE = "https://meet.jit.si/"; // pour un service sans limite : "https://8x8.vc/<ton-appId>/"
const callOk = u => typeof u === "string" && /^https:\/\/(meet\.jit\.si|8x8\.vc|meet\.google\.com)\/[\w\-./?=&%]+$/i.test(u);
async function sendCall(url, type) {
  if (!chat) return;
  try {
    await addDoc(collection(fbDB, M), {
      ...dest(), de: me.uid, deNom: me.name,
      texte: "📞 Appel vidéo " + (type === "meet" ? "Google Meet" : "Jitsi"),
      callUrl: url, callType: type, lu: false, createdAt: Date.now()
    });
  } catch (err) { alert("Invitation non envoyée : " + (err.code || err.message)); }
}
/* Appel intégré à la page (Jitsi) */
function openCall(url) {
  if (!callOk(url)) return;
  if (/meet\.google\.com/i.test(url)) { window.open(url, "_blank", "noopener"); return; }
  $("callT").textContent = "Appel vidéo" + (chat ? " — " + chat.nom : "");
  $("callTab").href = url;
  $("callF").src = url + "#userInfo.displayName=" + encodeURIComponent(JSON.stringify(me.name));
  $("callov").classList.add("open");
}
function closeCall() { $("callF").src = "about:blank"; $("callov").classList.remove("open"); }
$("callX").onclick = closeCall;
$("msgs").addEventListener("click", e => {
  const cj = e.target.closest("[data-call]"); if (!cj) return;
  e.preventDefault(); openCall(cj.dataset.call);
});
$("callJitsi").onclick = () => {
  if (!chat) return;
  if (!confirm("Lancer un appel vidéo avec " + chat.nom + " ?\nUne invitation sera envoyée dans la discussion.")) return;
  const room = "CRE" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const url = JITSI_BASE + room;
  openCall(url);
  sendCall(url, "jitsi");
};
$("callMeet").onclick = () => {
  if (!chat) return;
  window.open("https://meet.google.com/new", "_blank", "noopener");
  const l = prompt("Google Meet vient de s’ouvrir.\nCrée la réunion, copie son lien (https://meet.google.com/xxx-xxxx-xxx) et colle-le ici pour l’envoyer à " + chat.nom + " :");
  if (!l) return;
  const url = l.trim();
  if (!/^https:\/\/meet\.google\.com\/[a-z0-9\-]+(\?.*)?$/i.test(url)) { alert("Lien Google Meet invalide."); return; }
  sendCall(url, "meet");
};

/* ── Messages vocaux ── */
const MAX_REC = 300; // secondes
let rec = null, recChunks = [], recTimer = null, recStart = 0, recCancel = false;
const mmss = t => Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
async function startRec() {
  if (!chat || rec) return;
  if (!navigator.mediaDevices || !window.MediaRecorder) { alert("Ton navigateur ne permet pas l’enregistrement audio."); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mt = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(t => MediaRecorder.isTypeSupported(t)) || "";
    rec = new MediaRecorder(st, mt ? { mimeType: mt } : undefined);
    recChunks = []; recCancel = false;
    rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop = onRecStop;
    rec.start(); recStart = Date.now();
    $("rec").style.display = "flex"; $("micBtn").classList.add("on"); $("recT").textContent = "0:00";
    recTimer = setInterval(() => {
      const t = Math.round((Date.now() - recStart) / 1000);
      $("recT").textContent = mmss(t);
      if (t >= MAX_REC) stopRec(false);
    }, 500);
  } catch (e) { rec = null; alert("Micro inaccessible : " + (e.message || e)); }
}
function stopRec(cancel) {
  if (!rec) return;
  recCancel = !!cancel; clearInterval(recTimer);
  try { if (rec.state !== "inactive") rec.stop(); } catch (e) {}
  try { rec.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
}
async function onRecStop() {
  const type = (rec && rec.mimeType) || "audio/webm", dur = Math.round((Date.now() - recStart) / 1000);
  rec = null; $("rec").style.display = "none"; $("micBtn").classList.remove("on");
  if (recCancel || dur < 1 || !recChunks.length || !chat) return;
  await sendAudio(new Blob(recChunks, { type }), dur);
}
async function sendAudio(blob, dur) {
  if (sending) return;
  sending = true; $("send").disabled = true;
  try {
    if (!CLOUD_NAME || !UPLOAD_PRESET) throw new Error("L’envoi n’est pas encore configuré.");
    const ext = blob.type.includes("mp4") ? "m4a" : blob.type.includes("ogg") ? "ogg" : "webm";
    const fd = new FormData(); fd.append("file", blob, "vocal." + ext); fd.append("upload_preset", UPLOAD_PRESET);
    const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, { method: "POST", body: fd });
    const j = await r.json();
    if (!j.secure_url) throw new Error((j.error && j.error.message) || "Échec de l’envoi");
    const vocal = {
      ...dest(), de: me.uid, deNom: me.name,
      texte: "🎤 Message vocal", mediaUrl: j.secure_url, mediaType: "audio", duree: dur,
      lu: false, createdAt: Date.now()
    };
    if (replying) vocal.replyTo = replying;
    clearReply();
    await addDoc(collection(fbDB, M), vocal);
  } catch (err) { alert("Vocal non envoyé : " + (err.code || err.message)); }
  finally { sending = false; $("send").disabled = false; }
}
/* ── Répondre / réagir ── */
function clearReply() { replying = null; $("rbar").style.display = "none"; }
function setReply(id) {
  const m = msgs.find(x => x.id === id); if (!m) return;
  const t = m.mediaUrl ? preview(m) : (m.texte || "");
  replying = { id: m.id, nom: m.deNom, texte: String(t).slice(0, 80) };
  $("rbN").textContent = m.de === me.uid ? "Toi" : m.deNom; $("rbT").textContent = replying.texte;
  $("rbar").style.display = "flex"; $("inp").focus();
}
$("rbX").onclick = clearReply;
const rp = $("rp"); let rpId = null;
rp.innerHTML = REACTS.map(x => `<button type="button">${x}</button>`).join("");
async function setReact(id, em) {
  const m = msgs.find(x => x.id === id); if (!m) return;
  const cur = (m.react || {})[me.uid] || "";
  try { await updateDoc(doc(fbDB, M, id), { ["react." + me.uid]: cur === em ? "" : em }); }
  catch (err) { alert("Réaction impossible : " + (err.code || err.message)); }
}
rp.addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  const id = rpId; rp.classList.remove("open"); setReact(id, e.target.textContent);
});
$("msgs").addEventListener("click", e => {
  const rb = e.target.closest("[data-reply]"); if (rb) { setReply(rb.dataset.reply); return; }
  const fb = e.target.closest("[data-fwd]"); if (fb) { openFwd(fb.dataset.fwd); return; }
  const xb = e.target.closest("[data-react]");
  if (xb) {
    rpId = xb.dataset.react; rp.classList.add("open");
    const r = xb.getBoundingClientRect(), w = rp.offsetWidth;
    rp.style.top = Math.max(8, r.top - rp.offsetHeight - 6) + "px";
    rp.style.left = Math.min(Math.max(8, r.left - w / 2), window.innerWidth - w - 8) + "px";
    e.stopPropagation(); return;
  }
  const ch = e.target.closest("[data-rxchip]"); if (ch) { setReact(ch.dataset.rxchip, ch.dataset.em); return; }
  const g = e.target.closest("[data-goto]");
  if (g) { const el = $("m_" + g.dataset.goto); if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400); } }
});
document.addEventListener("click", e => { if (!e.target.closest("#rp") && !e.target.closest("[data-react]")) rp.classList.remove("open"); });

/* ── Transférer ── */
let fwdMsg = null;
function renderFwd() {
  const q = $("fq").value.trim().toLowerCase();
  const gl = Object.values(groups).filter(g => !q || String(g.nom).toLowerCase().includes(q));
  const pl = members.filter(m => !q || String(m.nom).toLowerCase().includes(q));
  $("fpick").innerHTML = gl.map(g => `<div class="row" data-fg="${esc(g.id)}" data-nom="${esc(g.nom)}"><div class="av sm">👪</div><div class="mid"><div class="t1"><b>${esc(g.nom)}</b></div></div></div>`).join("")
    + pl.map(m => `<div class="row" data-fu="${esc(m.uid)}" data-nom="${esc(m.nom)}">${avatar(m.uid, m.nom, "sm")}<div class="mid"><div class="t1"><b>${esc(m.nom)}</b></div><div class="t2"><span>${esc(m.classe || "Club")}</span></div></div></div>`).join("")
    || '<p class="empty">Aucun résultat.</p>';
}
function openFwd(id) {
  const m = msgs.find(x => x.id === id); if (!m || m.supprime) return;
  fwdMsg = m; $("fq").value = ""; renderFwd(); $("fm").classList.add("open");
}
$("fq").oninput = renderFwd;
$("fcancel").onclick = () => $("fm").classList.remove("open");
$("fm").addEventListener("click", e => { if (e.target.id === "fm") $("fm").classList.remove("open"); });
$("fpick").addEventListener("click", async e => {
  const r = e.target.closest(".row"); if (!r || !fwdMsg || sending) return;
  const nom = r.dataset.nom, gid = r.dataset.fg, uid = r.dataset.fu;
  const d = gid ? { conv: "g_" + gid, membres: (groups[gid] && groups[gid].membres) || [me.uid], groupe: gid, groupeNom: nom }
    : { conv: convId(me.uid, uid), membres: [me.uid, uid], a: uid, aNom: nom };
  const data = { ...d, de: me.uid, deNom: me.name, texte: fwdMsg.texte || "", lu: false, createdAt: Date.now(), transfere: true };
  if (fwdMsg.mediaUrl) { data.mediaUrl = fwdMsg.mediaUrl; data.mediaType = fwdMsg.mediaType; if (fwdMsg.duree) data.duree = fwdMsg.duree; }
  sending = true;
  try {
    await addDoc(collection(fbDB, M), data);
    $("fm").classList.remove("open"); fwdMsg = null;
    aconv = null; chat = gid ? { g: true, gid, nom } : { uid, nom };
    openPane(false);
  } catch (err) { alert("Transfert impossible : " + (err.code || err.message)); }
  finally { sending = false; }
});

/* ── Groupes ── */
let gSel = new Set();
const gCanEdit = () => { const g = gEdit ? groups[gEdit] : null; return !g || g.createur === me.uid || isAdmin; };
function renderPick() {
  const q = $("gq").value.trim().toLowerCase(), ok = gCanEdit();
  const l = members.filter(m => !q || String(m.nom).toLowerCase().includes(q) || String(m.classe || "").toLowerCase().includes(q));
  $("gpick").innerHTML = l.length ? l.map(m => `<label><input type="checkbox" value="${esc(m.uid)}" ${gSel.has(m.uid) ? "checked" : ""} ${ok ? "" : "disabled"}>${avatar(m.uid, m.nom, "sm")}<span>${esc(m.nom)}<br><small>${esc(m.classe || "Club")}</small></span></label>`).join("")
    : '<p class="empty">Aucun élève.</p>';
}
function openGroupModal(gid) {
  gEdit = gid; const g = gid ? groups[gid] : null;
  $("gtitle").textContent = g ? "Infos du groupe" : "Nouveau groupe";
  $("gname").value = g ? g.nom : ""; $("gq").value = "";
  gSel = new Set(g ? g.membres : []);
  $("gleave").style.display = g ? "" : "none";
  $("gname").disabled = !gCanEdit(); $("gsave").style.display = gCanEdit() ? "" : "none";
  renderPick(); $("gm").classList.add("open");
}
$("gpick").addEventListener("change", e => { const c = e.target; if (c.type !== "checkbox") return; if (c.checked) gSel.add(c.value); else gSel.delete(c.value); });
$("gq").oninput = renderPick;
$("gcancel").onclick = () => $("gm").classList.remove("open");
$("gm").addEventListener("click", e => { if (e.target.id === "gm") $("gm").classList.remove("open"); });
$("ginfo").onclick = () => { if (chat && chat.g) openGroupModal(chat.gid); };
$("gsave").onclick = async () => {
  const nom = $("gname").value.trim();
  if (!nom) { alert("Donne un nom au groupe."); return; }
  const ids = gEdit ? [...gSel] : [me.uid, ...[...gSel].filter(u => u !== me.uid)];
  if (gEdit && !ids.includes(me.uid)) ids.push(me.uid);
  if (ids.length < 2) { alert("Choisis au moins un membre."); return; }
  $("gsave").disabled = true;
  try {
    if (gEdit) await updateDoc(doc(fbDB, GRP, gEdit), { nom, membres: ids });
    else {
      const ref = await addDoc(collection(fbDB, GRP), { nom, membres: ids, createur: me.uid, createdAt: Date.now() });
      groups[ref.id] = { id: ref.id, nom, membres: ids, createur: me.uid };
      tab = "groups"; chat = { g: true, gid: ref.id, nom }; aconv = null;
      $("gm").classList.remove("open"); openPane(false); return;
    }
    $("gm").classList.remove("open");
  } catch (err) { alert("Enregistrement impossible : " + (err.code || err.message)); }
  finally { $("gsave").disabled = false; }
};
$("gleave").onclick = async () => {
  const g = groups[gEdit]; if (!g || !confirm("Quitter ce groupe ?")) return;
  try { await updateDoc(doc(fbDB, GRP, gEdit), { membres: g.membres.filter(u => u !== me.uid) }); $("gm").classList.remove("open"); }
  catch (err) { alert("Impossible de quitter : " + (err.code || err.message)); }
};

$("micBtn").onclick = startRec;
$("recX").onclick = () => stopRec(true);
$("recOk").onclick = () => stopRec(false);
</script>
